แดงมีขุยขอบชัด","Epidermoid cyst เป็นก้อนกลมใต้ผิวหนัง ไม่มีก้าน"],"k":["AK เป็นรอยโรคระยะก่อนเป็นมะเร็งของ SCC เกิดจาก UV ที่ทำให้เกิดการกลายพันธุ์ของยีน TP53","จุลพยาธิวิทยาตามเลกเชอร์: cytologic atypia จำกัดอยู่ชั้นล่างสุดของ epidermis เท่านั้น ร่วมกับ solar (dermal) elastosis ในหนังแท้","ทางคลินิกคลำได้ดีกว่ามองเห็น เพราะผิวหยาบคล้ายกระดาษทราย (sandpaper-like)","เมื่อ atypia ลามเต็มความหนาจะกลายเป็น SCC in situ (Bowen disease) และเมื่อทะลุ basement membrane จึงเป็น invasive SCC"],"ref":"Premalignant tumors · Actinic keratosis"},{"sec":"Benign epidermal lesions","n":61,"q":"A 25-year-old woman presents with a mobile, cystic nodule on her scalp that expresses cheesy white material when squeezed. What is the most likely diagnosis?","o":["Epidermoid cyst","Pilar cyst","Dermatofibroma","Seborrheic keratosis","Lipoma"],"a":1,"m":"Pilar (trichilemmal) cyst เป็นถุงน้ำที่พบบ่อยที่สุดบนหนังศีรษะ มีต้นกำเนิดจากปลอกรากผม ผนังบุด้วยเยื่อบุที่ไม่มีชั้น granular และมีเคราตินหนาแน่นภายใน","e":["Epidermoid cyst พบบ่อยที่ใบหน้า ลำคอ ลำตัว มีรูเปิดตรงกลางและผนังมี granular layer","ถูก — ถุงน้ำบนหนังศีรษะที่บีบแล้วมีสารคล้ายเนยแข็ง = pilar cyst","Dermatofibroma เป็นตุ่มแข็งที่ขา มี dimple sign ไม่ใช่ถุงน้ำ","Seborrheic keratosis เป็นรอยโรคผิวเผิน ไม่ใช่ถุง","Lipoma เป็นก้อนไขมันนุ่ม ไม่มีสารเคราตินออกมา"],"k":["Bowen disease = squamous cell carcinoma in situ มี full-thickness atypia ของ epidermis แต่ basement membrane ยังไม่ถูกทะลุ","เห็นเซลล์ผิดปกติทุกระดับ ขนาดและรูปทรงไม่สม่ำเสมอ มี mitosis สูงกว่าปกติและอยู่เหนือชั้น basal","ทางคลินิกเป็นแผ่นแดงมีขุยขอบเขตชัด โตช้า มักเข้าใจผิดว่าเป็นผื่น eczema หรือ psoriasis","ธงเตือนว่ากลายเป็น invasive: ก้อนนูนขึ้น เจ็บ หรือเป็นแผลไม่หาย"],"ref":"Premalignant tumors · Bowen disease"},{"sec":"Premalignant & Malignant","n":62,"q":"A 65-year-old male with chronic sun exposure presents with rough, scaly plaques on his scalp. A biopsy shows atypical keratinocytes confined to the epidermis. What is the diagnosis?","o":["Actinic keratosis","Bowen disease","Squamous cell carcinoma","Basal cell carcinoma","Keratoacanthoma"],"a":0,"m":"Actinic keratosis เป็นรอยโรคก่อนมะเร็งจากแสงแดดสะสม มีเซลล์ผิดปกติที่ชั้นล่างของหนังกำพร้าแบบไม่เต็มความหนา ร่วมกับ solar elastosis และ parakeratosis สลับ","e":["ถูก — แผ่นสากบนผิวที่โดนแดดร่วมกับ atypia บางส่วนของหนังกำพร้า = actinic keratosis","Bowen disease มี atypia เต็มความหนา (full-thickness) และเป็นแผ่นแดงขอบชัดมากกว่าแผ่นสาก","SCC ต้องมีการรุกล้ำเข้าหนังแท้","BCC มีลักษณะตุ่มมันวาวขอบม้วนและ palisading nuclei","Keratoacanthoma โตเร็วเป็นก้อนโดมมีแอ่งเคราตินตรงกลาง"],"k":["โตเร็วมากภายในไม่กี่สัปดาห์เป็นก้อนโดมที่มีแอ่งเคราตินตรงกลาง (crateriform) และมักยุบหายเองได้","ทางพยาธิวิทยาแยกจาก well-differentiated SCC ได้ยาก จึงมักถือปฏิบัติเหมือน SCC และตัดออกทั้งหมด","การตัดชิ้นเนื้อควรได้ทั้งรอยโรครวมขอบ เพื่อประเมินโครงสร้างสมมาตรและขอบที่ยื่นคล้ายริมฝีปาก (lipping)","เกิดจากแสงแดดเช่นเดียวกับ SCC พบบนผิวที่โดนแดดในผู้สูงอายุ"],"ref":"Premalignant/Malignant · Keratoacanthoma"},{"sec":"Premalignant & Malignant","n":63,"q":"A biopsy from a patient with Bowen disease reveals what key histologic feature?","o":["Atypical keratinocytes limited to the epidermis","Invasive dermal invasion","Palisading nuclei","Horn cyst formation","Reticular degeneration"],"a":0,"m":"Bowen disease = squamous cell carcinoma in situ มีเซลล์ผิดปกติเต็มความหนาหนังกำพร้า แต่ยังไม่ทะลุ basement membrane","e":["ถูก — atypia จำกัดอยู่ในหนังกำพร้า (in situ)","การรุกล้ำหนังแท้แปลว่ากลายเป็น invasive SCC แล้ว ไม่ใช่ Bowen","Palisading nuclei เป็นลักษณะของ BCC","Horn cyst เป็นของ seborrheic keratosis","Reticular degeneration พบในตุ่มน้ำจากไวรัสหรือ spongiotic dermatitis"],"k":["BCC เป็นมะเร็งผิวหนังที่พบบ่อยที่สุด โตช้า ทำลายเนื้อเยื่อเฉพาะที่ แต่แทบไม่แพร่กระจาย","กลไกหลักตามเลกเชอร์: การกลายพันธุ์ของยีน PTCH ซึ่งเป็นเบรกของ Hedgehog signaling pathway ทำให้ pathway ถูกกระตุ้นตลอดเวลา","จุลพยาธิวิทยา: กลุ่ม basaloid cells ในหนังแท้ โดยเซลล์ขอบเรียงเป็นรั้ว (peripheral palisading) และมี stromal retraction เป็นช่องว่างรอบก้อน","ทางคลินิก: pearly papule ขอบม้วน มี telangiectasia และแผลตรงกลางที่เป็นๆ หายๆ ตำแหน่งเด่นคือใบหน้าส่วนบน"],"ref":"Malignant tumors · Basal cell carcinoma"},{"sec":"Premalignant & Malignant","n":64,"q":"A 55-year-old male presents with a rapidly growing, dome-shaped nodule with central keratin-filled crater. What is the best diagnosis?","o":["Basal cell carcinoma","Actinic keratosis","Bowen disease","Keratoacanthoma","Epidermoid cyst"],"a":3,"m":"Keratoacanthoma โตเร็วภายในไม่กี่สัปดาห์เป็นก้อนโดมมีแอ่งเคราตินตรงกลาง มักยุบเองได้ แต่ทางพยาธิวิทยาแยกจาก SCC ยาก จึงมักตัดออกทั้งหมด","e":["BCC โตช้าและเป็นตุ่มมันวาวขอบม้วน ไม่มีแอ่งเคราตินขนาดใหญ่","Actinic keratosis เป็นแผ่นสากแบน ไม่ใช่ก้อนโตเร็ว","Bowen disease เป็นแผ่นแดงมีขุยขอบชัด โตช้า","ถูก — rapidly growing + central keratin crater = keratoacanthoma","Epidermoid cyst โตช้า ผิวเรียบ มีรูเปิดเล็ก ไม่มีแอ่งเคราตินเปิดกว้าง"],"k":["Albinism: จำนวนเมลาโนไซต์ปกติ แต่สังเคราะห์เมลานินไม่ได้ (มักขาดเอนไซม์ tyrosinase) เป็นความผิดปกติของ melanin synthesis","ผลตามมาคือผิว ผม และตาสีจาง มีปัญหาการมองเห็น (nystagmus, ลดความคมชัด) และเสี่ยงมะเร็งผิวหนังสูงมากตั้งแต่อายุน้อย","แยกจาก vitiligo ให้ชัด: vitiligo คือเมลาโนไซต์ถูกทำลาย จึงไม่มีเมลาโนไซต์ในรอยโรค และมักเริ่มในวัยผู้ใหญ่เป็นหย่อม","แยกจาก freckle: freckle มีเมลานินเพิ่มโดยเมลาโนไซต์เท่าเดิม ซึ่งเป็นด้านตรงข้ามของ albinism"],"ref":"Disorders of pigmentation · Albinism"},{"sec":"Premalignant & Malignant","n":65,"q":"A 65-year-old man presents with a pearly nodule with rolled borders and central ulceration. Histology shows palisading nuclei. What is the diagnosis?","o":["Actinic keratosis","Squamous cell carcinoma","Basal cell carcinoma","Bowen disease","Melanoma"],"a":2,"m":"Basal cell carcinoma เป็นมะเร็งผิวหนังที่พบบ่อยที่สุด ลักษณะตุ่มมันวาวขอบม้วน มีเส้นเลือดฝอยฝอย และแผลตรงกลาง พยาธิสภาพพบเซลล์เรียงตัวเป็นรั้วรอบขอบก้อน (peripheral palisading) กับ retraction artifact","e":["Actinic keratosis ไม่เป็นก้อนมันวาวและไม่มี palisading","SCC มักเป็นก้อนแข็งมีขุยหรือแผลที่ขอบแข็ง มี keratin pearls ไม่ใช่ palisading","ถูก — pearly nodule + rolled border + palisading nuclei = BCC","Bowen disease เป็นแผ่นแบนไม่ใช่ตุ่มมันวาว","Melanoma เป็นรอยโรคมีเม็ดสีผิดปกติตามเกณฑ์ ABCDE"],"k":["Vitiligo เป็นภูมิต้านตนเองที่ทำลายเมลาโนไซต์ ทำให้เกิด depigmented macule/patch ขาวสนิทขอบชัด","Wood lamp ทำให้รอยโรคเรืองขาวเด่นขึ้นและช่วยหาขอบเขตในคนผิวขาว","การกระจายแบบ acrofacial (ใบหน้า มือ เท้า รอบปาก) เป็นแบบแผนที่เลกเชอร์ยกไว้ และเกิด Koebner phenomenon ได้","สัมพันธ์กับโรคภูมิต้านตนเองอื่น เช่น ไทรอยด์อักเสบ เบาหวานชนิดที่ 1 โลหิตจางชนิด pernicious"],"ref":"Disorders of pigmentation · Vitiligo"},{"sec":"Pigmentation & Adnexa","n":66,"q":"A newborn presents with patchy depigmentation of the skin and hair, with normal melanocyte numbers but defective melanin synthesis. What is the most likely diagnosis?","o":["Vitiligo","Albinism","Melanocytic nevus","Freckle","Melanoma"],"a":1,"m":"Albinism: จำนวนเมลาโนไซต์ปกติแต่สร้างเมลานินไม่ได้ (มักจากการขาดเอนไซม์ tyrosinase) ผู้ป่วยมีผิว ผม และตาสีจาง เสี่ยงมะเร็งผิวหนังสูง","e":["Vitiligo เกิดจากการถูกทำลายของเมลาโนไซต์ จึงไม่มีเมลาโนไซต์ในรอยโรค และมักเริ่มในวัยผู้ใหญ่ ไม่ใช่แรกเกิด","ถูก — เมลาโนไซต์จำนวนปกติแต่สังเคราะห์เมลานินบกพร่อง = albinism","Melanocytic nevus เป็นกลุ่มเมลาโนไซต์ที่ให้สีเข้มขึ้น ไม่ใช่จางลง","Freckle มีเมลานินเพิ่มขึ้นในเซลล์ชั้น basal","Melanoma เป็นมะเร็งของเมลาโนไซต์"],"k":["เป็นภูมิต้านตนเองต่อรูขุมขนระยะ anagen โดยเชื่อว่าเกิดจากการสูญเสีย immune privilege ของรูขุมขน","Exclamation point hair = ผมหักสั้นที่โคนเรียวกว่าปลาย พบที่ขอบรอยโรคซึ่งบ่งว่าโรคยังลุกลาม","จุลพยาธิวิทยา: lymphocyte ล้อมรอบรูขุมขนส่วนล่างแบบ swarm of bees","รูขุมขนไม่ถูกทำลายถาวร (nonscarring) ผมจึงงอกกลับได้ อาจสัมพันธ์กับไทรอยด์และ vitiligo"],"ref":"Adnexal disorders · Alopecia areata"},{"sec":"Pigmentation & Adnexa","n":67,"q":"A 30-year-old woman presents with depigmented macules on her hands. Wood's lamp examination enhances the contrast. What is the diagnosis?","o":["Vitiligo","Albinism","Tinea versicolor","Post-inflammatory hyperpigmentation","Café-au-lait spots"],"a":0,"m":"Vitiligo เป็นโรคภูมิต้านตนเองที่ทำลายเมลาโนไซต์ ให้รอยด่างขาวสนิทขอบชัด และเรืองเด่นขึ้นใต้ Wood lamp","e":["ถูก — depigmented macule ขอบชัด เห็นชัดขึ้นใต้ Wood lamp = vitiligo","Albinism เป็นทั้งตัวตั้งแต่เกิด ไม่ใช่เป็นหย่อมในวัยผู้ใหญ่","Tinea versicolor เป็นรอยจาง (hypopigmented) มีขุยละเอียด เรืองสีเหลืองทอง","Post-inflammatory hyperpigmentation เป็นรอยคล้ำ ไม่ใช่รอยขาว","Café-au-lait spots เป็นรอยสีน้ำตาลอ่อน สัมพันธ์กับ neurofibromatosis"],"k":["Ephelis: เมลานินในเซลล์ basal เพิ่มขึ้นโดยจำนวนเมลาโนไซต์เท่าเดิม จึงเข้มขึ้นตามแดดและจางลงในฤดูหนาว","Lentigo ต่างกันชัดเจนตามเลกเชอร์: มี melanocytic hyperplasia เรียงเป็นแนวตรงในชั้น basal (lentiginous pattern) และสีไม่เปลี่ยนตามแดด","Melanocytic nevus ต่างออกไปอีกขั้นคือเมลาโนไซต์รวมกลุ่มเป็น nests","Lentigo maligna คือ melanoma in situ ที่มีเมลาโนไซต์ผิดปกติเพิ่มจำนวนแบบ lentiginous บนผิวที่โดนแดดเรื้อรังในผู้สูงอายุ"],"ref":"Disorders of pigmentation · Freckle (Ephelis)"},{"sec":"Pigmentation & Adnexa","n":68,"q":"A 40-year-old male presents with patchy hair loss with exclamation point hairs. What is the diagnosis?","o":["Androgenetic alopecia","Alopecia areata","Telogen effluvium","Tinea capitis","Trichotillomania"],"a":1,"m":"Alopecia areata เป็นภูมิต้านตนเองต่อรูขุมขนระยะ anagen ทำให้ผมร่วงเป็นหย่อมกลมเกลี้ยง พบ exclamation point hairs และมี lymphocyte ล้อมรอบรูขุมขนแบบ swarm of bees","e":["Androgenetic alopecia ผมบางแบบค่อยเป็นค่อยไปตามแบบแผน ไม่ใช่หย่อมกลม","ถูก — exclamation point hairs เป็นลักษณะจำเพาะของ alopecia areata","Telogen effluvium ผมร่วงกระจายทั่วศีรษะหลังภาวะเครียดหรือเจ็บป่วย","Tinea capitis มีขุย อักเสบ และผมหักสั้น พบเชื้อราจาก KOH","Trichotillomania ผมยาวไม่เท่ากันจากการดึง ขอบเขตไม่สม่ำเสมอ"],"k":["ลำดับการเจริญของไฝตามเลกเชอร์: junctional nevus (เฉพาะที่ DEJ) → compound nevus (ทั้ง epidermis และ dermis) → intradermal nevus (เฉพาะในหนังแท้)","Maturation คือหลักฐานความไม่ร้ายแรง: เซลล์ที่อยู่ตื้นใหญ่และสร้างเม็ดสี ส่วนที่ลึกลงไปเล็กลง ไม่สร้างเม็ดสี และเรียงคล้ายเส้นประสาท (neurotization)","กลไก: activating mutation ของ BRAF หรือ RAS แล้วถูกหยุดไว้ด้วย oncogene-induced senescence จึงไม่โตต่อ","Melanoma ตรงกันข้าม: ไม่มี maturation มี cytologic atypia และ mitosis ในส่วนลึก"],"ref":"Melanocytic nevus · ลำดับการเจริญ"},{"sec":"Pigmentation & Adnexa","n":69,"q":"A 25-year-old woman presents with multiple dark brown macules that darken with sun exposure. Histology reveals increased melanin deposition in basal keratinocytes without an increase in melanocyte number. What is the most likely diagnosis?","o":["Freckle (Ephelis)","Melanocytic nevus","Café-au-lait spots","Lentigo maligna","Post-inflammatory hyperpigmentation"],"a":0,"m":"Ephelis (กระ) มีเมลานินเพิ่มขึ้นในเซลล์ basal โดยจำนวนเมลาโนไซต์เท่าเดิม จึงเข้มขึ้นเมื่อโดนแดดและจางลงในฤดูหนาว","e":["ถูก — เมลานินเพิ่มแต่เมลาโนไซต์ไม่เพิ่ม + เข้มขึ้นตามแดด = กระ","Melanocytic nevus มีกลุ่ม (nests) ของเมลาโนไซต์เพิ่มขึ้น","Café-au-lait spot มีเมลานินเพิ่มเช่นกันแต่เป็นรอยเดี่ยวขนาดใหญ่ สีสม่ำเสมอ และไม่เปลี่ยนตามแดด","Lentigo maligna มีเมลาโนไซต์ผิดปกติเพิ่มจำนวนตามแนว basal ในผู้สูงอายุ","Post-inflammatory hyperpigmentation ต้องมีประวัติการอักเสบนำมาก่อน"],"k":["ABCDE: Asymmetry, Border irregularity, Color variegation, Diameter >6 มม., Evolution ซึ่งข้อ E (การเปลี่ยนแปลง) มีน้ำหนักมากที่สุดทางคลินิก","เคสตัวอย่างในเลกเชอร์คือไฝที่โตจาก 5 มม. เป็น 2 ซม. ใน 6 เดือน สีและขอบไม่สม่ำเสมอ","กลไก: UV ทำให้เกิดการกลายพันธุ์ในหลายยีน เช่น CDKN2A, BRAF, NRAS และ TERT","จุลพยาธิวิทยา: เซลล์ใหญ่ นิวเคลียสไม่สม่ำเสมอ นิวคลีโอลัสสีชมพูเด่นชัด ไม่มี maturation และพบ mitosis"],"ref":"Malignant tumors · Melanoma (ABCDE)"},{"sec":"Pigmentation & Adnexa","n":70,"q":"A 20-year-old male presents with a small, well-defined, pigmented lesion that has remained stable over time. Histology reveals nests of melanocytes in the epidermis and dermis. What is the best diagnosis?","o":["Junctional nevus","Compound nevus","Intradermal nevus","Lentigo maligna","Melanoma"],"a":1,"m":"Compound nevus มีกลุ่มเมลาโนไซต์ทั้งที่รอยต่อหนังกำพร้า-หนังแท้และในหนังแท้ (junctional = เฉพาะที่ DEJ, intradermal = เฉพาะในหนังแท้)","e":["Junctional nevus มีกลุ่มเซลล์เฉพาะที่ DEJ ไม่ลงไปในหนังแท้","ถูก — พบ nests ทั้งในหนังกำพร้าและหนังแท้ = compound nevus","Intradermal nevus มีเซลล์เฉพาะในหนังแท้ ไม่มีที่หนังกำพร้าแล้ว","Lentigo maligna เป็น melanoma in situ ในผู้สูงอายุบนผิวที่โดนแดดเรื้อรัง","Melanoma มีเซลล์ผิดปกติ เติบโตเปลี่ยนแปลง ไม่คงที่"],"k":["DHT ที่เปลี่ยนมาจากเทสโทสเตอโรนด้วย 5α-reductase ทำให้รูขุมขนที่ไวต่อฮอร์โมนหดเล็กลง (miniaturization)","ผลคือผมเส้นใหญ่ (terminal hair) กลายเป็นผมอ่อน (vellus hair) ตามแบบแผนพันธุกรรม","ผู้ชายร่นที่ขมับและบางกลางศีรษะ (vertex) ส่วนผู้หญิงบางกระจายกลางศีรษะโดยแนวผมด้านหน้ายังอยู่","รักษาด้วย minoxidil ทา และ finasteride กิน (ยับยั้ง 5α-reductase) เป็นการรักษาที่ต้องใช้ต่อเนื่อง"],"ref":"Adnexal disorders · Androgenetic alopecia"},{"sec":"Pigmentation & Adnexa","n":71,"q":"A 55-year-old male presents with a rapidly growing irregularly pigmented lesion with asymmetry, irregular borders, and color variation. What is the most likely diagnosis?","o":["Melanocytic nevus","Actinic keratosis","Melanoma","Seborrheic keratosis","Bowen disease"],"a":2,"m":"เข้าเกณฑ์ ABCDE (Asymmetry, Border irregularity, Color variation, Diameter มากกว่า 6 มม., Evolving) = melanoma","e":["ไฝธรรมดามีรูปสมมาตร ขอบเรียบ สีสม่ำเสมอ และคงที่","Actinic keratosis เป็นแผ่นสากไม่ใช่รอยโรคมีเม็ดสีที่เปลี่ยนแปลงเร็ว","ถูก — ABCDE ครบ = melanoma","Seborrheic keratosis แม้มีสีเข้มแต่ขอบชัด ผิวมัน และดูแปะติด","Bowen disease เป็นแผ่นแดงมีขุย ไม่ใช่รอยเม็ดสี"],"k":["ส่วนใหญ่เกิดจาก Trichophyton rubrum ซึ่งเป็น dermatophyte ชนิดเดียวกับที่ก่อ tinea pedis","ลักษณะเล็บ: หนา เหลืองขุ่น เปราะ ร่วมกับเศษเคราตินสะสมใต้เล็บ (subungual hyperkeratosis) และเล็บล่อน","ยืนยันด้วย KOH หรือส่งเศษเล็บย้อม PAS ก่อนเริ่มยา เพราะการรักษาต้องกินยานาน (terbinafine หลายสัปดาห์ถึงเดือน)","แยกจาก psoriatic nail: psoriasis มี pitting, oil drop sign, onycholysis และ KOH เป็นลบ"],"ref":"Nail disorders · Onychomycosis"},{"sec":"Pigmentation & Adnexa","n":72,"q":"A 45-year-old male presents with gradual hair loss on the vertex of his scalp. His father had a similar pattern of hair loss. What is the most likely cause?","o":["Androgenetic alopecia","Alopecia areata","Telogen effluvium","Tinea capitis","Trichotillomania"],"a":0,"m":"Androgenetic alopecia: DHT (จาก 5α-reductase) ทำให้รูขุมขนที่ไวต่อฮอร์โมนหดเล็กลง (miniaturization) ตามแบบแผนพันธุกรรม รักษาด้วย minoxidil และ finasteride","e":["ถูก — ผมร่วงตามแบบแผนบริเวณกลางศีรษะ + ประวัติครอบครัว","Alopecia areata ร่วงเป็นหย่อมกลมทันที ไม่ใช่ค่อยเป็นค่อยไป","Telogen effluvium ร่วงกระจายทั้งศีรษะหลังเหตุกระตุ้นราว 3 เดือน","Tinea capitis พบในเด็ก มีขุยและอักเสบ","Trichotillomania เกิดจากพฤติกรรมดึงผม"],"k":["Acute paronychia: ปวด บวม แดง ร้อนที่ขอบเล็บ เกิดเร็วภายในไม่กี่วัน ส่วนใหญ่จาก S. aureus หลังผิวหนังรอบเล็บบาดเจ็บ","ถ้ามีหนองสะสมต้องกรีดระบายหนอง ไม่ใช่ให้เพียงยาปฏิชีวนะ","Chronic paronychia: ดำเนินเกิน 6 สัปดาห์ บวมนุ่มไม่เจ็บมาก สูญเสีย cuticle สัมพันธ์กับการแช่น้ำเรื้อรังและ Candida","การป้องกันคือหลีกเลี่ยงการแช่น้ำและสวมถุงมือ ซึ่งสำคัญกว่าการให้ยาต้านจุลชีพ"],"ref":"Nail disorders · Paronychia"},{"sec":"Nail disorders","n":73,"q":"A 60-year-old male presents with thickened, yellowish, brittle toenails. KOH preparation shows septate hyphae. What is the most likely diagnosis?","o":["Psoriatic nails","Onychomycosis","Paronychia","Beau's lines","Nail lichen planus"],"a":1,"m":"Onychomycosis คือการติดเชื้อราที่เล็บ ส่วนใหญ่จาก Trichophyton rubrum ทำให้เล็บหนา เหลือง เปราะ และมีเศษใต้เล็บ (subungual hyperkeratosis)","e":["Psoriatic nails มีหลุมเล็บ (pitting) น้ำมันหยด และเล็บล่อน KOH เป็นลบ","ถูก — septate hyphae ใน KOH ยืนยันการติดเชื้อรา","Paronychia คือการอักเสบของขอบเล็บ มีปวดบวมแดง","Beau's lines เป็นร่องขวางเล็บหลังเจ็บป่วยรุนแรง","Nail lichen planus ทำให้เล็บบาง มีสันตามยาว และเกิด pterygium"],"k":["Radial growth phase: เซลล์มะเร็งเติบโตในแนวราบตาม epidermis ระยะนี้ยังไม่มีศักยภาพแพร่กระจาย","Vertical growth phase: ลุกลามลงหนังแท้เป็นก้อน เป็นระยะที่มีศักยภาพแพร่กระจายและเป็นตัวพยากรณ์โรคที่สำคัญที่สุด","Breslow thickness คือการวัดความหนาของ vertical growth phase จึงเป็นตัวเลขที่ต้องรายงานเสมอ","Acral lentiginous melanoma พบที่ฝ่ามือ ฝ่าเท้า ใต้เล็บ พบสัดส่วนสูงในคนเอเชียและผิวสีเข้ม และมักวินิจฉัยช้าเพราะไม่สัมพันธ์กับแสงแดด"],"ref":"Melanoma · Growth phases"},{"sec":"Nail disorders","n":74,"q":"A 30-year-old woman presents with painful, erythematous swelling of the lateral nail fold after prolonged water exposure. What is the most likely diagnosis?","o":["Onychomycosis","Acute paronychia","Chronic paronychia","Nail lichen planus","Pyogenic granuloma"],"a":1,"m":"Acute paronychia คือการอักเสบเฉียบพลันของขอบเล็บ ปวดบวมแดงชัดเจน มักจาก S. aureus หลังผิวหนังรอบเล็บเสียหาย","e":["Onychomycosis กระทบแผ่นเล็บ ไม่ทำให้ขอบเล็บบวมแดงเจ็บเฉียบพลัน","ถูก — ปวด บวม แดงเฉียบพลันที่ขอบเล็บ = acute paronychia","Chronic paronychia ดำเนินนานเกิน 6 สัปดาห์ อาการบวมไม่เจ็บมาก มักสัมพันธ์กับ Candida และการแช่น้ำเรื้อรัง","Nail lichen planus ไม่ทำให้บวมแดงเจ็บ","Pyogenic granuloma เป็นก้อนแดงเลือดออกง่าย ไม่ใช่การบวมอักเสบทั่วขอบเล็บ"],"k":["Onycholysis คือการแยกตัวของแผ่นเล็บออกจากฐานเล็บ เป็นคำศัพท์มาตรฐานที่ใช้บรรยายทั้งใน onychomycosis และ psoriatic nail","Beau's lines คือร่องขวางเล็บที่สะท้อนการหยุดสร้างเล็บชั่วคราวหลังเจ็บป่วยรุนแรง จึงบอกเวลาย้อนหลังได้","Nail lichen planus ทำให้เล็บบาง มีสันตามยาว และเกิด pterygium ซึ่งเป็นความเสียหายถาวร","เล็บเป็นส่วนต่อของ epidermis จึงสะท้อนโรคผิวหนังและโรคทางระบบได้"],"ref":"Nail disorders · Onychomycosis (เสริม)"},{"sec":"Pigmentation & Adnexa","n":75,"q":"A 55-year-old male presents with a rapidly growing pigmented lesion on his foot. The lesion is asymmetrical, with irregular borders and color variation. A biopsy reveals atypical melanocytes invading the dermis. What is the most likely diagnosis?","o":["Seborrheic keratosis","Actinic keratosis","Squamous cell carcinoma","Basal cell carcinoma","Melanoma"],"a":4,"m":"เมลาโนไซต์ผิดปกติรุกล้ำเข้าหนังแท้ = invasive melanoma (ตำแหน่งฝ่าเท้าเข้าได้กับชนิด acral lentiginous ซึ่งพบบ่อยในคนเอเชียและผิวสีเข้ม)","e":["Seborrheic keratosis เป็นเนื้องอกไม่ร้ายของ keratinocyte ไม่รุกล้ำ","Actinic keratosis เป็นรอยโรคของ keratinocyte จากแดด ไม่ใช่เมลาโนไซต์","SCC เป็นมะเร็งของ keratinocyte มี keratin pearls","BCC เป็นตุ่มมันวาว มี palisading nuclei ไม่ใช่เซลล์เม็ดสี","ถูก — atypical melanocytes invading dermis = melanoma"],"k":["Atypical melanocytes รุกล้ำเข้าหนังแท้ = invasive melanoma อยู่ในระยะ vertical growth phase","ตำแหน่งฝ่าเท้า/ใต้เล็บเข้าได้กับ acral lentiginous type ซึ่งพบบ่อยที่สุดในคนเอเชียและผิวสีเข้ม","การพยากรณ์โรคใช้ Breslow thickness เป็นหลัก ร่วมกับ ulceration และ mitotic rate","การรักษาคือผ่าตัดตัดออกด้วยขอบกว้างตามความหนา และพิจารณา sentinel lymph node biopsy"],"ref":"Malignant tumors · Invasive melanoma"}]},{"t":"ชุดที่ 2 · แบบฝึกหัดทบทวนจากเอกสารการบรรยาย (16 ข้อ)","qs":[{"sec":"Epidermal maturation","q":"เด็กชายอายุ 5 ปี มาพบแพทย์ด้วยอาการผิวแห้งเป็นเกล็ดทั่วตัวมาตั้งแต่เกิด การตรวจชิ้นเนื้อผิวหนังพบการหนาตัวของชั้น stratum corneum อย่างมาก และสูญเสียรูปแบบการเรียงตัวแบบตะกร้าสาน (basket-weave pattern) โดยไม่พบการอักเสบที่ชัดเจน พยาธิกำเนิดที่เป็นไปได้มากที่สุดของภาวะนี้คืออะไร?","o":["การเพิ่มจำนวนของเซลล์เคราติโนไซต์ (keratinocyte proliferation) ที่มากเกินไป","การทำลายเซลล์ฐาน (basal cells) โดยระบบภูมิคุ้มกัน","การหลุดลอกของเซลล์ผิวหนัง (desquamation) ที่บกพร่อง","การบวมน้ำระหว่างเซลล์ (spongiosis) ในชั้น epidermis"],"a":2,"m":"Ichthyosis เกิดจาก defective desquamation เซลล์ stratum corneum ที่ควรหลุดกลับยึดติดกันอยู่ ตัวอย่างคือ X-linked ichthyosis ที่ขาด steroid sulfatase ทำให้ cholesterol sulfate สะสมและเซลล์ไม่หลุดจากกัน","e":["ถ้าเป็นการแบ่งตัวเกินของ keratinocyte จะเป็นภาพของ psoriasis ซึ่งต้องมี acanthosis, parakeratosis และการอักเสบร่วมด้วย","การทำลายเซลล์ฐานโดยภูมิคุ้มกันคือ interface dermatitis (lichen planus, lupus, EM) ซึ่งต้องเห็นเซลล์อักเสบชัดเจน แต่โจทย์ระบุว่าแทบไม่มีการอักเสบ","ถูก — hyperkeratosis ที่ไม่มีการอักเสบ ร่วมกับการสูญเสีย basket-weave pattern คือภาพคลาสสิกของ ichthyosis","Spongiosis เป็นภาพของ eczema ซึ่งจะมีตุ่มน้ำและอาการคันเฉียบพลัน ไม่ใช่เกล็ดแห้งตั้งแต่แรกเกิด"],"k":["ในโรคนี้ scale ถือเป็น primary lesion ไม่ใช่ secondary lesion ต่างจากโรคผิวหนังทั่วไป","Basket-weave pattern คือการเรียงตัวโปร่งบางปกติของ stratum corneum เมื่อเคราตินอัดแน่นจึงหายไปกลายเป็น compact hyperkeratosis","ประวัติครอบครัวฝ่ายชายหลายคนมีอาการคล้ายกัน เข้าได้กับการถ่ายทอดแบบ X-linked recessive","Acquired ichthyosis ในผู้ใหญ่อาจเป็นสัญญาณของมะเร็งภายใน"],"n":76,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Acute inflammatory dermatoses","q":"หญิงอายุ 30 ปี มีผื่นแดงคันและตุ่มน้ำใส (vesicles) บริเวณแขนหลังสัมผัสกับต้นไม้ชนิดหนึ่ง การตรวจชิ้นเนื้อผิวหนังพบลักษณะการบวมน้ำระหว่างเซลล์ในชั้น epidermis (intercellular edema) อย่างชัดเจน ลักษณะทางจุลพยาธิวิทยานี้เรียกว่าอะไร?","o":["Acanthosis","Spongiosis","Interface dermatitis","Dermal edema"],"a":1,"m":"Intercellular edema ในชั้น epidermis คือ spongiosis เป็นลักษณะเด่นของ acute eczematous dermatitis ซึ่งเกิดจาก T cell–mediated (Type IV) hypersensitivity โดยมี Langerhans cell เป็นตัวนำเสนอแอนติเจน","e":["Acanthosis คือการหนาตัวของ epidermis จากการเพิ่มจำนวน keratinocyte ไม่ใช่การบวมน้ำ","ถูก — spongiosis คือการบวมน้ำระหว่างเซลล์ที่ดัน keratinocyte แยกจากกันจนเกิด intraepidermal vesicle","Interface dermatitis คือการอักเสบที่รอยต่อ epidermis-หนังแท้พร้อมการทำลายเซลล์ฐาน พบใน lichen planus และ erythema multiforme","Dermal edema คือการบวมในชั้นหนังแท้ พบใน urticaria โดยที่ epidermis ปกติ"],"k":["รอยโรคที่เกิดตามแนวสัมผัสพืชพิษเป็น linear distribution แบบ 'outside job' ตามที่เลกเชอร์จัดกลุ่มไว้","ลำดับเวลา: Type IV ใช้เวลา 24-72 ชม. หลังสัมผัส ต่างจากลมพิษที่เกิดภายในนาที","ระยะเรื้อรังของ eczema จะเปลี่ยนเป็น acanthosis + hyperkeratosis + dermal fibrosis คือ lichenification","การรักษาหลักคือหลีกเลี่ยงสารก่อภูมิแพ้ ร่วมกับสเตียรอยด์ทาและยาแก้คัน"],"n":77,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Acute inflammatory dermatoses","q":"ผู้ป่วยชายมีรอยโรคเป็นวงแดงคล้ายเป้ายิง (targetoid lesions) หลังได้รับยาปฏิชีวนะกลุ่มซัลฟา (sulfonamides) การตัดชิ้นเนื้อไปตรวจน่าจะพบลักษณะทางจุลพยาธิวิทยาแบบใดเด่นที่สุด?","o":["การสะสมของ neutrophils ใต้ชั้น stratum corneum","การบวมน้ำในชั้นหนังแท้เพียงอย่างเดียว","การแทรกซึมของลิมโฟไซต์ตามแนวรอยต่อ epidermis และหนังแท้ ร่วมกับการตายของเซลล์เคราติโนไซต์","การหนาตัวของชั้น stratum corneum"],"a":2,"m":"Erythema multiforme เกิดจาก CD8+ cytotoxic T lymphocyte ทำลาย keratinocyte ที่แสดงแอนติเจนของยาหรือเชื้อ จึงเห็น interface dermatitis ร่วมกับ necrotic keratinocytes และ vacuolization ของชั้น basal","e":["นิวโทรฟิลใต้ stratum corneum คือ subcorneal pustule ซึ่งเป็นภาพของ impetigo และ pustular psoriasis","การบวมน้ำในหนังแท้อย่างเดียวโดย epidermis ปกติ คือ urticaria ซึ่งไม่มีรอยโรครูปเป้าและหายใน 24 ชม.","ถูก — interface dermatitis + necrotic keratinocytes คือภาพของ erythema multiforme","Hyperkeratosis เป็นการเปลี่ยนแปลงเรื้อรังของชั้นขุย ไม่ใช่ปฏิกิริยาเฉียบพลันต่อยา"],"k":["สาเหตุที่พบบ่อยที่สุดของ EM คือ HSV ส่วนยา (โดยเฉพาะซัลฟา) เป็นสาเหตุหลักของ SJS/TEN","Target lesion แท้มี 3 วง: ตรงกลางคล้ำหรือพอง ล้อมด้วยวงซีดและวงแดงรอบนอก","ถ้ามีเยื่อบุหลายตำแหน่งร่วมด้วยและผิวเริ่มหลุดลอก ต้องประเมินว่าเข้าเกณฑ์ SJS/TEN แล้วหรือยัง","แกนร่วมของกลุ่มนี้คือ keratinocyte ตายจาก cytotoxic T cell ต่างจาก pemphigus ที่เซลล์แยกจากกันเพราะแอนติบอดี"],"n":78,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Chronic inflammatory dermatoses","q":"การตรวจชิ้นเนื้อผิวหนังของผู้ป่วยรายหนึ่งพบลักษณะการหนาตัวของ epidermis, parakeratosis และกลุ่มของนิวโทรฟิลในชั้น stratum corneum (Munro microabscesses) การวินิจฉัยที่เป็นไปได้มากที่สุดคืออะไร?","o":["Lichen Planus","Seborrheic Dermatitis","Psoriasis","Erythema Multiforme"],"a":2,"m":"Munro microabscess ร่วมกับ acanthosis และ parakeratosis คือชุดลักษณะจำเพาะของสะเก็ดเงิน ซึ่งเกิดจาก Th1/Th17 หลั่ง TNF, IL-12, IL-17, IL-23 กระตุ้น keratinocyte ให้แบ่งตัวเร็วผิดปกติ","e":["Lichen planus มี hypergranulosis, orthokeratosis และ band-like lymphocytic infiltrate ไม่มีนิวโทรฟิลในชั้นขุย","Seborrheic dermatitis มีภาพผสม spongiotic กับ acanthotic และมี follicular lipping แต่ไม่มี Munro microabscess ชัดเจน","ถูก — parakeratosis + Munro microabscess = psoriasis","Erythema multiforme เป็น interface dermatitis ที่มี keratinocyte ตาย ไม่ใช่การหนาตัวของ epidermis"],"k":["จำคู่กัน: Munro microabscess อยู่ในชั้น corneum ส่วน spongiform pustule of Kogoj อยู่ในชั้น spinosum","Rete ridges ในสะเก็ดเงินยืดยาวสม่ำเสมอ เลกเชอร์เปรียบเหมือนหลอดทดลองในตะแกรง","Suprapapillary thinning ทำให้ขูดขุยแล้วมีจุดเลือดออก = Auspitz sign","นิวโทรฟิลเหล่านี้ปลอดเชื้อ ไม่ได้แปลว่าติดเชื้อแบคทีเรีย"],"n":79,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Chronic inflammatory dermatoses","q":"ผู้ป่วยมีผื่นสีม่วง คัน มีลักษณะเป็นตุ่มแบนหลายเหลี่ยมบริเวณข้อมือ การตรวจชิ้นเนื้อผิวหนังพบลักษณะเด่นคือการแทรกซึมของลิมโฟไซต์เป็นแถบหนาแน่นตามแนวรอยต่อ epidermis-dermis และรอยต่อมีลักษณะหยักแหลมคล้ายฟันเลื่อย (sawtoothing) การวินิจฉัยคืออะไร?","o":["Psoriasis","Lichen Planus","Bullous Pemphigoid","Dermatitis Herpetiformis"],"a":1,"m":"Lichen planus เป็นต้นแบบของ interface (lichenoid) dermatitis เกิดจาก CD8+ T cell ทำลายเซลล์ชั้น basal จึงพบ band-like infiltrate, sawtoothing ของ rete ridges และ Civatte bodies","e":["Psoriasis มี parakeratosis, hypogranulosis และ Munro microabscess ส่วน rete ridges ยืดยาวสม่ำเสมอไม่ใช่หยักแหลม","ถูก — 6P ทางคลินิก + band-like infiltrate + sawtoothing = lichen planus","Bullous pemphigoid เป็นตุ่มน้ำ subepidermal ที่มี eosinophil และ linear IgG ที่ BMZ","Dermatitis herpetiformis มี neutrophil microabscess ที่ยอด dermal papillae และ granular IgA"],"k":["Wickham striae (ลายร่างแหขาว) ในช่องปากสอดคล้องกับ hypergranulosis ทางจุลพยาธิวิทยา","Lichen planus เกิด Koebner phenomenon ได้ จึงมักพบรอยโรคเรียงเป็นเส้นตามแนวเกา","Civatte (colloid) bodies คือ keratinocyte ที่ตายแบบ apoptosis","ข้อควรระวัง: oral lichen planus ชนิดแผลเรื้อรังเพิ่มความเสี่ยง squamous cell carcinoma"],"n":80,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Blistering diseases","q":"ผู้ป่วยสูงอายุมีตุ่มน้ำพองใสขนาดใหญ่ ผนังหนา ไม่แตกง่าย (tense bullae) ทั่วตัว การตรวจชิ้นเนื้อพบตุ่มน้ำใต้ชั้น epidermis (subepidermal blister) และมีอีโอซิโนฟิลจำนวนมาก ผล direct immunofluorescence พบการสะสมของ IgG และ C3 เป็นแนวเส้นตรงตามแนว dermoepidermal junction การวินิจฉัยที่ถูกต้องคืออะไร?","o":["Pemphigus Vulgaris","Pemphigus Foliaceus","Bullous Pemphigoid","Dermatitis Herpetiformis"],"a":2,"m":"Bullous pemphigoid เกิดจาก IgG ต่อ BPAGs (BP180/BP230) ซึ่งเป็นส่วนประกอบของ hemidesmosome การแยกตัวจึงอยู่ใต้ epidermis ทั้งชั้น ทำให้ตุ่มน้ำตึงและทนไม่แตกง่าย","e":["Pemphigus vulgaris เป็น suprabasal acantholysis ตุ่มน้ำหย่อนแตกง่าย และ DIF เป็นลายร่างแหระหว่างเซลล์","Pemphigus foliaceus แยกตัวระดับ subcorneal ตื้นยิ่งกว่า จึงมักเห็นเป็นสะเก็ดขุยไม่ใช่ตุ่มน้ำใหญ่","ถูก — tense bullae + subepidermal + eosinophils + linear IgG/C3 = bullous pemphigoid","Dermatitis herpetiformis เป็น granular IgA ที่ยอด dermal papillae และเซลล์เด่นคือนิวโทรฟิล"],"k":["หลักคิดของเลกเชอร์: ระดับการแยกตัวเป็นตัวกำหนดลักษณะทางคลินิก หลังคาที่หนา (epidermis ทั้งชั้น) จึงให้ตุ่มน้ำตึง","ไม่พบ acantholysis เป็นจุดแยกทางจุลพยาธิวิทยาที่สำคัญจากกลุ่ม pemphigus","มักพบในผู้สูงอายุ และมักไม่มีรอยโรคในช่องปาก ต่างจาก pemphigus vulgaris","ต้องส่ง DIF จากผิวหนังรอบรอยโรค (perilesional) ไม่ใช่จากตัวตุ่มน้ำเอง"],"n":81,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Blistering diseases","q":"ผู้ป่วยชายอายุ 35 ปี มีผื่นคันเป็นกลุ่มของตุ่มน้ำใสบริเวณข้อศอกและเข่า มีประวัติท้องเสียเรื้อรังร่วมด้วย การตรวจชิ้นเนื้อพบนิวโทรฟิลสะสมตัวเป็นหย่อมๆ ที่ปลาย dermal papillae และผล immunofluorescence พบการสะสมของ IgA แบบเป็นจุดๆ (granular deposits) ในบริเวณเดียวกัน โรคประจำตัวที่น่าจะพบร่วมกับผู้ป่วยรายนี้คืออะไร?","o":["Lupus Erythematosus","Celiac Disease","Psoriasis","Crohn's Disease"],"a":1,"m":"Dermatitis herpetiformis สัมพันธ์อย่างยิ่งกับ celiac disease โดย IgA ที่ตอบสนองต่อ gliadin จะทำปฏิกิริยาข้ามกับ reticulin/anchoring fibrils ที่ยึด basement membrane กับหนังแท้","e":["Lupus ให้ interface dermatitis และ DIF เป็นแถบ IgG/C3 ที่ BMZ (lupus band) ไม่ใช่ granular IgA","ถูก — DH คือการแสดงออกทางผิวหนังของ gluten sensitivity","Psoriasis ไม่มี immune deposit และไม่สัมพันธ์กับกลูเตน","Crohn's disease สัมพันธ์กับ erythema nodosum และ pyoderma gangrenosum มากกว่า"],"k":["ผู้ป่วยจำนวนมากมีลำไส้ผิดปกติแบบไม่มีอาการชัดเจน จึงต้องคัดกรอง celiac เสมอเมื่อวินิจฉัย DH","Dapsone ทำให้อาการคันดีขึ้นเร็วมาก แต่การงดกลูเตนตลอดชีวิตคือการรักษาต้นเหตุ","ชื่อโรคทำให้สับสน: herpetiformis หมายถึงตุ่มน้ำรวมกลุ่มคล้ายเริม ไม่ได้เกี่ยวกับไวรัสเริม","เทียบ DIF ให้แม่น: IgG fishnet→pemphigus, linear IgG→BP, granular IgA→DH, linear IgA→linear IgA disease"],"n":82,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Epidermal appendages","q":"หญิงอายุ 45 ปี มาด้วยอาการหน้าแดงตลอดเวลา มีตุ่มแดงและตุ่มหนองเล็กๆ บริเวณแก้มและจมูก ไม่มีสิวอุดตัน (comedones) เธอสังเกตว่าอาการแย่ลงเมื่อดื่มเครื่องดื่มร้อนหรือเครียด การวินิจฉัยที่เป็นไปได้มากที่สุดคืออะไร?","o":["Acne Vulgaris","Rosacea","Seborrheic Dermatitis","Allergic Contact Dermatitis"],"a":1,"m":"Rosacea พบในวัยกลางคนขึ้นไป มีหน้าแดงถาวรและเส้นเลือดฝอยขยาย ร่วมกับตุ่มแดงตุ่มหนอง แต่ไม่มี comedones ซึ่งเป็นจุดแยกที่สำคัญที่สุดจากสิว","e":["Acne vulgaris ต้องมี comedones (สิวหัวเปิด/หัวปิด) และพบในวัยรุ่นเป็นหลัก","ถูก — ไม่มี comedones + หน้าแดงถาวร + มีตัวกระตุ้นชัดเจน = rosacea","Seborrheic dermatitis เป็นขุยมันสีเหลืองบริเวณร่องข้างจมูกและคิ้ว ไม่ใช่ตุ่มหนองบนพื้นหน้าแดง","Allergic contact dermatitis มีประวัติสัมผัสสารและผื่นเป็นตุ่มน้ำคันตรงตำแหน่งที่สัมผัส"],"k":["กลไกตามเลกเชอร์: ความผิดปกติของ innate immunity โดยมีระดับ cathelicidin สูงและการกระตุ้นผ่าน TLR2 ทำให้เกิดการอักเสบและหลอดเลือดขยาย","4 ระยะของ rosacea: flushing เป็นพักๆ → หน้าแดงถาวรกับ telangiectasia → papules/pustules → rhinophyma","ตัวกระตุ้นที่พบบ่อย: ของร้อน แอลกอฮอล์ อาหารเผ็ด แสงแดด ความเครียด","จุลพยาธิวิทยา: perifollicular lymphocytic infiltrate, dermal edema และ telangiectasia"],"n":83,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Panniculitis","q":"ผลการตรวจชิ้นเนื้อผิวหนังของผู้ป่วยที่มีตุ่มนูนเจ็บที่หน้าแข้ง พบการอักเสบในผนังกั้นของชั้นไขมันใต้ผิวหนัง (septal panniculitis) โดยไม่พบการอักเสบของหลอดเลือด (vasculitis) การวินิจฉัยที่เป็นไปได้มากที่สุดคืออะไร?","o":["Erythema Induratum","Erythema Nodosum","Rosacea","Weber-Christian disease"],"a":1,"m":"Erythema nodosum เป็น panniculitis ที่พบบ่อยที่สุด มีการอักเสบที่ผนังกั้น (septa) ของชั้นไขมันโดยไม่มี vasculitis เป็นปฏิกิริยาตอบสนองแบบ delayed hypersensitivity ต่อสิ่งกระตุ้น","e":["Erythema induratum เป็น lobular panniculitis และมี necrotizing vasculitis ร่วมด้วย มักกลายเป็นแผล","ถูก — septal panniculitis without vasculitis = erythema nodosum","Rosacea เป็นโรคของใบหน้า ไม่ใช่การอักเสบของชั้นไขมัน","Weber-Christian disease เป็น lobular panniculitis ที่มีไข้ร่วมด้วย และเป็นคำวินิจฉัยที่ปัจจุบันแทบไม่ใช้แล้ว"],"k":["จำคู่ตรงข้าม: EN = septal, ไม่มี vasculitis, ไม่เป็นแผล / EI = lobular, มี necrotizing vasculitis, มักเป็นแผล","เมื่อวินิจฉัย EN ได้ ต้องตามหาต้นเหตุเสมอ: strep, วัณโรค, sarcoidosis, IBD, ยาคุมกำเนิด ยาซัลฟา การตั้งครรภ์","เซลล์อักเสบเปลี่ยนตามเวลา: ระยะแรกเป็นนิวโทรฟิล ต่อมาเป็น lymphocyte และ giant cell","การตัดชิ้นเนื้อควรใช้ incisional biopsy ที่ลึกถึงชั้นไขมัน ไม่ใช่ punch ตื้นๆ"],"n":84,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Infections","q":"การตรวจชิ้นเนื้อจากตุ่มนูนมีรอยบุ๋มตรงกลาง พบก้อนโปรตีนขนาดใหญ่รูปไข่ (ellipsoid cytoplasmic inclusions) อยู่ในไซโทพลาสซึมของเซลล์ epidermis ชั้นบน สิ่งที่พบนี้คืออะไรและเกิดจากเชื้ออะไร?","o":["Koilocytes จากเชื้อ HPV","Molluscum bodies จากเชื้อ Poxvirus","Munro microabscesses จาก Psoriasis","Colloid bodies จาก Lichen Planus"],"a":1,"m":"Molluscum bodies (Henderson-Paterson bodies) คือก้อน inclusion ของโปรตีนไวรัสรูปไข่ขนาดใหญ่ในไซโทพลาสซึม เป็นลักษณะจำเพาะของ molluscum contagiosum ซึ่งเกิดจาก poxvirus","e":["Koilocyte เป็นการเปลี่ยนแปลงที่นิวเคลียส (หดตัว) และมี perinuclear halo ไม่ใช่ก้อน inclusion ในไซโทพลาสซึม","ถูก — ellipsoid cytoplasmic inclusion + umbilicated papule = molluscum contagiosum จาก poxvirus","Munro microabscess คือกลุ่มนิวโทรฟิลในชั้น stratum corneum ไม่ใช่ inclusion ในเซลล์","Colloid (Civatte) body คือ keratinocyte ที่ตายแบบ apoptosis บริเวณ DEJ ใน lichen planus"],"k":["Umbilication (รอยบุ๋มกลาง) เป็นคำบรรยาย topography ที่เลกเชอร์จับคู่กับ molluscum และ basal cell carcinoma","ในเด็กเป็นโรคที่หายเองได้ภายในเป็นเดือนถึงปี ติดต่อโดยการสัมผัสโดยตรงและใช้ของร่วมกัน","ถ้าพบจำนวนมากหรือก้อนใหญ่ผิดปกติในผู้ใหญ่ ต้องนึกถึง HIV","แยกจากหูด: หูดผิวขรุขระคล้ายกะหล่ำ ไม่มีรอยบุ๋มกลาง และพบ koilocytosis"],"n":85,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Infections","q":"ผู้ป่วยมีผื่นแดงเป็นวงที่ลำตัว การขูดขุยไปตรวจด้วย KOH พบสายใยของเชื้อรา การตรวจชิ้นเนื้อเพื่อยืนยันน่าจะพบลักษณะใด และควรใช้การย้อมพิเศษอะไร?","o":["เชื้อราในชั้นหนังแท้, ย้อม Gram stain","เชื้อราในชั้นไขมันใต้ผิวหนัง, ย้อม Acid-fast stain","เชื้อราในชั้น stratum corneum, ย้อม PAS stain","เชื้อราในหลอดเลือด, ย้อม Silver stain"],"a":2,"m":"การติดเชื้อราตื้น (dermatophytosis) เชื้อจะถูกจำกัดอยู่เฉพาะชั้น stratum corneum เพราะ dermatophyte ย่อยเคราตินเป็นอาหาร การยืนยันทำได้ด้วย PAS stain ซึ่งย้อมผนังเซลล์เชื้อราติดสีชมพูแดง","e":["Gram stain ใช้กับแบคทีเรีย และเชื้อราตื้นไม่ลงไปถึงหนังแท้ในคนภูมิคุ้มกันปกติ","Acid-fast stain ใช้กับ Mycobacterium ไม่ใช่เชื้อรา และชั้นไขมันไม่ใช่ตำแหน่งของ dermatophyte","ถูก — เชื้อราจำกัดในชั้น stratum corneum และย้อมด้วย PAS ตามที่เลกเชอร์ระบุ","การพบเชื้อราในหลอดเลือด (angioinvasion) เป็นลักษณะของเชื้อราลุกลามรุนแรงเช่น Mucor หรือ Aspergillus ในผู้ป่วยภูมิคุ้มกันบกพร่อง"],"k":["ควรขูดขุยจากขอบวงที่ยังลุกลาม (active border) เพราะมีเชื้อมากที่สุด","GMS เป็นการย้อมทางเลือกที่ไวกว่า ให้เชื้อราติดสีดำบนพื้นเขียว","ถ้าเคยทาสเตียรอยด์มาก่อน ผื่นจะเปลี่ยนหน้าตาเป็น tinea incognito ทำให้วินิจฉัยพลาดได้ง่าย","กลุ่ม dermatophyte ที่ต้องจำ: Trichophyton, Microsporum, Epidermophyton"],"n":86,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Melanocytic lesions","q":"ลักษณะทางจุลพยาธิวิทยาที่สำคัญที่สุดที่ใช้แยกไฝธรรมดา (benign nevus) ออกจากมะเร็งเมลาโนมา (melanoma) คืออะไร?","o":["การมีอยู่ของเม็ดสีเมลานิน","การที่เซลล์เรียงตัวกันเป็นกลุ่ม (nesting)","การมีเซลล์ไฝอยู่ในชั้นหนังแท้","การที่เซลล์ไฝในส่วนลึกมีขนาดเล็กลงและไม่สร้างเม็ดสี (maturation)"],"a":3,"m":"Maturation คือลักษณะสำคัญของไฝธรรมดา: เซลล์ที่อยู่ตื้นใหญ่และสร้างเม็ดสี ส่วนที่ลึกลงไปเล็กลง ไม่สร้างเม็ดสี และเรียงคล้ายเส้นประสาท (neurotization) ขณะที่ melanoma ไม่มี maturation","e":["เมลานินพบได้ทั้งในไฝและ melanoma และ melanoma บางชนิดไม่มีเม็ดสีเลย (amelanotic) จึงใช้แยกไม่ได้","การเรียงตัวเป็นกลุ่ม (nests) เป็นลักษณะปกติของไฝ แต่ melanoma ก็มี nests ได้เช่นกัน เพียงแต่รูปร่างและขนาดไม่สม่ำเสมอ","เซลล์ไฝในหนังแท้เป็นเรื่องปกติของ compound และ intradermal nevus ไม่ได้บ่งถึงมะเร็ง","ถูก — การมี maturation ในส่วนลึกคือหลักฐานความไม่ร้ายแรงที่หนักแน่นที่สุด"],"k":["ที่ไฝธรรมดาไม่โตต่อเพราะกลไก oncogene-induced senescence หลังการกลายพันธุ์ของ BRAF หรือ RAS","ลักษณะอื่นที่ช่วยชี้ melanoma: นิวเคลียสไม่สม่ำเสมอ นิวคลีโอลัสสีชมพูเด่นชัด mitosis ในส่วนลึก และ pagetoid spread ขึ้นสู่ชั้นบน","Dysplastic nevus อยู่ตรงกลาง: มี architectural atypia (nests เชื่อมกัน) และ cytologic atypia ร่วมกับ lentiginous hyperplasia และ linear fibrosis","Dysplastic nevus เป็นได้ทั้ง precursor และ marker ของความเสี่ยงต่อ melanoma ที่ตำแหน่งอื่น"],"n":87,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Melanocytic lesions","q":"ผู้ป่วยมีรอยโรคที่ผิวหนัง การตรวจชิ้นเนื้อพบลักษณะเซลล์ขนาดใหญ่ที่มีนิวเคลียสไม่สม่ำเสมอและนิวคลีโอลัสสีชมพูเด่นชัด ลุกลามลงไปในชั้นหนังแท้เป็นก้อน (nodule) ลักษณะการเติบโตแบบนี้เรียกว่าอะไรและมีความสำคัญอย่างไร?","o":["Radial growth phase, มีการพยากรณ์โรคดี","Vertical growth phase, สัมพันธ์กับศักยภาพในการแพร่กระจาย","Junctional activity, เป็นลักษณะของไฝระยะเริ่มต้น","Neurotization, เป็นลักษณะของไฝที่ไม่ร้ายแรง"],"a":1,"m":"Vertical growth phase คือการเติบโตในแนวดิ่งลงสู่หนังแท้เป็นก้อน เป็นระยะที่เซลล์มะเร็งมีศักยภาพในการแพร่กระจาย และความหนาของระยะนี้ (Breslow thickness) เป็นปัจจัยพยากรณ์โรคที่สำคัญที่สุด","e":["Radial growth phase คือการเติบโตในแนวราบตาม epidermis ซึ่งยังไม่มีศักยภาพแพร่กระจาย แต่โจทย์ระบุว่าลุกลามลงหนังแท้เป็นก้อนแล้ว","ถูก — vertical growth phase สัมพันธ์กับ metastatic potential","Junctional activity หมายถึงกลุ่มเซลล์ที่รอยต่อ DEJ ซึ่งเป็นลักษณะของไฝระยะแรก ไม่ใช่ก้อนในหนังแท้","Neurotization คือเซลล์ไฝส่วนลึกที่เรียงคล้ายเส้นประสาท เป็นลักษณะของ maturation ในไฝไม่ร้ายแรง"],"k":["เหตุผลที่ Breslow thickness สำคัญ: ความลึกสัมพันธ์โดยตรงกับโอกาสเข้าถึงหลอดเลือดและท่อน้ำเหลืองในหนังแท้","การวัดวัดจากชั้น granular layer ลงไปถึงเซลล์มะเร็งที่ลึกที่สุด จึงต้องได้ชิ้นเนื้อที่มีฐานครบ (excisional biopsy)","ปัจจัยพยากรณ์อื่นที่ต้องรายงาน: ulceration, mitotic rate, lymphovascular invasion, margin","การรักษาคือผ่าตัดด้วยขอบกว้างตามความหนา และพิจารณา sentinel lymph node biopsy"],"n":88,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Benign epithelial tumors","q":"ผู้ป่วยสูงอายุมาพบแพทย์ด้วยเรื่องมีตุ่มคล้ายหูดสีน้ำตาลเกิดขึ้นจำนวนมากอย่างรวดเร็วทั่วลำตัวในช่วง 3 เดือนที่ผ่านมา ซึ่งเรียกว่า Leser-Trélat sign ภาวะนี้สัมพันธ์กับโรคใดมากที่สุด?","o":["การติดเชื้อไวรัส HPV","โรคสะเก็ดเงิน","มะเร็งของอวัยวะภายใน เช่น มะเร็งกระเพาะอาหาร","การแพ้ยา"],"a":2,"m":"Leser-Trélat sign คือการเกิด seborrheic keratosis จำนวนมากอย่างรวดเร็ว จัดเป็น paraneoplastic syndrome ที่สัมพันธ์กับมะเร็งภายใน โดยเฉพาะมะเร็งกระเพาะอาหารและมะเร็งทางเดินอาหารอื่น","e":["HPV ก่อหูดจริง แต่ seborrheic keratosis ไม่ได้เกิดจากไวรัส และหูดไม่ขึ้นพรวดพราดทั่วลำตัวแบบนี้","สะเก็ดเงินให้แผ่นแดงขุยสีเงิน ไม่ใช่ตุ่มน้ำตาลแบบแปะติด","ถูก — Leser-Trélat sign เป็นสัญญาณเตือนของมะเร็งภายใน ต้องตรวจค้นหาเพิ่มเติม","การแพ้ยาให้ผื่นเฉียบพลันแบบ maculopapular, urticaria หรือ SJS/TEN ไม่ใช่เนื้องอกจำนวนมาก"],"k":["Seborrheic keratosis ปกติเป็นเนื้องอกไม่ร้ายของผู้สูงอายุ ลักษณะ stuck-on ผิวคล้ายขี้ผึ้ง พบ horn cysts และ pseudohorn cysts","คำสำคัญที่ทำให้ผิดปกติคือ 'จำนวนมากและเกิดเร็ว' ไม่ใช่แค่การมี seborrheic keratosis","Paraneoplastic sign อื่นที่ต้องนึกถึงคู่กัน: acanthosis nigricans ชนิด malignant และ acquired ichthyosis","Sebaceous adenoma หลายก้อนก็เป็นสัญญาณของ Muir-Torre syndrome ซึ่งสัมพันธ์กับมะเร็งลำไส้ใหญ่"],"n":89,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Malignant epidermal tumors","q":"การตรวจชิ้นเนื้อจากตุ่มนูนคล้ายไข่มุกที่ใบหน้า พบกลุ่มเซลล์มะเร็งที่มีนิวเคลียสติดสีเข้มในชั้นหนังแท้ โดยเซลล์ที่ขอบของกลุ่มมีการเรียงตัวเป็นแนวรั้ว (palisading) และมีช่องว่างแยกระหว่างกลุ่มเซลล์กับเนื้อเยื่อรอบข้าง การวินิจฉัยที่ถูกต้องคืออะไร?","o":["Actinic Keratosis","Squamous Cell Carcinoma","Melanoma","Basal Cell Carcinoma"],"a":3,"m":"Basal cell carcinoma ประกอบด้วยกลุ่ม basaloid cells ในหนังแท้ โดยเซลล์ขอบเรียงเป็นรั้ว (peripheral palisading) และมี stromal retraction เป็นช่องว่างรอบก้อน ทางคลินิกคือ pearly papule ขอบม้วนมี telangiectasia","e":["Actinic keratosis อยู่ในชั้น epidermis เท่านั้น มี atypia เฉพาะชั้นล่างสุด และไม่ได้เป็นก้อนในหนังแท้","SCC มีเซลล์ที่สร้างเคราติน เห็น keratin pearls และ intercellular bridges ไม่มี palisading","Melanoma เป็นเซลล์เม็ดสีที่มีนิวคลีโอลัสเด่น ต้องยืนยันด้วย S100/SOX10/HMB-45","ถูก — peripheral palisading + stromal retraction = basal cell carcinoma"],"k":["กลไกตามเลกเชอร์: การกลายพันธุ์ของ PTCH ปลดเบรก Hedgehog signaling pathway ทำให้เซลล์เบซัลแบ่งตัวไม่หยุด","BCC พบบ่อยที่สุดในบรรดามะเร็งผิวหนัง โตช้า และแทบไม่แพร่กระจาย","ข้อกังวลหลักของ BCC คือการทำลายเนื้อเยื่อเฉพาะที่ (โดยเฉพาะรอบตา จมูก หู) ต่างจาก SCC ที่กังวลเรื่องการแพร่กระจาย","Gorlin (nevoid BCC) syndrome เกิดจากความผิดปกติของ PTCH ตั้งแต่กำเนิด ทำให้เกิด BCC หลายก้อนตั้งแต่อายุน้อย"],"n":90,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"},{"sec":"Malignant epidermal tumors","q":"ข้อใดคือความแตกต่างที่สำคัญที่สุดระหว่าง squamous cell carcinoma in situ และ actinic keratosis?","o":["SCC in situ สัมพันธ์กับแสงแดด แต่ AK ไม่สัมพันธ์","ใน SCC in situ เซลล์ผิดปกติจะพบตลอดทุกชั้นความหนาของ epidermis แต่ใน AK จะพบเฉพาะชั้นล่างสุด","AK สามารถแพร่กระจายได้ แต่ SCC in situ ไม่สามารถ","AK เกิดจากการกลายพันธุ์ของยีน PTCH แต่ SCC in situ เกิดจากการกลายพันธุ์ของยีน TP53"],"a":1,"m":"ทั้งสองภาวะอยู่บนสเปกตรัมเดียวกันของความเสียหายจาก UV ต่างกันที่ระดับความหนาของ atypia: AK มี atypia เฉพาะชั้นล่างสุดของ epidermis ส่วน SCC in situ มี full-thickness atypia แต่ยังไม่ทะลุ basement membrane","e":["ผิด เพราะทั้งสองภาวะสัมพันธ์กับ UV เหมือนกัน และมีการกลายพันธุ์ของ TP53 เป็นเหตุการณ์ตั้งต้นร่วมกัน","ถูก — ระดับความหนาของ atypia คือจุดแยกที่แท้จริง","ผิดกลับด้าน ทั้งคู่ยังไม่ทะลุ basement membrane จึงยังไม่แพร่กระจาย ต้องกลายเป็น invasive SCC ก่อน","PTCH เป็นยีนของ BCC ไม่ใช่ของ AK ส่วน TP53 เกี่ยวข้องกับทั้ง AK และ SCC"],"k":["ลำดับการดำเนินโรค: sun-damaged skin → actinic keratosis → SCC in situ (Bowen disease) → invasive SCC","ลักษณะร่วมที่พบในหนังแท้คือ solar (dermal) elastosis ซึ่งเป็นหลักฐานของความเสียหายจากแสงแดดสะสม","ทางคลินิก AK เป็นปื้นหยาบคล้ายกระดาษทราย ส่วน Bowen disease เป็นแผ่นแดงมีขุยขอบเขตชัด","จุดที่ต้องกังวลคือเมื่อทะลุ basement membrane แล้ว เพราะ SCC สามารถแพร่กระจายไปต่อมน้ำเหลืองได้ ต่างจาก BCC"],"n":91,"ref":"แบบฝึกหัดทบทวนจากเอกสารการบรรยาย"}]}];
const L='ABCDE'.split('');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=null;
function show(id){['home','quiz','summary'].forEach(x=>$(x).classList.toggle('hide',x!==id));window.scrollTo(0,0)}
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function renderHome(){
 cur&&clearInterval(cur.timerId);cur=null;
 $('home').innerHTML='<p style="color:var(--mut);font-size:14px">กดตอบแล้วเฉลยจะขึ้นทันที พร้อมเหตุผลรายตัวเลือกและประเด็นสำคัญที่ต้องจำ ย้อนกลับไปดูข้อก่อนหน้าได้ตลอด</p>'+
 DATA.map((s,i)=>`<div class="card setcard" onclick="startSet(${i})"><h3>${esc(s.t)}</h3><span>${s.qs.length} ข้อ · เฉลยครบทุกตัวเลือก + key points</span></div>`).join('');
 show('home');
}
function startSet(i){
 if(cur)clearInterval(cur.timerId);
 cur={setIdx:i,qs:DATA[i].qs,answers:DATA[i].qs.map(()=>null),i:0,sec:0,timerId:null,ok:0,bad:0};
 cur.timerId=setInterval(()=>{cur.sec++;const t=$('clock');if(t)t.textContent=fmt(cur.sec)},1000);
 renderQuestion();show('quiz');
}
function renderQuestion(){
 const q=cur.qs[cur.i],pick=cur.answers[cur.i],done=pick!==null;
 let opts=q.o.map((o,oi)=>{
   let cls='opt';
   if(done){cls+= oi===q.a?' ok':(oi===pick?' no':' dim')}
   return `<button class="${cls}" ${done?'disabled':''} onclick="answer(${oi})"><b>${L[oi]}</b>${esc(o)}</button>`}).join('');
 let ex='';
 if(done){
   const right=pick===q.a;
   ex=`<div class="explain"><div class="verdict ${right?'g':'r'}">${right?'✓ ตอบถูก':'✗ ตอบผิด — คำตอบที่ถูกคือ '+L[q.a]}</div>
   <h4>กลไก / เหตุผลหลัก</h4><div>${esc(q.m)}</div>
   <h4>วิเคราะห์รายตัวเลือก</h4><ul>${q.e.map((e,ei)=>`<li><b>${L[ei]})</b> ${esc(e)}</li>`).join('')}</ul>
   ${q.k?`<h4>ประเด็นสำคัญที่ต้องจำ</h4><div class="keyp"><ul>${q.k.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
   ${q.ref?`<div class="ref">อ้างอิงเนื้อหา: ${esc(q.ref)}</div>`:''}</div>`;
 }
 const answered=cur.answers.filter(x=>x!==null).length;
 $('quiz').innerHTML=`
 <div class="bar">
   <span class="pill">ข้อ ${cur.i+1}/${cur.qs.length}</span>
   <span class="pill">⏱ <span id="clock">${fmt(cur.sec)}</span></span>
   <span class="pill g">ถูก ${cur.ok}</span>
   <span class="pill r">ผิด ${cur.bad}</span>
 </div>
 <div class="prog"><i style="width:${answered/cur.qs.length*100}%"></i></div>
 <div class="card">
   <div class="sec">${esc(q.sec)} · ข้อ ${q.n}</div>
   <div class="q">${esc(q.q)}</div>
   ${opts}${ex}
   <div class="nav">
     <button class="btn" onclick="go(-1)" ${cur.i===0?'disabled':''}>← ข้อก่อนหน้า</button>
     <button class="btn pri" onclick="go(1)" ${cur.i===cur.qs.length-1?'disabled':''}>ข้อถัดไป →</button>
     <button class="btn ghost" onclick="finishSet()">ดูสรุปผล</button>
     <button class="btn ghost" onclick="goHome()">หน้าแรก</button>
   </div>
   <div class="grid">${cur.qs.map((_,k)=>{
     const a=cur.answers[k];let c='gq';if(k===cur.i)c+=' now';else if(a!==null)c+= a===cur.qs[k].a?' ok':' no';
     return `<button class="${c}" onclick="jump(${k})">${k+1}</button>`}).join('')}</div>
 </div>`;
}
function answer(oi){
 if(cur.answers[cur.i]!==null)return;
 cur.answers[cur.i]=oi;
 if(oi===cur.qs[cur.i].a)cur.ok++;else cur.bad++;
 renderQuestion();
}
function go(d){const n=cur.i+d;if(n<0||n>=cur.qs.length)return;cur.i=n;renderQuestion();window.scrollTo(0,0)}
function jump(k){cur.i=k;renderQuestion();window.scrollTo(0,0)}
function review(k){cur.i=k;renderQuestion();show('quiz')}
function finishSet(){
 clearInterval(cur.timerId);
 const total=cur.qs.length,ans=cur.answers.filter(x=>x!==null).length;
 const pct=total?Math.round(cur.ok/total*100):0;
 const wrong=cur.qs.map((q,k)=>({q,k})).filter(o=>cur.answers[o.k]!==null&&cur.answers[o.k]!==o.q.a);
 const skip=cur.qs.map((q,k)=>k).filter(k=>cur.answers[k]===null);
 $('summary').innerHTML=`<div class="card">
  <div class="sec">สรุปผล · ${esc(DATA[cur.setIdx].t)}</div>
  <div class="score">${pct}%</div>
  <div class="stat">
    <div><b style="color:var(--good)">${cur.ok}</b>ถูก</div>
    <div><b style="color:var(--bad)">${cur.bad}</b>ผิด</div>
    <div><b>${total-ans}</b>ยังไม่ตอบ</div>
    <div><b>${fmt(cur.sec)}</b>เวลาที่ใช้</div>
  </div>
  ${wrong.length?`<div class="rev"><b>ข้อที่ตอบผิด (กดเพื่อย้อนดูเฉลย):</b><br>${wrong.map(o=>`<a onclick="review(${o.k})">ข้อ ${o.k+1}</a>`).join(' · ')}</div>`:'<div class="rev">ตอบถูกทุกข้อที่ทำ 🎉</div>'}
  ${skip.length?`<div class="rev"><b>ยังไม่ได้ตอบ:</b><br>${skip.map(k=>`<a onclick="review(${k})">ข้อ ${k+1}</a>`).join(' · ')}</div>`:''}
  <div class="nav">
    <button class="btn pri" onclick="startSet(${cur.setIdx})">ทำชุดนี้ใหม่</button>
    <button class="btn" onclick="show('quiz')">กลับไปทำต่อ</button>
    <button class="btn ghost" onclick="goHome()">หน้าแรก</button>
  </div></div>`;
 show('summary');
}
function goHome(){renderHome()}
renderHome();
</script><!--auto-home-btn-->
