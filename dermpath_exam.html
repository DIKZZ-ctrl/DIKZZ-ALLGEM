<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dermatopathology MCQ — ข้อสอบพร้อมเฉลยละเอียด</title>
<style>
:root{--hema:#5b2a86;--eosin:#e0567c;--good:#1f8a5f;--bad:#c43d4f;--bg:#f7f4fb;--card:#fff;--ink:#1f1b26;--mut:#6b6478;--line:#e6dff0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Sarabun",sans-serif;line-height:1.65}
.wrap{max-width:880px;margin:0 auto;padding:16px 14px 60px}
.top{background:linear-gradient(120deg,var(--hema),var(--eosin));color:#fff;padding:22px 14px;text-align:center}
.top h1{margin:0;font-size:20px;letter-spacing:.3px}
.top p{margin:6px 0 0;opacity:.9;font-size:13px}
.hide{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(91,42,134,.06)}
.setcard{cursor:pointer;transition:.15s}
.setcard:hover{transform:translateY(-2px);border-color:var(--hema)}
.setcard h3{margin:0 0 4px;color:var(--hema);font-size:16px}
.setcard span{color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--line)}
.pill{font-size:13px;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.pill.g{color:var(--good);border-color:#bfe6d4}.pill.r{color:var(--bad);border-color:#f2ccd2}
.prog{height:5px;background:#eae2f3;border-radius:9px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--hema),var(--eosin))}
.sec{font-size:12px;color:var(--eosin);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.q{font-size:16px;margin:8px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;margin:8px 0;font:inherit;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--hema);background:#faf7fd}
.opt b{color:var(--hema);margin-right:8px}
.opt.ok{border-color:var(--good);background:#eefaf4}
.opt.no{border-color:var(--bad);background:#fdeef0}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.explain{border-left:4px solid var(--hema);background:#faf7fd;border-radius:0 11px 11px 0;padding:12px 14px;margin-top:14px;font-size:14px}
.explain h4{margin:12px 0 6px;font-size:13px;color:var(--hema);text-transform:uppercase;letter-spacing:.5px}
.explain h4:first-of-type{margin-top:0}
.explain ul{margin:6px 0 0;padding-left:18px}
.explain li{margin:5px 0}
.keyp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}
.keyp li{margin:6px 0}
.ref{margin-top:10px;font-size:12px;color:var(--mut);font-style:italic}
.verdict{font-weight:700;margin-bottom:6px}
.verdict.g{color:var(--good)}.verdict.r{color:var(--bad)}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;padding:11px;border-radius:11px;border:1.5px solid var(--hema);background:#fff;color:var(--hema);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--hema);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--mut)}
.btn:disabled{opacity:.4;cursor:default}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gq{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:12px;cursor:pointer;color:var(--mut)}
.gq.ok{border-color:var(--good);color:var(--good);font-weight:700}
.gq.no{border-color:var(--bad);color:var(--bad);font-weight:700}
.gq.now{background:var(--hema);color:#fff;border-color:var(--hema)}
.score{font-size:42px;font-weight:800;color:var(--hema);text-align:center;margin:6px 0}
.stat{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.stat div{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 16px;text-align:center;min-width:92px}
.stat b{display:block;font-size:20px}
.rev{font-size:14px;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.rev a{color:var(--hema);cursor:pointer;text-decoration:underline}
</style></head><body>
<div class="top"><h1>Dermatopathology — คลังข้อสอบข้อกา</h1><p>เฉลยทุกตัวเลือก + ประเด็นที่ต้องจำ · ย้อนดูข้อเดิมได้ · จับเวลา</p></div>
<div class="wrap">
<div id="home"></div>
<div id="quiz" class="hide"></div>
<div id="summary" class="hide"></div>
</div>
<script>
const DATA=[{"t":"ชุดที่ 1 · Review Questions ท้ายบท (75 ข้อ)","qs":[{"sec":"Biopsy & Stains","n":1,"q":"A 55-year-old male presents with a non-healing pigmented lesion on his forearm. The lesion is irregular, has grown over the past six months, and is suspected to be melanoma. What is the most appropriate type of biopsy?","o":["Shave biopsy","Punch biopsy","Excisional biopsy","Fine needle aspiration","Incisional biopsy"],"a":2,"m":"สงสัย melanoma ต้องได้ความลึกทั้งก้อนเพื่อวัด Breslow thickness ซึ่งเป็นตัวพยากรณ์โรคสำคัญที่สุด จึงใช้ excisional biopsy (ตัดทั้งรอยโรคพร้อมขอบแคบ 1-3 มม.)","e":["Shave biopsy ตัดตื้นเฉพาะ epidermis/upper dermis ทำให้ตัดฐานรอยโรคขาด วัด Breslow ไม่ได้ ห้ามใช้เมื่อสงสัยเมลาโนมา","Punch biopsy ได้ตัวอย่างแค่บางส่วน อาจพลาดบริเวณที่ลึกที่สุด ใช้เฉพาะรอยโรคใหญ่หรือตำแหน่งที่ตัดออกทั้งหมดไม่ได้","ถูก — ได้รอยโรคครบทั้งความกว้างและความลึก ประเมิน Breslow thickness, ulceration, mitotic rate ได้ครบถ้วน","FNA ได้แค่เซลล์ ไม่เห็นสถาปัตยกรรมเนื้อเยื่อและความลึก ใช้กับต่อมน้ำเหลืองที่สงสัยแพร่กระจายมากกว่า","Incisional biopsy ตัดเพียงบางส่วน เป็นทางเลือกรองเมื่อรอยโรคใหญ่มากหรืออยู่ตำแหน่งสำคัญ ไม่ใช่ทางเลือกแรกในเคสนี้"],"k":["Breslow thickness = ความหนาของ vertical growth phase เป็นปัจจัยพยากรณ์โรคที่สำคัญที่สุดของ melanoma ตามที่ระบุในเลกเชอร์ จึงต้องได้ชิ้นเนื้อที่มีฐานครบ","Excisional biopsy ตัดรอยโรคทั้งหมดพร้อมขอบแคบ 1-3 มม. ลึกถึงไขมันใต้ผิวหนัง ประเมินได้ทั้ง Breslow, ulceration, mitotic rate, margin","รอยโรคที่เข้าเกณฑ์ ABCDE (โตจาก 5 มม. เป็น 2 ซม. ใน 6 เดือน สีไม่สม่ำเสมอ ขอบไม่เรียบ) คือเคสตัวอย่างในเลกเชอร์ที่ต้องตัดชิ้นเนื้อทันที","กับดักข้อสอบ: shave biopsy ทำให้ under-staging เพราะฐานรอยโรคขาด ส่วน FNA ใช้เฉพาะประเมินต่อมน้ำเหลืองที่สงสัยแพร่กระจาย"],"ref":"ส่วนที่ 1 · การตรวจชิ้นเนื้อ / Melanoma"},{"sec":"Biopsy & Stains","n":2,"q":"A 45-year-old woman presents with a hyperpigmented skin lesion suspected to be a fungal infection. Which special stain would be most useful for identifying fungal elements?","o":["Hematoxylin and eosin (H&E)","Periodic Acid-Schiff (PAS)","Congo Red","Mucicarmine","Oil Red O"],"a":1,"m":"PAS ย้อมกับ polysaccharide ในผนังเซลล์เชื้อรา (glycogen/mucopolysaccharide) ทำให้ hyphae และ yeast ติดสีชมพูแดงเด่นชัด (GMS เป็นอีกทางเลือก)","e":["H&E เป็นการย้อมพื้นฐาน อาจเห็นเชื้อราบางส่วนแต่ไวต่ำ ไม่ใช่ special stain สำหรับเชื้อรา","ถูก — PAS ย้อมผนังเซลล์เชื้อราติดสีชมพูแดง (magenta) เป็น special stain มาตรฐาน","Congo Red ใช้ตรวจ amyloid ให้ apple-green birefringence ใต้แสงโพลาไรซ์","Mucicarmine ย้อม mucin เช่นใน adenocarcinoma หรือแคปซูลของ Cryptococcus","Oil Red O ย้อมไขมันในชิ้นเนื้อแช่แข็ง ไม่เกี่ยวกับเชื้อรา"],"k":["เลกเชอร์ระบุชัดว่าเชื้อรากลุ่ม dermatophyte จำกัดตัวอยู่เฉพาะชั้น stratum corneum เท่านั้น ไม่ลงลึกกว่านั้นในคนภูมิคุ้มกันปกติ","PAS ย้อม polysaccharide ในผนังเซลล์เชื้อราให้ติดสีชมพูแดง (magenta) จึงเห็น hyphae ตัดขวางในชั้นขุยได้ชัด","ทางเลือกอื่น: GMS (สีดำบนพื้นเขียว) ไวกว่าเล็กน้อย ส่วน KOH prep เป็นการตรวจข้างเตียงที่เร็วและถูกที่สุด","ตารางเทียบ special stain: PAS→เชื้อรา, Congo red→amyloid, Oil Red O→ไขมัน (frozen section), Mucicarmine→mucin, Prussian blue→เหล็ก"],"ref":"การติดเชื้อที่ผิวหนัง · Superficial fungal infection"},{"sec":"Macroscopic terms","n":3,"q":"A 30-year-old woman presents with multiple fluid-filled vesicles (<0.5 cm) on her fingers after exposure to an irritant. Which term best describes these lesions?","o":["Bulla","Macule","Papule","Vesicle","Nodule"],"a":3,"m":"รอยโรคมีน้ำใสภายในและขนาดน้อยกว่า 0.5 ซม. = vesicle (ถ้ามากกว่า 0.5 ซม. = bulla)","e":["Bulla คือถุงน้ำขนาดใหญ่กว่า 0.5 ซม.","Macule เป็นรอยแบนเปลี่ยนสี ไม่มีน้ำ ไม่นูน","Papule เป็นตุ่มนูนแข็ง (solid) น้อยกว่า 1 ซม. ไม่มีของเหลว","ถูก — ถุงน้ำใสขนาดน้อยกว่า 0.5 ซม.","Nodule เป็นก้อนแข็งลึกในชั้นหนังแท้ ขนาดมากกว่า 1 ซม."],"k":["Vesicle vs bulla ต่างกันที่ขนาดเท่านั้น ทั้งคู่คือรอยนูนที่มีของเหลวอยู่ภายใน","เกณฑ์ขนาดต่างกันตามตำรา: Robbins ใช้ 5 มม. (vesicle ≤5 มม., bulla >5 มม.) ส่วนตำราคลินิก (Bolognia) ใช้ 1 ซม. โจทย์ข้อนี้ให้เกณฑ์ 0.5 ซม. มาแล้วจึงตอบตามโจทย์","สัมพันธ์กับพยาธิวิทยา: vesicle/bulla = intraepidermal หรือ subepidermal cleft formation","ตัวอย่างโรค: contact dermatitis (spongiotic vesicle), herpes, varicella, dyshidrotic eczema"],"ref":"รอยโรคปฐมภูมิ · Vesicle/Bulla"},{"sec":"Macroscopic terms","n":4,"q":"A 25-year-old woman presents with a flat, hyperpigmented lesion on her cheek measuring 1 cm in diameter. The lesion is not palpable. What is the correct dermatological term for this lesion?","o":["Papule","Macule","Patch","Plaque","Nodule"],"a":1,"m":"รอยโรคแบนราบ คลำไม่ได้ เปลี่ยนเฉพาะสี ขนาดไม่เกิน 1 ซม. = macule (เกิน 1 ซม. จึงเรียก patch)","e":["Papule ต้องนูนคลำได้ แต่โจทย์ระบุว่า not palpable","ถูก — flat + not palpable + ไม่เกิน 1 ซม. = macule","Patch คือรอยแบนที่ใหญ่กว่า 1 ซม. โจทย์ให้พอดี 1 ซม. จึงยังจัดเป็น macule","Plaque เป็นแผ่นนูนกว้างกว่า 1 ซม. คลำได้","Nodule เป็นก้อนแข็งลึก คลำได้ชัดเจน"],"k":["Macule = flat + nonpalpable + เปลี่ยนเฉพาะสี ไม่มีการนูนหรือขุย","เกณฑ์ขนาดในเลกเชอร์มี 2 ชุด: ตาราง macroscopic ใช้ 5 มม. (macule ≤5 มม., patch >5 มม.) ส่วนหัวข้อ primary lesion ใช้ 1 ซม. ข้อนี้เป็นข้อที่มีข้อถกเถียง แต่คำตอบมาตรฐานของข้อสอบคือ macule","สัมพันธ์กับพยาธิวิทยา: macule/patch = การเปลี่ยนแปลงจำกัดใน epidermis หรือความผิดปกติของเม็ดสีเท่านั้น","ตัวอย่าง: solar lentigo, ephelis, petechiae, junctional nevus (macule) / vitiligo, melasma, café-au-lait (patch)"],"ref":"รอยโรคปฐมภูมิ · Macule/Patch"},{"sec":"Macroscopic terms","n":5,"q":"A 30-year-old male presents with a reddish, raised lesion on his forearm, measuring 1.5 cm in diameter. It has an irregular border and is slightly scaly. Which term best describes this lesion?","o":["Papule","Nodule","Plaque","Vesicle","Wheal"],"a":2,"m":"รอยนูนแบนกว้างกว่า 1 ซม. มีผิวเป็นขุย ความกว้างมากกว่าความลึก = plaque","e":["Papule ต้องเล็กกว่า 1 ซม.","Nodule เป็นก้อนลึกทรงกลม ความลึกมากกว่าความกว้าง ไม่ใช่แผ่นแบน","ถูก — แผ่นนูนกว้างกว่า 1 ซม. ผิวมีขุย","Vesicle ต้องมีน้ำอยู่ภายใน","Wheal เป็นผื่นนูนบวมชั่วคราวจาก dermal edema หายภายใน 24 ชม. ไม่มีขุย"],"k":["Plaque = รอยนูนผิวราบ คลำขอบได้ กว้างกว่าลึก มักเกิดจาก papule หลายอันรวมกัน (confluence)","พยาธิวิทยาเบื้องหลัง: epidermal hyperplasia และ/หรือการแทรกซึมของเซลล์ในหนังแท้","ผิวที่มีขุย (scale) บ่งถึง hyperproliferative state ของ epidermis เช่น psoriasis, lichen simplex chronicus, nummular dermatitis","ถ้าเป็น plaque ในชั้น dermis: granuloma annulare, sarcoidosis, morphea, lichen sclerosus"],"ref":"รอยโรคปฐมภูมิ · Plaque"},{"sec":"Macroscopic terms","n":6,"q":"A 40-year-old male presents with a firm, raised lesion on his back, measuring 2 cm in diameter. The lesion is deep within the dermis. What is the best classification?","o":["Papule","Nodule","Tumor","Cyst","Plaque"],"a":1,"m":"ก้อนแข็ง (solid) อยู่ลึกในหนังแท้ ขนาดมากกว่า 1 ซม. = nodule","e":["Papule เล็กกว่า 1 ซม. และอยู่ตื้น","ถูก — solid, deep, มากกว่า 1 ซม. = nodule","Tumor มักหมายถึงก้อนขนาดใหญ่กว่า 2 ซม. ขึ้นไป เป็นคำที่กว้างเกินสำหรับก้อน 2 ซม. ที่นิยามชัดแล้ว","Cyst ต้องมีผนังบุและมีของเหลว/สารกึ่งแข็งภายใน แต่โจทย์ระบุว่า firm","Plaque เป็นแผ่นแบนตื้น ไม่ใช่ก้อนลึก"],"k":["Nodule = ก้อนนูนที่มีปริมาตรมากกว่า papule กินลึกถึง dermis หรือ subcutis เลกเชอร์ใช้เกณฑ์มากกว่า 1.5 ซม.","จุดชี้ขาดไม่ใช่แค่ขนาด แต่คือความลึก: มวลส่วนใหญ่ของก้อนอยู่ใต้ผิว คลำได้มากกว่ามองเห็น","ตัวอย่าง: epidermoid inclusion cyst, lipoma, neurofibroma, nodular melanoma, metastasis, rheumatoid nodule, erythema nodosum","Cyst ต้องมีผนังบุและมีของเหลว/เคราตินภายใน จึงคลำได้นุ่มหยุ่น ต่างจากโจทย์ที่ระบุ firm"],"ref":"รอยโรคปฐมภูมิ · Nodule"},{"sec":"Macroscopic terms","n":7,"q":"A 35-year-old woman presents with multiple, itchy, fluid-filled lesions on her forearm. Each lesion measures 0.3 cm in diameter. What is the correct dermatologic term?","o":["Bulla","Vesicle","Pustule","Papule","Wheal"],"a":1,"m":"ถุงน้ำใสขนาด 0.3 ซม. (น้อยกว่า 0.5 ซม.) = vesicle","e":["Bulla ต้องใหญ่กว่า 0.5 ซม.","ถูก — 0.3 ซม. และมีของเหลวใส","Pustule ต้องมีหนอง (purulent) ไม่ใช่น้ำใส","Papule เป็นตุ่มแข็งไม่มีของเหลว","Wheal เกิดจากบวมในหนังแท้ ไม่มีโพรงของเหลว"],"k":["ของเหลวใส + ขนาดเล็ก + คัน = vesicle จาก spongiotic process หรือการติดเชื้อไวรัส","Pustule ต่างกันที่เนื้อในเป็นหนอง (neutrophils เป็นหลัก) เช่น folliculitis, acne, pustular psoriasis, AGEP, impetigo (subcorneal pustule)","Wheal เกิดจาก dermal edema ล้วนๆ ไม่มีโพรงของเหลว จึงยุบหายภายใน 24 ชม.","ถ้าตุ่มน้ำเรียงเป็นกลุ่ม (grouped) ให้นึกถึง herpes group; ถ้าเรียงเป็นเส้น (linear) ให้นึกถึงการสัมผัสสารก่อภูมิแพ้เช่น poison ivy"],"ref":"รอยโรคปฐมภูมิ · Vesicle"},{"sec":"Microscopic terms","n":8,"q":"A biopsy from a scaly lesion on the scalp shows epidermal hyperplasia with elongation of rete ridges. What is the correct microscopic term?","o":["Hyperkeratosis","Acanthosis","Dyskeratosis","Spongiosis","Parakeratosis"],"a":1,"m":"Acanthosis = หนาตัวของชั้น stratum spinosum ทำให้ rete ridges ยืดยาว พบเด่นใน psoriasis และ lichen simplex chronicus","e":["Hyperkeratosis คือ stratum corneum หนาขึ้น ไม่ใช่การยืดของ rete ridges","ถูก — epidermal hyperplasia + elongated rete ridges = acanthosis","Dyskeratosis คือ keratinization ก่อนกำหนดของ keratinocyte เดี่ยวๆ","Spongiosis คือบวมระหว่างเซลล์ (intercellular edema) พบใน eczema","Parakeratosis คือมีนิวเคลียสค้างอยู่ใน stratum corneum"],"k":["Acanthosis = epidermal hyperplasia จากการเพิ่มจำนวน keratinocyte ทำให้ stratum spinosum หนาและ rete ridges ยืดยาว","ในสะเก็ดเงิน rete ridges ยืดยาวลงอย่างสม่ำเสมอ เลกเชอร์เปรียบว่าเหมือน 'หลอดทดลองในตะแกรง' (test tubes in a rack)","แยกจากคำอื่น: hyperkeratosis = corneum หนา, hypergranulosis = granular layer หนา, papillomatosis = ยอด dermal papillae ยกตัวเป็น finger-like","พบ acanthosis ได้ในหลายโรค: psoriasis, lichen simplex chronicus, seborrheic keratosis, acanthosis nigricans, lichen planus"],"ref":"คำศัพท์จุลภาค · Acanthosis"},{"sec":"Microscopic terms","n":9,"q":"A 45-year-old male presents with severe pruritus and erythematous plaques. Biopsy reveals increased spaces between keratinocytes with intercellular edema. What is the most likely microscopic term?","o":["Acanthosis","Spongiosis","Hydropic degeneration","Civatte bodies","Munro microabscesses"],"a":1,"m":"น้ำสะสมระหว่าง keratinocyte ดันเซลล์แยกออกจากกันจนเห็นเป็นฟองน้ำ = spongiosis ลักษณะเด่นของ eczema/contact dermatitis","e":["Acanthosis คือหนังกำพร้าหนาตัว ไม่ใช่การบวมระหว่างเซลล์","ถูก — intercellular edema ในหนังกำพร้า = spongiosis","Hydropic (vacuolar) degeneration คือการบวมของเซลล์ชั้น basal พบใน lichen planus และ lupus","Civatte bodies คือ keratinocyte ที่ตายแบบ apoptosis พบใน lichen planus","Munro microabscesses คือกลุ่มนิวโทรฟิลใน stratum corneum พบใน psoriasis"],"k":["Spongiosis = intercellular edema ดันเซลล์แยกจากกันจนเห็นสะพาน desmosome ยืดออกคล้ายฟองน้ำ ถ้ารุนแรงจะรวมเป็น intraepidermal vesicle","กลไก: T cell–mediated (Type IV hypersensitivity) โดย Langerhans cell จับแอนติเจนแล้วนำเสนอต่อ T cell เมื่อสัมผัสซ้ำจึงหลั่งไซโตไคน์","ระยะเรื้อรังของ eczema จะเปลี่ยนจาก spongiosis เป็น acanthosis + hyperkeratosis + papillary dermal fibrosis (= lichenification)","แยกจาก hydropic/vacuolar degeneration ซึ่งเป็นการบวมของเซลล์ชั้น basal ที่รอยต่อ DEJ (interface pattern)"],"ref":"Acute inflammatory dermatoses · Eczema"},{"sec":"Microscopic terms","n":10,"q":"A 35-year-old woman presents with a thickened, leathery plaque on the nape of her neck, which has been present for years due to chronic scratching. What is the correct microscopic term for this change?","o":["Hyperkeratosis","Acanthosis","Lichenification","Spongiosis","Dysplasia"],"a":2,"m":"การเกาเรื้อรังทำให้ผิวหนาเป็นแผ่นหนังคล้ายหนังสัตว์ ลายผิวเด่นขึ้น = lichenification (พบใน lichen simplex chronicus)","e":["Hyperkeratosis เป็นเพียงองค์ประกอบย่อยหนึ่ง ไม่ครอบคลุมภาพรวมของผิวหนาจากการเกา","Acanthosis ก็เป็นองค์ประกอบย่อยเช่นกัน แต่คำที่ตรงกับภาพทางคลินิกคือ lichenification","ถูก — ผิวหนาเป็นแผ่นเหนียวจากการเกาเรื้อรัง = lichenification","Spongiosis พบในระยะเฉียบพลันของ eczema ไม่ใช่ระยะเรื้อรัง","Dysplasia คือการเปลี่ยนแปลงของเซลล์ผิดปกติแบบก่อนมะเร็ง ไม่เกี่ยวกับการเกา"],"k":["Lichenification = ผิวหนาหยาบและลายผิวเด่นขึ้น จากการถู/เกาซ้ำๆ เป็นรอยโรคทุติยภูมิ (secondary lesion)","จุลพยาธิวิทยา: epidermal hyperplasia (acanthosis) + hyperkeratosis + papillary dermal fibrosis + perivascular lymphohistiocytic infiltrate","โรคที่พบ: lichen simplex chronicus (เป็นเดี่ยวๆ), atopic dermatitis ระยะเรื้อรัง, chronic irritant contact dermatitis","เทียบกับ atrophy: lichenification = reactive hyperplasia (เนื้อเยื่อเพิ่ม) ส่วน atrophy = loss ของเนื้อเยื่อ"],"ref":"รอยโรคทุติยภูมิ · Lichenification"},{"sec":"Classification & Etiology","n":11,"q":"A 28-year-old woman presents with multiple vesicular lesions on her lips and perioral region. A Tzanck smear shows multinucleated giant cells. What is the most likely etiological classification of this disease?","o":["Bacterial infection","Viral infection","Fungal infection","Parasitic infection","Autoimmune disease"],"a":1,"m":"Tzanck smear พบ multinucleated giant cells = ผลของ herpesvirus (HSV/VZV) ที่ทำให้เซลล์รวมตัวกัน จัดเป็นการติดเชื้อไวรัส","e":["แบคทีเรียทำให้เกิดตุ่มหนอง/สะเก็ดน้ำผึ้ง และ Gram stain พบเชื้อ ไม่ให้ giant cells","ถูก — multinucleated giant cells บ่งชี้ herpes virus infection","เชื้อราตรวจด้วย KOH/PAS พบ hyphae หรือ yeast ไม่ใช่ giant cells","ปรสิตเช่น scabies พบตัวไรจากการขูดผิว ไม่ใช่ giant cells","โรคภูมิต้านตนเองเช่น pemphigus พบ acantholytic cells เดี่ยว ไม่ใช่เซลล์หลายนิวเคลียส"],"k":["Multinucleated giant cell เกิดจาก herpesvirus ทำให้เซลล์ที่ติดเชื้อหลอมรวมกัน (syncytium) พร้อม nuclear molding และ ground-glass chromatin","Tzanck smear แยก HSV จาก VZV ไม่ได้ ต้องใช้ตำแหน่ง/ลักษณะทางคลินิกหรือ PCR/DFA ช่วย","ในชิ้นเนื้อจะเห็น ballooning (hydropic) degeneration และ reticular degeneration ซึ่งเป็นลักษณะของ viral cytopathic effect","เทียบกับกลุ่มอื่น: pemphigus ให้ acantholytic cell เดี่ยวกลม (Tzanck cell) ที่ไม่มีหลายนิวเคลียส"],"ref":"การติดเชื้อไวรัส · HSV"},{"sec":"Classification & Etiology","n":12,"q":"A 35-year-old male presents with erythematous, scaly plaques on the extensor surfaces of his elbows and knees. Histopathology reveals parakeratosis, Munro microabscesses, and elongation of rete ridges. Which of the following best describes the pathogenesis of his disease?","o":["Type I hypersensitivity reaction","Chronic inflammatory autoimmune process","Direct bacterial invasion","Genetic mutation causing epidermal dysplasia","Viral-mediated keratinocyte apoptosis"],"a":1,"m":"Psoriasis เกิดจากกระบวนการอักเสบเรื้อรังแบบภูมิต้านตนเอง โดย T cell (Th1/Th17) หลั่ง IL-17/IL-23/TNF-α กระตุ้นให้ keratinocyte แบ่งตัวเร็วผิดปกติ","e":["Type I hypersensitivity เกิดผ่าน IgE และ mast cell พบใน urticaria/anaphylaxis ไม่ใช่สะเก็ดเงิน","ถูก — เป็นการอักเสบเรื้อรังที่ขับเคลื่อนโดย T cell (immune-mediated)","ไม่มีการรุกรานของแบคทีเรีย Munro microabscess เป็นนิวโทรฟิลที่ปลอดเชื้อ","มีปัจจัยพันธุกรรม (HLA-Cw6) ร่วมด้วย แต่ไม่ได้ทำให้เกิด dysplasia","ไม่มีไวรัสเกี่ยวข้อง และ keratinocyte แบ่งตัวมากขึ้น ไม่ได้ตายมากขึ้น"],"k":["Psoriasis มีพื้นฐานเป็น autoimmune/immune-mediated โดย Th1 และ Th17 หลั่ง TNF, IL-12, IL-17, IL-23 กระตุ้น keratinocyte ให้แบ่งตัวเร็วผิดปกติ","ผลคือ turnover ของ epidermis สั้นลงเหลือไม่กี่วัน เซลล์ขึ้นมาถึงผิวโดยยังมีนิวเคลียส = parakeratosis","Munro microabscess = นิวโทรฟิลที่ปลอดเชื้อใน stratum corneum ไม่ได้แปลว่ามีการติดเชื้อแบคทีเรีย","การรักษาที่มุ่งเป้าไซโตไคน์ (TNF inhibitor, anti-IL-17/23) ได้ผลดี ซึ่งยืนยันกลไก immune-mediated"],"ref":"Chronic inflammatory dermatoses · Psoriasis"},{"sec":"Classification & Etiology","n":13,"q":"A 6-year-old child presents with honey-colored crusted lesions around the mouth and nose. Gram stain reveals Gram-positive cocci in chains. What is the most appropriate classification of this condition?","o":["Fungal infection","Viral infection","Autoimmune disorder","Bacterial infection","Neoplastic disease"],"a":3,"m":"Impetigo จากเชื้อ Gram-positive cocci เรียงเป็นสาย = Streptococcus pyogenes จัดเป็นการติดเชื้อแบคทีเรีย","e":["เชื้อราให้ผื่นวงแหวนมีขุยและตรวจพบ hyphae ไม่ใช่ cocci","ไวรัสให้ตุ่มน้ำใสรวมกลุ่ม ไม่พบแบคทีเรียใน Gram stain","โรคภูมิต้านตนเองไม่พบเชื้อจากการย้อม","ถูก — Gram-positive cocci in chains = Streptococcus จึงเป็นการติดเชื้อแบคทีเรีย","เนื้องอกไม่ก่อสะเก็ดสีน้ำผึ้งและไม่พบเชื้อ"],"k":["Gram-positive cocci เรียงเป็นสาย = Streptococcus, เรียงเป็นกลุ่มพวงองุ่น = Staphylococcus ข้อนี้โจทย์ให้ chains จึงเป็นสเตรป","ปัจจุบัน S. aureus เป็นสาเหตุอันดับหนึ่งของ impetigo ส่วน S. pyogenes พบรองลงมาแต่สำคัญเพราะเสี่ยง post-streptococcal glomerulonephritis","กลไกตามเลกเชอร์: แบคทีเรียสร้าง exfoliative toxin ที่ตัดทำลาย desmoglein 1 ทำให้ผิวแยกตัวระดับตื้น","จุลพยาธิวิทยา: subcorneal pustule (นิวโทรฟิลใต้ stratum corneum) ซึ่งแตกแล้วแห้งเป็นสะเก็ดสีน้ำผึ้ง"],"ref":"การติดเชื้อแบคทีเรีย · Impetigo"},{"sec":"Classification & Etiology","n":14,"q":"A 25-year-old woman presents with multiple hypopigmented, well-demarcated macules on her trunk, with fine scaling. A KOH preparation reveals \"spaghetti and meatball\" appearance. What is the appropriate classification of this disease?","o":["Viral infection","Bacterial infection","Fungal infection","Autoimmune disorder","Neoplastic disease"],"a":2,"m":"ภาพ spaghetti and meatballs คือ short hyphae ปนกับ yeast กลมของ Malassezia furfur ใน tinea versicolor = การติดเชื้อรา","e":["ไวรัสไม่ปรากฏใน KOH prep","แบคทีเรีย (เช่น erythrasma) ให้เรืองแสงปะการังใต้ Wood lamp ไม่ใช่ hyphae ใน KOH","ถูก — Malassezia furfur เป็นเชื้อรา (yeast)","Vitiligo ซึ่งเป็นภูมิต้านตนเองให้รอยด่างขาวสนิทไม่มีขุยและ KOH ปกติ","ไม่ใช่เนื้องอก"],"k":["Spaghetti and meatballs = short septate hyphae ปนกับ yeast กลมเป็นกลุ่มของ Malassezia furfur","Malassezia เป็นยีสต์ประจำถิ่นที่ชอบไขมัน จึงเจริญมากบริเวณลำตัวส่วนบน หน้าอก และหลัง","รอยด่างจางเกิดจากกรด azelaic ที่เชื้อสร้างขึ้นไปยับยั้ง tyrosinase ทำให้ผิวบริเวณนั้นไม่คล้ำตามแดด","เชื้อเดียวกันนี้ยังสัมพันธ์กับ seborrheic dermatitis และ Malassezia folliculitis"],"ref":"การติดเชื้อรา · Tinea versicolor"},{"sec":"Classification & Etiology","n":15,"q":"A 38-year-old man presents with multiple firm, skin-colored papules on his hands. Histopathology reveals hyperkeratosis and koilocytosis. What is the most likely classification of this condition?","o":["Viral infection","Bacterial infection","Autoimmune disease","Connective tissue disorder","Genetic skin disease"],"a":0,"m":"Koilocytosis (เซลล์มีวงใสรอบนิวเคลียส) เป็นลักษณะเฉพาะของการติดเชื้อ HPV คือหูดสามัญ (verruca vulgaris)","e":["ถูก — koilocyte เป็นผลจาก HPV จัดเป็นการติดเชื้อไวรัส","แบคทีเรียไม่ทำให้เกิด koilocytosis","ไม่มีลักษณะภูมิต้านตนเองเช่น interface dermatitis หรือ acantholysis","โรคเนื้อเยื่อเกี่ยวพันทำให้เกิดพังผืดในหนังแท้ ไม่ใช่หูด","โรคพันธุกรรมมักแสดงตั้งแต่เด็กและกระจายทั่วตัว"],"k":["Koilocyte = เซลล์ในชั้นบนของ epidermis ที่มีนิวเคลียสหดตัวติดสีเข้มและมี perinuclear halo ใสล้อมรอบ เป็น cytopathic effect ของ HPV","ลักษณะร่วมของหูด: verrucous/papillomatous epidermal hyperplasia, hyperkeratosis, hypergranulosis และ rete ridges โค้งเข้าหากลาง","HPV ชนิดก่อหูดที่ผิวหนัง (1, 2, 4) ต่างจากชนิดเสี่ยงสูงที่ก่อมะเร็งปากมดลูก (16, 18)","แยกจาก molluscum: molluscum มีรอยบุ๋มกลางและพบ molluscum (Henderson-Paterson) bodies ในไซโทพลาสซึม"],"ref":"การติดเชื้อไวรัส · Verrucae"},{"sec":"Classification & Etiology","n":16,"q":"A 48-year-old man presents with a non-healing ulcer on his foot. A biopsy shows necrotizing granulomatous inflammation with acid-fast bacilli. What is the most appropriate classification?","o":["Viral infection","Fungal infection","Bacterial infection","Autoimmune disease","Genetic disease"],"a":2,"m":"Acid-fast bacilli = Mycobacterium ซึ่งเป็นแบคทีเรีย ทำให้เกิด necrotizing granuloma","e":["ไวรัสไม่ติดสี acid-fast และไม่สร้าง granuloma แบบนี้","เชื้อราตรวจด้วย PAS/GMS ไม่ใช่ acid-fast stain","ถูก — Mycobacterium เป็นแบคทีเรียชนิด acid-fast","โรคภูมิต้านตนเองอาจมี granuloma ได้แต่ต้องไม่พบเชื้อ","โรคพันธุกรรมไม่ทำให้พบเชื้อในชิ้นเนื้อ"],"k":["Acid-fast bacilli ติดสีจากการย้อม Ziehl-Neelsen/Fite เพราะผนังเซลล์มี mycolic acid = กลุ่ม Mycobacterium ซึ่งเป็นแบคทีเรีย","Necrotizing (caseating) granuloma + AFB ชี้ไปที่ M. tuberculosis หรือ atypical mycobacteria","Granuloma ที่ไม่พบเชื้อ ให้นึกถึง sarcoidosis, granuloma annulare, foreign body reaction","ถ้ารอยโรคเรียงตามแนวท่อน้ำเหลือง (sporotrichoid pattern) ให้นึกถึง atypical mycobacteria, sporotrichosis, nocardiosis"],"ref":"การจำแนกโรค · Granulomatous infection"},{"sec":"Classification & Etiology","n":17,"q":"A 55-year-old woman presents with thickened, hardened skin on her hands and face, along with Raynaud's phenomenon. A skin biopsy shows dermal fibrosis and atrophy of adnexal structures. What is the best classification of this disease?","o":["Infectious disease","Autoimmune disease","Genetic disease","Neoplastic disease","Environmental disorder"],"a":1,"m":"Systemic sclerosis (scleroderma) เป็นโรคภูมิต้านตนเองที่มีการสร้างคอลลาเจนมากเกินในหนังแท้ ร่วมกับ Raynaud และ autoantibody (anti-Scl-70, anti-centromere)","e":["ไม่พบเชื้อและไม่ตอบสนองต่อยาต้านจุลชีพ","ถูก — scleroderma เป็นโรคภูมิต้านตนเองของเนื้อเยื่อเกี่ยวพัน","ไม่ใช่โรคถ่ายทอดทางพันธุกรรมโดยตรง","ไม่มีเซลล์มะเร็ง ไม่ใช่เนื้องอก","สารเคมีบางชนิดกระตุ้นได้ แต่กลไกหลักคือภูมิต้านตนเอง"],"k":["Scleroderma เป็นโรคภูมิต้านตนเองของเนื้อเยื่อเกี่ยวพัน มีการสร้างคอลลาเจนมากเกินในหนังแท้จนผิวแข็งตึง","จุลพยาธิวิทยา: dermal fibrosis หนาแน่น + การฝ่อหายของ adnexal structures (ต่อมเหงื่อ รูขุมขน) ถูกคอลลาเจนบีบรัด","Raynaud phenomenon มักเป็นอาการนำ สะท้อน vasculopathy ของหลอดเลือดเล็ก","แอนติบอดี: anti-Scl-70 (topoisomerase I) → diffuse type, anti-centromere → limited type/CREST"],"ref":"Connective tissue disease · Systemic sclerosis"},{"sec":"Viral exanthem","n":18,"q":"A 6-year-old child presents with fever, malaise, and a maculopapular rash that began on the face and spread downward. Oral examination reveals Koplik spots. What is the most likely cause?","o":["Rubella virus","Measles virus","Parvovirus B19","Varicella-zoster virus","Coxsackievirus"],"a":1,"m":"Koplik spots (จุดขาวบนพื้นแดงในกระพุ้งแก้ม) เป็น pathognomonic ของหัด (measles) ร่วมกับผื่นลงจากหน้าสู่ลำตัว และไข้สูง ไอ น้ำมูก ตาแดง","e":["หัดเยอรมันมีผื่นคล้ายกันแต่อาการเบากว่า ไม่มี Koplik spots มีต่อมน้ำเหลืองหลังหูโต","ถูก — Koplik spots คือลักษณะจำเพาะของ measles","Parvovirus B19 ทำให้แก้มแดงเหมือนถูกตบและผื่นลูกไม้ที่แขนขา","VZV ทำให้เกิดตุ่มน้ำหลายระยะพร้อมกัน ไม่ใช่ผื่นราบนูน","Coxsackievirus ทำให้เกิดตุ่มที่มือ เท้า ปาก"],"k":["Koplik spots = จุดขาวเทาบนพื้นแดงในกระพุ้งแก้มตรงข้ามฟันกราม เป็น pathognomonic และขึ้นก่อนผื่น 1-2 วัน","อาการนำคือ 3C: cough, coryza, conjunctivitis ร่วมกับไข้สูง","ผื่นเป็น maculopapular เริ่มที่หน้า/หลังหู แล้วลามลงล่าง (cephalocaudal) และจางแบบ brownish desquamation","ชิ้นเนื้อ/รอยโรคในเยื่อบุพบ Warthin-Finkeldey multinucleated giant cells"],"ref":"Viral exanthem · Measles"},{"sec":"Viral exanthem","n":19,"q":"A 3-year-old child presents with a maculopapular rash that started on the face and spread to the trunk. Postauricular lymphadenopathy is noted. What is the most likely diagnosis?","o":["Measles","Rubella","Scarlet fever","Roseola","Fifth disease"],"a":1,"m":"ผื่นจากหน้าลงลำตัว ร่วมกับต่อมน้ำเหลืองหลังหูและท้ายทอยโต โดยไม่มีอาการหนัก = หัดเยอรมัน (rubella)","e":["หัดต้องมี Koplik spots และไข้สูงร่วมกับ 3C (cough, coryza, conjunctivitis)","ถูก — postauricular lymphadenopathy เป็นเบาะแสเด่นของ rubella","ไข้อีดำอีแดงให้ผื่นสากเหมือนกระดาษทราย ลิ้นสตรอว์เบอร์รี และเริ่มที่ลำตัว","Roseola ไข้สูง 3 วันแล้วผื่นขึ้นหลังไข้ลด เริ่มที่ลำตัว","Fifth disease มีแก้มแดงจัดแบบ slapped cheek"],"k":["Postauricular และ suboccipital lymphadenopathy เป็นเบาะแสเด่นที่แยก rubella จาก measles","อาการทั่วไปเบากว่าหัดชัดเจน ไข้ต่ำ ผื่นหายเร็วภายใน 3 วัน (three-day measles)","ความสำคัญหลักคือ congenital rubella syndrome ในหญิงตั้งครรภ์ไตรมาสแรก (หูหนวก ต้อกระจก หัวใจพิการ)","เทียบเพื่อนบ้าน: roseola = ไข้สูง 3 วันแล้วผื่นขึ้นตอนไข้ลด, fifth disease = slapped cheek, scarlet fever = ผื่นสาก + strawberry tongue"],"ref":"Viral exanthem · Rubella"},{"sec":"Hypersensitivity & Eczema","n":20,"q":"A 30-year-old woman develops pruritic wheals and shortness of breath after eating shellfish. What is the primary underlying mechanism?","o":["Type I hypersensitivity","Type II hypersensitivity","Type III immune complex deposition","T-cell-mediated reaction","Autoimmune process"],"a":0,"m":"อาการลมพิษและหลอดลมตีบทันทีหลังกินอาหาร = IgE จับ mast cell แล้วหลั่ง histamine = Type I hypersensitivity","e":["ถูก — IgE-mediated mast cell degranulation ทันทีหลังสัมผัสสารก่อภูมิแพ้","Type II เกิดจากแอนติบอดีทำลายเซลล์เป้าหมายโดยตรง เช่น pemphigus","Type III เกิดจาก immune complex สะสม เช่น vasculitis, serum sickness","Type IV ใช้เวลา 24-72 ชั่วโมง เช่น contact dermatitis ไม่ใช่ทันทีทันใด","ไม่ใช่ภูมิต้านตนเอง เพราะเป้าหมายคือโปรตีนจากอาหาร"],"k":["กลไกคือ mast cell degranulation หลั่ง histamine ทำให้เกิด microvascular hyperpermeability อย่างรวดเร็ว","จุลพยาธิวิทยา: superficial dermal edema ดันคอลลาเจนแยกห่าง + sparse perivenular mononuclear infiltrate โดย epidermis ปกติ","ลักษณะทางคลินิกที่ยืนยัน: wheal นูนคัน ย้ายที่ และหายภายใน 24 ชม. โดยไม่ทิ้งรอย","ถ้าผื่นอยู่นานเกิน 24 ชม. หรือทิ้งรอยคล้ำ ต้องนึกถึง urticarial vasculitis และควรตัดชิ้นเนื้อ"],"ref":"Acute inflammatory dermatoses · Urticaria"},{"sec":"Hypersensitivity & Eczema","n":21,"q":"A 2-year-old child presents with pruritic, erythematous patches on the flexor surfaces of his elbows and knees. His mother has asthma. What is the most likely diagnosis?","o":["Atopic dermatitis","Allergic contact dermatitis","Psoriasis","Lichen planus","Seborrheic dermatitis"],"a":0,"m":"เด็กเล็ก ผื่นคันบริเวณข้อพับ ร่วมกับประวัติภูมิแพ้ในครอบครัว (atopic march) = atopic dermatitis ซึ่งสัมพันธ์กับการกลายพันธุ์ filaggrin","e":["ถูก — ตำแหน่งข้อพับ + ประวัติหอบหืดในครอบครัว = ผื่นภูมิแพ้ผิวหนัง","Contact dermatitis ต้องมีประวัติสัมผัสสารเฉพาะและผื่นอยู่ตรงตำแหน่งที่สัมผัส","Psoriasis อยู่ด้านนอกข้อ (extensor) มีขุยสีเงินหนา","Lichen planus พบในผู้ใหญ่ ตุ่มสีม่วงเหลี่ยม","Seborrheic dermatitis อยู่บริเวณมัน เช่น หนังศีรษะ ร่องข้างจมูก"],"k":["สาระสำคัญคือ skin barrier defect (filaggrin mutation) ร่วมกับ immune dysregulation แบบ Th2","ตำแหน่งตามอายุ: ทารกอยู่ที่แก้มและด้านนอกแขนขา ส่วนเด็กโต/ผู้ใหญ่ย้ายมาอยู่ที่ข้อพับ (flexural) ตามที่เลกเชอร์ระบุใน distribution pattern","Atopic march: atopic dermatitis → แพ้อาหาร → หอบหืด → allergic rhinitis ประวัติครอบครัวจึงมีน้ำหนักมาก","ระยะเฉียบพลันเห็น spongiosis ระยะเรื้อรังเห็น lichenification จากการเกา"],"ref":"Eczema · Atopic dermatitis"},{"sec":"Hypersensitivity & Eczema","n":22,"q":"A 30-year-old woman presents with a pruritic, vesicular rash on her hands after using a new detergent. A biopsy shows spongiosis. What is the most likely diagnosis?","o":["Psoriasis","Allergic contact dermatitis","Seborrheic dermatitis","Erythema multiforme","Lichen planus"],"a":1,"m":"ผื่นตุ่มน้ำคันเฉพาะที่หลังสัมผัสสารใหม่ + spongiosis = allergic contact dermatitis (Type IV hypersensitivity)","e":["Psoriasis มี parakeratosis และ Munro microabscess ไม่ใช่ spongiosis","ถูก — สัมพันธ์ชัดกับสารใหม่ที่สัมผัส และพยาธิสภาพเป็น spongiotic dermatitis","Seborrheic dermatitis เป็นขุยมันบริเวณใบหน้า/หนังศีรษะ ไม่สัมพันธ์กับผงซักฟอก","Erythema multiforme มีรอยโรครูปเป้า มักตามหลัง HSV","Lichen planus มี band-like infiltrate และตุ่มม่วงเหลี่ยม"],"k":["เป็น Type IV (delayed) hypersensitivity ใช้เวลา 24-72 ชม. หลังสัมผัสซ้ำ ต่างจาก Type I ที่เกิดทันที","Langerhans cell ใน epidermis จับแอนติเจนแล้วเดินทางไปต่อมน้ำเหลืองเพื่อกระตุ้น T cell (sensitization) การสัมผัสครั้งถัดไปจึงเกิดผื่น","ตำแหน่งผื่นตรงกับบริเวณที่สัมผัสเป๊ะๆ และอาจเรียงเป็นเส้น (linear streaks) เช่นกรณี poison ivy","จุลพยาธิวิทยา: spongiosis ± intraepidermal vesicle + perivascular lymphocyte และมัก exocytosis ของ eosinophil"],"ref":"Eczema · Allergic contact dermatitis"},{"sec":"Drug & Reactive","n":23,"q":"A 25-year-old male presents with targetoid lesions on his hands and forearms after a recent herpes simplex virus infection. What is the most likely diagnosis?","o":["Urticaria","Erythema multiforme","Erythema nodosum","Toxic epidermal necrolysis","Bullous pemphigoid"],"a":1,"m":"รอยโรครูปเป้า (target lesion) ที่ปลายมือปลายเท้า หลังติดเชื้อ HSV = erythema multiforme ซึ่ง HSV เป็นสาเหตุที่พบบ่อยที่สุด","e":["Urticaria เป็นผื่นนูนบวมย้ายที่และหายใน 24 ชม. ไม่มีรูปเป้า","ถูก — target lesion + ประวัติ HSV = erythema multiforme","Erythema nodosum เป็นตุ่มก้อนเจ็บใต้ผิวหนังบริเวณหน้าแข้ง","TEN มีผิวหนังหลุดลอกเป็นแผ่นกว้างกว่า 30% มักจากยา","Bullous pemphigoid เป็นตุ่มน้ำตึงในผู้สูงอายุ"],"k":["กลไก: CD8+ cytotoxic T lymphocyte ทำลาย keratinocyte ที่แสดงแอนติเจนของเชื้อหรือยาบนผิวเซลล์","HSV เป็นสาเหตุที่พบบ่อยที่สุดของ EM (โดยเฉพาะชนิดกลับเป็นซ้ำ) ส่วนยาเป็นสาเหตุหลักของ SJS/TEN","จุลพยาธิวิทยา: interface dermatitis + necrotic (apoptotic) keratinocytes + vacuolization ของชั้น basal","Target lesion แท้ต้องมี 3 วง: ตรงกลางคล้ำ/พอง ล้อมด้วยวงซีดและวงแดงรอบนอก มักอยู่ที่ปลายมือปลายเท้า"],"ref":"Acute inflammatory dermatoses · Erythema multiforme"},{"sec":"Drug & Reactive","n":24,"q":"A 40-year-old woman develops diffuse skin sloughing involving >30% of her body surface area one week after taking sulfa antibiotics. What is the most likely diagnosis?","o":["Erythema multiforme","Stevens-Johnson syndrome","Toxic epidermal necrolysis","Drug-induced urticaria","Acute generalized exanthematous pustulosis"],"a":2,"m":"ผิวหนังหลุดลอกมากกว่า 30% ของพื้นที่ผิวกาย = toxic epidermal necrolysis (SJS น้อยกว่า 10%, overlap 10-30%)","e":["EM จำกัดเฉพาะรอยโรครูปเป้า ไม่มีการลอกเป็นแผ่นกว้าง","SJS ผิวหลุดน้อยกว่า 10% ของพื้นที่ผิวกาย","ถูก — มากกว่า 30% เข้าเกณฑ์ TEN","ลมพิษจากยาเป็นผื่นนูนคัน ไม่มีการตายของหนังกำพร้า","AGEP เป็นตุ่มหนองเล็กจำนวนมากบนผิวแดง ไม่ลอกเป็นแผ่น"],"k":["เกณฑ์แบ่งตามพื้นที่ผิวที่หลุดลอก: SJS <10%, SJS/TEN overlap 10-30%, TEN >30%","ยาที่พบบ่อย: sulfonamides, allopurinol, ยากันชัก (carbamazepine, lamotrigine), NSAIDs กลุ่ม oxicam","จุลพยาธิวิทยา: full-thickness epidermal necrosis + subepidermal split โดยมีเซลล์อักเสบน้อย (pauci-inflammatory)","Nikolsky sign บวก ต้องดูแลแบบผู้ป่วยไฟไหม้ หยุดยาต้นเหตุทันที และเฝ้าระวังเยื่อบุตา/ปาก/อวัยวะเพศ"],"ref":"Drug reaction · SJS/TEN"},{"sec":"Papulosquamous","n":25,"q":"A 40-year-old male presents with erythematous plaques with silvery scales on the extensor surfaces of his elbows and knees. A biopsy shows parakeratosis and Munro microabscesses. What is the pathogenesis?","o":["Type I hypersensitivity","Type IV hypersensitivity","T-cell-mediated keratinocyte hyperproliferation","Autoimmune attack on desmosomes","IgA-mediated basement membrane attack"],"a":2,"m":"Psoriasis: T cell (Th17) หลั่ง cytokine กระตุ้น keratinocyte ให้แบ่งตัวเร็วผิดปกติ (turnover เหลือ 3-5 วัน) เกิด parakeratosis และขุยสีเงิน","e":["Type I เป็น IgE-mediated ไม่เกี่ยวกับสะเก็ดเงิน","Type IV เป็นกลไกของ contact dermatitis แม้จะมี T cell ร่วมแต่คำตอบที่จำเพาะกว่าคือข้อ c","ถูก — T-cell-mediated keratinocyte hyperproliferation","การทำลาย desmosome คือกลไกของ pemphigus vulgaris","IgA ที่ basement membrane คือ linear IgA disease"],"k":["ลำดับเหตุการณ์: T cell (Th1/Th17) หลั่งไซโตไคน์ → keratinocyte hyperproliferation → parakeratosis + ขุยสีเงิน","แม้ T cell จะเป็นตัวขับเคลื่อน แต่ผลลัพธ์ปลายทางที่ทำให้เกิดภาพโรคคือการแบ่งตัวเกินของ keratinocyte จึงเป็นคำตอบที่จำเพาะที่สุด","Suprapapillary thinning ทำให้หลอดเลือดที่ขยายตัวอยู่ใต้ยอด dermal papillae ถูกกระเทือนง่าย เกิด Auspitz sign เมื่อขูดขุย","Koebner phenomenon: รอยโรคใหม่เกิดตามแนวที่ผิวถูกทำร้าย พบทั้งใน psoriasis, lichen planus และ vitiligo"],"ref":"Chronic inflammatory dermatoses · Psoriasis"},{"sec":"Papulosquamous","n":26,"q":"A 35-year-old man presents with greasy, yellow scales on his scalp, eyebrows, and nasolabial folds. The condition worsens with stress. What is the causative factor?","o":["Malassezia yeast","Streptococcus pyogenes","Autoantibodies against desmoglein","IgA immune complex deposition","Keratinocyte apoptosis"],"a":0,"m":"Seborrheic dermatitis สัมพันธ์กับยีสต์ Malassezia ที่เจริญในบริเวณต่อมไขมันมาก ทำให้เกิดการอักเสบและขุยมันสีเหลือง","e":["ถูก — Malassezia (Pityrosporum) เป็นปัจจัยหลัก จึงตอบสนองต่อยาต้านเชื้อรา","Streptococcus ทำให้เกิด impetigo/erysipelas","แอนติบอดีต่อ desmoglein คือ pemphigus","IgA immune complex คือ HSP/dermatitis herpetiformis","Keratinocyte apoptosis เด่นใน erythema multiforme และ lichen planus"],"k":["เลกเชอร์เน้นว่าเป็นการอักเสบของ epidermis ไม่ใช่โรคของต่อมไขมันโดยตรง แต่สัมพันธ์กับปริมาณ sebum และการตอบสนองต่อ Malassezia","ตำแหน่งจึงตรงกับบริเวณที่มีต่อมไขมันหนาแน่น: หนังศีรษะ คิ้ว ร่องข้างจมูก หลังหู หน้าอกส่วนบน","จุลพยาธิวิทยาผสมระหว่าง spongiotic (แบบ eczema) และ acanthotic (แบบ psoriasis) โดยมี follicular lipping เป็นตัวชี้เฉพาะ","Follicular lipping = หย่อม parakeratosis ที่มีนิวโทรฟิลปนอยู่บริเวณปากรูขุมขน"],"ref":"Chronic inflammatory dermatoses · Seborrheic dermatitis"},{"sec":"Papulosquamous","n":27,"q":"A 50-year-old woman presents with pruritic, purple, polygonal papules on her wrists and white lacy lesions on her oral mucosa. What is the most likely diagnosis?","o":["Psoriasis","Lichen planus","Pemphigus vulgaris","Cutaneous lupus erythematosus","Bullous pemphigoid"],"a":1,"m":"6P ของ lichen planus: pruritic, purple, polygonal, planar, papules, plaques ร่วมกับ Wickham striae (ลายร่างแหขาว) ในช่องปาก","e":["Psoriasis มีขุยสีเงินบน extensor ไม่ใช่ตุ่มม่วงที่ข้อมือด้านใน","ถูก — ตุ่มม่วงเหลี่ยมคัน + Wickham striae = lichen planus","Pemphigus vulgaris เป็นตุ่มน้ำหย่อนและแผลถลอกในปาก ไม่ใช่ลายร่างแหขาว","Cutaneous lupus ให้ผื่นวงแดงมีขุยและรอยแผลเป็น สัมพันธ์กับแสงแดด","Bullous pemphigoid เป็นตุ่มน้ำตึง มักไม่มีรอยโรคในช่องปาก"],"k":["6P: Pruritic, Purple, Polygonal, Planar, Papules, Plaques ตำแหน่งเด่นคือข้อมือด้านใน ขา และเยื่อบุช่องปาก","Wickham striae = ลายร่างแหขาวบนผิวรอยโรคและในกระพุ้งแก้ม สอดคล้องกับ hypergranulosis ที่พบทางจุลพยาธิวิทยา","กลไก: CD8+ T cell ทำลายเซลล์ชั้น basal ที่แสดงแอนติเจนเปลี่ยนแปลงไป จัดเป็น interface dermatitis ต้นแบบ","ข้อควรระวังทางคลินิก: oral lichen planus ชนิดเป็นแผลเรื้อรังมีความเสี่ยงกลายเป็น squamous cell carcinoma"],"ref":"Chronic inflammatory dermatoses · Lichen planus"},{"sec":"Papulosquamous","n":28,"q":"A 28-year-old HIV-positive male presents with severe seborrheic dermatitis affecting his scalp, face, and chest. Which organism is primarily associated with this condition?","o":["Streptococcus pyogenes","Candida albicans","Malassezia species","Propionibacterium acnes","Microsporum species"],"a":2,"m":"Seborrheic dermatitis ที่รุนแรงและดื้อการรักษาเป็นตัวบ่งชี้ภาวะภูมิคุ้มกันบกพร่อง เชื้อที่เกี่ยวข้องคือ Malassezia","e":["Streptococcus ทำให้เกิดการติดเชื้อผิวหนังแบบเฉียบพลัน ไม่ใช่ขุยมันเรื้อรัง","Candida ทำให้เกิดผื่นแดงมีตุ่มหนองบริเวณซอกพับชื้น","ถูก — Malassezia species","C. acnes เกี่ยวข้องกับสิว","Microsporum เป็น dermatophyte ทำให้เกิดกลาก"],"k":["Seborrheic dermatitis ที่รุนแรง กระจายกว้าง หรือดื้อการรักษา เป็นสัญญาณเตือนให้ตรวจหา HIV","เชื้อที่เกี่ยวข้องคือ Malassezia (Pityrosporum) ซึ่งเป็นยีสต์ประจำถิ่นบนผิวหนัง","อธิบายด้วยหลักในเลกเชอร์เรื่อง skin microbiome: เมื่อภูมิคุ้มกันเสียสมดุล จุลินทรีย์ประจำถิ่นจึงก่อโรคได้","แยกจาก Candida ซึ่งชอบซอกพับชื้นและให้ satellite pustules"],"ref":"Seborrheic dermatitis ในผู้ป่วยภูมิคุ้มกันบกพร่อง"},{"sec":"Papulosquamous","n":29,"q":"A 40-year-old male presents with chronic flaky, greasy scales on the scalp, eyebrows, and nasolabial folds. The condition improves with antifungal shampoos. What is the most appropriate treatment?","o":["Topical corticosteroids","Antifungal agents (ketoconazole shampoo)","Systemic antibiotics","UV phototherapy","Oral isotretinoin"],"a":1,"m":"การรักษาหลักของ seborrheic dermatitis คือลดปริมาณ Malassezia ด้วย ketoconazole/selenium sulfide/zinc pyrithione shampoo","e":["สเตียรอยด์ทาช่วยลดอักเสบระยะสั้น แต่ไม่ได้แก้ต้นเหตุและใช้นานบนใบหน้าไม่ปลอดภัย","ถูก — ยาต้านเชื้อราเป็นการรักษาหลัก","ยาปฏิชีวนะระบบไม่จำเป็นเพราะไม่ใช่การติดเชื้อแบคทีเรีย","UV ใช้ในสะเก็ดเงิน ไม่ใช่ทางเลือกแรกที่นี่","Isotretinoin ใช้ในสิวรุนแรง"],"k":["หลักการคือลดปริมาณ Malassezia: ketoconazole, ciclopirox, selenium sulfide, zinc pyrithione shampoo","สเตียรอยด์ทาอ่อนๆ ใช้คุมการอักเสบระยะสั้นได้ แต่ไม่แก้ต้นเหตุ และใช้นานบนใบหน้าเสี่ยง atrophy, telangiectasia, perioral dermatitis","ทางเลือกบนใบหน้าเพื่อเลี่ยงสเตียรอยด์: topical calcineurin inhibitor (tacrolimus, pimecrolimus)","โรคนี้เป็นเรื้อรังกลับเป็นซ้ำ จึงต้องรักษาแบบควบคุมต่อเนื่อง ไม่ใช่รักษาให้หายขาด"],"ref":"การรักษา seborrheic dermatitis"},{"sec":"Papulosquamous","n":30,"q":"A 45-year-old woman presents with itchy, purple, polygonal papules on her flexor wrists and white lacy streaks in her buccal mucosa. What is the most likely histological finding?","o":["Subepidermal bullae with eosinophils","Band-like lymphocytic infiltrate at the dermoepidermal junction","Munro microabscesses and parakeratosis","Acantholysis with suprabasal blisters","Hydropic degeneration of basal cells"],"a":1,"m":"Lichen planus มีลักษณะ interface dermatitis: lymphocyte เรียงเป็นแถบชิดรอยต่อหนังกำพร้า-หนังแท้ ร่วมกับ sawtooth rete ridges และ Civatte bodies","e":["Subepidermal bullae with eosinophils คือ bullous pemphigoid","ถูก — band-like lymphocytic infiltrate ที่ DEJ เป็นลักษณะเด่นที่สุด","Munro microabscess + parakeratosis คือ psoriasis","Acantholysis เหนือชั้น basal คือ pemphigus vulgaris","Hydropic degeneration พบร่วมได้ใน lichen planus แต่ไม่จำเพาะเท่า band-like infiltrate และยังพบใน lupus ด้วย"],"k":["Band-like (lichenoid) lymphocytic infiltrate เป็นแถบหนาแน่นต่อเนื่องชิด DEJ คือลักษณะเด่นที่สุด","ร่วมด้วย: sawtoothing ของ rete ridges, hypergranulosis (wedge-shaped), hyperkeratosis แบบ orthokeratosis (ไม่มี parakeratosis)","Civatte/colloid bodies คือ apoptotic keratinocyte ที่ตกลงมาอยู่บริเวณ DEJ และหนังแท้ตื้น","Vacuolar (hydropic) degeneration ของชั้น basal พบร่วมได้ แต่ไม่จำเพาะเพราะพบใน lupus และ erythema multiforme ด้วย"],"ref":"Lichen planus · Histopathology"},{"sec":"Papulosquamous","n":31,"q":"A biopsy from a patient with lichen planus shows colloid (Civatte) bodies. What are these structures?","o":["Dysplastic keratinocytes in the basal layer","Degenerating keratinocytes undergoing apoptosis","Inflammatory infiltrates composed of eosinophils","Retained nuclei in the stratum corneum","Acantholytic keratinocytes"],"a":1,"m":"Civatte (colloid) bodies คือซาก keratinocyte ที่ตายแบบ apoptosis จากการถูก cytotoxic T cell ทำลาย ติดสีชมพูเป็นก้อนกลมบริเวณ DEJ","e":["ไม่ใช่เซลล์ผิดปกติแบบก่อนมะเร็ง","ถูก — เป็น apoptotic keratinocyte","ไม่ใช่เซลล์อักเสบ และ eosinophil ไม่เด่นใน lichen planus","นิวเคลียสค้างใน stratum corneum คือ parakeratosis","Acantholytic cell คือเซลล์ที่หลุดจากกันใน pemphigus"],"k":["Civatte (colloid, hyaline) body = keratinocyte ที่ตายแบบ apoptosis จากการถูก cytotoxic T cell ทำลาย ติดสีชมพูเข้มเป็นก้อนกลม","เป็นหลักฐานทางจุลพยาธิวิทยาว่ากลไกของโรคคือการทำลายเซลล์ชั้น basal (interface/lichenoid pattern)","พบได้ในโรคอื่นที่มี interface damage เช่น lupus erythematosus และ erythema multiforme จึงไม่จำเพาะ 100%","แยกจากคำที่หน้าตาคล้ายกัน: parakeratosis = นิวเคลียสค้างในชั้น corneum, acantholytic cell = เซลล์ที่หลุดจากกันใน pemphigus"],"ref":"Lichen planus · Civatte bodies"},{"sec":"Papulosquamous","n":32,"q":"Which of the following features helps differentiate seborrheic dermatitis from psoriasis?","o":["Greasy, yellowish scales","Elongation of rete ridges","Presence of Munro microabscesses","Well-demarcated plaques","Nail pitting"],"a":0,"m":"ขุยมันสีเหลืองบริเวณที่มีต่อมไขมันมากเป็นลักษณะเฉพาะของ seborrheic dermatitis ต่างจากขุยแห้งสีเงินและขอบเขตชัดของสะเก็ดเงิน","e":["ถูก — greasy yellowish scale เป็นตัวแยกที่ใช้ได้จริงทางคลินิก","Rete ridge ยืดยาวพบได้ทั้งสองโรค จึงแยกไม่ได้","Munro microabscess เป็นของสะเก็ดเงิน (จึงเป็นลักษณะของ psoriasis ไม่ใช่ตัวแยกที่โจทย์ถามในทิศทางนี้)","ขอบเขตชัดเป็นลักษณะของสะเก็ดเงิน ส่วน seborrheic dermatitis ขอบเบลอ","Nail pitting เป็นของสะเก็ดเงิน"],"k":["ตัวแยกทางคลินิกที่ใช้ได้จริง: ขุยมันสีเหลืองบนพื้นแดงขอบเบลอ (seb derm) vs ขุยแห้งสีเงินบนแผ่นหนาขอบชัด (psoriasis)","ตำแหน่งช่วยแยก: seb derm อยู่บริเวณที่มีต่อมไขมันมาก ส่วน psoriasis อยู่ด้าน extensor คือข้อศอก เข่า และหนังศีรษะแบบขอบเขตชัด","ลักษณะที่พบร่วมกันได้ทั้งสองโรคจึงแยกไม่ได้: acanthosis, elongation of rete ridges, parakeratosis","ลักษณะที่เป็นของ psoriasis เท่านั้น: Munro microabscess, Auspitz sign, nail pitting, onycholysis, ข้ออักเสบ"],"ref":"Seborrheic dermatitis vs Psoriasis"},{"sec":"Papulosquamous","n":33,"q":"Which of the following skin conditions is characterized by hyperkeratosis, parakeratosis, and neutrophilic microabscesses in the stratum corneum?","o":["Psoriasis","Lichen planus","Bullous pemphigoid","Seborrheic dermatitis","Erythema multiforme"],"a":0,"m":"Psoriasis: hyperkeratosis + parakeratosis + Munro microabscesses (นิวโทรฟิลใน stratum corneum) + hypogranulosis + acanthosis","e":["ถูก — Munro microabscess เป็นลักษณะจำเพาะของสะเก็ดเงิน","Lichen planus มี hypergranulosis และ band-like infiltrate ไม่มี parakeratosis","Bullous pemphigoid มีตุ่มน้ำใต้หนังกำพร้าและ eosinophil","Seborrheic dermatitis มี parakeratosis รอบรูขุมขนแต่ไม่มี Munro microabscess ชัดเจน","Erythema multiforme มี keratinocyte necrosis และ vacuolar change"],"k":["ชุดลักษณะครบของสะเก็ดเงิน: hyperkeratosis + parakeratosis + hypogranulosis + acanthosis ที่ rete ridges ยืดสม่ำเสมอ + Munro microabscess","Munro microabscess อยู่ในชั้น stratum corneum ส่วน spongiform pustule of Kogoj อยู่ในชั้น stratum spinosum","หนังแท้ส่วนบนมี dilated tortuous capillaries ในยอด dermal papillae ซึ่งอธิบาย Auspitz sign","ไม่มี interface change และไม่มี eosinophil เด่น ซึ่งช่วยแยกจาก lichen planus และ bullous pemphigoid"],"ref":"Psoriasis · Histopathology"},{"sec":"Papulosquamous","n":34,"q":"Which of the following best differentiates psoriasis from lichen planus?","o":["Presence of basal vacuolar degeneration","Thickened stratum corneum with hypergranulosis","Hyperkeratosis with loss of the granular layer","Lymphocytic infiltrate at the dermoepidermal junction","Wickham striae"],"a":2,"m":"สะเก็ดเงินมี parakeratosis พร้อม hypogranulosis (ชั้น granular บางลงหรือหายไป) ขณะที่ lichen planus มี hypergranulosis ชัดเจน จึงเป็นจุดแยกทางพยาธิวิทยาที่คมที่สุด","e":["Basal vacuolar degeneration เป็นลักษณะของ lichen planus ไม่ใช่ของสะเก็ดเงิน","Hypergranulosis เป็นของ lichen planus","ถูก — hyperkeratosis ร่วมกับการหายไปของ granular layer = psoriasis","Lymphocyte ที่ DEJ เป็นของ lichen planus","Wickham striae เป็นลักษณะทางคลินิกของ lichen planus"],"k":["จุดแยกที่คมที่สุดคือชั้น granular: psoriasis มี hypogranulosis (หายไป) ส่วน lichen planus มี hypergranulosis (หนาขึ้น)","ตามมาด้วยชนิดของ keratin ชั้นบน: psoriasis = parakeratosis, lichen planus = orthokeratosis","รูปทรง rete ridges: psoriasis ยืดยาวสม่ำเสมอเหมือนหลอดทดลองในตะแกรง ส่วน lichen planus หยักแหลมคล้ายฟันเลื่อย","เซลล์อักเสบ: psoriasis เด่นที่นิวโทรฟิลในชั้น corneum ส่วน lichen planus เด่นที่ lymphocyte เป็นแถบที่ DEJ"],"ref":"Psoriasis vs Lichen planus"},{"sec":"Blistering diseases","n":35,"q":"A 60-year-old male presents with multiple flaccid bullae and erosions on his oral mucosa and trunk. A biopsy reveals suprabasal acantholysis, and DIF shows intercellular IgG deposition in a \"fishnet pattern.\" What is the most likely diagnosis?","o":["Bullous pemphigoid","Pemphigus vulgaris","Pemphigus foliaceus","Dermatitis herpetiformis","Epidermolysis bullosa"],"a":1,"m":"Pemphigus vulgaris: แอนติบอดี IgG ต่อ desmoglein 3 (และ 1) ทำลาย desmosome เกิด acantholysis เหนือชั้น basal เห็น row of tombstones ตุ่มน้ำหย่อนและมีแผลในปาก","e":["Bullous pemphigoid มีตุ่มน้ำตึง DIF เป็นเส้นตรงที่ basement membrane และมักไม่มีแผลในปาก","ถูก — suprabasal acantholysis + fishnet IgG = pemphigus vulgaris","Pemphigus foliaceus เกิดที่ชั้นตื้น (subcorneal) และไม่มีรอยโรคในเยื่อบุช่องปาก","Dermatitis herpetiformis พบ granular IgA ที่ยอด dermal papillae","Epidermolysis bullosa เป็นโรคพันธุกรรม DIF ปกติ"],"k":["IgG autoantibody ต่อ desmoglein 3 (และ 1) ทำลาย desmosome เกิด acantholysis ระดับ suprabasal","เซลล์ชั้น basal ยังเกาะ basement membrane อยู่แต่แยกจากกัน เห็นเป็นแถวเรียงคล้ายป้ายหลุมศพ (row of tombstones)","หลังคาตุ่มน้ำบางมาก จึงเป็น flaccid bulla ที่แตกง่ายกลายเป็นแผลถลอกเจ็บ และ Nikolsky sign บวก","DIF: IgG ระหว่างเซลล์ทั่วทั้ง epidermis เป็นลายร่างแห (fishnet/chicken-wire pattern) แผลในปากมักเป็นอาการนำ"],"ref":"Blistering diseases · Pemphigus vulgaris"},{"sec":"Blistering diseases","n":36,"q":"A 50-year-old male presents with tense bullae on his trunk. DIF of perilesional skin shows linear IgG deposition at the basement membrane. What is the most likely diagnosis?","o":["Pemphigus vulgaris","Pemphigus foliaceus","Bullous pemphigoid","Dermatitis herpetiformis","Linear IgA bullous dermatosis"],"a":2,"m":"Bullous pemphigoid: IgG ต่อ BP180/BP230 ที่ hemidesmosome เกิดตุ่มน้ำใต้หนังกำพร้าซึ่งตึงและแตกยาก DIF เป็นเส้นตรงตาม basement membrane","e":["Pemphigus vulgaris ให้ตุ่มน้ำหย่อนและ DIF เป็นร่างแหระหว่างเซลล์","Pemphigus foliaceus ตุ่มน้ำตื้นมาก มักเห็นเป็นสะเก็ดขุย","ถูก — tense bullae + linear IgG ที่ BMZ","Dermatitis herpetiformis เป็น granular IgA ไม่ใช่ linear IgG","Linear IgA disease เป็น linear IgA ไม่ใช่ IgG"],"k":["IgG ต่อ BP180/BP230 ซึ่งเป็นส่วนประกอบของ hemidesmosome ที่ยึดเซลล์ basal กับ basement membrane","การแยกตัวจึงอยู่ระดับ subepidermal โดยมี epidermis ทั้งชั้นเป็นหลังคา ตุ่มน้ำจึงตึงและทนไม่แตกง่าย","จุลพยาธิวิทยา: ไม่มี acantholysis แต่พบ eosinophil จำนวนมากในตุ่มน้ำและหนังแท้ข้างใต้","DIF: IgG และ C3 เป็นแนวเส้นตรง (linear) ตาม DEJ พบในผู้สูงอายุและมักไม่มีรอยโรคในช่องปาก"],"ref":"Blistering diseases · Bullous pemphigoid"},{"sec":"Blistering diseases","n":37,"q":"A 35-year-old male presents with intensely pruritic grouped vesicles on his elbows and knees. DIF of perilesional skin reveals granular IgA deposits in the dermal papillae. What is the most likely diagnosis?","o":["Pemphigus vulgaris","Bullous pemphigoid","Dermatitis herpetiformis","Erythema multiforme","Epidermolysis bullosa"],"a":2,"m":"Dermatitis herpetiformis สัมพันธ์กับ celiac disease มี granular IgA ที่ยอด dermal papillae ตุ่มน้ำคันมากที่ข้อศอกและเข่า รักษาด้วย dapsone และงดกลูเตน","e":["Pemphigus vulgaris เป็น IgG แบบร่างแหระหว่างเซลล์","Bullous pemphigoid เป็น linear IgG ที่ BMZ","ถูก — granular IgA ใน dermal papillae = dermatitis herpetiformis","Erythema multiforme DIF ไม่จำเพาะและมีรอยโรครูปเป้า","Epidermolysis bullosa เกิดจากความผิดปกติของโครงสร้าง ไม่มี immune deposit"],"k":["สัมพันธ์อย่างยิ่งกับ celiac disease: IgA ต่อ gliadin ทำปฏิกิริยาข้ามกับ reticulin/anchoring fibrils ที่ยึด basement membrane กับหนังแท้","จุลพยาธิวิทยา: neutrophil microabscesses ที่ปลายยอด dermal papillae ซึ่งต่อมารวมกันเป็น subepidermal blister","DIF: granular IgA ที่ยอด dermal papillae (ต่างจาก linear IgA disease ที่เป็นแนวเส้นตรง)","การรักษา: dapsone ทำให้อาการคันดีขึ้นภายในไม่กี่วัน แต่การงดกลูเตนตลอดชีวิตคือการแก้ต้นเหตุ"],"ref":"Blistering diseases · Dermatitis herpetiformis"},{"sec":"Blistering diseases","n":38,"q":"A biopsy from a patient with pemphigus foliaceus shows intraepidermal acantholysis confined to the upper epidermis. Which autoantibody is most commonly implicated?","o":["Anti-desmoglein 1","Anti-desmoglein 3","Anti-BP180","Anti-type VII collagen","Anti-laminin"],"a":0,"m":"Desmoglein 1 อยู่หนาแน่นที่หนังกำพร้าชั้นบนของผิวหนัง (ไม่มีในเยื่อบุช่องปาก) การถูกทำลายจึงเกิดตุ่มน้ำตื้นและไม่มีแผลในปาก","e":["ถูก — anti-desmoglein 1 = pemphigus foliaceus","Anti-desmoglein 3 พบใน pemphigus vulgaris ซึ่งเกิดรอยแยกเหนือชั้น basal และมีแผลในปาก","Anti-BP180 คือ bullous pemphigoid","Anti-type VII collagen คือ epidermolysis bullosa acquisita","Anti-laminin 332 คือ mucous membrane pemphigoid"],"k":["Anti-desmoglein 1 ทำให้เกิด acantholysis ระดับ subcorneal คือชั้นตื้นสุดของ epidermis","หลักการ desmoglein compensation: เยื่อบุช่องปากมี Dsg3 มาก จึงชดเชยได้ ผู้ป่วย PF จึงไม่มีแผลในปาก ต่างจาก PV","ทางคลินิกมักไม่เห็นตุ่มน้ำเพราะแตกทันที เห็นเป็นสะเก็ดขุยตื้นบริเวณหน้า หนังศีรษะ ลำตัวส่วนบน","เทียบเป้าหมายแอนติเจน: Dsg3→PV, Dsg1→PF, BP180/230→BP, type VII collagen→EBA, laminin 332→mucous membrane pemphigoid"],"ref":"Blistering diseases · Pemphigus foliaceus"},{"sec":"Panniculitis & Vasculitis","n":39,"q":"A 25-year-old woman presents with tender, erythematous nodules on her shins. A biopsy shows septal panniculitis without vasculitis. What is the most likely diagnosis?","o":["Polyarteritis nodosa","Leukocytoclastic vasculitis","Erythema nodosum","Pyoderma gangrenosum","Sweet syndrome"],"a":2,"m":"Erythema nodosum เป็น septal panniculitis ที่ไม่มี vasculitis ให้ก้อนแดงเจ็บที่หน้าแข้ง สัมพันธ์กับการติดเชื้อสเตรป วัณโรค sarcoidosis ยาคุม และ IBD","e":["PAN เป็นการอักเสบของหลอดเลือดขนาดกลาง มี fibrinoid necrosis","Leukocytoclastic vasculitis กระทบหลอดเลือดเล็กและให้ palpable purpura","ถูก — septal panniculitis without vasculitis = erythema nodosum","Pyoderma gangrenosum เป็นแผลเจาะลึกขอบม่วงคล้ำ","Sweet syndrome เป็นแผ่นนูนเจ็บพร้อมไข้และนิวโทรฟิลในหนังแท้"],"k":["เป็น panniculitis ที่พบบ่อยที่สุด และเป็น septal panniculitis without vasculitis ตามที่เลกเชอร์ระบุ","เป็นปฏิกิริยาตอบสนองแบบ delayed hypersensitivity ต่อสิ่งกระตุ้น จึงต้องตามหาต้นเหตุเสมอ","สาเหตุที่ต้องนึกถึง: streptococcal infection, วัณโรค, sarcoidosis, IBD, ยาคุมกำเนิดและซัลฟา, การตั้งครรภ์","ทางคลินิก: ก้อนแดงเจ็บที่หน้าแข้งทั้งสองข้าง ไม่เป็นแผล และหายโดยไม่ทิ้งแผลเป็น (ต่างจาก erythema induratum ที่เป็น lobular + necrotizing vasculitis และมักกลายเป็นแผล)"],"ref":"Panniculitis · Erythema nodosum"},{"sec":"Panniculitis & Vasculitis","n":40,"q":"A 40-year-old man presents with palpable purpura on his lower legs. A biopsy reveals fibrinoid necrosis of small vessels with neutrophilic infiltrates and nuclear debris. What is the most likely diagnosis?","o":["Henoch-Schönlein purpura","Polyarteritis nodosa","Leukocytoclastic vasculitis","Granulomatosis with polyangiitis","Erythema nodosum"],"a":2,"m":"Leukocytoclastic vasculitis คือคำวินิจฉัยทางพยาธิวิทยาของหลอดเลือดเล็กอักเสบ มี fibrinoid necrosis + นิวโทรฟิล + nuclear dust (leukocytoclasis)","e":["HSP เป็นชนิดย่อยที่ต้องยืนยันด้วย IgA ใน DIF และมักมีอาการข้อ/ท้อง/ไต ร่วมด้วย","PAN กระทบหลอดเลือดขนาดกลาง ให้ก้อนตามแนวเส้นเลือดและ livedo","ถูก — ภาพพยาธิวิทยาตรงกับ leukocytoclastic vasculitis","GPA มี granuloma และมักมีอาการทางเดินหายใจร่วมกับ c-ANCA","Erythema nodosum เป็น panniculitis ไม่ใช่ vasculitis"],"k":["LCV เป็นคำวินิจฉัยทางพยาธิวิทยาของ small-vessel vasculitis: fibrinoid necrosis ของผนังหลอดเลือด + นิวโทรฟิลแทรก + nuclear dust (leukocytoclasis) + เม็ดเลือดแดงรั่วออกนอกหลอดเลือด","อาการทางคลินิกที่ตรงกันคือ palpable purpura ซึ่ง 'คลำได้' เพราะมีการอักเสบและเลือดออกในหนังแท้","ตำแหน่งเด่นที่ขาส่วนล่างเพราะแรงดัน hydrostatic สูง","ต้องส่ง DIF ด้วยเสมอ: ถ้าพบ IgA เด่นจะจัดเป็น IgA vasculitis (HSP) และต้องตรวจไตร่วมด้วย"],"ref":"Vasculitis · Leukocytoclastic vasculitis"},{"sec":"Panniculitis & Vasculitis","n":41,"q":"A 7-year-old boy presents with palpable purpura, arthritis, and abdominal pain following a recent upper respiratory infection. What is the most likely diagnosis?","o":["Kawasaki disease","Polyarteritis nodosa","Leukocytoclastic vasculitis","Henoch-Schönlein purpura (IgA vasculitis)","Rocky Mountain spotted fever"],"a":3,"m":"HSP: เด็กหลังติดเชื้อทางเดินหายใจ มีจ้ำนูนที่ขาและก้น ปวดข้อ ปวดท้อง และอาจมีเลือดในปัสสาวะ เกิดจาก IgA immune complex","e":["Kawasaki มีไข้เกิน 5 วัน ตาแดง ริมฝีปากแตก ต่อมน้ำเหลืองโต ไม่ใช่จ้ำนูน","PAN พบในผู้ใหญ่ ไม่กระทบไตแบบ glomerulonephritis จาก IgA","LCV เป็นคำกว้างทางพยาธิวิทยา แต่โจทย์ให้กลุ่มอาการครบจึงตอบชื่อโรคที่จำเพาะกว่า","ถูก — HSP (IgA vasculitis) คือกลุ่มอาการสี่อย่างในเด็ก","RMSF มีไข้สูงและผื่นเริ่มที่ข้อมือข้อเท้าแล้วลามเข้าลำตัว มีประวัติเห็บกัด"],"k":["HSP = IgA vasculitis เกิดจาก IgA immune complex สะสมในหลอดเลือดเล็ก มักตามหลังการติดเชื้อทางเดินหายใจส่วนบน","กลุ่มอาการคลาสสิก 4 อย่าง: palpable purpura ที่ขาและก้น, ปวดข้อ, ปวดท้อง (อาจมี intussusception), และไตอักเสบแบบ IgA nephropathy","ทางพยาธิวิทยาชิ้นเนื้อผิวหนังจะเห็น leukocytoclastic vasculitis เหมือนกัน แต่ DIF พบ IgA จึงจำเพาะกว่า","การพยากรณ์โรคระยะยาวขึ้นกับการมีส่วนร่วมของไต จึงต้องตรวจปัสสาวะติดตาม"],"ref":"Vasculitis · Henoch-Schönlein purpura"},{"sec":"Connective tissue disease","n":42,"q":"A 45-year-old female presents with a malar rash, photosensitivity, and arthralgia. ANA is positive. What is the most likely diagnosis?","o":["Dermatomyositis","Systemic lupus erythematosus","Scleroderma","Lichen planus","Erythema nodosum"],"a":1,"m":"ผื่นปีกผีเสื้อที่เว้นร่องแก้ม ไวต่อแสง ปวดข้อ และ ANA บวก = SLE (แอนติบอดีจำเพาะคือ anti-dsDNA และ anti-Smith)","e":["Dermatomyositis มีผื่นสีม่วงรอบเปลือกตา (heliotrope) และ Gottron papules พร้อมกล้ามเนื้ออ่อนแรง","ถูก — malar rash + photosensitivity + arthralgia + ANA = SLE","Scleroderma มีผิวแข็งตึงและ Raynaud เป็นอาการนำ","Lichen planus เป็นตุ่มม่วงคัน ไม่สัมพันธ์กับ ANA","Erythema nodosum เป็นก้อนเจ็บที่หน้าแข้ง"],"k":["4 ปัจจัยตามเลกเชอร์: (1) follicular keratinization ผิดปกติทำให้รูขุมขนอุดตัน (2) ต่อมไขมันโตและสร้าง sebum มากจากแอนโดรเจน (3) C. acnes เพิ่มจำนวน (4) การอักเสบตามมา","C. acnes สร้างเอนไซม์ lipase ย่อยไตรกลีเซอไรด์ให้เป็นกรดไขมันอิสระที่กระตุ้นการอักเสบ","แบ่งรอยโรคเป็น noninflammatory (open/closed comedones) และ inflammatory (papules, pustules, nodules)","จุดแยกจาก rosacea ที่เลกเชอร์เน้น: rosacea ไม่มี comedones และพบในวัยกลางคนขึ้นไป โดยเกี่ยวกับ cathelicidin และ TLR2"],"ref":"Disorders of epidermal appendages · Acne vulgaris"},{"sec":"Connective tissue disease","n":43,"q":"A 50-year-old male presents with heliotrope rash, Gottron papules, and proximal muscle weakness. Which autoantibody is most specific for this condition?","o":["Anti-Scl-70","Anti-dsDNA","Anti-Jo-1","Anti-La (SSB)","Anti-centromere"],"a":2,"m":"Dermatomyositis: anti-Jo-1 (anti-histidyl tRNA synthetase) จำเพาะกับกลุ่ม antisynthetase syndrome สัมพันธ์กับปอดอักเสบชนิด interstitial (anti-Mi-2 ก็จำเพาะเช่นกัน)","e":["Anti-Scl-70 จำเพาะกับ diffuse systemic sclerosis","Anti-dsDNA จำเพาะกับ SLE และสัมพันธ์กับไตอักเสบ","ถูก — anti-Jo-1 พบใน dermatomyositis/polymyositis","Anti-La (SSB) พบใน Sjögren syndrome","Anti-centromere พบใน limited scleroderma (CREST)"],"k":["Gram-positive cocci in clusters = Staphylococcus aureus ซึ่งเลกเชอร์ระบุว่าเป็นสาเหตุส่วนใหญ่ของ impetigo","กลไก: exfoliative toxin ตัดทำลาย desmoglein 1 ที่ยึดเซลล์ชั้นบนสุด ทำให้ผิวแยกตัวระดับตื้น","จุลพยาธิวิทยา: subcorneal pustule เมื่อแตกและแห้งจึงเกิดสะเก็ดสีน้ำผึ้ง (honey-colored crust)","เชื้อและกลไกเดียวกันเมื่อ toxin กระจายทั่วร่างกายจะกลายเป็น staphylococcal scalded skin syndrome"],"ref":"การติดเชื้อแบคทีเรีย · Impetigo"},{"sec":"Bacterial infections","n":44,"q":"A 16-year-old male presents with multiple comedones, pustules, and nodules on the face and chest. What is the primary causative factor?","o":["Malassezia species","Staphylococcus aureus","Propionibacterium acnes (Cutibacterium acnes)","Autoantibody deposition","Type IV hypersensitivity"],"a":2,"m":"Acne vulgaris เกิดจาก 4 ปัจจัย: การสร้างซีบัมมากขึ้นจากแอนโดรเจน, การอุดตันของรูขุมขน, การเพิ่มจำนวนของ C. acnes และการอักเสบตามมา","e":["Malassezia ทำให้เกิด Malassezia folliculitis ซึ่งเป็นตุ่มคันสม่ำเสมอและไม่มี comedone","S. aureus ทำให้เกิด folliculitis/furuncle ไม่ใช่สิวหัวดำหัวขาว","ถูก — C. acnes ย่อยไตรกลีเซอไรด์เป็นกรดไขมันอิสระกระตุ้นการอักเสบ","ไม่มีการสะสมของแอนติบอดีในสิว","สิวไม่ใช่ปฏิกิริยาภูมิแพ้ชนิดล่าช้า"],"k":["Cellulitis กินลึกถึงหนังแท้ชั้นลึกและไขมันใต้ผิวหนัง ขอบเขตจึงไม่ชัด ต่างจาก erysipelas ที่อยู่ตื้นและมีขอบนูนคมชัด","เชื้อที่พบบ่อย: S. pyogenes และ S. aureus ในผู้ป่วยเบาหวานอาจเป็นเชื้อผสมและลุกลามเร็ว","ธงแดงของ necrotizing fasciitis: ปวดรุนแรงเกินกว่าที่เห็น ผิวคล้ำ ตุ่มน้ำเลือด ชาไม่รู้สึก คลำได้กรอบแกรบใต้ผิว และอาการทั้งระบบทรุดเร็ว ต้องผ่าตัดด่วน","เบาหวานเป็นปัจจัยเสี่ยงสำคัญ เพราะทั้งภูมิคุ้มกันบกพร่อง ปลายประสาทเสื่อม และเลือดไปเลี้ยงลดลง"],"ref":"การติดเชื้อแบคทีเรีย · Cellulitis"},{"sec":"Bacterial infections","n":45,"q":"A 7-year-old child presents with honey-colored crusted lesions around the mouth. Gram stain reveals Gram-positive cocci in clusters. What is the most likely causative organism?","o":["Streptococcus pyogenes","Staphylococcus aureus","Pseudomonas aeruginosa","Corynebacterium diphtheriae","Mycobacterium leprae"],"a":1,"m":"Cocci เรียงเป็นกลุ่มคล้ายพวงองุ่น = Staphylococcus (ถ้าเรียงเป็นสาย = Streptococcus) S. aureus เป็นสาเหตุที่พบบ่อยที่สุดของ impetigo ในปัจจุบัน","e":["S. pyogenes เรียงเป็นสาย (chains) ไม่ใช่กลุ่ม","ถูก — Gram-positive cocci in clusters = S. aureus","Pseudomonas เป็นแท่งแกรมลบ","C. diphtheriae เป็นแท่งแกรมบวกรูปกระบอง","M. leprae เป็นเชื้อ acid-fast ทำให้เกิดโรคเรื้อน"],"k":["M. leprae ชอบอุณหภูมิต่ำ จึงรุกรานผิวหนังส่วนปลายและเส้นประสาทส่วนปลายที่อยู่ตื้น","สามอย่างที่ต้องเจอพร้อมกัน: รอยด่างจาง + สูญเสียความรู้สึกในรอยโรค + เส้นประสาทส่วนปลายหนาคลำได้","สเปกตรัมของโรคขึ้นกับภูมิคุ้มกันชนิดเซลล์: tuberculoid (รอยโรคน้อย granuloma เด่น เชื้อน้อย) ถึง lepromatous (รอยโรคมาก เชื้อเยอะ พบ foamy macrophage)","ตรวจยืนยันด้วย Fite stain ซึ่งเป็น acid-fast stain ที่ดัดแปลงให้เหมาะกับ M. leprae"],"ref":"Mycobacterial infection · Leprosy"},{"sec":"Bacterial infections","n":46,"q":"A 50-year-old diabetic male presents with painful, erythematous swelling of the lower leg with poorly defined borders. The area is warm, tender, and rapidly expanding. What is the most likely diagnosis?","o":["Impetigo","Erysipelas","Cellulitis","Necrotizing fasciitis","Cutaneous anthrax"],"a":2,"m":"Cellulitis เป็นการติดเชื้อของหนังแท้ชั้นลึกและไขมันใต้ผิวหนัง จึงมีขอบเขตไม่ชัด ต่างจาก erysipelas ที่อยู่ตื้นและมีขอบนูนชัด","e":["Impetigo อยู่ผิวเผินมาก มีสะเก็ดสีน้ำผึ้ง ไม่บวมลึก","Erysipelas มีขอบเขตชัดเจนและนูนขึ้นจากผิวปกติ","ถูก — ขอบเขตไม่ชัด + บวมแดงร้อนลึก = cellulitis","Necrotizing fasciitis จะเจ็บรุนแรงเกินกว่าอาการที่เห็น มีผิวคล้ำ ตุ่มน้ำเลือด และอาการทั้งระบบทรุดเร็ว","Cutaneous anthrax เป็นแผลสะเก็ดดำไม่เจ็บ ล้อมด้วยอาการบวม"],"k":["Dermatophyte (Trichophyton, Microsporum, Epidermophyton) ย่อยเคราตินได้ จึงอยู่จำกัดในชั้น stratum corneum ตามที่เลกเชอร์ระบุ","ผื่นขยายออกด้านนอกและจางตรงกลาง เกิดเป็นวงแหวนขอบนูนมีขุย (active border) จึงควรขูดขุยจากขอบไปตรวจ","KOH พบ septate branching hyphae ยืนยันด้วย PAS ในชิ้นเนื้อ","ระวัง tinea incognito: ถ้าทาสเตียรอยด์ ผื่นจะดูจางลงแต่เชื้อลุกลามกว้างขึ้นและขอบวงหายไป"],"ref":"การติดเชื้อรา · Tinea corporis"},{"sec":"Bacterial infections","n":47,"q":"A 40-year-old man from an endemic region presents with hypopigmented anesthetic patches and thickened peripheral nerves. A skin biopsy shows acid-fast bacilli. What is the most likely diagnosis?","o":["Syphilis","Tuberculosis","Leprosy","Cutaneous leishmaniasis","Mycetoma"],"a":2,"m":"รอยด่างจางที่ชาไม่รู้สึก + เส้นประสาทส่วนปลายหนาตัว + acid-fast bacilli = โรคเรื้อนจาก Mycobacterium leprae ซึ่งชอบอุณหภูมิต่ำและรุกรานเส้นประสาท","e":["ซิฟิลิสให้แผลริมแข็งหรือผื่นฝ่ามือฝ่าเท้า ตรวจพบ spirochete ไม่ใช่ acid-fast","วัณโรคผิวหนังไม่ทำให้เส้นประสาทหนาและไม่ทำให้ชา","ถูก — การชาร่วมกับเส้นประสาทหนาเป็นลักษณะเฉพาะของโรคเรื้อน","Leishmaniasis ให้แผลเรื้อรังและพบ amastigote ในแมคโครฟาจ","Mycetoma ให้ก้อนบวมมีรูระบายและเม็ดสี (grains)"],"k":["Malassezia furfur เป็นยีสต์ที่ต้องการไขมัน (lipophilic) พบเป็นเชื้อประจำถิ่นบนผิวปกติ","ภาพ KOH เป็น short hyphae ปนกับ yeast กลุ่มกลม เรียกว่า spaghetti and meatballs","กรด azelaic ที่เชื้อสร้างยับยั้ง tyrosinase ทำให้รอยโรคไม่คล้ำตามแดดและเห็นเด่นขึ้นหลังตากแดด","ใต้ Wood lamp เรืองแสงสีเหลืองทอง แยกจาก erythrasma ที่เรืองสีปะการังและเกิดจากแบคทีเรีย Corynebacterium"],"ref":"การติดเชื้อรา · Malassezia furfur"},{"sec":"Fungal infections","n":48,"q":"A 25-year-old male presents with pruritic, annular, scaly plaques with central clearing on his trunk. A KOH prep shows septate hyphae. What is the most likely diagnosis?","o":["Candidiasis","Tinea corporis","Pityriasis rosea","Erythrasma","Tinea versicolor"],"a":1,"m":"ผื่นวงแหวนขอบนูนมีขุยและตรงกลางจาง (central clearing) ร่วมกับ septate hyphae ใน KOH = กลากที่ลำตัวจาก dermatophyte","e":["Candida ให้ผื่นแดงชื้นมี satellite pustules และพบ pseudohyphae กับ budding yeast","ถูก — annular + central clearing + septate hyphae = tinea corporis","Pityriasis rosea มี herald patch และผื่นเรียงตามแนวซี่โครง KOH เป็นลบ","Erythrasma เรืองแสงสีปะการังใต้ Wood lamp เกิดจากแบคทีเรีย Corynebacterium","Tinea versicolor เป็นรอยด่างสีต่างกันบนลำตัว ไม่ใช่วงแหวนขอบนูน"],"k":["Candida ให้ budding yeast ร่วมกับ pseudohyphae ซึ่ง dermatophyte ไม่มี","Satellite pustules รอบผื่นหลักเป็นลักษณะจำเพาะ พบในซอกพับที่อับชื้น (intertrigo)","ปัจจัยเสี่ยง: ภูมิคุ้มกันบกพร่อง เบาหวาน อ้วน ใช้ยาปฏิชีวนะหรือสเตียรอยด์ ความอับชื้น","ทางเลกเชอร์ อธิบายได้ด้วยการเสียสมดุลของ skin microbiome ทำให้เชื้อประจำถิ่นกลายเป็นเชื้อก่อโรค"],"ref":"การติดเชื้อรา · Candidiasis"},{"sec":"Fungal infections","n":49,"q":"A patient presents with hypopigmented macules on his upper trunk that fail to tan in the sun. KOH preparation shows a \"spaghetti and meatballs\" pattern. What is the causative organism?","o":["Candida albicans","Trichophyton rubrum","Malassezia furfur","Epidermophyton floccosum","Microsporum canis"],"a":2,"m":"Malassezia furfur สร้างกรด azelaic ยับยั้ง tyrosinase ทำให้ผิวบริเวณนั้นไม่คล้ำตามแดด ภาพ KOH เป็น short hyphae ปนกับ yeast กลม","e":["Candida ให้ pseudohyphae กับ budding yeast และมักอยู่ในซอกพับชื้น","T. rubrum เป็น dermatophyte ให้ septate hyphae ยาว ทำให้เกิดกลาก","ถูก — Malassezia furfur คือสาเหตุของเกลื้อน (tinea versicolor)","E. floccosum เป็น dermatophyte เช่นกัน","M. canis เป็น dermatophyte จากสัตว์ ทำให้เกิดกลากที่ศีรษะในเด็ก"],"k":["HSV-1 มักก่อโรคที่ริมฝีปาก แฝงตัวใน trigeminal ganglion และกลับเป็นซ้ำเมื่อมีไข้ เครียด แสงแดด หรือประจำเดือน","ลักษณะจำเพาะคือตุ่มน้ำใสรวมกลุ่มบนพื้นแดง (grouped vesicles on erythematous base)","Tzanck smear พบ multinucleated giant cells ร่วมกับ nuclear molding แต่แยก HSV จาก VZV ไม่ได้","HSV เป็นสาเหตุอันดับหนึ่งของ recurrent erythema multiforme ซึ่งเป็นข้อเชื่อมโยงที่ข้อสอบชอบถาม"],"ref":"การติดเชื้อไวรัส · Herpes simplex"},{"sec":"Fungal infections","n":50,"q":"A 35-year-old immunocompromised woman presents with erythematous plaques with satellite pustules in the groin. A KOH prep reveals budding yeast and pseudohyphae. What is the most likely diagnosis?","o":["Dermatophytosis","Candidiasis","Erythrasma","Tinea cruris","Sporotrichosis"],"a":1,"m":"Satellite pustules รอบผื่นหลัก + budding yeast กับ pseudohyphae = candidal intertrigo ซึ่งพบมากในผู้ที่ภูมิคุ้มกันต่ำ เบาหวาน หรือบริเวณอับชื้น","e":["Dermatophyte ไม่สร้าง pseudohyphae และไม่มี satellite lesion","ถูก — budding yeast + pseudohyphae + satellite pustules = candidiasis","Erythrasma เป็นแผ่นสีน้ำตาลแดงไม่มีตุ่มหนอง เรืองแสงปะการัง","Tinea cruris มีขอบนูนชัดและตรงกลางจาง ไม่มี satellite pustule","Sporotrichosis เป็นตุ่มก้อนเรียงตามแนวท่อน้ำเหลืองหลังถูกหนามตำ"],"k":["งูสวัดคือ VZV ที่แฝงใน dorsal root ganglion กลับมาทำงานเมื่อภูมิคุ้มกันชนิดเซลล์ลดลง","การกระจายแบบ dermatomal เป็นหนึ่งใน linear distribution pattern ที่เลกเชอร์ยกเป็นเบาะแสสำคัญ","ยาต้านไวรัส (acyclovir, valacyclovir, famciclovir) ควรเริ่มภายใน 72 ชั่วโมงเพื่อลดความรุนแรงและลด postherpetic neuralgia","ธงแดง: herpes zoster ophthalmicus (สาขา V1 มีตุ่มที่ปลายจมูก = Hutchinson sign) ต้องส่งจักษุแพทย์ทันที"],"ref":"การติดเชื้อไวรัส · Herpes zoster"},{"sec":"Viral infections","n":51,"q":"A 20-year-old woman presents with grouped vesicles on an erythematous base on her lips. A Tzanck smear reveals multinucleated giant cells. What is the most likely diagnosis?","o":["Varicella-zoster virus","Herpes simplex virus","Molluscum contagiosum","Hand-foot-mouth disease","Cytomegalovirus"],"a":1,"m":"ตุ่มน้ำรวมกลุ่มบนพื้นแดงที่ริมฝีปาก (herpes labialis) จาก HSV-1 ซึ่งแฝงตัวใน trigeminal ganglion และกลับเป็นซ้ำเมื่อร่างกายอ่อนแอ","e":["VZV ให้ผื่นตุ่มน้ำเรียงตามแนวเส้นประสาท (งูสวัด) หรือกระจายทั่วตัว (อีสุกอีใส) ไม่ใช่ที่ริมฝีปากซ้ำๆ","ถูก — HSV คือสาเหตุของแผลร้อนในที่ริมฝีปาก","Molluscum เป็นตุ่มไข่มุกมีรอยบุ๋มตรงกลาง ไม่มีน้ำ","HFMD มีตุ่มที่มือ เท้า และในปาก พบในเด็ก","CMV มักก่อโรคในผู้ภูมิคุ้มกันต่ำ พบ owl-eye inclusion ไม่ใช่ giant cell"],"k":["เกิดจาก poxvirus ทางคลินิกเป็นตุ่มมันวาวทรงโดมมีรอยบุ๋มตรงกลาง (umbilicated papule)","จุลพยาธิวิทยาพบ molluscum bodies (Henderson-Paterson bodies) เป็นก้อน inclusion รูปไข่ขนาดใหญ่ในไซโทพลาสซึมของเซลล์ epidermis ชั้นบน","ในเด็กเป็นโรคที่หายเองได้ แต่ถ้าพบจำนวนมากในผู้ใหญ่ต้องนึกถึงภาวะภูมิคุ้มกันบกพร่อง","Umbilication เป็นคำบรรยาย topography ที่เลกเชอร์จัดคู่กับ molluscum และ basal cell carcinoma"],"ref":"การติดเชื้อไวรัส · Molluscum contagiosum"},{"sec":"Viral infections","n":52,"q":"A 60-year-old male presents with painful, grouped vesicles along a single dermatome. What is the best treatment?","o":["Acyclovir","Doxycycline","Griseofulvin","Amphotericin B","Ivermectin"],"a":0,"m":"งูสวัด (herpes zoster) จาก VZV ที่กลับมาทำงานใน dorsal root ganglion รักษาด้วยยาต้านไวรัสภายใน 72 ชั่วโมงเพื่อลดความรุนแรงและ postherpetic neuralgia","e":["ถูก — acyclovir (หรือ valacyclovir/famciclovir)","Doxycycline เป็นยาปฏิชีวนะ ใช้กับริกเก็ตเซียหรือสิว","Griseofulvin ใช้รักษาเชื้อรากลุ่ม dermatophyte","Amphotericin B ใช้กับเชื้อราลุกลามรุนแรง","Ivermectin ใช้กับหิดและปรสิต"],"k":["Sarcoptes scabiei ตัวเมียขุดโพรง (burrow) ในชั้น stratum corneum เพื่อวางไข่","อาการคันรุนแรงโดยเฉพาะกลางคืนเป็นผลจากปฏิกิริยาภูมิไวเกินต่อไรและมูลของไร จึงเกิดหลังติดเชื้อไปแล้วหลายสัปดาห์","ตำแหน่งเด่น: ซอกนิ้ว ข้อมือด้านใน รักแร้ รอบสะดือ อวัยวะเพศ (ผู้ใหญ่มักไม่เป็นที่ศีรษะ)","รักษาด้วย permethrin 5% ทาทั้งตัว หรือ ivermectin กิน และต้องรักษาผู้สัมผัสใกล้ชิดทุกคนพร้อมกัน"],"ref":"ปรสิต · Scabies"},{"sec":"Viral infections","n":53,"q":"A 10-year-old child presents with pearly, dome-shaped papules with central umbilication on his torso. What is the most likely causative agent?","o":["Human papillomavirus","Herpes simplex virus","Molluscum contagiosum virus","Varicella-zoster virus","Coxsackievirus"],"a":2,"m":"ตุ่มสีเนื้อมันวาวทรงโดมมีรอยบุ๋มตรงกลาง = molluscum contagiosum จาก poxvirus พบ Henderson-Paterson bodies ในชิ้นเนื้อ","e":["HPV ทำให้เกิดหูดผิวขรุขระ ไม่มีรอยบุ๋มตรงกลาง","HSV ให้ตุ่มน้ำเจ็บรวมกลุ่ม","ถูก — molluscum contagiosum virus","VZV ให้ตุ่มน้ำกระจายหลายระยะ","Coxsackievirus ทำให้เกิดโรคมือเท้าปาก"],"k":["Permethrin เป็นยาฆ่าปรสิตภายนอกตัวเลือกแรกทั้งใน pediculosis และ scabies","ต้องรักษาคู่นอนและผู้สัมผัสใกล้ชิด ร่วมกับซักผ้าปูที่นอนและเสื้อผ้าด้วยน้ำร้อน","โลนที่ขนหัวหน่าวเป็นโรคติดต่อทางเพศสัมพันธ์ จึงควรตรวจคัดกรองโรคติดต่อทางเพศสัมพันธ์อื่นร่วมด้วย","ถ้าพบโลนที่ขนตาในเด็ก ต้องนึกถึงการถูกล่วงละเมิดทางเพศ"],"ref":"ปรสิต · Pediculosis pubis"},{"sec":"Parasitic infestations","n":54,"q":"A 22-year-old male presents with intensely pruritic lesions in the web spaces of his fingers, worse at night. Skin scrapings reveal burrowing mites. What is the most likely diagnosis?","o":["Pediculosis","Pthirus pubis","Scabies","Tungiasis","Cutaneous leishmaniasis"],"a":2,"m":"หิดจาก Sarcoptes scabiei ตัวเมียขุดโพรงใต้ผิวหนัง ทำให้คันมากโดยเฉพาะกลางคืน ตำแหน่งเด่นคือซอกนิ้ว ข้อมือด้านใน และรอบเอว","e":["Pediculosis คือเหาที่ศีรษะหรือลำตัว ไม่ขุดโพรงในผิวหนัง","Pthirus pubis คือโลนที่ขนหัวหน่าว เกาะที่โคนขน","ถูก — burrow + คันกลางคืน + ซอกนิ้ว = scabies","Tungiasis เกิดจากหมัดทรายฝังที่เท้า เห็นเป็นตุ่มมีจุดดำตรงกลาง","Leishmaniasis เป็นแผลเรื้อรังจากแมลงริ้นฝอยทราย ไม่คันแบบนี้"],"k":["EDA gene (X-linked) ควบคุมการพัฒนาของโครงสร้างที่มาจาก ectoderm ได้แก่ ฟัน ผม เล็บ และต่อมเหงื่อ","อาการสำคัญคือ hypohidrosis ซึ่งทำให้เด็กมีไข้สูงโดยไม่มีการติดเชื้อ (heat intolerance) เป็นภาวะที่อันตราย","ฟันมักหายไปหรือมีรูปร่างแหลมคล้ายหมุด (conical/peg-shaped teeth) ผมบางและละเอียด","เทียบกลุ่ม genodermatoses อื่น: ichthyosis (cornification), EB (structural adhesion protein), XP (DNA repair), albinism (melanin synthesis)"],"ref":"Genodermatoses · Ectodermal dysplasia"},{"sec":"Parasitic infestations","n":55,"q":"A 35-year-old man presents with severe pruritus and small insects attached to his pubic hair. What is the best treatment?","o":["Acyclovir","Doxycycline","Permethrin","Fluconazole","Prednisone"],"a":2,"m":"Pediculosis pubis รักษาด้วย permethrin 1-5% ทาภายนอก ร่วมกับซักผ้าด้วยน้ำร้อนและรักษาคู่นอน","e":["Acyclovir ใช้กับการติดเชื้อไวรัสเริม","Doxycycline ไม่ฆ่าเหา","ถูก — permethrin เป็นยาฆ่าปรสิตภายนอกตัวเลือกแรก","Fluconazole ใช้กับเชื้อรา","Prednisone ลดการอักเสบแต่ไม่กำจัดตัวปรสิต"],"k":["พยาธิกำเนิดหลักตามเลกเชอร์คือ defective desquamation ทำให้เซลล์ stratum corneum ที่ควรหลุดกลับยึดติดกันอยู่","ตัวอย่างที่เลกเชอร์ยกคือ X-linked ichthyosis ซึ่งขาดเอนไซม์ steroid sulfatase ทำให้ cholesterol sulfate สะสมและเซลล์ไม่หลุดออก","จุลพยาธิวิทยา: stratum corneum หนาชัดเจน และสูญเสีย basket-weave pattern โดยแทบไม่มีการอักเสบ","Acquired ichthyosis ที่เกิดในผู้ใหญ่อาจเป็นสัญญาณของมะเร็งภายใน (paraneoplastic)"],"ref":"Disorders of epidermal maturation · Ichthyosis"},{"sec":"Genetic skin disease","n":56,"q":"A 5-year-old male presents with multiple missing teeth, sparse hair, and hypohidrosis. Genetic testing reveals a mutation in the EDA gene. What is the most likely diagnosis?","o":["Ichthyosis","Ectodermal dysplasia","Albinism","Epidermolysis bullosa","Xeroderma pigmentosum"],"a":1,"m":"Hypohidrotic ectodermal dysplasia จากการกลายพันธุ์ยีน EDA (X-linked) ทำให้โครงสร้างที่มาจาก ectoderm พัฒนาผิดปกติ ได้แก่ ฟัน ผม และต่อมเหงื่อ","e":["Ichthyosis มีผิวแห้งเป็นเกล็ดทั่วตัว ฟันและต่อมเหงื่อปกติ","ถูก — ฟันหาย ผมบาง เหงื่อออกน้อย + EDA mutation","Albinism คือความผิดปกติของการสร้างเมลานิน","Epidermolysis bullosa ทำให้ผิวพองง่ายเมื่อเสียดสี","Xeroderma pigmentosum คือความบกพร่องในการซ่อม DNA ทำให้ไวต่อแสงแดดและเกิดมะเร็งเร็ว"],"k":["เนื้องอกไม่ร้ายของ keratinocyte พบบ่อยในผู้สูงอายุ ลักษณะ stuck-on คล้ายแปะติดบนผิว ผิวเคลือบขี้ผึ้ง (waxy)","จุลพยาธิวิทยา: horn cysts (ถุงเคราตินที่ถูกล้อมรอบ) และ pseudohorn cysts (โพรงเคราตินที่เปิดออกสู่ผิว)","Leser-Trélat sign: การเกิด SK จำนวนมากอย่างรวดเร็ว เป็น paraneoplastic syndrome ที่สัมพันธ์กับมะเร็งภายใน โดยเฉพาะมะเร็งกระเพาะอาหาร","ข้อควรระวัง: pigmented SK อาจดูคล้าย melanoma ถ้าไม่แน่ใจต้องตัดชิ้นเนื้อ"],"ref":"Benign epithelial tumors · Seborrheic keratosis"},{"sec":"Genetic skin disease","n":57,"q":"A newborn presents with diffuse thickened, scaly skin resembling a \"collodion baby.\" The most likely underlying pathology involves a mutation affecting:","o":["Type VII collagen","Keratinocyte differentiation","Melanin synthesis","Epidermal basement membrane proteins","Laminin-5"],"a":1,"m":"Collodion baby เป็นการแสดงออกของ congenital ichthyosis ซึ่งเกิดจากความผิดปกติของการแบ่งตัวและการหลุดลอกของ keratinocyte (เช่น TGM1) ทำให้ stratum corneum หนาผิดปกติ","e":["Type VII collagen ผิดปกติทำให้เกิด dystrophic epidermolysis bullosa (ตุ่มน้ำ ไม่ใช่เกล็ด)","ถูก — ความผิดปกติของ keratinocyte differentiation/cornification","Melanin synthesis ผิดปกติทำให้เกิด albinism","โปรตีน basement membrane ผิดปกติทำให้ผิวแยกชั้นเป็นตุ่มน้ำ","Laminin-5 ผิดปกติทำให้เกิด junctional epidermolysis bullosa"],"k":["กลไกคือการกระตุ้น growth factor receptor signaling ที่ผิวหนังมากเกินไป โดยอินซูลินที่สูงไปจับ IGF-1 receptor บน keratinocyte และ fibroblast","จุลพยาธิวิทยา: epidermal hyperplasia ร่วมกับ hyperkeratosis, papillomatosis และเม็ดสีชั้น basal เข้มขึ้นเล็กน้อย (สีคล้ำเกิดจากผิวหนา ไม่ใช่เมลานินเพิ่มมาก)","ชนิด benign สัมพันธ์กับโรคอ้วน เบาหวาน ภาวะดื้ออินซูลิน และ PCOS","ชนิด malignant เกิดเร็วในผู้สูงอายุที่ไม่อ้วน เป็น paraneoplastic syndrome ของมะเร็งในช่องท้อง โดยเฉพาะ gastric adenocarcinoma"],"ref":"Benign epithelial tumors · Acanthosis nigricans"},{"sec":"Benign epidermal lesions","n":58,"q":"A 60-year-old woman presents with multiple brown, waxy, stuck-on lesions on her trunk. A biopsy shows horn cysts. What is the most likely diagnosis?","o":["Actinic keratosis","Seborrheic keratosis","Bowen disease","Basal cell carcinoma","Epidermoid cyst"],"a":1,"m":"Seborrheic keratosis เป็นเนื้องอกไม่ร้ายของ keratinocyte ลักษณะเหมือนแปะติดบนผิว ผิวมัน พยาธิสภาพพบ horn cysts และ pseudohorn cysts","e":["Actinic keratosis เป็นแผ่นสากบนผิวที่โดนแดด มีเซลล์ผิดปกติ ไม่มี horn cyst","ถูก — stuck-on appearance + horn cysts = seborrheic keratosis","Bowen disease คือ SCC in situ มีเซลล์ผิดปกติเต็มความหนาหนังกำพร้า","BCC เป็นตุ่มมันวาวขอบม้วน มีเส้นเลือดฝอยและ palisading nuclei","Epidermoid cyst เป็นถุงใต้ผิวหนังมีเคราตินภายใน"],"k":["Skin tag (acrochordon) เป็นติ่งเนื้อนุ่มมีก้าน แกนกลางเป็น fibrovascular core หุ้มด้วย epidermis ปกติ","ตำแหน่งเด่นคือคอ รักแร้ ขาหนีบ ซึ่งเป็นบริเวณเสียดสี","สัมพันธ์กับโรคอ้วน เบาหวาน และการตั้งครรภ์ จึงมักพบร่วมกับ acanthosis nigricans","อาจบิดขั้วจนขาดเลือดและเจ็บได้ (infarcted skin tag) ซึ่งเป็นสาเหตุที่ผู้ป่วยมาพบแพทย์"],"ref":"Benign epithelial tumors · Fibroepithelial polyp"},{"sec":"Benign epidermal lesions","n":59,"q":"A 45-year-old woman with obesity and diabetes presents with hyperpigmented, velvety plaques on her neck and axillae. What is the underlying pathology?","o":["HPV infection","Hyperinsulinemia","Sun damage","Autoimmune inflammation","Chronic fungal infection"],"a":1,"m":"Acanthosis nigricans เกิดจากอินซูลินสูงไปจับ IGF-1 receptor บน keratinocyte และ fibroblast กระตุ้นการเพิ่มจำนวนเซลล์ (ถ้าเกิดเฉียบพลันในผู้สูงอายุต้องนึกถึงมะเร็งกระเพาะอาหาร)","e":["HPV ทำให้เกิดหูด ไม่ใช่แผ่นกำมะหยี่ในซอกพับ","ถูก — hyperinsulinemia จากภาวะดื้ออินซูลิน","แสงแดดไม่ได้ก่อรอยโรคในซอกรักแร้ที่ไม่โดนแดด","ไม่ใช่การอักเสบจากภูมิต้านตนเอง","เชื้อราให้ผื่นแดงมีขุยและคัน ไม่ใช่ผิวหนาสีคล้ำแบบกำมะหยี่"],"k":["Pilar cyst มีต้นกำเนิดจากปลอกรากผม (outer root sheath) จึงพบบนหนังศีรษะเป็นส่วนใหญ่ และมักมีหลายก้อน ถ่ายทอดทางพันธุกรรมได้","ผนังบุด้วยเยื่อบุที่ไม่มีชั้น granular (trichilemmal keratinization) ภายในเป็นเคราตินหนาแน่นเป็นเนื้อเดียว","Epidermoid (epithelial inclusion) cyst ต่างกันที่ผนังมี granular layer มีรูเปิดกลาง (punctum) และพบที่ใบหน้า คอ ลำตัว","ทั้งสองชนิดถ้าแตกจะทำให้เกิดการอักเสบรุนแรงแบบ foreign body reaction ตามที่เลกเชอร์ระบุ"],"ref":"Cysts · Pilar (trichilemmal) cyst"},{"sec":"Benign epidermal lesions","n":60,"q":"A 30-year-old man presents with a soft, pedunculated skin-colored lesion on his neck. What is the most likely diagnosis?","o":["Seborrheic keratosis","Fibroepithelial polyp","Actinic keratosis","Bowen disease","Epidermoid cyst"],"a":1,"m":"Fibroepithelial polyp (skin tag / acrochordon) เป็นติ่งเนื้อนุ่มมีก้าน พบบริเวณคอ รักแร้ ขาหนีบ สัมพันธ์กับความอ้วนและการเสียดสี","e":["Seborrheic keratosis แปะแบนบนผิว ไม่มีก้านและมีสีน้ำตาลผิวมัน","ถูก — soft + pedunculated = skin tag","Actinic keratosis เป็นแผ่นสากแบน ไม่ยื่นมีก้าน","Bowen disease เป็นแผ่น
