<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#f5f3f8;--surface:#fff;--ink:#1e1b2e;--muted:#67627c;--line:#e2deec;
  --hema:#34306b;--hema-soft:#ebe9f7;--eosin:#c23d69;--eosin-soft:#fbe8ef;
  --good:#1d7f53;--good-soft:#e3f4ec;--bad:#b83227;--bad-soft:#fbe7e5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#14121d;--surface:#1d1a29;--ink:#ece9f4;--muted:#a19cb5;--line:#302c42;
  --hema:#aea7f2;--hema-soft:#282443;--eosin:#f07ea4;--eosin-soft:#3a1e2b;
  --good:#5fd09a;--good-soft:#16301f;--bad:#f08a80;--bad-soft:#3a1c1a;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#14121d;--surface:#1d1a29;--ink:#ece9f4;--muted:#a19cb5;--line:#302c42;
  --hema:#aea7f2;--hema-soft:#282443;--eosin:#f07ea4;--eosin-soft:#3a1e2b;
  --good:#5fd09a;--good-soft:#16301f;--bad:#f08a80;--bad-soft:#3a1c1a;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:820px;margin:0 auto}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;text-wrap:balance}
h1 span{color:var(--eosin)}
.sub{color:var(--muted);font-size:13px;margin:2px 0 8px}
@media (max-width:560px){.sub{display:none}h1{font-size:19px;margin-bottom:8px}}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
.tab,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.tab[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--bg)}
.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{white-space:nowrap;flex:none}
.chip small{opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.tools{margin-top:8px;justify-content:space-between}
.btn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;font-size:13px}
.score{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.score b{color:var(--ink)}
main{display:grid;gap:14px;margin-top:16px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.qh{display:flex;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.qn{font-weight:700;color:var(--hema)}
.lec{color:var(--eosin)}
.q p{margin:0 0 8px}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 10px}
.opt:hover:not(:disabled){border-color:var(--hema);background:var(--hema-soft)}
.opt:disabled{cursor:default}
.opt .k{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--muted)}
.opt .why{grid-column:2;font-size:13.5px;color:var(--muted);margin-top:4px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{color:var(--bad)}
.verdict{font-weight:600;margin:10px 0 4px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.more{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:14px}
.more p:last-child{color:var(--muted);font-size:13px}
.tw{overflow-x:auto;margin:6px 0 10px}
table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
th{background:var(--hema-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .see{margin:4px 0 8px}
.card .a{border-left:3px solid var(--eosin);padding-left:10px}
.empty{color:var(--muted);text-align:center;padding:32px}
.note{background:var(--eosin-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .15s,border-color .15s}}
.timer{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.timer b{color:var(--ink);font-weight:500}
.timer .slow{color:var(--bad)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.nav .btn{padding:8px 14px;font-size:14px}
.nav .btn.primary{background:var(--hema);border-color:var(--hema);color:var(--bg)}
.pos{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-variant-numeric:tabular-nums;padding:0}
.dot.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dot.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot.cur{outline:2px solid var(--hema);outline-offset:1px}
.sum h2{font-size:17px;margin:0 0 8px}
.stats{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:6px}
.stats div{display:grid}
.stats b{font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.wr{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.wr .you{border-left:3px solid var(--bad);padding-left:10px;margin:6px 0}
.wr .cor{border-left:3px solid var(--good);padding-left:10px;margin:6px 0}
.wr small{color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--hema)}
</style>

<script>
const D={"lec": ["Lec 1 Anatomy", "Lec 2 Histology", "Lec 3 Embryology", "Lec 4 Biochemistry", "Lec 5 Control of secretion", "Lec 6 Hypothalamus–pituitary", "Lec 7 Growth · Thyroid", "Lec 8 Adrenal", "Lec 9 Pancreas · Other", "Lec 10 Aging"], "qs": [{"n": 1, "lec": 0, "stem": "<p>An aneurysm bulges into the <b>upper part of the lateral wall<\/b> of the left cavernous sinus. Which nerve is the first to be compressed?<\/p>", "opts": ["Abducent nerve", "Maxillary nerve", "Oculomotor nerve", "Ophthalmic nerve", "Trochlear nerve"], "why": ["abducent nerve อยู่<b>กลางโพรง<\/b> sinus ข้าง internal carotid artery ไม่ได้อยู่ในผนัง — โดนก่อนเมื่อก้อน<b>ขยายเข้ากลาง sinus<\/b> (เช่น pituitary adenoma โตข้าง) ไม่ใช่เมื่อกดผนังบน", "maxillary nerve อยู่<b>ล่างสุด<\/b>ของผนังด้านข้าง", "ผนังด้านข้างเรียงจากบนลงล่าง: oculomotor (III) → trochlear (IV) → ophthalmic (V1) → maxillary (V2); ส่วนบนสุดคือ oculomotor → ptosis, รูม่านตาขยาย, ตามองลงออก", "ophthalmic nerve อยู่ใต้ trochlear", "trochlear nerve อยู่ใต้ oculomotor"], "ans": 2, "more": "<p><b>กลไก:<\/b> ตำแหน่งของรอยโรค (ผนังบน vs กลางโพรง) ตัดสินว่าเส้นไหนเสียก่อน<\/p><p><b>ทำไมตัวลวงหลอก:<\/b> จำว่า \"cranial nerve VI เสียก่อน\" ได้ แต่ใช้เฉพาะเมื่อก้อนเข้า<b>กลางโพรง<\/b> — โจทย์นี้กด<b>ผนังบน<\/b><\/p><p><b>High-yield:<\/b> lateral wall บน→ล่าง = III, IV, V1, V2 · ในโพรง = VI + internal carotid artery<\/p><p>📍 01-ANAT หน้า 18, 26<\/p>"}, {"n": 2, "lec": 0, "stem": "<p>At which site do hypothalamic releasing hormones <b>first enter the blood<\/b> on their way to the anterior pituitary?<\/p>", "opts": ["Secondary capillary plexus in the pars distalis", "Capillaries of the inferior hypophyseal artery in the pars nervosa", "Primary capillary plexus in the median eminence", "Sinusoids of the pars tuberalis around the stalk", "Tributaries of the cavernous sinus beside the fossa"], "why": ["secondary plexus = จุดที่ hormone <b>ออก<\/b>จากเลือดไปหาเซลล์ anterior pituitary (จุดที่สอง ไม่ใช่จุดแรก)", "inferior hypophyseal artery เลี้ยง <b>posterior<\/b> lobe; antidiuretic hormone เข้าเลือดที่นี่ ไม่ใช่ releasing hormones", "superior hypophyseal artery → primary plexus ใน median eminence → parvocellular axon ปล่อย releasing hormones ที่นี่ → portal veins ลง stalk → secondary plexus", "pars tuberalis หุ้ม stalk แต่ไม่ใช่จุดรับ releasing hormones", "เป็นทางเลือดดำ<b>ออก<\/b>จากต่อม"], "ans": 2, "more": "<p><b>Flow:<\/b> superior hypophyseal artery → <b>primary plexus (median eminence)<\/b> → hypophyseal portal veins → secondary plexus (anterior lobe) → anterior hypophyseal veins → cavernous sinus<\/p><p><b>ทำไมตัวลวงหลอก:<\/b> \"secondary plexus\" คุ้นหูเพราะอยู่ใน anterior lobe — แต่ถามจุด<b>แรก<\/b><\/p><p><b>High-yield:<\/b> portal system = capillary 2 ชุดต่อกัน; ชุดแรกรับ, ชุดสองส่ง<\/p><p>📍 01-ANAT หน้า 21, 23<\/p>"}, {"n": 3, "lec": 0, "stem": "<p>During thyroidectomy, the surgeon ligates the superior thyroid artery <b>on the capsule at the upper pole<\/b> rather than high near its origin. What is the main reason?<\/p>", "opts": ["To preserve the blood supply to the superior parathyroid glands", "To avoid the external branch of the superior laryngeal nerve that runs with the artery", "To avoid the recurrent laryngeal nerve in the tracheo-oesophageal groove", "To prevent bleeding from the middle thyroid artery nearby", "To keep the pyramidal lobe attached to the hyoid bone"], "why": ["parathyroid ได้เลือดหลักจาก <b>inferior<\/b> thyroid artery (ascending branch)", "external branch วิ่งคู่ superior thyroid artery ลงมาที่ superior pole → ผูกสูงเสี่ยงผูกเส้นประสาทไปด้วย → ผูกชิด capsule", "recurrent laryngeal nerve อยู่ที่ <b>inferior<\/b> pole/posteromedial surface", "<b>ไม่มี<\/b> middle thyroid artery (มีแต่ middle thyroid vein)", "ไม่ใช่เหตุผลเรื่องการผูกหลอดเลือด"], "ans": 1, "more": "<p><b>High-yield:<\/b> artery กับ nerve เดินคู่กันทั้งสองขั้ว → ผูก artery ชิดต่อม (low, on the capsule)<\/p><p>📍 01-ANAT หน้า 31–33<\/p>"}, {"n": 4, "lec": 0, "stem": "<p>Which parathyroid glands are the <b>more constant<\/b> in position, and why?<\/p>", "opts": ["Superior glands — they come from pouch 4 and descend only a short distance", "Inferior glands — they come from pouch 3 and stay with the thyroid", "Superior glands — they come from pouch 3 and descend with the thymus", "Inferior glands — they come from pouch 4 and stop at the carotid bifurcation", "Both pairs equally — all four form from the thyroid primordium"], "why": ["pouch 4 → superior glands เคลื่อนตาม thyroid ระยะสั้น → ตำแหน่งค่อนข้างคงที่ (medial, posterior)", "pouch ถูก แต่ inferior ถูกลากโดย thymus ระยะไกล → ตำแหน่ง<b>แปรผัน<\/b>", "จับคู่ pouch ผิด (pouch 3 = inferior)", "จับคู่ pouch ผิด; และการค้างที่ carotid bifurcation เป็นเรื่องของ inferior gland ที่ลงไม่ถึง", "parathyroid ไม่ได้มาจาก thyroid primordium"], "ans": 0, "more": "<p><b>ทำไมตัวลวงหลอก:<\/b> ตัวเลือก 2–4 สลับ \"pouch\" กับ \"ตำแหน่ง\" — ชื่อต่อมตั้งตามตำแหน่งสุดท้าย ไม่ใช่ตาม pouch<\/p><p><b>High-yield:<\/b> pouch 3 → inferior (ลงไกล แปรผัน) · pouch 4 → superior (ลงใกล้ คงที่)<\/p><p>📍 01-ANAT หน้า 41 · 04-DEV หน้า 34, 37<\/p>"}, {"n": 5, "lec": 0, "stem": "<p>Parvocellular neurons that control the <b>anterior<\/b> pituitary lie mainly in which hypothalamic zone?<\/p>", "opts": ["Lateral zone, including the lateral tuberal nuclei", "Medial zone, including the supraoptic nucleus", "Medial zone, including the ventromedial nucleus", "Periventricular zone, including the arcuate nucleus", "Mammillary region, including the posterior nucleus"], "why": ["lateral zone = limbic input, emotional expression", "supraoptic = magnocellular → <b>posterior<\/b> pituitary", "ventromedial = satiety (medial zone คุม posterior pituitary + autonomic)", "periventricular zone (periventricular, suprachiasmatic, arcuate) → parvocellular axon สิ้นสุดที่ median eminence → portal system", "ไม่ใช่กลุ่มที่คุม anterior pituitary"], "ans": 3, "more": "<p><b>High-yield:<\/b> periventricular + arcuate → anterior (blood) · supraoptic + paraventricular → posterior (axon)<\/p><p>📍 01-ANAT หน้า 10, 23<\/p>"}, {"n": 6, "lec": 0, "stem": "<p>Which statement about the pineal gland is correct?<\/p>", "opts": ["It is supplied by the superior hypophyseal arteries", "It is controlled by adrenocorticotropic hormone from the pituitary", "It is attached to the floor of the third ventricle", "It enlarges steadily from childhood into old age", "It lies outside the blood–brain barrier"], "why": ["pineal ได้เลือดจาก posterior choroidal arteries (แขนงของ posterior cerebral artery)", "pineal ไม่อยู่ใต้การคุมของ pituitary; คุมโดย sympathetic (norepinephrine) ตามแสง", "ติด <b>roof<\/b> ของ third ventricle", "secretion สูงสุดอายุ 1–5 ปี แล้วลด; หลัง 7 ปีฝ่อเป็นก้อน fibrous เล็ก", "pineal อยู่นอก blood–brain barrier → melatonin เข้ากระแสเลือดได้อิสระ"], "ans": 4, "more": "<p><b>High-yield:<\/b> pineal = midline, roof of third ventricle, outside blood–brain barrier, ไม่ขึ้นกับ pituitary<\/p><p>📍 01-ANAT หน้า 3, 13–14<\/p>"}, {"n": 7, "lec": 0, "stem": "<p>CT shows a 4-cm mass of the <b>left<\/b> adrenal gland. Which organs are its main <b>anterior<\/b> relations?<\/p>", "opts": ["Right lobe of the liver and inferior vena cava", "Stomach, pancreas and sometimes the spleen", "Duodenum and head of the pancreas", "Transverse colon and jejunum", "Diaphragm and quadratus lumborum"], "why": ["anterior relations ของต่อม<b>ขวา<\/b>", "ต่อมซ้าย (semilunar) ด้านหน้า: stomach, pancreas, บางครั้ง spleen", "อยู่ใกล้ฝั่งขวา", "ไม่ใช่ direct relation ในสไลด์", "diaphragm อยู่ <b>ด้านหลัง<\/b> ของทั้งสองต่อม"], "ans": 1, "more": "<p><b>High-yield:<\/b> ขวา: liver + inferior vena cava · ซ้าย: stomach + pancreas (± spleen)<\/p><p>📍 01-ANAT หน้า 44<\/p>"}, {"n": 8, "lec": 0, "stem": "<p>A gallstone lodges in the <b>hepatopancreatic ampulla<\/b>. The patient develops jaundice and acute pancreatitis together. Which anatomical fact explains both?<\/p>", "opts": ["The accessory duct and the bile duct share the minor papilla", "The bile duct and main pancreatic duct unite in the ampulla before the major papilla", "The portal vein and bile duct pass together behind the pancreatic neck", "The pancreatic tail and bile duct meet in the splenorenal ligament", "The cystic duct drains directly into the main pancreatic duct"], "why": ["minor papilla รับเฉพาะ accessory duct", "main pancreatic duct + bile duct รวมเป็น hepatopancreatic ampulla (of Vater) เปิดที่ major papilla (มี sphincter of Oddi) → นิ่วอุดจุดเดียว → bile คั่ง (jaundice) + pancreatic juice คั่ง (pancreatitis ⚠️ textbook consensus)", "portal vein เกิดหลัง neck แต่ไม่รวมกับ bile duct", "tail อยู่ใกล้ spleen ไม่เกี่ยวกับ bile duct", "cystic duct → common bile duct"], "ans": 1, "more": "<p><b>High-yield:<\/b> ampulla = จุดรวมของสองระบบท่อ → ก้อนที่นี่ (นิ่ว, tumour ที่ head) กระทบทั้งสอง<\/p><p>📍 01-ANAT หน้า 51, 54<\/p>"}, {"n": 9, "lec": 0, "stem": "<p>A neurosurgeon reaches a pituitary adenoma through the nose without opening the skull. Which structure lies <b>directly below<\/b> the hypophyseal fossa and is crossed in this approach?<\/p>", "opts": ["Ethmoid air cells", "Maxillary sinus", "Sphenoid sinus", "Frontal sinus", "Cavernous sinus"], "why": ["อยู่หน้า/ข้างบน ไม่ได้อยู่ใต้ sella ตรง", "อยู่ในกระดูก maxilla ต่ำและอยู่ด้านข้าง", "sella turcica เป็นส่วนของ sphenoid bone; ใต้ fossa คือ sphenoid sinus (และ nasopharynx) → เข้าทางจมูกผ่าน sinus ถึงต่อม (⚠️ transsphenoidal approach เป็น textbook consensus)", "อยู่หน้าผาก", "อยู่ <b>ด้านข้าง<\/b> ของต่อม ไม่ใช่ด้านล่าง"], "ans": 2, "more": "<p><b>High-yield:<\/b> รอบต่อม: บน = diaphragma sellae + optic chiasm · ล่าง = sphenoid sinus · ข้าง = cavernous sinus<\/p><p>📍 01-ANAT หน้า 16, 18<\/p>"}, {"n": 10, "lec": 1, "stem": "<p>In a parathyroid section, some chief cells are small with faintly acidophilic cytoplasm (<b>dark<\/b> chief cells), while others are paler (<b>light<\/b> chief cells). What does this difference represent?<\/p>", "opts": ["Dark cells are oxyphil precursors; light cells are adipocytes", "Dark cells secrete calcitonin; light cells secrete parathyroid hormone", "Dark cells are resting; light cells are actively secreting", "Dark cells are actively secreting; light cells are resting", "Dark cells are degenerating; light cells are dividing"], "why": ["adipocyte ไม่ใช่ chief cell", "calcitonin มาจาก thyroid C cells", "กลับด้าน", "สไลด์: dark chief cell = active stage; light chief cell = resting stage", "ไม่ใช่ข้อมูลในสไลด์"], "ans": 3, "more": "<p><b>High-yield:<\/b> chief cell = principal = clear cell · มี glycogen + lipid droplets · สร้าง parathyroid hormone<\/p><p>📍 02-HISTO หน้า 9<\/p>"}, {"n": 11, "lec": 1, "stem": "<p>Cords of cuboidal basophilic cells wrap around the infundibular stalk. According to the lecture slide, which hormones do these cells secrete?<\/p>", "opts": ["Growth hormone and prolactin", "Follicle-stimulating hormone and luteinizing hormone", "Antidiuretic hormone and oxytocin", "Melanocyte-stimulating hormone only", "Adrenocorticotropic hormone and thyroid-stimulating hormone"], "why": ["acidophils ของ pars distalis", "pars tuberalis: slide ระบุ secrete follicle-stimulating hormone, luteinizing hormone (handout: มี gonadotroph บางส่วน หน้าที่ในคนยังไม่ชัด)", "posterior pituitary (ปล่อย ไม่ได้สร้าง)", "pars intermedia", "basophils ของ pars distalis (อยู่ตรงกลาง)"], "ans": 1, "more": "<p><b>High-yield:<\/b> pars tuberalis = anterior-lobe tissue ที่หุ้ม stalk ซึ่งเป็นส่วนของ posterior lobe<\/p><p>📍 02-HISTO หน้า 24 · 03-HISTO หน้า 5 · 01-ANAT หน้า 17<\/p>"}, {"n": 12, "lec": 1, "stem": "<p>Among the chromaffin cells of the adrenal medulla, a few large cells have an <b>eccentric vesicular nucleus<\/b> and acidophilic cytoplasm. What are they?<\/p>", "opts": ["Sympathetic ganglion cells (multipolar neurons)", "Norepinephrine-secreting chromaffin cells", "Cells of the zona reticularis", "Pituicyte-like glial cells", "Endothelial cells of medullary sinusoids"], "why": ["sympathetic ganglion cell: multipolar neuron, nucleus เยื้องศูนย์, cytoplasm acidophilic (ป้าย GG ในสไลด์)", "chromaffin cell: polyhedral, nucleus กลม granular, cytoplasm <b>basophilic<\/b>", "เป็นเซลล์ cortex ไม่ใช่ medulla", "ไม่มีใน adrenal medulla", "เซลล์แบนบุหลอดเลือด"], "ans": 0, "more": "<p><b>High-yield:<\/b> medulla = chromaffin cells (basophilic, A และ NA) + sympathetic ganglion cells ปน<\/p><p>📍 02-HISTO หน้า 32–33 · 03-HISTO หน้า 19<\/p>"}, {"n": 13, "lec": 1, "stem": "<p>Which islet cell secretes a hormone released <b>after a meal<\/b> that may reduce further food intake?<\/p>", "opts": ["Glucagon-secreting alpha cell", "Insulin-secreting beta cell", "Somatostatin-secreting delta cell", "Pancreatic polypeptide cell", "Bicarbonate-secreting centroacinar cell"], "why": ["glucagon เด่นช่วงอดอาหาร", "insulin หลั่งหลังอาหารจริง แต่สไลด์ไม่ได้บรรยายว่าลดการกินต่อ", "somatostatin ชะลอการใช้อาหาร ไม่ใช่ appetite hormone ตามสไลด์", "pancreatic polypeptide: หลั่งหลังอาหาร บทบาทใน appetite อาจลดการกินต่อ; ยับยั้ง gallbladder contraction และ enzyme secretion", "exocrine duct cell"], "ans": 3, "more": "<p><b>ทำไมตัวลวงหลอก:<\/b> \"หลังอาหาร\" ทำให้เลือก beta cell — แต่คำว่า \"reduce food intake\" ชี้ pancreatic polypeptide<\/p><p>📍 12-PHYSIO หน้า 3 · 01-ANAT หน้า 53 · 05-BIOCHEM หน้า 67<\/p>"}, {"n": 14, "lec": 1, "stem": "<p>With routine H&amp;E the cytoplasm of pinealocytes is hard to see. Which stain reveals their long branching processes ending near blood vessels?<\/p>", "opts": ["Periodic acid–Schiff stain", "Chromate (chromaffin) reaction", "Silver stain", "Oil red O stain", "Congo red stain"], "why": ["⚠️ ย้อม glycogen/glycoprotein (textbook consensus) ไม่ใช่วิธีในสไลด์", "ใช้กับ chromaffin cells ของ adrenal medulla", "handout: silver stain เห็น processes ที่แตกแขนงและโป่งปลาย ไปสัมผัสผนังหลอดเลือด", "⚠️ ย้อม lipid (textbook consensus)", "⚠️ ย้อม amyloid (textbook consensus)"], "ans": 2, "more": "<p>📍 03-HISTO หน้า 10<\/p>"}, {"n": 15, "lec": 1, "stem": "<p>A parathyroid biopsy from a <b>6-year-old<\/b> shows only chief cells. Which cell type would be pothyroidism", "pancreas (ventral bud, islet cells)", "pituitary (LHX2 = posterior lobe)"], "ans": 2, "more": "<p><b>High-yield (molecular map):<\/b> hypothalamus Wnt/β-catenin · pituitary FGF8, BMP4, WNT5A, LHX2 · thyroid TTF1/TTF2/PAX8 · C cells MASH1 · pouches TBX1 · adrenal DAX1/CYP21A2 · pancreas PDX1/neurogenin-3<\/p><p>📍 04-DEV หน้า 52<\/p>"}, {"n": 18, "lec": 2, "stem": "<p>Which cortical zones are present in the adrenal gland <b>at birth<\/b>, and which becomes recognisable only later?<\/p>", "opts": ["Glomerulosa and fasciculata at birth; reticularis by the end of year 3", "Fasciculata and reticularis at birth; glomerulosa by year 3", "All three zones at birth; the medulla by year 3", "Only reticularis at birth; the other two at puberty", "Glomerulosa and reticularis at birth; fasciculata by year 1"], "why": ["สไลด์: แรกเกิดมี zona glomerulosa + zona fasciculata; zona reticularis เห็นชัดปลายปีที่ 3 (โซนสุดท้าย)", "reticularis มาทีหลัง", "medulla มีตั้งแต่ fetal (เล็ก แล้วค่อยเจริญหลังคลอด)", "ไม่ใช่", "fasciculata มีตั้งแต่แรกเกิด"], "ans": 0, "more": "<p><b>Link:<\/b> reticularis มาช้า → adrenal androgen ในเด็กเล็กต่ำ; ผู้สูงอายุ reticularis ฝ่อก่อน (adrenopause)<\/p><p>📍 04-DEV หน้า 41–42<\/p>"}, {"n": 19, "lec": 2, "stem": "<p>Why does the common bile duct in the adult pass <b>behind<\/b> the head of the pancreas?<\/p>", "opts": ["The dorsal bud grows around the bile duct and fuses in front of it", "Duodenal rotation carries the ventral bud and bile duct dorsally", "The bile duct migrates through the pancreas after birth", "The splenic primordium pushes the bile duct backward", "The ventral mesentery forms a tunnel for the bile duct"], "why": ["ventral bud ต่างหากที่เคลื่อน", "ventral bud เกิดข้าง bile duct → duodenum หมุนตามเข็มนาฬิกา 90° (C-shape) → ventral bud + bile duct ถูกพาไปด้านหลัง อยู่ใต้ dorsal bud → fuse ราว week 7", "เกิดใน embryo", "ไม่ใช่", "ไม่ใช่กลไกในสไลด์"], "ans": 1, "more": "<p><b>High-yield:<\/b> กลไกนี้อธิบายทั้ง bile duct หลัง head และ bile duct เปิดร่วมกับ main pancreatic duct ที่ ampulla<\/p><p>📍 04-DEV หน้า 47–48<\/p>"}, {"n": 20, "lec": 2, "stem": "<p>Which statement about the origin of the thyroid gland is correct?<\/p>", "opts": ["It arises from the dorsal part of the fourth pharyngeal pouch", "It arises from the third pharyngeal pouch together with the thymus", "It arises from the ultimopharyngeal body", "It arises from a median floor thickening at the foramen cecum", "It arises from neural crest cells of the second arch"], "why": ["= superior parathyroid", "= inferior parathyroid + thymus", "ให้ C cells (ส่วนน้อยของต่อม) ไม่ใช่ follicular cells", "thyroid <b>ไม่ใช่<\/b> pouch derivative: median endodermal thickening ที่ floor of pharynx ระหว่าง pouch 1 และ 2 = foramen cecum", "ไม่ใช่"], "ans": 3, "more": "<p><b>ทำไมตัวลวงหลอก:<\/b> ตัวเลือกทุกตัวเป็นโครงสร้างจริงในคอ — ต้องรู้ว่าอันไหนให้อะไร<\/p><p>📍 04-DEV หน้า 32<\/p>"}, {"n": 21, "lec": 2, "stem": "<p>A 3-week-old <b>boy<\/b> has vomiting, hyponatraemia and hyperkalaemia with low cortisol and aldosterone. His external genitalia are normal and ultrasound shows <b>small<\/b> adrenal glands. Serum 17-hydroxyprogesterone is not raised. Which gene is most likely mutated?<\/p>", "opts": ["CYP21A2", "DAX1", "TBX1", "PAX8", "PDX1"], "why": ["CYP21A2 (21-hydroxylase) → congenital adrenal hyperplasia: adrenal <b>โต<\/b> และ 17-hydroxyprogesterone <b>สูง<\/b>", "DAX1 → X-linked adrenal hypoplasia congenita: cortex เจริญไม่เต็ม → ต่อม<b>เล็ก<\/b> ขาด cortisol + aldosterone แต่ไม่มี precursor คั่ง", "DiGeorge (hypocalcaemia)", "thyroid", "pancreas"], "ans": 1, "more": "<p><b>กลไกเปรียบเทียบ:<\/b> congenital adrenal hyperplasia = enzyme พัง → precursor คั่ง + adrenocorticotropic hormone กระตุ้น → ต่อมโต · adrenal hypoplasia = ตัวต่อมเจริญไม่ได้ → ต่อมเล็ก<\/p><p><b>ทำไมตัวลวงหลอก:<\/b> salt wasting ในทารกชาย → เด้งไป 21-hydroxylase ทันที; ขนาดต่อม + 17-hydroxyprogesterone แยกได้<\/p><p>📍 04-DEV หน้า 44–45, 52<\/p>"}, {"n": 22, "lec": 3, "stem": "<p>When aromatase converts testosterone into estradiol, how does the carbon number of the steroid change?<\/p>", "opts": ["From 21 to 19", "From 27 to 21", "From 21 to 18", "From 19 to 18", "From 19 to 21"], "why": ["progestin/corticoid (21) → androgen (19) = 17,20 lyase", "cholesterol (27) → pregnenolone (21) = desmolase (side-chain cleavage)", "ไม่มีเอนไซม์ขั้นเดียวแบบนี้", "androgen (testosterone) = 19 carbons → estrogen (estradiol) = 18 carbons", "ทิศย้อนกลับ ไม่เกิด"], "ans": 3, "more": "<p><b>ตารางคาร์บอน:<\/b> cholesterol 27 · pregnenolone, progesterone, cortisol, aldosterone 21 · androgens 19 · estrogens 18<\/p><p><b>High-yield:<\/b> นับคาร์บอนลดลงเรื่อย ๆ ตาม pathway: 27 → 21 → 19 → 18<\/p><p>📍 05-BIOCHEM หน้า 15, 17<\/p>"}, {"n": 23, "lec": 3, "stem": "<p>How does antidiuretic hormone travel from the hypothalamic cell body to the posterior pituitary?<\/p>", "opts": ["Free in the cerebrospinal fluid of the third ventricle", "Inside axonal granules, bound to the carrier protein neurophysin", "Through the hypophyseal portal veins bound to plasma albumin", "As a nuclear receptor complex moving along microtubules", "Diffusing through the pars tuberalis from cell to cell"], "why": ["ไม่ใช่เส้นทาง", "prepropressophysin → ตัดใน granule ได้ antidiuretic hormone + neurophysin (II) + glycopeptide → axonal transport (microtubules) → เก็บใน axon terminal (Herring bodies)", "portal veins ใช้กับ releasing hormones ไป anterior lobe", "peptide ไม่ใช้ nuclear receptor", "ไม่ใช่"], "ans": 1, "more": "<p><b>High-yield:<\/b> antidiuretic hormone กับ oxytocin = 9 amino acids ต่างกันที่ตำแหน่ง 3 และ 8; ขนส่งภายใน axon คู่กับ neurophysin<\/p><p>📍 05-BIOCHEM หน้า 29 · 07-PHYSIO หน้า 13<\/p>"}, {"n": 24, "lec": 3, "stem": "<p>Which steroidogenic enzyme is located in the <b>mitochondria<\/b> rather than the smooth endoplasmic reticulum?<\/p>", "opts": ["21-hydroxylase", "17-alpha-hydroxylase", "3-beta-hydroxysteroid dehydrogenase", "Aromatase", "11-beta-hydroxylase"], "why": ["smooth endoplasmic reticulum", "smooth endoplasmic reticulum", "smooth endoplasmic reticulum", "smooth endoplasmic reticulum", "mitochondria: side-chain cleavage (desmolase), 11-beta-hydroxylase, aldosterone synthase"], "ans": 4, "more": "<p><b>กลไก:<\/b> substrate วิ่ง mitochondria → smooth endoplasmic reticulum → กลับ mitochondria สำหรับขั้นสุดท้ายของ cortisol/aldosterone<\/p><p><b>High-yield:<\/b> ขั้นแรก (desmolase) และขั้นท้าย (11-beta, aldosterone synthase) อยู่ mitochondria<\/p><p>📍 05-BIOCHEM หน้า 17, 54, 56<\/p>"}, {"n": 25, "lec": 3, "stem": "<p>After thyroglobulin is digested in lysosomes, what happens to the released <b>monoiodotyrosine and diiodotyrosine<\/b>?<\/p>", "opts": ["They are secreted into blood as active hormones", "They are deiodinated and their iodine is reused", "They are converted into reverse triiodothyronine", "They are returned to the colloid unchanged", "They are excreted directly into bile"], "why": ["ออกฤทธิ์ไม่ได้; ที่หลั่งคือ thyroxine + triiodothyronine", "iodine salvage: monoiodotyrosine/diiodotyrosine ถูก deiodinate → iodide กลับมาใช้สังเคราะห์ใหม่", "reverse triiodothyronine มาจาก thyroxine (inner-ring deiodination)", "ไม่ใช่", "ไม่ใช่"], "ans": 1, "more": "<p><b>High-yield:<\/b> thyroglobulin มี tyrosine 123 residues ใช้จริงแค่ 4–8; iodine เป็นวัตถุดิบหายาก → ต้อง salvage<\/p><p>📍 05-BIOCHEM หน้า 44–45<\/p>"}, {"n": 26, "lec": 3, "stem": "<p>Which part of the 84-amino-acid parathyroid hormone molecule carries its <b>biological activity<\/b>?<\/p>", "opts": ["The C-terminal fragment, residues 34/37–84", "The pro sequence removed in the Golgi", "The signal sequence removed in the endoplasmic reticulum", "The N-terminal region, residues 1–33 or 1–36", "The glycopeptide attached to neurophysin"], "why": ["C-terminal fragment ไม่ใช่ส่วน active", "ถูกตัดทิ้ง", "ถูกตัดทิ้ง", "biologically active sequence = 1–33 (หรือ 1–36) ด้าน N-terminal", "เป็นของ antidiuretic hormone"], "ans": 3, "more": "<p><b>Flow:<\/b> prepro-parathyroid hormone 115 → (ตัด signal ใน rough endoplasmic reticulum) pro 90 → (ตัด pro ใน Golgi) parathyroid hormone 84 → granule<\/p><p>📍 05-BIOCHEM หน้า 50<\/p>"}, {"n": 27, "lec": 3, "stem": "<p>During prolonged fasting, cortisol stimulates hepatic gluconeogenesis. Which substrate <b>cannot<\/b> give net glucose synthesis?<\/p>", "opts": ["Lactate", "Glycerol", "Alanine", "Even-chain fatty acids", "Other glucogenic amino acids"], "why": ["ใช้ได้", "ใช้ได้ (จาก triglyceride)", "glucogenic amino acid ใช้ได้", "handout ระบุ: กรดไขมันสายคู่คาร์บอนเปลี่ยนเป็นกลูโคสสุทธิไม่ได้โดยตรง (ได้ acetyl-coenzyme A → ketone แทน)", "ใช้ได้"], "ans": 3, "more": "<p><b>กลไก:<\/b> cortisol สลายโปรตีนกล้ามเนื้อ (amino acid) + lipolysis (glycerol + fatty acid) → ตับใช้ glycerol + amino acid สร้าง glucose; fatty acid ให้พลังงาน/ketone<\/p><p><b>High-yield:<\/b> \"fat can't make sugar\" ยกเว้นส่วน glycerol<\/p><p>📍 03-HISTO หน้า 17 · 11-PHYSIO หน้า 14<\/p>"}, {"n": 28, "lec": 4, "stem": "<p>In early pregnancy, free thyroxine rises slightly and thyroid-stimulating hormone falls. Which property of human chorionic gonadotropin explains this?<\/p>", "opts": ["It is a steroid that binds the thyroid hormone receptor", "It raises thyroxine-binding globulin, which stimulates the thyroid", "It weakly activates the thyroid-stimulating hormone receptor", "It inhibits deiodinase in peripheral tissues", "It is secreted by thyrotrophs of the anterior pituitary"], "why": ["เป็น glycoprotein ไม่ใช่ steroid", "thyroxine-binding globulin ↑ จาก <b>estrogen<\/b> และเพิ่มแค่ total hormone ไม่ได้กระตุ้นต่อม", "thyroid-stimulating hormone, luteinizing hormone, follicle-stimulating hormone, human chorionic gonadotropin = glycoprotein โครงสร้างคล้ายกัน → human chorionic gonadotropin กระตุ้น thyroid-stimulating hormone receptor ได้บ้าง → free thyroxine ↑ → feedback กด thyroid-stimulating hormone", "ไม่ใช่", "มาจาก placenta"], "ans": 2, "more": "<p><b>High-yield:<\/b> glycoprotein hormones: thyroid-stimulating hormone, luteinizing hormone, follicle-stimulating hormone, human chorionic gonadotropin<\/p><p>📍 06-PHYSIO หน้า 6 · 09-PHYSIO หน้า 5–6<\/p>"}, {"n": 29, "lec": 4, "stem": "<p>Which hormone acts mainly through the <b>inositol trisphosphate–diacylglycerol<\/b> pathway?<\/p>", "opts": ["Glucagon", "Parathyroid hormone", "Gonadotropin-releasing hormone", "Adrenocorticotropic hormone", "Thyroid-stimulating hormone"], "why": ["cyclic adenosine monophosphate", "cyclic adenosine monophosphate", "กลุ่ม inositol trisphosphate: gonadotropin-releasing hormone, thyrotropin-releasing hormone, oxytocin, vasopressin (V1), catecholamine (alpha-1), angiotensin II", "cyclic adenosine monophosphate", "cyclic adenosine monophosphate (สไลด์ thyroid แสดงทั้งสองทาง แต่ตารางจัดเป็น cyclic adenosine monophosphate)"], "ans": 2, "more": "<p><b>High-yield:<\/b> hypothalamic releasing hormones แบ่งสองฝั่ง: corticotropin-releasing hormone + growth hormone-releasing hormone = cyclic adenosine monophosphate · thyrotropin-releasing hormone + gonadotropin-releasing hormone = inositol trisphosphate<\/p><p>📍 06-PHYSIO หน้า 12 · 07-PHYSIO หน้า 5<\/p>"}, {"n": 30, "lec": 4, "stem": "<p>After a meal, rising blood glucose directly triggers insulin release. How is this stimulus for hormone release classified?<\/p>", "opts": ["Hormonal stimulus", "Neural stimulus", "Humoral stimulus", "Positive feedback stimulus", "Autocrine stimulus"], "why": ["hormone กระตุ้น hormone (เช่น thyrotropin-releasing hormone → thyroid-stimulating hormone)", "เส้นประสาทกระตุ้น (sympathetic → adrenal medulla)", "humoral = ระดับสาร/ion ในเลือดเปลี่ยน (glucose → insulin, calcium ต่ำ → parathyroid hormone)", "insulin ลด glucose = negative feedback", "ไม่ใช่"], "ans": 2, "more": "<p><b>High-yield:<\/b> 3 กลไกการหลั่ง: hormonal · humoral · neural<\/p><p>📍 05-BIOCHEM หน้า 22 · 06-PHYSIO หน้า 23<\/p>"}, {"n": 31, "lec": 4, "stem": "<p>Raising blood glucose during stress requires glucagon, cortisol, growth hormone and epinephrine together. Which principle of hormone interaction does this illustrate?<\/p>", "opts": ["One hormone has multiple actions", "Down-regulation of receptors", "Positive feedback", "One action needs multiple hormones", "Ultrashort-loop feedback"], "why": ["เช่น cortisol ทำหลายอย่าง (glucose, กระดูก, ภูมิคุ้มกัน) — คนละหลัก", "ไม่ใช่", "ไม่ใช่", "ผลเดียว (glucose ↑) ต้องใช้หลาย hormone ร่วม (synergism + permissive)", "ไม่ใช่"], "ans": 3, "more": "<p><b>High-yield:<\/b> สรุปสไลด์: one hormone → multiple actions · one action → multiple hormones<\/p><p>📍 06-PHYSIO หน้า 27–29 · 12-PHYSIO หน้า 34<\/p>"}, {"n": 32, "lec": 4, "stem": "<p>A patient develops a sudden <b>fall<\/b> in thyroxine-binding globulin. Once a new steady state is reached, what happens?<\/p>", "opts": ["Low total thyroxine, normal free thyroxine", "Low total thyroxine, low free thyroxine", "High total thyroxine, low free thyroxine", "Normal total, persistently high free thyroxine", "Normal total thyroxine, low free thyroxine"], "why": ["binding protein ลด → free ขึ้นชั่วคราว → feedback กด thyroid-stimulating hormone → สร้างน้อยลงจน free กลับปกติ → total ต่ำ (bound น้อยลง)", "ภาพ hypothyroidism จริง (free ต่ำ)", "ทิศผิด", "เป็นแค่ช่วงชั่วคราว ไม่ใช่ steady state", "ไม่ใช่"], "ans": 0, "more": "<p><b>Logic:<\/b> feedback ตรวจจับและคุม <b>free<\/b> hormone; binding protein เปลี่ยนแค่ total — กลับด้านของกรณีตั้งครรภ์ (thyroxine-binding globulin ↑)<\/p><p><b>High-yield:<\/b> ถ้า binding protein ผิดปกติ ให้ดู free hormone + tropic hormone<\/p><p>📍 06-PHYSIO หน้า 9 · 09-PHYSIO หน้า 12<\/p>"}, {"n": 33, "lec": 5, "stem": "<p>When a baby suckles, which combination of hypothalamic changes occurs?<\/p>", "opts": ["Dopamine release falls and oxytocin neurons are activated", "Dopamine release rises and oxytocin neurons are inhibited", "Thyrotropin-releasing hormone falls and antidiuretic hormone rises", "Corticotropin-releasing hormone rises and oxytocin falls", "Gonadotropin-releasing hormone rises and dopamine rises"], "why": ["afferent จาก nipple → hypothalamus → prolactin-inhibiting hormone (dopamine) ↓ + prolactin-releasing hormone ↑ → prolactin ↑ (สร้างนม) และ neurosecretory cells ↑ → oxytocin ↑ (ขับนม)", "กลับด้าน", "ไม่ใช่", "oxytocin ↑", "prolactin สูง<b>กด<\/b> gonadotropin-releasing hormone (natural contraception)"], "ans": 0, "more": "<p><b>High-yield:<\/b> suckling → ปลดเบรก dopamine (prolactin) + เปิด oxytocin (ejection) · plasma prolactin เพิ่ม ~10 เท่าขณะให้นม<\/p><p>📍 07-PHYSIO หน้า 27 · 08-PHYSIO หน้า 26, 31–32<\/p>"}, {"n": 34, "lec": 5, "stem": "<p>A man drinks a large amount of beer and urinates much more than the volume of fluid would predict. Which mechanism contributes?<\/p>", "opts": ["Ethanol stimulates aldosterone release", "Ethanol raises plasma osmolality, stimulating antidiuretic hormone", "Ethanol blocks aquaporin-2 production in the kidney directly", "Ethanol inhibits antidiuretic hormone secretion", "Ethanol increases angiotensin II"], "why": ["ไม่ใช่กลไกในสไลด์", "จะทำให้ปัสสาวะ<b>น้อยลง<\/b>", "ไม่ใช่กลไกในสไลด์", "สไลด์: ethanol <b>ยับยั้ง<\/b> antidiuretic hormone → collecting duct ไม่ดูดน้ำ → diuresis", "angiotensin II <b>กระตุ้น<\/b> antidiuretic hormone"], "ans": 3, "more": "<p><b>High-yield:<\/b> ยับยั้ง antidiuretic hormone: osmolality ↓, volume ↑, atrial natriuretic peptide, blood pressure ↑, ethanol<\/p><p>📍 07-PHYSIO หน้า 18<\/p>"}, {"n": 35, "lec": 5, "stem": "<p>Three patients have central diabetes insipidus: one from a supraoptic nucleus lesion, one from a pituitary stalk transection, one from destruction of the posterior lobe. What is true?<\/p>", "opts": ["Only the posterior lobe lesion causes diabetes insipidus", "The stalk lesion spares antidiuretic hormone because it is carried in portal blood", "The supraoptic lesion spares antidiuretic hormone because the posterior lobe makes it", "All three stop antidiuretic hormone delivery; the level of the lesion does not change the result", "Only the nucleus lesion matters because axons regrow at once"], "why": ["ทุกระดับทำให้เกิด", "antidiuretic hormone เดินใน <b>axon<\/b> ไม่ใช่ portal blood", "posterior lobe <b>ไม่สร้าง<\/b> hormone", "สไลด์ anatomy: ตัด axon ที่ใดก็ตาม (cell body, stalk, posterior lobe) → antidiuretic hormone ไม่ถึงเลือด ผลเหมือนกัน", "ไม่ใช่"], "ans": 3, "more": "<p><b>High-yield:<\/b> route 1 (neural) ขาดตรงไหนก็เหมือนกัน → central diabetes insipidus<\/p><p>📍 01-ANAT หน้า 12 · 07-PHYSIO หน้า 22<\/p>"}, {"n": 36, "lec": 5, "stem": "<p>In experimental mammals, removal of the pineal gland before puberty leads to which effect, according to the lecture?<\/p>", "opts": ["Delayed puberty from excess gonadotropins", "Precocious puberty from loss of melatonin", "Permanent insomnia with high melatonin", "Hypothyroidism from loss of thyroid-stimulating hormone", "Diabetes insipidus from loss of antidiuretic hormone"], "why": ["กลับด้าน", "สไลด์: melatonin กด gonad (ยับยั้ง luteinizing hormone/gonadotropin-releasing hormone) → ตัด pineal ในสัตว์ → precocious puberty", "melatonin จะต่ำ", "ไม่เกี่ยว", "ไม่เกี่ยว"], "ans": 1, "more": "<p><b>ข้อควรระวัง:<\/b> ในคน ความสัมพันธ์เชิงสาเหตุยังไม่ชัด (handout) และ pineal tumour ทำ precocious puberty เฉพาะเมื่อทำลาย hypothalamus ด้วย<\/p><p>📍 07-PHYSIO หน้า 40 · 04-DEV หน้า 10 · 03-HISTO หน้า 11<\/p>"}, {"n": 37, "lec": 5, "stem": "<p>Besides inserting aquaporin-2, which other effects of antidiuretic hormone help concentrate urine?<\/p>", "opts": ["More urea reabsorption and a more concentrated medulla", "Increased glomerular filtration and potassium secretion", "Increased glucose reabsorption in the proximal tubule", "Less urea reabsorption and a more dilute medulla", "Increased bicarbonate secretion by intercalated cells"], "why": ["สไลด์: antidiuretic hormone ↑ urea reabsorption ที่ collecting duct และ sodium transport เข้า medullary interstitium → interstitium เข้มข้น → ดึงน้ำออกได้มาก", "ไม่ใช่", "ไม่ใช่", "ตรงข้าม", "ไม่ใช่"], "ans": 0, "more": "<p><b>High-yield:<\/b> ปกติดูดกลับ 14–16 L ภายใต้ antidiuretic hormone เหลือปัสสาวะ 1–2 L<\/p><p>📍 07-PHYSIO หน้า 16<\/p>"}, {"n": 38, "lec": 6, "stem": "<p>A man with acromegaly also has galactorrhoea, although his serum prolactin is normal. Which fact explains this?<\/p>", "opts": ["Prolactin binds the growth hormone receptor with high affinity", "Growth hormone binds the prolactin receptor with affinity similar to prolactin", "Insulin-like growth factor 1 stimulates milk synthesis directly", "Growth hormone blocks dopamine release from the hypothalamus", "Acromegaly always co-secretes oxytocin"], "why": ["prolactin <b>ไม่มี<\/b> affinity ต่อ growth hormone receptor", "growth hormone กับ prolactin มี homology → growth hormone จับ prolactin receptor ได้ใกล้เคียง prolactin → growth hormone สูงจึงกระตุ้นเต้านมได้", "ไม่ใช่", "ไม่ใช่กลไกในสไลด์", "ไม่ใช่"], "ans": 1, "more": "<p><b>ทำไมตัวลวงหลอก:<\/b> ความสัมพันธ์ไม่สมมาตร — growth hormone → prolactin receptor ได้ แต่ prolactin → growth hormone receptor ไม่ได้<\/p><p><b>High-yield:<\/b> hormone ที่ homologous กับ growth hormone: prolactin, human chorionic somatomammotropin<\/p><p>📍 08-PHYSIO หน้า 4<\/p>"}, {"n": 39, "lec": 6, "stem": "<p>A somatostatin analogue is given to a patient with a growth hormone-secreting pituitary tumour. How does it work?<\/p>", "opts": ["It blocks the growth hormone receptor on the liver", "It inhibits growth hormone synthesis and release from somatotrophs", "It stimulates insulin-like growth factor 1 negative feedback", "It destroys somatotrophs by apoptosis", "It increases growth hormone-releasing hormone"], "why": ["ไม่ใช่ receptor antagonist", "somatostatin (growth hormone-inhibiting hormone) ยับยั้งการสังเคราะห์และหลั่ง growth hormone; สไลด์: somatostatin analogue for pituitary tumour", "ไม่ใช่", "ไม่ใช่", "ตรงข้าม"], "ans": 1, "more": "<p><b>High-yield:<\/b> somatostatin 14 amino acids · กด growth hormone + thyroid-stimulating hormone (hypothalamic) · กด insulin + glucagon (islet)<\/p><p>📍 08-PHYSIO หน้า 10 · 05-BIOCHEM หน้า 32<\/p>"}, {"n": 40, "lec": 6, "stem": "<p>A patient with acromegaly has hypercalciuria and mild hyperphosphataemia. Which growth hormone action explains this?<\/p>", "opts": ["Stimulation of renal 1-alpha-hydroxylase", "Complete inhibition of parathyroid hormone", "Stimulation of calcitonin from C cells", "Growth hormone-induced renal failure", "Blockade of vitamin D receptors"], "why": ["mineral effect: growth hormone ↑ 1-alpha-hydroxylase → calcitriol ↑ → ดูดซึม calcium + phosphate ↑; ไตดูดกลับ sodium, calcium, phosphate ↑ → phosphate สูง, calcium ที่ถูกกรองมากขึ้น → hypercalciuria", "ไม่ใช่", "ไม่ใช่", "ไม่ใช่", "ตรงข้าม"], "ans": 0, "more": "<p><b>High-yield:<\/b> acromegaly lab ในสไลด์: glucose intolerance ~50%, hyperinsulinism, hypercalciuria, hyperphosphataemia<\/p><p>📍 08-PHYSIO หน้า 6, 21<\/p>"}, {"n": 41, "lec": 6, "stem": "<p>Which of the following <b>stimulates<\/b> growth hormone secretion?<\/p>", "opts": ["Somatostatin", "Insulin-like growth factor 1", "Hyperglycaemia", "Ghrelin", "Insulin"], "why": ["ยับยั้ง", "negative feedback (long-loop)", "ยับยั้ง (หลักของ suppression test)", "ghrelin อยู่ในกลุ่ม stimulators ในสไลด์ (ร่วมกับ growth hormone-releasing hormone, sleep, hypoglycaemia, arginine, exercise)", "สไลด์ hormonal control: insulin (−)"], "ans": 3, "more": "<p><b>High-yield:<\/b> growth hormone เพิ่ม: sex hormones, thyroid hormone, ghrelin, deep sleep, hypoglycaemia, arginine, exercise · ลด: somatostatin, insulin-like growth factor 1, hyperglycaemia, insulin<\/p><p>📍 08-PHYSIO หน้า 11–13<\/p>"}, {"n": 42, "lec": 6, "stem": "<p>A woman with untreated <b>primary hypothyroidism<\/b> has galactorrhoea and a mildly raised prolactin. Which explanation fits the lecture?<\/p>", "opts": ["Low thyroxine acting directly on lactotrophs to cause secretion", "Thyrotropin-releasing hormone excess stimulating lactotrophs", "Low thyroid-stimulating hormone removes inhibition of prolactin", "Dopamine secretion rises in hypothyroidism", "Prolactin is made by the thyroid gland"], "why": ["ไม่ใช่กลไกในสไลด์", "primary hypothyroidism → feedback หาย → thyrotropin-releasing hormone ↑ (กระตุ้นทั้ง thyrotroph และ lactotroph) + ขาดผล \"thyroid hormone ลด prolactin\" → prolactin ↑", "ใน primary thyroid-stimulating hormone <b>สูง<\/b>", "dopamine ↑ จะกด prolactin", "ไม่ใช่"], "ans": 1, "more": "<p><b>กลไก:<\/b> thyroxine ↓ → thyrotropin-releasing hormone ↑ → thyroid-stimulating hormone ↑ + prolactin ↑<\/p><p><b>High-yield:<\/b> thyrotropin-releasing hormone = prolactin-releasing factor ตัวหนึ่ง<\/p><p>📍 08-PHYSIO หน้า 28 · 09-PHYSIO หน้า 21 · 07-PHYSIO หน้า 6<\/p>"}, {"n": 43, "lec": 6, "stem": "<p>Thyroid hormone raises oxygen consumption in most tissues. In which tissue does it <b>not<\/b> increase oxygen consumption?<\/p>", "opts": ["Heart", "Skeletal muscle", "Liver", "Kidney", "Brain"], "why": ["เพิ่ม", "เพิ่ม", "เพิ่ม", "เพิ่ม", "สไลด์: ไม่เพิ่ม oxygen consumption ใน brain, gonad, spleen, uterus, testis, thyroid (receptor น้อย)"], "ans": 4, "more": "<p><b>ทำไมตัวลวงหลอก:<\/b> สมองต้องการ thyroid hormone มากในการ<b>พัฒนา<\/b> (fetus/เด็ก) แต่ในผู้ใหญ่ไม่เพิ่ม metabolic rate ของสมอง<\/p><p><b>High-yield:<\/b> calorigenic effect = ↑ sodium-potassium adenosine triphosphatase synthesis → oxygen consumption ↑ → heat ↑<\/p><p>📍 09-PHYSIO หน้า 17–18<\/p>"}, {"n": 44, "lec": 6, "stem": "<p>Which thyroid hormone receptor isoform is expressed in the <b>hypothalamus and pituitary<\/b>, where it mediates negative feedback?<\/p>", "opts": ["Thyroid hormone receptor alpha-1", "Thyroid hormone receptor beta-1", "Thyroid hormone receptor beta-2", "Retinoid X receptor alone", "Thyroid-stimulating hormone receptor"], "why": ["หัวใจ, กล้ามเนื้อลาย, กระดูก, central nervous system", "ไต, ตับ", "hypothalamus, pituitary (+ retina, cochlea)", "ไม่ใช่ข้อมูลในสไลด์", "เป็น membrane receptor ของ thyroid-stimulating hormone บน follicular cell ไม่ใช่ receptor ของ thyroid hormone"], "ans": 2, "more": "<p><b>High-yield:<\/b> alpha-1 = หัวใจ/กล้ามเนื้อ/กระดูก/สมอง · beta-1 = ตับ/ไต · beta-2 = hypothalamus/pituitary<\/p><p>📍 09-PHYSIO หน้า 15<\/p>"}, {"n": 45, "lec": 6, "stem": "<p>A woman with a known <b>toxic multinodular goitre<\/b> receives iodinated contrast for CT and develops thyrotoxicosis two weeks later. What is this?<\/p>", "opts": ["Wolff-Chaikoff effect", "Jod-Basedow effect", "Sheehan syndrome", "Hashimoto thyroiditis", "Secondary hyperthyroidism"], "why": ["iodine เกิน → <b>กด<\/b> hormone synthesis (ต่อมปกติ)", "iodine เกิน → <b>hyperthyroidism<\/b> ในต่อมที่ autoregulation เสีย (Graves, toxic multinodular goitre, toxic adenoma); แหล่ง iodine: อาหาร, contrast, amiodarone", "pituitary infarction", "autoimmune hypothyroidism", "ต้นเหตุที่ pituitary"], "ans": 1, "more": "<p><b>High-yield:<\/b> ต่อมปกติ + iodine เกิน → Wolff-Chaikoff (ลด) · ต่อมผิดปกติ + iodine เกิน → Jod-Basedow (เพิ่ม)<\/p><p>📍 09-PHYSIO หน้า 8–10<\/p>"}, {"n": 46, "lec": 7, "stem": "<p>Which change <b>increases<\/b> renin release from the juxtaglomerular cells?<\/p>", "opts": ["High sodium delivery to the macula densa", "Rise in afferent arteriolar pressure", "Increased atrial natriuretic peptide", "Increased beta-adrenergic sympathetic activity", "Expansion of plasma volume"], "why": ["sodium ที่ macula densa <b>ต่ำ<\/b> ต่างหากที่กระตุ้น", "perfusion pressure <b>ต่ำ<\/b> ที่กระตุ้น", "atrial natriuretic peptide ยับยั้งระบบนี้", "sympathetic (beta) กระตุ้น juxtaglomerular cells → renin → angiotensin I → (angiotensin-converting enzyme ในปอด) → angiotensin II → aldosterone", "volume มาก → renin ลด"], "ans": 3, "more": "<p><b>Flow:<\/b> volume ↓/pressure ↓/sodium ↓/beta-sympathetic → renin → angiotensin II → aldosterone + vasoconstriction + antidiuretic hormone + thirst<\/p><p>📍 11-PHYSIO หน้า 24–25, 30<\/p>"}, {"n": 47, "lec": 7, "stem": "<p>A woman with Cushing syndrome has thin, easily bruised skin, wide purple striae and proximal muscle wasting. Which cortisol action underlies these three features?<\/p>", "opts": ["Mineralocorticoid-like sodium retention", "Protein catabolism in skin and muscle", "Increased fat deposition in the face and trunk", "Increased gastric acid secretion", "Immunosuppression with reduced interleukins"], "why": ["อธิบาย hypertension/บวม", "cortisol = catabolic ต่อโปรตีน → collagen ในผิวลด (ผิวบาง, หลอดเลือดเปราะ, striae) + กล้ามเนื้อสลาย (proximal weakness)", "อธิบาย moon face, buffalo hump", "อธิบาย peptic ulcer", "อธิบาย infection, delayed wound healing"], "ans": 1, "more": "<p><b>ทำไมตัวลวงหลอก:<\/b> ทุกตัวเลือกเป็นอาการจริงของ Cushing — ต้องจับคู่ \"อาการ ↔ กลไก\" ให้ถูก<\/p><p><b>High-yield:<\/b> Cushing: fat redistribution · protein catabolism · glucose ↑ · bone ↓ · immunity ↓ · blood pressure ↑<\/p><p>📍 11-PHYSIO หน้า 13–14, 20 · 02-HISTO หน้า 35<\/p>"}, {"n": 48, "lec": 7, "stem": "<p>An adrenalectomised animal given no glucocorticoid becomes hypoglycaemic during fasting, even though its glucagon rises normally. Which explanation fits?<\/p>", "opts": ["Glucagon cannot be secreted without cortisol", "Cortisol is needed for insulin secretion", "Cortisol permits hepatic responses to glucagon", "Glucagon is converted to cortisol in the liver", "The animal lacks epinephrine because the medulla is intact"], "why": ["โจทย์บอก glucagon ขึ้นปกติ", "ไม่ใช่", "cortisol permissive: ทำให้ตับตอบสนองต่อ glucagon + catecholamine ได้เต็มที่ (gluconeogenesis) → ขาด cortisol ตับตอบสนองอ่อน → hypoglycaemia", "ไม่ใช่", "ตัดทั้งต่อม medulla ก็ไม่มี; และเหตุผลขัดกันเอง"], "ans": 2, "more": "<p><b>High-yield:<\/b> Addison มี fasting hypoglycaemia แม้ glucagon ปกติ<\/p><p>📍 11-PHYSIO หน้า 14, 21 · 06-PHYSIO หน้า 28<\/p>"}, {"n": 49, "lec": 7, "stem": "<p>Angiotensin II stimulates aldosterone synthesis in zona glomerulosa cells. Which drug class, according to the lecture, would <b>reduce<\/b> aldosterone synthesis by blocking this signalling?<\/p>", "opts": ["Beta-adrenergic agonists", "Calcium channel blockers", "Adrenocorticotropic hormone analogues", "Potassium supplements", "Thyrotropin-releasing hormone analogues"], "why": ["beta agonist เพิ่ม renin → เพิ่ม aldosterone", "angiotensin II (AT1 receptor, phospholipase C → inositol trisphosphate/diacylglycerol) และ potassium สูง → voltage-sensitive calcium channel เปิด → calcium ↑ → calcium-calmodulin kinase → aldosterone synthesis; สไลด์: calcium channel blockers inhibit aldosterone synthesis", "เพิ่ม aldosterone เล็กน้อย", "potassium สูงกระตุ้น", "ไม่เกี่ยว"], "ans": 1, "more": "<p><b>High-yield:<\/b> ตัวกลางร่วมของ angiotensin II และ potassium = intracellular calcium<\/p><p>📍 11-PHYSIO หน้า 26–27<\/p>"}, {"n": 50, "lec": 7, "stem": "<p>A 4-year-old <b>boy<\/b> has pubic hair, a large penis, rapid growth and advanced bone age, but his testes are small for this degree of virilisation. Which mechanism best explains this?<\/p>", "opts": ["True central precocious puberty from early gonadotropin-releasing hormone pulses", "Excess adrenal androgens from 21-hydroxylase deficiency driven by high adrenocorticotropic hormone", "A testosterone-secreting testicular tumour", "Excess growth hormone from a pituitary adenoma", "Low melatonin from pineal calcification"], "why": ["central puberty → luteinizing hormone/follicle-stimulating hormone กระตุ้นอัณฑะ → testes <b>โต<\/b>", "21-hydroxylase deficiency (congenital adrenal hyperplasia) → cortisol ↓ → adrenocorticotropic hormone ↑ → substrate ไป androgen → virilisation แต่อัณฑะเล็ก (ไม่ได้ถูก gonadotropin กระตุ้น) = precocious <b>pseudo<\/b>puberty", "tumour ข้างเดียวจะทำให้อัณฑะข้างนั้นโต (⚠️ textbook consensus)", "ไม่ทำให้ virilisation", "ไม่ใช่"], "ans": 1, "more": "<p><b>กลไกทีละขั้น:<\/b> enzyme ขาด → cortisol ต่ำ → feedback หาย → adrenocorticotropic hormone ↑ → adrenal hyperplasia (fasciculata + reticularis) → androgen ↑ → growth spurt + bone age เร่ง → epiphysis ปิดเร็ว → ผู้ใหญ่เตี้ย<\/p><p><b>High-yield:<\/b> virilisation + อัณฑะเล็ก = androgen จากนอกอัณฑะ (adrenal)<\/p><p>📍 11-PHYSIO หน้า 36 · 04-DEV หน้า 44–45 · 05-BIOCHEM หน้า 61<\/p>"}, {"n": 51, "lec": 7, "stem": "<p>Norepinephrine ใช่"], "ans": 0, "more": "<p><b>กลไก:<\/b> beta cell ใช้ช่อง potassium ในการ depolarize; potassium ต่ำรบกวนกลไกนี้ (⚠️ รายละเอียดเป็น textbook consensus)<\/p><p><b>High-yield:<\/b> insulin กับ potassium สัมพันธ์สองทาง: insulin ดึง potassium เข้าเซลล์ · potassium ต่ำลดการหลั่ง insulin · potassium สูงกระตุ้น insulin<\/p><p>📍 12-PHYSIO หน้า 10, 14<\/p>"}, {"n": 54, "lec": 8, "stem": "<p>During an overnight fast, the liver <b>releases<\/b> glucose into the blood. Which transporter allows glucose to leave hepatocytes?<\/p>", "opts": ["Glucose transporter 1", "Glucose transporter 3", "Glucose transporter 4", "Sodium–glucose cotransporter in the gut", "Glucose transporter 2"], "why": ["red blood cell, blood–brain barrier", "neuron", "กล้ามเนื้อลาย, ไขมัน (insulin-dependent)", "⚠️ ดูดซึมในลำไส้ (textbook consensus) ไม่ใช่ตับ", "glucose transporter 2 อยู่ที่ตับ, ลำไส้, beta cell; ⚠️ เป็น transporter สองทิศ ทำให้ตับปล่อย glucose ได้ (textbook consensus)"], "ans": 4, "more": "<p><b>High-yield:<\/b> glucose transporter 2 = sensor ของ beta cell + ทางเข้าออกของตับ<\/p><p>📍 12-PHYSIO หน้า 7<\/p>"}, {"n": 55, "lec": 8, "stem": "<p>Serum antibodies against insulin and glutamic acid decarboxylase 65 are found in a child whose fasting glucose is still normal. How is this best interpreted?<\/p>", "opts": ["Type 2 diabetes with insulin resistance", "A false-positive result without meaning", "Established type 1 diabetes with total beta-cell loss", "Maturity-onset diabetes of the young", "Beta-cell autoimmunity at a pre-diabetes stage"], "why": ["ไม่มี autoantibody", "สไลด์: จำนวน autoantibody ที่ตรวจพบทำนายโอกาสเป็นเบาหวาน", "glucose ยังปกติ → beta cell ยังเหลือพอ", "monogenic ไม่ใช่ autoimmune", "type 1: autoimmune attack (insulitis) → เริ่มมี antibody ก่อนอาการ; beta-cell mass ลดเหลือ &lt; ครึ่ง = pre-diabetes (post-prandial glucose สูง); อาการชัดเมื่อเหลือน้อยมาก"], "ans": 4, "more": "<p><b>High-yield:<\/b> type 1 = genetic susceptibility (human leukocyte antigen) + environmental trigger (virus, diet, drug) → autoimmunity → antibody → beta cell loss → hyperglycaemia<\/p><p>📍 12-PHYSIO หน้า 19 · 02-HISTO หน้า 14<\/p>"}, {"n": 56, "lec": 8, "stem": "<p>Parathyroid hormone increases osteoclast activity, yet osteoclasts lack parathyroid hormone receptors. How does parathyroid hormone act on them?<\/p>", "opts": ["It binds osteoclasts through the calcium-sensing receptor", "Via osteoblasts, which raise RANKL to activate osteoclasts", "It is converted to calcitonin, which activates osteoclasts", "It stimulates osteoclasts through vitamin D receptors on osteoclasts", "It works only through the kidney, never on bone"], "why": ["calcium-sensing receptor อยู่ที่ chief cell ของ parathyroid", "osteoblast มี receptor ต่อ parathyroid hormone และ vitamin D → เพิ่ม RANKL → จับ RANK บน osteoclast precursor → fusion + activation → bone resorption (ทางอ้อม)", "calcitonin <b>ยับยั้ง<\/b> osteoclast", "osteoclast ขาด receptor ของ vitamin D เช่นกัน", "ออกฤทธิ์ที่กระดูกด้วย"], "ans": 1, "more": "<p><b>High-yield:<\/b> osteoclast มาจาก hematopoietic stem cell (คล้าย monocyte) · osteoblast คุม osteoclast ผ่าน RANKL<\/p><p>📍 10-PHYSIO หน้า 9–10, 15 · 03-HISTO หน้า 15<\/p>"}, {"n": 57, "lec": 8, "stem": "<p>Why does an oral glucose load produce a <b>larger<\/b> insulin response than the same amount of glucose given intravenously?<\/p>", "opts": ["Oral glucose bypasses the liver", "Gut incretin hormones stimulate beta cells", "Intravenous glucose stimulates somatostatin only", "Oral glucose is absorbed more slowly, giving higher peaks", "Intravenous glucose enters beta cells without glucose transporter 2"], "why": ["ทางปากต้องผ่าน portal vein ถึงตับก่อน", "incretin effect: glucose-dependent insulinotropic peptide + glucagon-like peptide 1 จากลำไส้กระตุ้น beta cell ให้หลั่ง insulin เพิ่ม (⚠️ คำว่า incretin effect เป็น textbook consensus สไลด์ระบุบทบาท hormone)", "ไม่ใช่", "ช้ากว่าไม่ทำให้ peak สูงกว่า", "ไม่จริง"], "ans": 1, "more": "<p><b>High-yield:<\/b> gastrointestinal of Langerhans", "key": "ต่อมผสม exocrine + endocrine"}, {"id": "S11", "see": "เซลล์เล็กซีดอยู่ตรงกลางกลุ่มเซลล์ pyramidal", "ans": "Centroacinar cell", "key": "จำเพาะตับอ่อน"}, {"id": "S12", "see": "เนื้อเยื่อในสมองแนวกลาง เซลล์ nucleus กลมใหญ่ nucleolus ชัด", "ans": "Pinealocyte", "key": "melatonin"}, {"id": "S13", "see": "ก้อน calcified ม่วงเป็นชั้น ๆ ในเนื้อเยื่อเดียวกับ S12", "ans": "Corpora arenacea", "key": "เพิ่มตามอายุ; radiological landmark"}, {"id": "S14", "see": "cords เซลล์ basophilic ลูกบาศก์ เรียงตามแนวก้านเนื้อเยื่อประสาท", "ans": "Pars tuberalis", "key": "หุ้ม infundibular stalk"}, {"id": "S15", "see": "ถุงบรรจุสารชมพู อยู่ระหว่างส่วนติดสีเข้มกับส่วนติดสีจางของต่อมเดียวกัน", "ans": "Rathke's cyst (pars intermedia)", "key": "เศษ lumen ของ Rathke pouch"}], "gl": [["ACTH", "Adrenocorticotropic hormone"], ["ADH / AVP", "Antidiuretic hormone / Arginine vasopressin"], ["CRH · TRH · GnRH · GHRH", "Corticotropin- · Thyrotropin- · Gonadotropin- · Growth hormone-releasing hormone"], ["GHIH / SRIF", "Growth hormone-inhibiting hormone (somatostatin)"], ["PIH / PIF", "Prolactin-inhibiting hormone/factor (dopamine)"], ["GH · PRL · TSH · FSH · LH · MSH", "Growth hormone · Prolactin · Thyroid-stimulating · Follicle-stimulating · Luteinizing · Melanocyte-stimulating hormone"], ["IGF-1", "Insulin-like growth factor 1"], ["T3 · T4 · rT3", "Triiodothyronine · Thyroxine · Reverse triiodothyronine"], ["TBG · TPO · TSI", "Thyroxine-binding globulin · Thyroid peroxidase · Thyroid-stimulating immunoglobulin"], ["MIT · DIT", "Monoiodotyrosine · Diiodotyrosine"], ["PTH · CaSR", "Parathyroid hormone · Calcium-sensing receptor"], ["DHEA(-S)", "Dehydroepiandrosterone (sulfate)"], ["PNMT", "Phenylethanolamine-N-methyltransferase"], ["POMC", "Pro-opiomelanocortin"], ["CBG", "Cortisol-binding globulin"], ["RAAS", "Renin–angiotensin–aldosterone system"], ["ANP", "Atrial natriuretic peptide"], ["GLUT", "Glucose transporter"], ["GLP-1 · GIP", "Glucagon-like peptide 1 · Glucose-dependent insulinotropic peptide"], ["DKA · HHS", "Diabetic ketoacidosis · Hyperosmolar hyperglycaemic state"], ["SIADH · DI", "Syndrome of inappropriate antidiuretic hormone secretion · Diabetes insipidus"], ["cAMP · cGMP · IP3 · DAG · PKA · JAK", "Cyclic adenosine/guanosine monophosphate · Inositol trisphosphate · Diacylglycerol · Protein kinase A · Janus kinase"], ["RLN · SLN", "Recurrent laryngeal nerve · Superior laryngeal nerve"], ["IVC", "Inferior vena cava"], ["CAH", "Congenital adrenal hyperplasia"]]};
const KEY='endo-exam1-set4-v1';
const blank=()=>({pick:{},order:{},spent:{}});
let S=blank();
try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuffle=()=>{D.qs.forEach(q=>{const a=[0,1,2,3,4];for(let i=4;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}S.order[q.n]=a})};
if(!Object.keys(S.order).length){shuffle();save()}
let mode='mcq',lec=-1,wrongOnly=false,cur=0,shownN=null,shownAt=0;
const $=id=>document.getElementById(id);
const L='ABCDE';
const done=q=>S.pick[q.n]!==undefined;
const fmt=ms=>{const s=Math.round(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const list=()=>D.qs.filter(q=>(lec<0||q.lec===lec)&&(!wrongOnly||(done(q)&&S.pick[q.n]!==q.ans)));

// time counts only while an unanswered question is on screen
function flush(){if(shownN!==null){S.spent[shownN]=(S.spent[shownN]||0)+(Date.now()-shownAt);shownN=null;save()}}
function track(q){flush();if(q&&!done(q)&&mode==='mcq'&&!document.hidden){shownN=q.n;shownAt=Date.now()}}
const live=n=>(S.spent[n]||0)+(shownN===n?Date.now()-shownAt:0);
const total=()=>D.qs.reduce((a,q)=>a+live(q.n),0);
function tick(){
  if(mode!=='mcq')return;
  const q=list()[cur];const t=q?live(q.n):0;
  $('timer').innerHTML=`รวม <b>${fmt(total())}</b> · ข้อนี้ <b class="${t>90000?'slow':''}">${fmt(t)}</b>`;
}
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else if(mode==='mcq')track(list()[cur])});

function score(){
  const by=D.lec.map(()=>[0,0]);let r=0,t=0;
  D.qs.forEach(q=>{const p=S.pick[q.n];if(p===undefined)return;t++;by[q.lec][1]++;if(p===q.ans){r++;by[q.lec][0]++}});
  return {r,t,by};
}
function chips(){
  const s=score();
  $('chips').innerHTML=[['ทั้งหมด',-1,`${s.r}/${s.t}`],...D.lec.map((n,i)=>[n,i,s.by[i][1]?`${s.by[i][0]}/${s.by[i][1]}`:''])]
    .map(([n,i,c])=>`<button class="chip" data-lec="${i}" aria-pressed="${lec===i}">${n}<small>${c}</small></button>`).join('');
  $('score').innerHTML=`ทำแล้ว <b>${s.t}</b>/63 · ถูก <b>${s.r}</b>${s.t?` · ${Math.round(s.r/s.t*100)}%`:''}`;
}
function qHTML(q){
  const p=S.pick[q.n],d=p!==undefined,ord=S.order[q.n];
  const opts=ord.map((o,i)=>{
    const cls=d?(o===q.ans?'right':o===p?'wrong':''):'';
    return `<button class="opt ${cls}" data-q="${q.n}" data-o="${o}" ${d?'disabled':''}><span class="k">${L[i]}</span><span>${q.opts[o]}</span>${d?`<span class="why">${q.why[o]}</span>`:''}</button>`}).join('');
  const v=d?`<div class="verdict ${p===q.ans?'ok':'no'}">${p===q.ans?'ถูก':'ผิด'} · เฉลย ${L[ord.indexOf(q.ans)]} · ใช้เวลา ${fmt(S.spent[q.n]||0)}</div><div class="more">${q.more}</div>`:'';
  return `<article class="q" id="q${q.n}"><div class="qh"><span class="qn">ข้อ ${q.n}</span><span class="mono lec">${D.lec[q.lec]}</span></div>${q.stem}<div class="opts">${opts}</div>${v}</article>`;
}
function mcq(){
  const ls=list();
  if(!ls.length){track(null);return '<div class="empty">ไม่มีข้อที่ตอบผิดในหมวดนี้</div><div class="nav"><button class="btn" data-act="allq">กลับไปดูทุกข้อ</button></div>'}
  cur=Math.min(cur,ls.length-1);
  const q=ls[cur];track(q);
  const left=D.qs.filter(x=>!done(x)).length;
  const last=cur===ls.length-1;
  const dots=ls.map((x,i)=>`<button class="dot ${done(x)?(S.pick[x.n]===x.ans?'ok':'no'):''} ${i===cur?'cur':''}" data-go="${i}" aria-label="ข้อ ${x.n}">${x.n}</button>`).join('');
  return `${qHTML(q)}
  <div class="nav"><button class="btn" data-act="prev" ${cur?'':'disabled'}>← ก่อนหน้า</button>
  <span class="pos">${cur+1} / ${ls.length}${wrongOnly?' · ทวนข้อผิด':''}</span>
  ${last?`<button class="btn primary" data-mode="sum">ดูสรุปผล</button>`:`<button class="btn ${done(q)?'primary':''}" data-act="next">${done(q)?'ถัดไป →':'ข้าม →'}</button>`}</div>
  <div class="dots">${dots}</div>
  <div class="row tools"><span class="score">เหลือ ${left} ข้อ · กด 1–5 หรือ A–E เพื่อตอบ · ← → เปลี่ยนข้อ</span>
  <span class="row"><button class="btn" data-act="wrong" aria-pressed="${wrongOnly}">${wrongOnly?'แสดงทุกข้อ':'ทวนเฉพาะข้อผิด'}</button><button class="btn" data-act="reset">เริ่มใหม่</button></span></div>`;
}
function summary(){
  flush();
  const s=score(),ans=D.qs.filter(done),tt=total();
  const wrong=ans.filter(q=>S.pick[q.n]!==q.ans);
  const rows=D.lec.map((n,i)=>{const [r,t]=s.by[i];const all=D.qs.filter(q=>q.lec===i).length;
    return `<tr><td>${n}</td><td style="white-space:nowrap">${r}/${t}<small> จาก ${all}</small></td><td>${t?Math.round(r/t*100)+'%':'–'}</td><td><div class="bar"><i style="width:${t?r/t*100:0}%"></i></div></td></tr>`}).join('');
  const wl=wrong.map(q=>{const o=S.order[q.n],p=S.pick[q.n];
    return `<div class="wr"><div class="qh"><span class="qn">ข้อ ${q.n}</span><span class="mono lec">${D.lec[q.lec]} · ${fmt(S.spent[q.n]||0)}</span></div>${q.stem}
    <div class="you"><small>คุณตอบ ${L[o.indexOf(p)]}</small><br>${q.opts[p]}<br><small>${q.why[p]}</small></div>
    <div class="cor"><small>เฉลย ${L[o.indexOf(q.ans)]}</small><br>${q.opts[q.ans]}<br><small>${q.why[q.ans]}</small></div>
    <button class="btn" data-jump="${q.n}">เปิดข้อนี้ + คำอธิบายเต็ม</button></div>`}).join('');
  return `<section class="card sum"><h2>สรุปผล</h2>
  <div class="stats"><div><b>${s.r}/${s.t}</b><span>ถูก / ทำแล้ว (จาก 63)</span></div>
  <div><b>${s.t?Math.round(s.r/s.t*100):0}%</b><span>ความแม่น</span></div>
  <div><b>${fmt(tt)}</b><span>เวลารวม</span></div>
  <div><b>${ans.length?fmt(tt/ans.length):'0:00'}</b><span>เฉลี่ยต่อข้อ (เป้า 1:30)</span></div></div>
  <div class="tw"><table><thead><tr><th>หมวด</th><th>ถูก/ทำ</th><th>%</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="card sum"><h2>ข้อที่ผิด (${wrong.length})</h2>${wl||'<p class="empty">ยังไม่มีข้อที่ผิด</p>'}
  ${wrong.length?'<div class="nav"><button class="btn primary" data-act="drill">ทำซ้ำเฉพาะข้อที่ผิด</button></div>':''}</section>`;
}
function render(){
  $('mcqbar').hidden=mode!=='mcq';
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  if(mode==='mcq'){chips();$('main').innerHTML=mcq();tick()}
  else{track(null);
    if(mode==='sum')$('main').innerHTML=summary();
    else if(mode==='saq')$('main').innerHTML='<div class="note">ข้อสอบจริงใช้รูป slide · ที่นี่ฝึกจากคำบรรยาย: อ่านสิ่งที่เห็น → ตอบในใจ → แตะเพื่อดูเฉลย</div>'+
      D.saq.map(s=>`<details class="card"><summary><span class="mono lec">${s.id}</span> ${s.see}</summary><div class="a"><b>${s.ans}</b><br>${s.key}</div></details>`).join('');
    else $('main').innerHTML=`<div class="card"><div class="tw"><table><thead><tr><th>ตัวย่อ</th><th>ชื่อเต็ม</th></tr></thead><tbody>${D.gl.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
}
const go=i=>{cur=i;render();scrollTo(0,0)};
function pick(n,o){if(S.pick[n]!==undefined)return;flush();S.pick[n]=o;save();render()}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.disabled)return;
  const a=t.dataset.act;
  if(t.dataset.mode){mode=t.dataset.mode;render();scrollTo(0,0)}
  else if(t.dataset.lec!==undefined){lec=+t.dataset.lec;go(0)}
  else if(t.dataset.go!==undefined)go(+t.dataset.go);
  else if(t.dataset.q)pick(+t.dataset.q,+t.dataset.o);
  else if(t.dataset.jump){mode='mcq';lec=-1;wrongOnly=false;go(D.qs.findIndex(q=>q.n===+t.dataset.jump))}
  else if(a==='prev')go(cur-1);
  else if(a==='next')go(cur+1);
  else if(a==='wrong'){wrongOnly=!wrongOnly;go(0)}
  else if(a==='allq'){wrongOnly=false;go(0)}
  else if(a==='drill'){mode='mcq';lec=-1;wrongOnly=true;go(0)}
  else if(a==='reset'){
    if(t.dataset.sure){shownN=null;S=blank();shuffle();save();wrongOnly=false;lec=-1;go(0)}
    else{t.dataset.sure=1;t.textContent='ยืนยันล้างคำตอบ + เวลา?';setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent='เริ่มใหม่'}},3000)}
  }
});
document.addEventListener('keydown',e=>{
  if(mode!=='mcq'||e.metaKey||e.ctrlKey||e.altKey)return;
  const ls=list(),q=ls[cur];if(!q)return;
  const k=e.key.toUpperCase(),i='12345'.indexOf(k)>=0?'12345'.indexOf(k):L.indexOf(k);
  if(i>=0&&k.length===1)pick(q.n,S.order[q.n][i]);
  else if(e.key==='ArrowRight'&&cur<ls.length-1)go(cur+1);
  else if(e.key==='ArrowLeft'&&cur>0)go(cur-1);
});
render();
</script>
