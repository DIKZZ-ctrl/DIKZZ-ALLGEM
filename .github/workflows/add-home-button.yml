name: Add home button

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - ".github/scripts/add_home_button.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-home-button
  cancel-in-progress: false

jobs:
  add-button:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Insert home button
        run: python .github/scripts/add_home_button.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "chore: auto-add home button [skip ci]"
          git push
