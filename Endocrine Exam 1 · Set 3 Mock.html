<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
:root{
  --bg:#f5f3f8;--surface:#fff;--ink:#1e1b2e;--muted:#67627c;--line:#e2deec;
  --hema:#34306b;--hema-soft:#ebe9f7;--eosin:#c23d69;--eosin-soft:#fbe8ef;
  --good:#1d7f53;--good-soft:#e3f4ec;--bad:#b83227;--bad-soft:#fbe7e5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#14121d;--surface:#1d1a29;--ink:#ece9f4;--muted:#a19cb5;--line:#302c42;
  --hema:#aea7f2;--hema-soft:#282443;--eosin:#f07ea4;--eosin-soft:#3a1e2b;
  --good:#5fd09a;--good-soft:#16301f;--bad:#f08a80;--bad-soft:#3a1c1a;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#14121d;--surface:#1d1a29;--ink:#ece9f4;--muted:#a19cb5;--line:#302c42;
  --hema:#aea7f2;--hema-soft:#282443;--eosin:#f07ea4;--eosin-soft:#3a1e2b;
  --good:#5fd09a;--good-soft:#16301f;--bad:#f08a80;--bad-soft:#3a1c1a;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:820px;margin:0 auto}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;text-wrap:balance}
h1 span{color:var(--eosin)}
.sub{color:var(--muted);font-size:13px;margin:2px 0 8px}
@media (max-width:560px){.sub{display:none}h1{font-size:19px;margin-bottom:8px}}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
.tab,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.tab[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--bg)}
.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{white-space:nowrap;flex:none}
.chip small{opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.tools{margin-top:8px;justify-content:space-between}
.btn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;font-size:13px}
.score{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.score b{color:var(--ink)}
main{display:grid;gap:14px;margin-top:16px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.qh{display:flex;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.qn{font-weight:700;color:var(--hema)}
.lec{color:var(--eosin)}
.q p{margin:0 0 8px}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 10px}
.opt:hover:not(:disabled){border-color:var(--hema);background:var(--hema-soft)}
.opt:disabled{cursor:default}
.opt .k{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--muted)}
.opt .why{grid-column:2;font-size:13.5px;color:var(--muted);margin-top:4px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{color:var(--bad)}
.verdict{font-weight:600;margin:10px 0 4px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.more{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:14px}
.more p:last-child{color:var(--muted);font-size:13px}
.tw{overflow-x:auto;margin:6px 0 10px}
table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
th{background:var(--hema-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .see{margin:4px 0 8px}
.card .a{border-left:3px solid var(--eosin);padding-left:10px}
.empty{color:var(--muted);text-align:center;padding:32px}
.note{background:var(--eosin-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .15s,border-color .15s}}
.timer{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.timer b{color:var(--ink);font-weight:500}
.timer .slow{color:var(--bad)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.nav .btn{padding:8px 14px;font-size:14px}
.nav .btn.primary{background:var(--hema);border-color:var(--hema);color:var(--bg)}
.pos{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-variant-numeric:tabular-nums;padding:0}
.dot.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dot.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot.cur{outline:2px solid var(--hema);outline-offset:1px}
.sum h2{font-size:17px;margin:0 0 8px}
.stats{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:6px}
.stats div{display:grid}
.stats b{font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.wr{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.wr .you{border-left:3px solid var(--bad);padding-left:10px;margin:6px 0}
.wr .cor{border-left:3px solid var(--good);padding-left:10px;margin:6px 0}
.wr small{color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--hema)}
</style>

<script>
const D={"lec": ["Lec 1 Anatomy", "Lec 2 Histology", "Lec 3 Embryology", "Lec 4 Biochemistry", "Lec 5 Control of secretion", "Lec 6 Hypothalamus–pituitary", "Lec 7 Growth · Thyroid", "Lec 8 Adrenal", "Lec 9 Pancreas · Other", "Lec 10 Aging"], "qs": [{"n": 1, "lec": 0, "stem": "<p>A 14-year-old boy has headache, vomiting and <b>inability to look upward<\/b>. His pupils react poorly to light but constrict normally on near vision. MRI shows a 2-cm mass arising from the midline structure attached to the roof of the third ventricle, with dilated lateral and third ventricles but a normal fourth ventricle. Which pair of structures is compressed?<\/p>", "opts": ["Tectum/posterior commissure and the cerebral aqueduct", "Optic chiasm and the pituitary stalk", "Cavernous sinus and the abducent nerve", "Mammillary bodies and the fornix", "Interventricular foramen and the septum pellucidum"], "why": ["ก้อน pineal อยู่เหนือ tectum (superior colliculi) และ posterior commissure ซึ่งเป็นทางของ vertical gaze → เสีย upward gaze + light–near dissociation (Parinaud syndrome); ด้านล่างหน้าเป็น cerebral aqueduct ซึ่งแคบที่สุดใน ventricular system → กดแล้ว lateral + third ventricle โต แต่ fourth ventricle ปกติ = obstructive hydrocephalus", "optic chiasm อยู่หน้าเหนือ sella ห่างจาก pineal มาก; ถ้าโดนกดจะเป็น bitemporal hemianopia ไม่ใช่ upward gaze palsy", "cavernous sinus อยู่ข้าง sella; abducent nerve palsy = มองออกด้านข้างไม่ได้ ไม่ใช่มองขึ้น", "mammillary bodies อยู่ floor ของ third ventricle ไม่ใช่ roof; ไม่ทำให้ gaze palsy", "ถ้าอุด interventricular foramen → lateral ventricle โต แต่ third ventricle <b>ไม่<\/b> โต (โจทย์บอก third ventricle โต)"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> pineal mass → (1) กด posterior commissure/tectum → vertical gaze pathway เสีย → Parinaud syndrome · (2) กด cerebral aqueduct → cerebrospinal fluid ไหลจาก third ไป fourth ventricle ไม่ได้ → ventricle เหนือจุดอุดโต → intracranial pressure สูง → ปวดหัว อาเจียน<\/p><p><b>ทำไมตัวลวงหลอก:<\/b> ใช้ \"ventricle ไหนโต\" บอกระดับการอุดได้ — third โต แต่ fourth ปกติ = อุดที่ aqueduct พอดี<\/p><p><b>High-yield:<\/b> pineal tumour = Parinaud syndrome + obstructive hydrocephalus; precocious puberty เกิดเฉพาะเมื่อก้อนทำลาย hypothalamus ร่วมด้วย<\/p><p>📍 01-ANAT หน้า 13–15 · 03-HISTO หน้า 11<\/p>"}, {"n": 2, "lec": 0, "stem": "<p>A 38-year-old woman with a slowly enlarging non-functioning pituitary macroadenoma growing <b>upward<\/b> in the midline notices she bumps into door frames. Which visual field defect is most likely to appear <b>first<\/b>?<\/p>", "opts": ["Loss of the upper temporal quadrants of both eyes", "Loss of the lower temporal quadrants of both eyes", "Loss of the nasal fields of both eyes", "Complete blindness of one eye", "Loss of the right half of the visual field of both eyes"], "why": ["ก้อนดันขึ้นจาก<b>ใต้<\/b> chiasm → โดน decussating nasal fibres ส่วนล่าง (inferonasal) ก่อน → fibres ล่างรับภาพลานสายตาส่วน<b>บน<\/b> → upper temporal quadrant หายก่อน แล้วค่อยลามเป็น bitemporal hemianopia เต็ม", "จะเกิดก่อนถ้าก้อนกดจาก<b>บน<\/b>ลงมา (⚠️ เช่นก้อนเหนือ chiasm — textbook consensus)", "nasal field มาจาก temporal retina ซึ่ง fibres ไม่ไขว้ อยู่ด้านข้าง chiasm → ไม่โดนก่อน", "ต้องโดน optic nerve ข้างเดียว (หน้า chiasm)", "homonymous hemianopia = รอยโรคหลัง chiasm (optic tract)"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> nasal retina รับภาพ temporal field → fibres ไขว้ตรงกลาง chiasm → chiasm นั่งบน diaphragma sellae แนวกลาง → ก้อนโตขึ้นแนวกลางชน fibres ที่ไขว้ก่อน → ด้านล่างของ chiasm โดนก่อน → ภาพบนหาย (ภาพกลับหัวบน retina)<\/p><p><b>ทำไมตัวลวงหลอก:<\/b> จำแค่ \"bitemporal\" แต่ลืมว่าเริ่มจาก quadrant ไหน — ใต้กด = ภาพบนหาย<\/p><p><b>High-yield:<\/b> pituitary adenoma → bitemporal hemianopia เริ่มที่ <b>upper<\/b> quadrants; ผู้ป่วยชนของด้านข้าง<\/p><p>📍 01-ANAT หน้า 25<\/p>"}, {"n": 3, "lec": 0, "stem": "<p>After total thyroidectomy for a large goitre, a patient develops <b>inspiratory stridor and respiratory distress<\/b> in the recovery room. Her voice is weak but not hoarse. Laryngoscopy shows both vocal folds lying close to the midline and not moving. What is the most likely cause and immediate implication?<\/p>", "opts": ["Bilateral recurrent laryngeal nerve injury; the airway may need tracheostomy", "Bilateral external superior laryngeal nerve injury; voice rest is enough", "Unilateral recurrent laryngeal nerve injury; no airway risk", "Hypocalcaemic laryngeal tetany from parathyroid removal on day 3", "Injury to the internal branch of the superior laryngeal nerve; aspiration only"], "why": ["recurrent laryngeal nerve เลี้ยงทุก intrinsic muscle ยกเว้น cricothyroid (รวม posterior cricoarytenoid ซึ่งเป็นตัวเดียวที่ abduct) → เสียทั้งสองข้าง → folds ค้างใกล้ midline → อุดทางหายใจ → ภาวะฉุกเฉิน อาจต้อง tracheostomy", "external branch เสีย → เสียงสูงหาย ไม่มี airway risk (ตารางในสไลด์ระบุ \"No\")", "ข้างเดียว → เสียงแหบ fold อีกข้างยังเปิดทางได้ ไม่ทำ stridor รุนแรง", "laryngeal tetany จาก hypocalcaemia เกิดได้จริง แต่โจทย์เกิด<b>ทันทีในห้องพักฟื้น<\/b>; calcium ลดต้องใช้เวลา และ folds จะเป็น spasm ไม่ใช่นิ่งอัมพาต", "internal branch = sensory เหนือ fold (⚠️ textbook consensus)"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> ผ่าตัดใกล้ ligament of Berry/inferior thyroid artery ทั้งสองข้าง → recurrent laryngeal nerve ทั้งสองข้างเสีย → ไม่มีกล้ามเนื้อ abduct → folds อยู่ตำแหน่ง paramedian → ช่อง glottis แคบ → inspiratory stridor<\/p><p><b>ทำไมตัวลวงหลอก:<\/b> \"แหบ\" เป็นอาการข้างเดียว; ทั้งสองข้างเสียงอาจไม่แหบมากเพราะ folds ชิดกัน แต่หายใจไม่ได้<\/p><p><b>High-yield:<\/b> bilateral recurrent laryngeal nerve injury = surgical emergency → จึงต้องตรวจ vocal fold ก่อนและหลังผ่าตัดเสมอ<\/p><p>📍 01-ANAT หน้า 33, 35<\/p>"}, {"n": 4, "lec": 0, "stem": "<p>A 60-year-old woman has a large multinodular goitre. She is euthyroid but complains of breathlessness when lying flat. Why does an enlarging thyroid compress the trachea instead of simply bulging forward?<\/p>", "opts": ["It lies in the visceral compartment bounded by pretracheal fascia, strap muscles and the cervical vertebrae, so growth is directed inward", "The thyroid is attached to the hyoid bone by the thyroglossal duct in all adults", "The trachea has no cartilage at the level of the isthmus", "The recurrent laryngeal nerve pulls the gland backward", "The thyroid lies behind the oesophagus"], "why": ["ต่อมถูกหุ้มด้วย pretracheal fascia (false capsule) ที่ยึดกับ trachea/larynx อยู่ใน visceral compartment ร่วม pharynx, trachea, oesophagus และมี strap muscles อยู่หน้า → ขยายได้น้อย → ดันเข้าในกดโครงสร้างที่ห่ออยู่", "thyroglossal duct สลายไปแล้ว; ที่ติด hyoid คือ pyramidal lobe ใน ~50% เท่านั้น", "trachea มี cartilage ring ทุกระดับ (isthmus อยู่หน้า ring 2–3)", "nerve ไม่ได้ดึงต่อม", "thyroid อยู่<b>หน้า<\/b>และข้าง trachea; oesophagus อยู่หลัง trachea"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> goitre โต → fascial sleeve จำกัดทิศ → กด trachea (หายใจลำบาก โดยเฉพาะท่านอน) ± oesophagus (กลืนลำบาก)<\/p><p><b>ทำไมตัวลวงหลอก:<\/b> สไลด์เน้นว่า \"ที่ต้องรู้คือ compartment ไม่ใช่ endocrinology\" — ต่อมโตไม่ได้แปลว่า hyper/hypo<\/p><p><b>High-yield:<\/b> multinodular goitre ส่วนใหญ่ euthyroid; ผ่าเมื่อก้อนทำให้หายใจลำบาก<\/p><p>📍 01-ANAT หน้า 29, 37<\/p>"}, {"n": 5, "lec": 0, "stem": "<p>A 45-year-old man has papillary thyroid carcinoma confined to the right lobe. Before surgery, the surgeon examines the neck for nodal spread. Along which groups of nodes should the surgeon expect the first metastases?<\/p>", "opts": ["Paratracheal nodes and deep cervical nodes along the internal jugular vein", "Submental nodes only", "Axillary nodes", "Occipital nodes", "Para-aortic nodes in the abdomen"], "why": ["lymph ของ thyroid ไป paratracheal nodes (ข้าง trachea) และ deep cervical nodes (ใต้ omohyoid ตามแนว internal jugular vein) → เป็นจุดที่ต้องตรวจ/เลาะ", "ระบายคางและพื้นปาก", "ระบาย upper limb, breast", "ระบายหนังศีรษะด้านหลัง", "ระบาย retroperitoneal organs"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> lymph ตามเส้นเลือดดำ: superior/middle thyroid vein → internal jugular vein → deep cervical nodes ตามแนวเดียวกัน; ส่วน paratracheal nodes รับจากด้านใน<\/p><p><b>High-yield:<\/b> รูปแบบ lymphatic drainage ทำนายตำแหน่ง nodal metastasis → บอกว่า surgeon ต้องดูที่ไหน<\/p><p>📍 01-ANAT หน้า 32<\/p>"}, {"n": 6, "lec": 0, "stem": "<p>A patient develops hyperglycaemia within <b>seconds<\/b> of an acute fright, before any change in plasma cortisol. Through which route does the hypothalamus most directly influence the pancreatic islets?<\/p>", "opts": ["Autonomic (sympathetic) nerves that bypass the pituitary", "Releasing hormones carried by the hypophyseal portal veins", "Axons of the hypothalamo-hypophyseal tract ending in the posterior pituitary", "Adrenocorticotropic hormone from the anterior pituitary", "Growth hormone from somatotrophs"], "why": ["route 3 ของ hypothalamus: autonomic nervous system → adrenal medulla + pancreatic islets โดยไม่ผ่าน pituitary → เร็วระดับวินาที (catecholamine: glucagon ↑, insulin ↓, glycogenolysis ↑)", "route 2 (vascular) → anterior pituitary → ช้ากว่า และไม่คุม islet ตรง", "route 1 (neural) → antidiuretic hormone, oxytocin", "ต้องผ่าน cortisol ซึ่งโจทย์บอกยังไม่เปลี่ยน (ช้าเป็นนาที–ชั่วโมง)", "ช้า และเป็น anti-insulin แบบ chronic"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> stressor → hypothalamus → sympathetic outflow → (a) adrenal medulla ปล่อย epinephrine (b) islet: alpha cell ↑ glucagon, beta cell ↓ insulin (alpha-adrenergic) → glucose ↑ ภายในวินาที<\/p><p><b>High-yield:<\/b> 3 routes ออกจาก hypothalamus: neural (posterior pituitary) · vascular (anterior pituitary) · autonomic (adrenal medulla + islets)<\/p><p>📍 01-ANAT หน้า 3, 11 · 05-BIOCHEM หน้า 64<\/p>"}, {"n": 7, "lec": 0, "stem": "<p>A 58-year-old man with carcinoma of the <b>head of the pancreas<\/b> undergoes surgery. The surgeon explains that the duodenum must be removed together with the pancreatic head. Which anatomical fact best explains this?<\/p>", "opts": ["The head and duodenum share the pancreaticoduodenal arterial arcades from both the coeliac trunk and the superior mesenteric artery", "The duodenum receives blood only from the splenic artery", "The pancreatic tail is fused to the duodenum", "The head is intraperitoneal and hangs from the duodenum", "The accessory duct is the only drainage of the duodenum"], "why": ["coeliac trunk → gastroduodenal → superior pancreaticoduodenal arteries; superior mesenteric artery → inferior pancreaticoduodenal artery → ต่อกันเป็น arcade เลี้ยงทั้ง head และ duodenum → ตัด head แล้ว duodenum ขาดเลือด → ต้องตัดคู่ (pancreaticoduodenectomy)", "splenic artery เลี้ยง body/tail", "tail อยู่ใกล้ spleen", "head เป็น retroperitoneal ใน C-loop", "ไม่ใช่เหตุผล"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> เลือดจาก 2 parent vessels (foregut: coeliac + midgut: superior mesenteric artery) = หลักฐาน foregut–midgut origin → arcade ร่วม → แยกกันไม่ได้<\/p><p><b>High-yield:<\/b> หัวตับอ่อนแยกจาก duodenum ไม่ได้ทั้งเส้นเลือดและท่อ (bile duct ผ่าน head)<\/p><p>📍 01-ANAT หน้า 52, 54<\/p>"}, {"n": 8, "lec": 0, "stem": "<p>A 50-year-old man undergoes a right radical <b>nephrectomy<\/b>. Post-operatively his cortisol and aldosterone are normal and imaging shows the right adrenal gland still in place. Which anatomical feature made this possible?<\/p>", "opts": ["The adrenal gland lies in its own fascial compartment, separated from the kidney by a thin septum within the renal fascia", "The adrenal gland lies inside the peritoneal cavity", "The adrenal gland receives no blood from the renal artery", "The adrenal gland lies below the kidney", "The adrenal gland is attached to the liver, not the kidney"], "why": ["adrenal และ kidney อยู่ใน renal fascia เดียวกันแต่มี septum บางกั้นเป็นคนละ compartment → เอาไตออกได้โดยเหลือต่อม; ไตที่ปลูกถ่ายก็ไม่มี adrenal ติดมา", "retroperitoneal", "inferior suprarenal arteries มาจาก renal artery (แต่มีอีก 2 แหล่ง)", "อยู่ที่ <b>superior pole<\/b>", "ต่อมขวาสัมพันธ์ด้านหน้ากับตับ แต่ไม่ได้ยึดติด"], "ans": 0, "more": "<p><b>ทำไมตัวลวงหลอก:<\/b> ตัวเลือก 3 ดูเกี่ยว — จริงอยู่ที่ต่อมเสีย inferior suprarenal artery ไปเมื่อตัด renal artery แต่ยังมี superior (inferior phrenic) + middle (aorta) เลี้ยง<\/p><p><b>High-yield:<\/b> 3 arteries in / 1 vein out; fascial septum แยก adrenal จากไต<\/p><p>📍 01-ANAT หน้า 43, 45<\/p>"}, {"n": 9, "lec": 0, "stem": "<p>A 35-year-old woman has paroxysmal hypertension, palpitations and sweating with high urinary catecholamine metabolites. Both adrenal glands are normal on imaging; a 3-cm mass lies <b>beside the abdominal aorta<\/b>. What developmental explanation best fits?<\/p>", "opts": ["Neural crest–derived chromaffin tissue left along the sympathetic migration path (extra-adrenal paraganglioma)", "Ectopic adrenal cortex from mesoderm secreting catecholamines", "Ectopic pancreatic tissue secreting insulin", "Persistence of the thyroglossal duct", "Ectopic parathyroid tissue in the retroperitoneum"], "why": ["medulla = neural crest ที่ migrate ไปเป็น sympathetic ganglion ดัดแปลง → เนื้อเยื่อ chromaffin อาจค้างตามทางใกล้ aorta → เนื้องอกหลั่ง catecholamine ได้นอก adrenal", "cortex สร้าง steroid ไม่ใช่ catecholamine", "insulin → hypoglycaemia ไม่ใช่ hypertension episodes", "อยู่คอแนวกลาง", "parathyroid hormone → hypercalcaemia"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> neural crest migration ผิดที่ → chromaffin tissue นอกต่อม → เนื้องอก → catecholamine ไม่มี downstream regulation → ความดันสูงเป็นพัก ๆ<\/p><p><b>High-yield:<\/b> abnormal migration อธิบาย: lingual thyroid · parathyroid ectopia · extra-adrenal paraganglioma<\/p><p>📍 01-ANAT หน้า 47, 55 · 04-DEV หน้า 41–42<\/p>"}, {"n": 10, "lec": 1, "stem": "<p>In a sagittal section of the pituitary, a thin zone <b>between<\/b> the anterior and posterior lobes contains several colloid-filled cysts lined by cuboidal cells, with a few basophilic cells around them. What is this zone and what do the cysts represent?<\/p>", "opts": ["Pars intermedia; remnants of the lumen of Rathke pouch", "Pars tuberalis; dilated portal capillaries", "Pars nervosa; Herring bodies", "Pars distalis; degenerating acidophils", "Median eminence; ependymal cysts"], "why": ["pars intermedia อยู่ระหว่าง pars distalis กับ pars nervosa; มี colloid cyst (Rathke's cysts) = เศษ lumen ของ Rathke pouch; basophilic cells ในสัตว์สร้าง melanocyte-stimulating hormone ในคนหน้าที่ไม่ชัด", "pars tuberalis หุ้มรอบ <b>stalk<\/b> เป็น cords basophilic ไม่ใช่ถุง colloid", "Herring bodies = ปลาย axon โป่ง ไม่มี epithelium บุ", "pars distalis เป็น cords เซลล์ + sinusoid ไม่ใช่ cyst", "median eminence อยู่ที่ hypothalamus"], "ans": 0, "more": "<p><b>กลไกทีละขั้น (embryology → histology):<\/b> Rathke pouch ผนังหน้าเจริญเป็น pars distalis → ผนังหลังไม่ค่อยเจริญเป็น pars intermedia → lumen เหลือเป็น cleft/cyst → ถ้าโตมาก = Rathke cleft cyst<\/p><p><b>ทำไมตัวลวงหลอก:<\/b> ทั้ง Herring body และ Rathke cyst เป็น \"ก้อนชมพู\" — แยกด้วยตำแหน่ง (pars nervosa vs ระหว่างกลีบ) และมีเซลล์บุหรือไม่<\/p><p><b>High-yield:<\/b> colloid ใน pituitary = pars intermedia (Rathke's cysts); colloid ใน thyroid = thyroglobulin<\/p><p>📍 02-HISTO หน้า 22–23 · 03-HISTO หน้า 5, 8 · 04-DEV หน้า 19<\/p>"}, {"n": 11, "lec": 1, "stem": "<p>A student looks at an unknown endocrine gland: cords of epithelial cells, <b>no ducts<\/b>, and wide thin-walled capillaries with pores in their walls. Which additional feature would show that the gland is the <b>thyroid<\/b> rather than another endocrine gland?<\/p>", "opts": ["Follicles storing colloid outside the cells", "Fenestrated capillaries between cells", "Absence of a duct system", "Rich autonomic nerve supply", "A connective tissue capsule with septa"], "why": ["thyroid เป็นข้อยกเว้น: เซลล์เรียงเป็น follicle เก็บ hormone (thyroglobulin ใน colloid) <b>นอกเซลล์<\/b> — ต่อมอื่นเป็น cords/clusters", "ลักษณะร่วมของต่อมไร้ท่อทุกต่อม", "ลักษณะร่วมทุกต่อม (นิยามของ endocrine)", "ลักษณะร่วม (output ต้องปรับได้)", "ต่อมส่วนใหญ่มี capsule"], "ans": 0, "more": "<p><b>กลไก:<\/b> สามลักษณะร่วมของต่อมไร้ท่อ = capillary หนาแน่น · fenestrated capillary · neural/autonomic connection → ส่ง hormone เข้าเลือดเร็ว<\/p><p><b>High-yield:<\/b> จำต่อมใต้กล้องด้วย \"ลักษณะที่ต่อมอื่นไม่มี\" ไม่ใช่ลักษณะร่วม<\/p><p>📍 01-ANAT หน้า 4–6 · 03-HISTO หน้า 1<\/p>"}, {"n": 12, "lec": 1, "stem": "<p>A pancreatic section shows pyramidal cells arranged around a tiny lumen, with <b>basophilic<\/b> basal cytoplasm and <b>eosinophilic<\/b> apical granules. Which statement about these cells is correct?<\/p>", "opts": ["They are exocrine acinar cells; the basal basophilia is rough endoplasmic reticulum and the apical granules are zymogen, secreted in response to cholecystokinin and secretin", "They are beta cells storing insulin in apical granules", "They are alpha cells located at the periphery of each islet", "They secrete hormones directly into portal blood", "They form 1–2% of pancreatic mass"], "why": ["acinar cell: ฐานติดม่วงเพราะ rough endoplasmic reticulum หนาแน่น (สร้างโปรตีน) ยอดชมพูเพราะ zymogen granules (enzyme ยังไม่ออกฤทธิ์); กระตุ้นโดย cholecystokinin + secretin; ท่อ → duodenum", "beta cell อยู่ใน islet ติดสี<b>จาง<\/b> ไม่เรียงรอบ lumen", "alpha cell อยู่ใน islet และในคนกระจายปนกัน", "นั่นคือ islet cells", "islet = 1–2%; exocrine = ~95%"], "ans": 0, "more": "<p><b>ทำไมตัวลวงหลอก:<\/b> \"granules\" ทำให้คิดถึง hormone — แต่เรียงรอบ lumen + ติดสีเข้ม = exocrine<\/p><p><b>High-yield:<\/b> islet = ซีด ไม่มี lumen · acinus = เข้ม รอบ lumen มี centroacinar cell ตรงกลาง<\/p><p>📍 02-HISTO หน้า 12 · 03-HISTO หน้า 20–21<\/p>"}, {"n": 13, "lec": 1, "stem": "<p>A woman had a severe postpartum haemorrhage. MRI 3 months later shows infarction of about <b>half<\/b> of the anterior pituitary, yet her anterior pituitary hormone levels are normal. What best explains this?<\/p>", "opts": ["Clinical hypopituitarism usually appears only when more than about 75% of the anterior lobe is destroyed", "The posterior pituitary takes over anterior hormone synthesis", "The pars intermedia secretes all anterior hormones", "The hypothalamus secretes growth hormone and thyroid-stimulating hormone directly into blood", "Infarction affects only chromophobes, which make no hormones"], "why": ["handout: อาการ hypopituitarism เกิดเมื่อ anterior lobe ถูกทำลาย <b>&gt; 75%<\/b> → เนื้อที่เหลือชดเชยได้", "posterior lobe ไม่สร้าง hormone เลย (แค่เก็บ)", "ในคนหน้าที่ไม่ชัด", "hypothalamus หลั่ง releasing hormone เข้า portal ไม่ใช่ pituitary hormone", "infarction ไม่เลือกชนิดเซลล์; chromophobe ก็ไม่ใช่ทุกเซลล์ที่ไม่มี granule"], "ans": 0, "more": "<p><b>กลไก:<\/b> anterior pituitary ได้เลือดส่วนใหญ่จาก portal system (ความดันต่ำ) → ตกเลือดรุนแรง + ต่อมโตช่วงตั้งครรภ์ → infarct (Sheehan syndrome) → ถ้าเกิน 75% → ขาด hormone หลายตัว (prolactin → ไม่มีน้ำนม, gonadotropin → ขาดประจำเดือน)<\/p><p><b>High-yield:<\/b> hypopituitarism ต้องเสียเนื้อต่อม &gt; 75%<\/p><p>📍 03-HISTO หน้า 9 · 08-PHYSIO หน้า 16<\/p>"}, {"n": 14, "lec": 1, "stem": "<p>A CT scan of a healthy 70-year-old shows a small calcified dot in the midline behind the third ventricle. What is the histological basis of this finding?<\/p>", "opts": ["Corpora arenacea — calcium carbonate and phosphate concretions that increase with age in the pineal gland", "Calcified Herring bodies in the posterior pituitary", "Calcified colloid in the pars intermedia", "Dystrophic calcification of the hypothalamus after infarction", "Calcified craniopharyngioma"], "why": ["pineal sand (corpora arenacea, brain sand) = basophilic concretion ของ calcium carbonate + calcium phosphate ใน organic matrix เพิ่มตามอายุ → radio-opaque เป็น midline landmark", "Herring bodies ไม่ calcify และอยู่ใน sella", "อยู่ใน sella ไม่ใช่หลัง third ventricle", "โจทย์บอกคนแข็งแรง", "craniopharyngioma อยู่ <b>suprasellar<\/b> และมีอาการ"], "ans": 0, "more": "<p><b>กลไก:<\/b> pineal อยู่แนวกลาง ติด roof ของ third ventricle → calcification = จุดอ้างอิงแนวกลาง → ถ้าเลื่อน = space-occupying lesion<\/p><p><b>High-yield:<\/b> pineal sand = normal ageing + radiological midline marker; ผู้สูงอายุ melatonin ลด<\/p><p>📍 02-HISTO หน้า 37 · 03-HISTO หน้า 10 · 01-ANAT หน้า 14–15 · 13-PHYSIO หน้า 10<\/p>"}, {"n": 15, "lec": 1, "stem": "<p>Which statement about the arrangement of cells in a <b>human<\/b> pancreatic islet is correct according to the lecture handout?<\/p>", "opts": ["Alpha, beta and delta cells are intermingled throughout the islet rather than forming a strict beta-cell core with an alpha-cell mantle", "Alpha cells are confined to the periphery, as in all species", "Delta cells form the central core", "Beta cells are fewer than alpha cells", "Islets drain directly into the systemic veins without passing acinar capillaries"], "why": ["handout แก้ว่าใน human islet alpha กับ beta กระจายปนกัน; รูปแบบ beta core/alpha mantle เด่นในสัตว์ฟันแทะ; anatomy slide ก็ระบุ \"intermingled, not layered\"", "สไลด์ histology บอก \"periphery\" แต่ handout ชี้ว่าไม่ใช่ในคน — ⚠️ ข้อสอบอาจยึดสไลด์ ให้ดูคำว่า human ในโจทย์", "delta cell กระจายทั่ว islet", "beta ~70% มากที่สุด", "เลือดจาก islet ไหลผ่าน acinar capillaries = insulo-acinar portal system"], "ans": 0, "more": "<p><b>ทำไมตัวลวงหลอก:<\/b> มีความขัดกันระหว่าง slide (alpha \"periphery\") กับ handout/anatomy (intermingled ในคน) — อ่านโจทย์ว่าถาม \"human\" หรือไม่<\/p><p><b>High-yield:<\/b> insulo-acinar portal system = portal system ที่สองของ Lecture 1 (อีกอันคือ hypophyseal)<\/p><p>📍 03-HISTO หน้า 21 · 02-HISTO หน้า 13 · 01-ANAT หน้า 53<\/p>"}, {"n": 16, "lec": 2, "stem": "<p>Years after total hypophysectomy for a pituitary adenoma, a patient still has measurable anterior pituitary hormones, and later a small hormone-secreting adenoma is found in the <b>roof of the nasopharynx<\/b>. What is its most likely origin?<\/p>", "opts": ["Pharyngeal hypophysis — adenohypophyseal cells left along the path of Rathke pouch", "Remnant of the infundibulum", "Ectopic thyroid tissue", "Persistent thyroglossal duct", "Rathke cleft cyst"], "why": ["Rathke pouch งอกจาก roof ของ stomodeum ขึ้นผ่าน craniopharyngeal canal; เซลล์ที่ตกค้างใน midline roof ของ nasopharynx = pharyngeal hypophysis (พบเกือบทุกคน) → แหล่ง ectopic adenoma และสร้าง hormone ได้หลัง hypophysectomy", "infundibulum → posterior lobe ไม่สร้าง anterior hormone", "thyroid tissue ไม่สร้าง pituitary hormone", "อยู่คอแนวกลาง", "เป็น cyst ใน sella ไม่ใช่ใน nasopharynx และไม่สร้าง hormone"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> week 3 pouch งอกขึ้น → week 6 ก้านขาดจากปาก → ก้านฝ่อไม่หมด → เหลือเซลล์ตามทาง → ตำแหน่งต่ำสุดคือ nasopharynx<\/p><p><b>High-yield:<\/b> craniopharyngioma · Rathke cleft cyst · pharyngeal hypophysis = ความผิดพลาดเดียวกัน (ก้าน Rathke pouch ฝ่อไม่หมด) ต่างตำแหน่ง<\/p><p>📍 04-DEV หน้า 17, 20–21<\/p>"}, {"n": 17, "lec": 2, "stem": "<p>A 6-year-old has a painless midline neck lump that rises on tongue protrusion. Ultrasound confirms a normal thyroid gland in its usual position. At which level is this lesion <b>most commonly<\/b> located?<\/p>", "opts": ["Below the hyoid bone (infrahyoid)", "Within the tongue near the foramen cecum", "Above the hyoid bone", "In the suprasternal notch", "Lateral to the sternocleidomastoid"], "why": ["thyroglossal duct cyst พบบ่อยสุดที่ <b>infrahyoid<\/b>; อยู่แนวกลางเสมอ ขยับขึ้นเมื่อแลบลิ้นเพราะ tract ยังยึดกับ foramen cecum", "lingual type พบได้แต่ไม่บ่อยที่สุด", "suprahyoid พบน้อยกว่า", "ส่วนล่างสุดของทางพบน้อย", "lateral = cervical (branchial) cyst"], "ans": 0, "more": "<p><b>กลไก:<\/b> thyroid primordium ลงจาก foramen cecum ผ่านหน้า hyoid bone → duct ปกติสลายราว week 7 → ส่วนที่ค้างกลายเป็น cyst ตามทาง<\/p><p><b>ทำไมตัวลวงหลอก:<\/b> โจทย์ยืนยันว่ามี thyroid ปกติที่คอ → ไม่ใช่ ectopic thyroid → ผ่าออกได้โดยไม่เสียต่อม<\/p><p><b>High-yield:<\/b> midline + ขึ้นตามลิ้น = thyroglossal; lateral หน้า sternocleidomastoid = branchial<\/p><p>📍 04-DEV หน้า 23–24, 27–29<\/p>"}, {"n": 18, "lec": 2, "stem": "<p>A woman with Graves disease undergoes total thyroidectomy but remains mildly thyrotoxic; a radionuclide scan shows a thin band of functioning tissue running <b>upward from the isthmus toward the hyoid bone<\/b>. What is this tissue?<\/p>", "opts": ["Pyramidal lobe — the persistent lower end of the thyroglossal duct", "Lingual thyroid", "Ultimopharyngeal body", "Ectopic parathyroid gland", "Accessory thymic tissue"], "why": ["pyramidal lobe (~50% ของคน) = ปลายล่างของ thyroglossal duct ที่เหลือเป็นเนื้อต่อม ยื่นจาก isthmus ขึ้นไปยึด hyoid; ต้องตัดออกใน total thyroidectomy มิฉะนั้นเนื้อต่อมเหลือ", "อยู่ที่ฐานลิ้น", "รวมเข้า thyroid เป็น C cells ไม่สร้าง thyroxine", "ไม่สร้าง thyroid hormone", "ไม่สร้าง thyroid hormone"], "ans": 0, "more": "<p><b>High-yield:<\/b> ร่องรอยของ thyroglossal duct ในผู้ใหญ่ 2 อย่าง: foramen cecum (ปลายบน) + pyramidal lobe (ปลายล่าง)<\/p><p>📍 04-DEV หน้า 23, 26 · 01-ANAT หน้า 36<\/p>"}, {"n": 19, "lec": 2, "stem": "<p>A patient with primary hyperparathyroidism has four enlarged parathyroid glands removed from normal positions, but calcium stays high. A <b>fifth<\/b> gland is later found near the thymus. What developmental explanation fits a fifth gland?<\/p>", "opts": ["Division of an original parathyroid primordium producing a supernumerary gland", "Failure of the thyroid to descend", "Persistence of the thyroglossal duct", "Neural crest cells forming extra chief cells", "Fusion of the third and fourth pouches"], "why": ["สไลด์: &gt; 4 ต่อม = supernumerary จากการแบ่งตัวของ primordium เดิม; ต่อมที่ขาด = primordium ไม่ differentiate หรือฝ่อ", "เกี่ยวกับ thyroid", "เกี่ยวกับ thyroid", "chief cells มาจาก <b>endoderm<\/b> ของ pouch", "ไม่ใช่กลไกในสไลด์"], "ans": 0, "more": "<p><b>กลไก:<\/b> ต่อมที่หลงเหลือ (ectopic/supernumerary) = สาเหตุที่พบบ่อยสุดของ persistent disease หลังผ่าตัด hyperparathyroidism → รู้ทาง migration จึงรู้ว่าต้องหาที่ carotid sheath หรือ superior mediastinum<\/p><p><b>High-yield:<\/b> missed ectopic/extra gland = สาเหตุหลักของ persistent hyperparathyroidism<\/p><p>📍 04-DEV หน้า 36–37<\/p>"}, {"n": 20, "lec": 2, "stem": "<p>A 20-year-old has a smooth, fluctuant swelling on the <b>lateral<\/b> side of the neck along the anterior border of the sternocleidomastoid, below the angle of the mandible. It does not move on tongue protrusion. Which developmental structure failed to disappear?<\/p>", "opts": ["Cervical sinus formed when the second pharyngeal arch overgrew the lower grooves", "Thyroglossal duct", "Rathke pouch", "Ultimopharyngeal body", "Third pharyngeal pouch with the thymus"], "why": ["week 5 second arch เจริญลงคลุม groove 2–4 → เกิด cervical sinus ชั่วคราว → ปกติปิดหาย; ถ้าค้าง = cervical (branchial) cyst/fistula ด้านข้างคอ", "midline และขยับตามลิ้น", "อยู่ในกะโหลก/nasopharynx", "รวมเข้า thyroid", "ให้ ectopic thymus/parathyroid ไม่ใช่ cyst ด้านข้างแบบนี้"], "ans": 0, "more": "<p><b>High-yield:<\/b> ก้อนคอเด็ก — midline: thyroglossal cyst, ectopic thyroid · lateral: branchial cyst<\/p><p>📍 04-DEV หน้า 27, 33<\/p>"}, {"n": 21, "lec": 2, "stem": "<p>In an experimental mouse embryo lacking the transcription factor <b>neurogenin-3<\/b>, the pancreas has normal ducts and acini. What would be missing?<\/p>", "opts": ["Islet endocrine cells", "Exocrine acinar cells", "The dorsal pancreatic bud", "The accessory pancreatic duct", "Connective tissue septa"], "why": ["neurogenin-3 จำเป็นสำหรับ endocrine cell differentiation → ไม่มี → ไม่มี alpha/beta/delta cells แต่ acini ปกติ", "โจทย์บอก acini ปกติ", "dorsal bud ขึ้นกับ notochord (activin + FGF-2 กด Shh)", "เป็นเรื่องของ duct fusion", "มาจาก splanchnic mesenchyme"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> bud → tubules (SDF-1 คุม branching) → กลุ่มเซลล์แยกจาก tubule ไปอยู่ระหว่าง acini (ต้องใช้ neurogenin-3) → islet; glucagon/somatostatin cells เกิดก่อน beta cells; insulin เริ่มหลั่ง ~week 10<\/p><p><b>High-yield (molecular):<\/b> PDX1 = ventral bud · notochord activin/FGF-2 ปิด Shh = dorsal bud · neurogenin-3 = islet cells<\/p><p>📍 04-DEV หน้า 49–50, 52<\/p>"}, {"n": 22, "lec": 3, "stem": "<p>A 46,XY newborn has palpable testes and normal serum testosterone, but ambiguous external genitalia. The ratio of testosterone to dihydrotestosterone is very high. Which enzyme is deficient?<\/p>", "opts": ["5-alpha-reductase", "Aromatase", "17-alpha-hydroxylase", "21-hydroxylase", "17-beta-hydroxysteroid dehydrogenase"], "why": ["5-alpha-reductase เปลี่ยน testosterone → dihydrotestosterone ใน target tissue (genital skin, prostate); dihydrotestosterone ฤทธิ์แรงกว่า → ขาด → testosterone ปกติแต่อวัยวะเพศภายนอกไม่พัฒนาเต็ม", "androgen → estrogen; ไม่ทำให้ testosterone:dihydrotestosterone สูง", "testosterone จะ <b>ต่ำ<\/b> + hypertension", "46,XY อวัยวะเพศปกติ; ปัญหาคือ salt wasting", "androstenedione → testosterone; testosterone จะต่ำ"], "ans": 0, "more": "<p><b>กลไก:<\/b> Leydig cell → testosterone → (target) 5-alpha-reductase → dihydrotestosterone; (adipose) aromatase → estradiol<\/p><p><b>ทำไมตัวลวงหลอก:<\/b> testosterone ปกติ ทำให้ตัดตัวที่อยู่ \"ต้นทาง\" ออกหมด เหลือเอนไซม์ที่ทำงาน \"หลัง\" testosterone<\/p><p><b>High-yield:<\/b> testosterone ปกติ + dihydrotestosterone ต่ำ = 5-alpha-reductase<\/p><p>📍 05-BIOCHEM หน้า 17, 78 ⚠️ ภาวะ 5-alpha-reductase deficiency เป็น textbook consensus สไลด์มีแค่ pathway<\/p>"}, {"n": 23, "lec": 3, "stem": "<p>A 60-year-old smoker with small cell lung carcinoma has hypokalaemia, hypertension and markedly <b>darkened skin<\/b>. Plasma adrenocorticotropic hormone is very high. Why is the skin dark?<\/p>", "opts": ["Pro-opiomelanocortin processing yields adrenocorticotropic hormone, which contains melanocyte-stimulating hormone sequences that stimulate melanocytes", "Cortisol directly stimulates melanin synthesis", "Aldosterone deposits pigment in skin", "Epinephrine causes skin pigmentation", "Hypokalaemia darkens skin"], "why": ["pro-opiomelanocortin → adrenocorticotropic hormone (39 amino acids) + beta-lipotropin; ในลำดับมี melanocyte-stimulating hormone sequences → ระดับสูงมาก (ectopic) → กระตุ้น melanocyte", "⚠️ ผิวคล้ำพบใน Addison ที่ cortisol <b>ต่ำ<\/b> — จึงไม่ใช่ cortisol ที่ทำ", "ไม่ใช่", "ไม่ใช่", "ไม่ใช่"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> tumour หลั่ง adrenocorticotropic hormone (ไม่ถูก feedback) → cortisol สูงมาก (mineralocorticoid effect → hypokalaemia, hypertension) + melanocyte-stimulating hormone activity → ผิวคล้ำ<\/p><p><b>ทำไมตัวลวงหลอก:<\/b> จำกฎ \"ผิวคล้ำ = adrenocorticotropic hormone สูง\" ไม่ใช่ \"cortisol ต่ำ\"; Addison กับ ectopic adrenocorticotropic hormone คล้ำทั้งคู่<\/p><p><b>High-yield:<\/b> hyperpigmentation ตามระดับ adrenocorticotropic hormone: primary adrenal insufficiency, ectopic adrenocorticotropic hormone, congenital adrenal hyperplasia<\/p><p>📍 05-BIOCHEM หน้า 36, 61 · 03-HISTO หน้า 19–20<\/p>"}, {"n": 24, "lec": 3, "stem": "<p>A patient with end-stage chronic kidney disease has low serum calcium even though his dietary vitamin D and sunlight exposure are adequate. Which step of vitamin D activation is impaired?<\/p>", "opts": ["1-alpha-hydroxylation in the kidney", "Formation of cholecalciferol in the skin", "25-hydroxylation in the liver", "Absorption of vitamin D from the intestine", "24-hydroxylation in bone"], "why": ["7-dehydrocholesterol (ผิว + ultraviolet) → cholecalciferol → ตับ: 25-hydroxycholecalciferol → <b>ไต: 1-alpha-hydroxylase<\/b> → 1,25-dihydroxycholecalciferol (active) → ไตเสีย → calcitriol ต่ำ → ดูดซึม calcium ลด", "แสงแดดเพียงพอ", "ตับปกติ", "ไม่ใช่ขั้นตอนที่เสีย", "24,25-dihydroxy form ไม่ใช่ active form"], "ans": 0, "more": "<p><b>กลไกต่อ:<\/b> calcium ต่ำ + phosphate คั่ง (ไตขับไม่ได้) → parathyroid hormone ↑ = secondary hyperparathyroidism<\/p><p><b>High-yield:<\/b> ผิว → ตับ (25) → ไต (1-alpha) = active; ไตคือจุดคุมที่ parathyroid hormone กระตุ้น<\/p><p>📍 05-BIOCHEM หน้า 18 · 10-PHYSIO หน้า 17, 24, 27<\/p>"}, {"n": 25, "lec": 3, "stem": "<p>A patient whose thyroid was removed takes <b>only levothyroxine (thyroxine)<\/b>, yet her serum triiodothyronine is normal. Where does most of her triiodothyronine come from?<\/p>", "opts": ["Peripheral deiodination of thyroxine in tissues", "Residual thyroid tissue secreting triiodothyronine", "Hepatic synthesis from tyrosine", "Conversion of reverse triiodothyronine", "Pituitary secretion of triiodothyronine"], "why": ["แม้ในคนปกติ triiodothyronine ส่วนใหญ่ (~27 จาก ~31 ไมโครกรัมต่อวัน ตามสไลด์) มาจาก deiodination ของ thyroxine ที่เนื้อเยื่อ; thyroid หลั่ง triiodothyronine ตรงเพียงเล็กน้อย", "ไม่มีต่อมแล้ว", "ต้องใช้ thyroglobulin + iodination ใน thyroid", "reverse triiodothyronine = inactive product จาก inner-ring deiodination (deiodinase type 3)", "pituitary หลั่ง thyroid-stimulating hormone ไม่ใช่ triiodothyronine"], "ans": 0, "more": "<p><b>กลไก:<\/b> thyroxine = prohormone (half-life ยาว, ~80 ไมโครกรัม/วัน) → outer-ring deiodination → triiodothyronine (active, จับ nuclear receptor ~90%)<\/p><p><b>High-yield:<\/b> รักษา hypothyroidism ด้วย thyroxine เพราะ half-life ยาวและร่างกายแปลงเป็น triiodothyronine เอง<\/p><p>📍 05-BIOCHEM หน้า 43, 45 · 09-PHYSIO หน้า 12–13, 30<\/p>"}, {"n": 26, "lec": 3, "stem": "<p>The same gene gives calcitonin in thyroid C cells but calcitonin gene-related peptide in neurons. Which mechanism produces two different peptides from one gene?<\/p>", "opts": ["Tissue-specific alternative splicing and polyadenylation of the pre-messenger ribonucleic acid", "Different prohormone convertases cleaving the same protein", "Two separate genes on different chromosomes", "Post-translational glycosylation only", "Different iodination of the same peptide"], "why": ["thyroid: ตัดที่ poly(A) site 1 + splice → calcitonin messenger ribonucleic acid; neuron: poly(A) site 2 + splice อีกแบบ → calcitonin gene-related peptide", "เป็นกลไกของ proglucagon (alpha cell vs L cell) — เกิดหลัง translation", "ยีนเดียว", "ไม่ใช่", "iodination เป็นของ thyroid hormone"], "ans": 0, "more": "<p><b>ทำไมตัวลวงหลอก:<\/b> proglucagon กับ calcitonin gene ต่างก็ \"ยีนเดียว หลาย hormone\" แต่คนละระดับ: calcitonin = splicing (ก่อน translation), proglucagon = prohormone cleavage (หลัง translation)<\/p><p><b>High-yield:<\/b> calcitonin: 32 amino acids จาก C cells, ลด calcium<\/p><p>📍 05-BIOCHEM หน้า 47, 71<\/p>"}, {"n": 27, "lec": 3, "stem": "<p>Plasma cortisol has a half-life of about 60–90 minutes, whereas epinephrine lasts about 1 minute. What best explains this difference?<\/p>", "opts": ["Cortisol circulates mostly bound to plasma proteins, which protect it from degradation and renal filtration", "Cortisol is stored in vesicles and released slowly", "Epinephrine is bound to albumin", "Cortisol cannot enter cells", "Epinephrine is a steroid"], "why": ["steroid ไม่ละลายน้ำ → จับ globulin/albumin (bound = reservoir) → ชะลอ degradation, clearance, กันการกรองที่ไต → half-life ยาว; catecholamine ละลายน้ำ ลอยอิสระ → ถูกทำลายเร็ว", "steroid เก็บใน vesicle <b>ไม่ได้<\/b> (lipophilic แพร่ออก)", "epinephrine ละลายน้ำ ไม่ต้องจับ protein", "cortisol ผ่านเยื่อหุ้มเซลล์ได้", "epinephrine = amine (tyrosine)"], "ans": 0, "more": "<p><b>High-yield:<\/b> free hormone เท่านั้นที่ออกฤทธิ์; bound = คลังสำรอง<\/p><p>📍 05-BIOCHEM หน้า 16–17 · 06-PHYSIO หน้า 9<\/p>"}, {"n": 28, "lec": 4, "stem": "<p>An obese man has chronically high fasting insulin. His muscle and fat respond poorly to insulin even though insulin is abundant. Which change in the target cells best explains this, according to the principles of hormone response?<\/p>", "opts": ["Down-regulation — fewer functional insulin receptors per cell after prolonged high hormone exposure", "Up-regulation of insulin receptors", "Permissive effect of cortisol", "Positive feedback on beta cells", "Increased receptor affinity"], "why": ["ขนาดของการตอบสนองขึ้นกับจำนวน receptor/เซลล์, affinity, post-receptor amplification; hormone สูงนาน → down-regulation → sensitivity ลด (Lec 9: adipose ↑ → down-regulate insulin receptor)", "จะทำให้ตอบสนอง<b>มากขึ้น<\/b>", "permissive = ทำให้ตอบสนองต่ออีก hormone ดีขึ้น", "ไม่อธิบาย resistance", "ทำให้ sensitivity เพิ่ม"], "ans": 0, "more": "<p><b>กลไก:<\/b> hyperinsulinaemia → receptor internalization/ลดจำนวน → glucose uptake ผ่าน glucose transporter 4 ลด → beta cell ต้องหลั่งมากขึ้นอีก → วงจร insulin resistance → beta-cell exhaustion<\/p><p><b>High-yield:<\/b> hormone response = ความเข้มข้น × จำนวนเซลล์เป้าหมาย × sensitivity (จำนวน receptor, affinity, post-receptor)<\/p><p>📍 06-PHYSIO หน้า 18, 30 · 12-PHYSIO หน้า 21<\/p>"}, {"n": 29, "lec": 4, "stem": "<p>A tiny rise in plasma epinephrine produces a large rise in blood glucose within minutes. Which property of its signalling explains this magnification?<\/p>", "opts": ["Signal amplification through an enzymatic cascade: cyclic adenosine monophosphate → protein kinase A → phosphorylase kinase → glycogen phosphorylase", "Direct binding of epinephrine to glycogen", "Entry of epinephrine into the nucleus to increase gene transcription", "Epinephrine being stored in the liver", "A long plasma half-life of epinephrine"], "why": ["แต่ละขั้นเป็นเอนไซม์ที่กระตุ้นโมเลกุลถัดไปหลายตัว → hormone ไม่กี่โมเลกุล → glucose-1-phosphate จำนวนมาก; protein kinase A ยัง inactivate glycogen synthase ด้วย → หยุดเก็บ glycogen พร้อมกัน", "ไม่จับ glycogen ตรง", "กลไกของ steroid (ช้า ชั่วโมง–วัน)", "ไม่ใช่", "half-life ~1 นาที (สั้น)"], "ans": 0, "more": "<p><b>High-yield:<\/b> second messenger = amplification + speed (วินาที–นาที) · nuclear receptor = ช้าแต่ยาวนาน<\/p><p>📍 06-PHYSIO หน้า 14, 17<\/p>"}, {"n": 30, "lec": 4, "stem": "<p>A resident checks a patient's cortisol from a single blood sample taken at 11 p.m. and finds it much lower than a sample taken at 7 a.m. the same day. The patient is healthy. What explains the difference?<\/p>", "opts": ["Circadian (diurnal) rhythm with pulsatile secretion — cortisol peaks in the early morning and falls toward midnight", "Laboratory error, because cortisol is constant through the day", "Positive feedback after waking", "Cortisol is secreted only during sleep", "The evening sample reflects adrenal insufficiency"], "why": ["hormone secretion มี endogenous rhythm (circadian) + external factor (light-dark, sleep-wake); cortisol peak เช้า ต่ำสุดเที่ยงคืน และหลั่งเป็น pulse → การแปลผลต้องรู้เวลาเก็บ", "ไม่คงที่", "cortisol ไม่มี positive feedback", "ตัวที่หลั่งช่วงหลับเด่นคือ growth hormone; melatonin สูงกลางคืน", "ค่าต่ำตอนกลางคืนเป็นปกติ"], "ans": 0, "more": "<p><b>Clinical link:<\/b> Cushing syndrome สูญเสีย nadir กลางคืน → ใช้ late-night salivary cortisol ตรวจ (สไลด์ histology หน้า 35)<\/p><p><b>High-yield:<\/b> cortisol = circadian (เช้าสูง) · growth hormone = sleep · melatonin = dark · prolactin = ก่อนตื่น<\/p><p>📍 06-PHYSIO หน้า 26 · 11-PHYSIO หน้า 10, 12 · 02-HISTO หน้า 35<\/p>"}, {"n": 31, "lec": 4, "stem": "<p>Which disorder best illustrates the \"<b>receptor malfunction / hormone resistance<\/b>\" category of abnormal endocrine function?<\/p>", "opts": ["Type 2 diabetes with post-receptor signalling defects and abnormal glucose transporter 4, despite high insulin", "Pituitary adenoma secreting growth hormone", "Destruction of the adrenal cortex by autoimmunity", "Iodine deficiency reducing thyroxine synthesis", "Surgical removal of the parathyroid glands"], "why": ["insulin มีมาก แต่ target ตอบสนองไม่ได้ (receptor ลด, tyrosine kinase defect, glucose transporter 4 ผิดปกติ) = resistance", "hyper (over-production จาก tumour)", "hypo (gland destruction)", "hypo (ขาดวัตถุดิบ)", "hypo"], "ans": 0, "more": "<p><b>กลไกแยกประเภท:<\/b> hyper = hormone มากเกิน · hypo = hormone ขาด · resistance = hormone ปกติ/สูง แต่ผลต่ำ<\/p><p><b>High-yield:<\/b> hormone สูง + effect ต่ำ → resistance (type 2 diabetes, Laron, nephrogenic diabetes insipidus)<\/p><p>📍 06-PHYSIO หน้า 30 · 12-PHYSIO หน้า 21<\/p>"}, {"n": 32, "lec": 4, "stem": "<p>Growth hormone-releasing hormone released into the portal blood also acts back on the hypothalamic neurons that secrete it, limiting its own further release. What type of feedback is this?<\/p>", "opts": ["Ultrashort-loop feedback", "Short-loop feedback", "Long-loop feedback", "Positive feedback", "Physiological response–driven feedback"], "why": ["releasing hormone ย้อนกลับกด hypothalamus ตัวเอง = ultrashort-loop", "short-loop = tropic hormone จาก pituitary (เช่น growth hormone) ย้อนกด hypothalamus", "long-loop = hormone จาก target gland (เช่น insulin-like growth factor 1, cortisol) ย้อนกด hypothalamus + pituitary", "positive = กระตุ้นเพิ่ม", "= ผลทางสรีรวิทยา (เช่น glucose) ย้อนคุมต่อม"], "ans": 0, "more": "<p><b>Flow:<\/b> hypothalamus → (releasing hormone) → pituitary → (tropic hormone) → target gland → (hormone) → effect · ultrashort = ขั้นแรกกดตัวเอง · short = ขั้นสองกดขั้นแรก · long = ขั้นสามกดขั้นหนึ่งและสอง<\/p><p><b>High-yield:<\/b> นับ \"loop\" จากความยาวของทางย้อน<\/p><p>📍 05-BIOCHEM หน้า 24 · 06-PHYSIO หน้า 21 · 08-PHYSIO หน้า 13<\/p>"}, {"n": 33, "lec": 5, "stem": "<p>A trauma patient loses about 15% of his blood volume. Antidiuretic hormone rises sharply even though plasma osmolality is normal. By which mechanism?<\/p>", "opts": ["Reduced stretch of volume receptors/baroreceptors removes their tonic inhibition of antidiuretic hormone secretion, and angiotensin II also stimulates release", "Osmoreceptors detect high plasma osmolality", "Atrial natriuretic peptide stimulates antidiuretic hormone", "High blood pressure stimulates antidiuretic hormone", "Oxytocin converts to antidiuretic hormone"], "why": ["ปกติ baroreceptor ส่งสัญญาณ (vagal) <b>ยับยั้งแบบ tonic<\/b>; volume ↓ ≥10% → ยืดน้อยลง → การยับยั้งหาย → antidiuretic hormone ↑; ร่วมกับ renin → angiotensin II กระตุ้นเพิ่ม", "โจทย์บอก osmolality ปกติ", "atrial natriuretic peptide <b>ยับยั้ง<\/b>", "ความดันสูง <b>ยับยั้ง<\/b>", "คนละ hormone (ต่างกัน amino acid ตำแหน่ง 3 และ 8)"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> เสียเลือด → atrial/arterial stretch ↓ → vagal firing ↓ → ปลดเบรก → antidiuretic hormone ↑ → water reabsorption (V2) + vasoconstriction (V1) → รักษา volume/pressure<\/p><p><b>High-yield:<\/b> volume stimulus ต้อง ~10% · osmotic stimulus 1–2% แต่ volume ลดมากชนะ osmolality<\/p><p>📍 07-PHYSIO หน้า 17–18, 20<\/p>"}, {"n": 34, "lec": 5, "stem": "<p>During major surgical stress, antidiuretic hormone contributes to raising cortisol. Through which receptor and target?<\/p>", "opts": ["V1B receptor on corticotrophs, amplifying the effect of corticotropin-releasing hormone on adrenocorticotropic hormone secretion", "V2 receptor on the adrenal cortex", "V1 receptor on arteriolar smooth muscle", "Oxytocin receptor on the uterus", "Aquaporin-2 on corticotrophs"], "why": ["antidiuretic hormone (V1B) เสริมฤทธิ์ corticotropin-releasing hormone → adrenocorticotropic hormone ↑ → cortisol ↑", "V2 อยู่ที่ collecting duct", "V1 = vasoconstriction", "ไม่เกี่ยว", "aquaporin อยู่ที่ไต"], "ans": 0, "more": "<p><b>High-yield:<\/b> vasopressin receptors: V1 (หลอดเลือด, inositol trisphosphate) · V1B (corticotroph) · V2 (ไต, cyclic adenosine monophosphate)<\/p><p>📍 07-PHYSIO หน้า 17<\/p>"}, {"n": 35, "lec": 5, "stem": "<p>Which property is characteristic of <b>hypothalamic releasing hormones<\/b> acting on the anterior pituitary?<\/p>", "opts": ["Pulsatile secretion, membrane receptors with second messengers, and a trophic effect causing hyperplasia and hypertrophy of target cells", "Continuous secretion and nuclear receptors", "They act only on release, never on synthesis", "They travel in axons to the posterior pituitary", "They circulate bound to globulins"], "why": ["สไลด์: pulsatile; membrane receptor + second messenger (growth hormone-releasing hormone, corticotropin-releasing hormone → cyclic adenosine monophosphate; thyrotropin-releasing hormone → diacylglycerol/inositol trisphosphate); กระตุ้นทั้ง release + synthesis; trophic effect; คุม receptor ตัวเอง", "peptide → membrane receptor", "กระตุ้นทั้งการหลั่งและการสังเคราะห์", "ไปทาง portal blood สู่ anterior pituitary", "peptide ไม่ต้องจับ globulin"], "ans": 0, "more": "<p><b>High-yield:<\/b> trophic = ทำให้เซลล์เป้าหมายโต (ขาด adrenocorticotropic hormone → cortex ฝ่อ; thyroid-stimulating hormone สูง → goitre)<\/p><p>📍 07-PHYSIO หน้า 4–5<\/p>"}, {"n": 36, "lec": 5, "stem": "<p>A student has been under exam stress for 3 weeks. Which hormonal pattern characterises this <b>resistance phase<\/b> of the general adaptation syndrome?<\/p>", "opts": ["Cortisol, glucagon and growth hormone supply energy through lipolysis, muscle amino acid release and hepatic gluconeogenesis", "Only epinephrine and norepinephrine, lasting seconds", "Complete failure of cortisol production", "Insulin dominance with nutrient storage", "No endocrine change"], "why": ["resistance phase ใช้ hypothalamic–pituitary–adrenal axis (corticotropin-releasing hormone → adrenocorticotropic hormone → cortisol) + glucagon + growth hormone → สลายไขมัน, กล้ามเนื้อปล่อย amino acid, ตับสร้าง glucose", "alarm phase (sympatho-adrenal medullary system)", "exhaustion phase", "ตรงข้าม", "ไม่ใช่"], "ans": 0, "more": "<p><b>3 phases:<\/b> alarm (epinephrine, norepinephrine: glucose mobilization, heart rate ↑) → resistance (cortisol-driven energy supply) → exhaustion (reserve หมด, cortisol สร้างไม่ได้, electrolyte เสีย)<\/p><p><b>High-yield:<\/b> acute = sympatho-adrenal · chronic = hypothalamic–pituitary–adrenal axis<\/p><p>📍 07-PHYSIO หน้า 30–33<\/p>"}, {"n": 37, "lec": 5, "stem": "<p>A man under chronic work stress develops rising fasting glucose. Which mechanism links chronic stress to glucose intolerance, according to the lecture?<\/p>", "opts": ["Sustained cortisol and catecholamines increase hepatic gluconeogenesis and cause insulin resistance", "Stress directly destroys beta cells by autoimmunity", "Stress increases insulin sensitivity", "Stress lowers growth hormone and cortisol", "Stress stimulates somatostatin only"], "why": ["stress กระตุ้นทั้ง sympatho-adrenal system + hypothalamic–pituitary–adrenal axis → glucocorticoid + catecholamine → gluconeogenesis ↑ + insulin resistance → hyperglycaemia", "กลไกของ type 1", "ตรงข้าม", "stress เพิ่ม hormone เหล่านี้", "ไม่ใช่"], "ans": 0, "more": "<p><b>High-yield:<\/b> counter-regulatory hormones (cortisol, catecholamine, glucagon, growth hormone) ทั้งหมดดัน glucose ขึ้น<\/p><p>📍 07-PHYSIO หน้า 34 · 12-PHYSIO หน้า 21<\/p>"}, {"n": 38, "lec": 6, "stem": "<p>A child with Laron dwarfism is treated with recombinant insulin-like growth factor 1 and his linear growth improves. Which effect of growth hormone would <b>not<\/b> be restored by this treatment, because it is a direct growth hormone action?<\/p>", "opts": ["Lipolysis in adipose tissue", "Chondrocyte proliferation at the epiphyseal plate", "Protein synthesis in muscle", "Cell proliferation in many tissues", "Linear bone growth"], "why": ["lipolysis (และ anti-insulin effect, gluconeogenesis) = <b>direct<\/b> effect ผ่าน growth hormone receptor (Janus kinase) → receptor เสีย ให้ insulin-like growth factor 1 ก็ไม่ช่วย", "indirect ผ่าน insulin-like growth factor 1 → ได้ผล", "indirect (anabolic)", "indirect", "indirect"], "ans": 0, "more": "<p><b>กลไก:<\/b> indirect (insulin-like growth factor 1) = growth-promoting, insulin-like, anabolic · direct (growth hormone) = lipolysis, glucose ↑, anti-insulin (synergistic กับ cortisol, catabolic)<\/p><p><b>High-yield:<\/b> \"โต\" = insulin-like growth factor 1 · \"เผาผลาญไขมัน + น้ำตาลขึ้น\" = growth hormone ตรง<\/p><p>📍 08-PHYSIO หน้า 6–8<\/p>"}, {"n": 39, "lec": 6, "stem": "<p>A 7-year-old with untreated hypothyroidism is short with delayed bone age, and his growth hormone response to stimulation is reduced. Why does hypothyroidism impair growth hormone–driven growth?<\/p>", "opts": ["Thyroid hormone stimulates growth hormone gene expression in somatotrophs and acts synergistically with growth hormone and insulin-like growth factor 1 on bone", "Thyroid hormone blocks the growth hormone receptor", "Thyroxine is converted into growth hormone", "Thyroid-stimulating hormone inhibits growth hormone-releasing hormone", "Hypothyroidism causes early epiphyseal closure"], "why": ["thyroid hormone กระตุ้น growth hormone gene ใน somatotroph และทำงาน synergistic กับ growth hormone/insulin-like growth factor 1 ต่อการสร้างกระดูก → ขาด → growth hormone ต่ำ + ตอบสนองต่ำ", "ตรงข้าม", "ไม่ใช่", "ไม่ใช่กลไกในสไลด์", "ตรงข้าม — bone age <b>ช้า<\/b>"], "ans": 0, "more": "<p><b>High-yield:<\/b> ช่วง birth → puberty ต้องใช้ growth hormone + thyroid hormone ร่วม (synergism); in utero ใช้ human somatomammotropin<\/p><p>📍 09-PHYSIO หน้า 17 · 08-PHYSIO หน้า 11, 22<\/p>"}, {"n": 40, "lec": 6, "stem": "<p>A 28-year-old woman has amenorrhoea, galactorrhoea and infertility. Serum prolactin is very high and MRI shows a pituitary microadenoma. Why is she amenorrhoeic?<\/p>", "opts": ["High prolactin inhibits gonadotropin-releasing hormone release, lowering luteinizing hormone and follicle-stimulating hormone, so follicular growth and ovulation fail", "Prolactin directly destroys the ovaries", "Prolactin increases estrogen excessively", "Dopamine excess suppresses the ovary", "The adenoma compresses the posterior pituitary"], "why": ["prolactin สูง → กด gonadotropin-releasing hormone → luteinizing hormone/follicle-stimulating hormone ↓ → ไม่ตกไข่, estrogen ต่ำ → amenorrhoea (กลไกเดียวกับ natural birth control ขณะให้นม)", "ไม่ทำลาย", "estrogen <b>ต่ำ<\/b>", "ในภาวะนี้ dopamine ไม่ได้เกิน; รักษาด้วย dopamine <b>agonist<\/b>", "microadenoma ไม่กด"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> lactotroph adenoma (prolactinoma — hyperfunctioning adenoma ที่พบบ่อยที่สุด ~30%) → hyperprolactinaemia → galactorrhoea + hypogonadism (amenorrhoea, loss of libido, infertility)<\/p><p><b>High-yield:<\/b> prolactinoma รักษาด้วย dopamine agonist เพราะ prolactin อยู่ใต้การยับยั้งของ dopamine<\/p><p>📍 08-PHYSIO หน้า 32, 35–36 · 03-HISTO หน้า 8<\/p>"}, {"n": 41, "lec": 6, "stem": "<p>A 9-year-old on high-dose glucocorticoids for nephrotic syndrome for a year has slowed linear growth. Which statement best explains this?<\/p>", "opts": ["Glucocorticoids antagonise growth hormone action and depress osteoblast activity, blunting linear growth", "Glucocorticoids stimulate insulin-like growth factor 1 excessively", "Glucocorticoids cause early puberty", "Glucocorticoids increase thyroid hormone", "Glucocorticoids are required for growth hormone release, so extra dose speeds growth"], "why": ["สไลด์ growth hormone: glucocorticoid (+/−) ต้าน growth hormone action; สไลด์ calcium: glucocorticoid กด osteoblast, ลดการดูดซึม calcium → กระดูกโตช้า; Cushing syndrome ในเด็ก = cessation of linear growth", "ไม่ใช่", "ไม่ใช่", "cortisol <b>ลด<\/b> thyroid-stimulating hormone", "ขนาดสูงให้ผลตรงข้าม"], "ans": 0, "more": "<p><b>High-yield:<\/b> hormone ที่กด growth: glucocorticoid excess, hypothyroidism, growth hormone deficiency<\/p><p>📍 08-PHYSIO หน้า 11 · 10-PHYSIO หน้า 36 · 11-PHYSIO หน้า 17, 20<\/p>"}, {"n": 42, "lec": 6, "stem": "<p>Which of the following <b>decreases<\/b> thyroid-stimulating hormone secretion?<\/p>", "opts": ["High cortisol", "Thyrotropin-releasing hormone", "Cold exposure in infants", "Estrogen", "Catecholamines"], "why": ["สไลด์: ลด thyroid-stimulating hormone = cortisol, growth hormone, testosterone, excitement/anxiety, thyroid hormone", "เพิ่ม", "เพิ่ม (heat production ในทารก)", "เพิ่ม", "เพิ่ม"], "ans": 0, "more": "<p><b>Clinical link:<\/b> fasting/starving → thyrotroph ไวต่อ thyrotropin-releasing hormone ลด; ตั้งครรภ์ human chorionic gonadotropin ออกฤทธิ์คล้าย thyroid-stimulating hormone → thyroid-stimulating hormone ต่ำลงเล็กน้อย<\/p><p><b>High-yield:<\/b> เพิ่ม: thyrotropin-releasing hormone, catecholamine, estrogen, cold · ลด: cortisol, growth hormone, testosterone, thyroid hormone<\/p><p>📍 09-PHYSIO หน้า 6<\/p>"}, {"n": 43, "lec": 6, "stem": "<p>A 45-year-old man has weight loss, tremor and a diffuse goitre. Serum free thyroxine is <b>high<\/b> and thyroid-stimulating hormone is also <b>high<\/b>. MRI shows a pituitary mass. How is this classified?<\/p>", "opts": ["Secondary hyperthyroidism from a thyroid-stimulating hormone-secreting pituitary adenoma", "Graves disease (primary hyperthyroidism)", "Primary hypothyroidism", "Tertiary hypothyroidism", "Wolff-Chaikoff effect"], "why": ["tropic hormone สูง + target hormone สูง → ต้นเหตุอยู่ที่ pituitary (thyroid-stimulating hormone ไม่ถูก feedback กด); thyrotropin-releasing hormone จะถูกกด", "Graves: thyroxine สูง แต่ thyroid-stimulating hormone <b>ต่ำ<\/b> (ถูก feedback)", "thyroxine ต่ำ", "thyroxine ต่ำ", "thyroxine ต่ำ"], "ans": 0, "more": "<div class=\"tw\"><table><thead><tr><th>ระดับ<\/th><th>Thyrotropin-releasing hormone<\/th><th>Thyroid-stimulating hormone<\/th><th>Thyroxine<\/th><\/tr><\/thead><tbody><tr><td>Primary hyper (Graves)<\/td><td>↓<\/td><td>↓<\/td><td>↑<\/td><\/tr><tr><td>Secondary hyper (pituitary)<\/td><td>↓<\/td><td>↑<\/td><td>↑<\/td><\/tr><tr><td>Tertiary hyper (hypothalamus)<\/td><td>↑<\/td><td>↑<\/td><td>↑<\/td><\/tr><\/tbody><\/table><\/div><p><b>High-yield:<\/b> tropic + target ไปทิศเดียวกัน = ต้นเหตุอยู่เหนือต่อม; สวนทาง = ต้นเหตุที่ต่อมเอง<\/p><p>📍 09-PHYSIO หน้า 23<\/p>"}, {"n": 44, "lec": 6, "stem": "<p>A patient with hyperthyroidism has resting tachycardia and a fine hand tremor. Which mechanism best explains these features?<\/p>", "opts": ["Triiodothyronine increases target tissue sensitivity to catecholamines (beta-adrenergic signalling) — a permissive action", "Triiodothyronine is converted into epinephrine", "Thyroid-stimulating hormone directly stimulates the heart", "Calcitonin causes tremor", "Thyroid hormone lowers cardiac output"], "why": ["triiodothyronine เพิ่ม beta-adrenergic signalling (permissive) → tachycardia, palpitation, tremor; ร่วมกับผลตรงต่อหัวใจ (myosin, sarcoplasmic reticulum calcium adenosine triphosphatase) และผลทางอ้อม (vasodilation จาก heat → reflex)", "ไม่ใช่", "ในภาวะนี้ (primary) thyroid-stimulating hormone ต่ำ", "ไม่ใช่", "cardiac output <b>เพิ่ม<\/b>"], "ans": 0, "more": "<p><b>High-yield:<\/b> thyroid hormone permissive ต่อ catecholamine (หัวใจ) และ glucagon/cortisol/growth hormone (glycogenolysis, gluconeogenesis)<\/p><p>📍 09-PHYSIO หน้า 19–20, 24<\/p>"}, {"n": 45, "lec": 6, "stem": "<p>In an iodine-deficient mountain village, many adults have large goitres. Which sequence best explains goitre formation?<\/p>", "opts": ["Low iodine → low thyroxine → loss of negative feedback → high thyroid-stimulating hormone → follicular hyperplasia and gland enlargement", "Low iodine → high thyroxine → gland hypertrophy", "Low iodine → low thyroid-stimulating hormone → gland atrophy", "Low iodine → antibody formation → gland destruction", "Low iodine → excess calcitonin → gland enlargement"], "why": ["endemic goitre: ขาดวัตถุดิบ → hormone ต่ำ → feedback หาย → thyroid-stimulating hormone สูงนาน (trophic) → follicle และต่อมโต", "thyroxine ต่ำ", "thyroid-stimulating hormone สูง", "Hashimoto", "ไม่เกี่ยว"], "ans": 0, "more": "<p><b>กลไกเพิ่ม:<\/b> iodine <b>เกิน<\/b> ก็ทำ goitre ได้ (เพิ่มการสร้าง/เก็บ hormone); goitre ไม่ยุบง่ายแม้เติม iodine กลับ มักต้องผ่าตัด<\/p><p><b>High-yield:<\/b> goitre ≠ บอก function — euthyroid, hypo หรือ hyper ได้ทั้งหมด<\/p><p>📍 09-PHYSIO หน้า 11 · 01-ANAT หน้า 37–38 · 03-HISTO หน้า 13<\/p>"}, {"n": 46, "lec": 7, "stem": "<p>A patient with untreated adrenal insufficiency drinks 1 L of water and cannot excrete the water load; serum sodium falls. Which cortisol action is missing?<\/p>", "opts": ["Cortisol normally raises glomerular filtration rate and suppresses antidiuretic hormone, permitting rapid water diuresis", "Cortisol normally stimulates aquaporin-2 insertion", "Cortisol normally increases antidiuretic hormone", "Cortisol normally blocks aldosterone", "Cortisol normally causes sodium loss"], "why": ["cortisol ลด preglomerular resistance → renal plasma flow/glomerular filtration rate ↑ และกด antidiuretic hormone → ขับน้ำเร็ว; ขาด cortisol → glomerular filtration rate ↓, antidiuretic hormone ↑ → เก็บน้ำ → hyponatraemia", "เป็นกลไกของ antidiuretic hormone", "ตรงข้าม", "ไม่ใช่", "cortisol มีฤทธิ์ mineralocorticoid อ่อน ๆ (เก็บ sodium)"], "ans": 0, "more": "<p><b>High-yield:<\/b> Addison: \"inability to excrete water load (glomerular filtration rate ↓, antidiuretic hormone ↑)\" อยู่ในสไลด์ตรง ๆ<\/p><p>📍 11-PHYSIO หน b> secondary adrenal insufficiency → cortisol + androgens ต่ำ, aldosterone ปกติ → ไม่มี hyperkalaemia<\/p><p>📍 07-PHYSIO หน้า 10 · 11-PHYSIO หน้า 25–27<\/p>"}, {"n": 49, "lec": 7, "stem": "<p>A 55-year-old postmenopausal woman has no ovarian estrogen production, yet some estrogenic activity persists. What is its main source, according to the lecture?<\/p>", "opts": ["Androgens from the zona reticularis converted to estrogen in peripheral tissues", "Cortisol converted to estrogen", "The adrenal medulla", "Residual corpus luteum", "Pituitary follicle-stimulating hormone acting as an estrogen"], "why": ["dehydroepiandrosterone/androstenedione จาก zona reticularis → aromatase ที่เนื้อเยื่อ (adipose) → estrogen = แหล่งหลักหลัง menopause", "cortisol ไม่ถูกเปลี่ยนเป็น estrogen", "catecholamine", "ไม่มีหลัง menopause", "follicle-stimulating hormone ไม่ใช่ estrogen"], "ans": 0, "more": "<p><b>High-yield:<\/b> adrenal androgen อ่อน: ในชาย &lt; 5%; ในหญิงรับผิดชอบขนหัวหน่าว/รักแร้, sex drive, pubertal growth spurt<\/p><p>📍 11-PHYSIO หน้า 35 · 13-PHYSIO หน้า 5<\/p>"}, {"n": 50, "lec": 7, "stem": "<p>A patient with isolated <b>aldosterone deficiency<\/b> (cortisol normal) is expected to have which acid–base and electrolyte pattern?<\/p>", "opts": ["Hyperkalaemia with metabolic acidosis and sodium loss", "Hypokalaemia with metabolic alkalosis", "Hypernatraemia with hypertension", "Hypercalcaemia", "Normal potassium with respiratory alkalosis"], "why": ["aldosterone ปกติดูด sodium และขับ potassium + hydrogen; ขาด → เก็บ potassium (hyperkalaemia) + เก็บ hydrogen (metabolic acidosis) + เสีย sodium/น้ำ (postural hypotension, salt appetite)", "ภาพของ aldosterone <b>เกิน<\/b> (Conn)", "ภาพของ aldosterone เกิน", "ไม่เกี่ยว", "ไม่ใช่"], "ans": 0, "more": "<p><b>High-yield:<\/b> กลับด้าน Conn ทุกอย่าง: Conn = hypertension, hypokalaemia, alkalosis · ขาด = hypotension, hyperkalaemia, acidosis<\/p><p>📍 11-PHYSIO หน้า 29, 31–32<\/p>"}, {"n": 51, "lec": 7, "stem": "<p>During hypoglycaemia, epinephrine helps restore blood glucose. Which set of actions contributes?<\/p>", "opts": ["Increased hepatic glycogenolysis and gluconeogenesis, increased glucagon secretion and decreased insulin secretion", "Increased insulin secretion and glycogen synthesis", "Increased glucose uptake into adipose tissue", "Inhibition of lipolysis", "Decreased heart rate"], "why": ["epinephrine: glycogen breakdown ↑ (ตับ, กล้ามเนื้อ), gluconeogenesis ↑, glucagon ↑, insulin ↓ (alpha receptor ลด cyclic adenosine monophosphate ใน beta cell), fatty acid mobilization ↑", "ตรงข้าม", "ตรงข้าม", "กระตุ้น lipolysis", "heart rate ↑"], "ans": 0, "more": "<p><b>High-yield:<\/b> epinephrine = \"เตรียมพร้อม\": เพิ่มเชื้อเพลิง (glucose, fatty acid) + เพิ่มการส่ง oxygen (heart rate, blood pressure, bronchodilation)<\/p><p>📍 05-BIOCHEM หน้า 62 · 11-PHYSIO หน้า 41 · 12-PHYSIO หน้า 27<\/p>"}, {"n": 52, "lec": 8, "stem": "<p>In untreated type 1 diabetes, which hepatic change directly leads to ketoacidosis?<\/p>", "opts": ["Loss of insulin's inhibition of ketogenesis, with more fatty acids delivered from unrestrained lipolysis", "Increased insulin-driven fatty acid synthesis", "Increased glycogen synthesis in the liver", "Suppressed glucagon action on the liver", "Increased urea cycle suppression by insulin"], "why": ["insulin ปกติกด lipolysis และ ketogenesis ที่ตับ; ขาด insulin (+ glucagon สูง) → adipose ปล่อย fatty acid มาก → ตับทำ ketone → metabolic acidosis", "ต้องมี insulin", "ต้องมี insulin", "glucagon ทำงาน<b>เกิน<\/b> (insulin/glucagon ratio ต่ำ)", "ไม่เกี่ยว"], "ans": 0, "more": "<p><b>กลไกทีละขั้น (diabetic ketoacidosis):<\/b> insulin ≈ 0 → (1) glucose uptake ↓ → hyperglycaemia → glucosuria → osmotic diuresis → dehydration (2) lipolysis ↑ → fatty acid ↑ → ketogenesis → metabolic acidosis → Kussmaul respiration (3) protein breakdown → weight loss<\/p><p><b>High-yield:<\/b> ketoacidosis ต้องการ insulin ≈ 0; มี insulin เหลือนิดเดียว (type 2) ก็กด ketone ได้ → hyperosmolar hyperglycaemic state<\/p><p>📍 12-PHYSIO หน้า 11, 16–17<\/p>"}, {"n": 53, "lec": 8, "stem": "<p>A healthy person skips meals and blood glucose starts to fall. What is the <b>first<\/b> physiological defence against hypoglycaemia?<\/p>", "opts": ["Shutting off insulin secretion", "Rising growth hormone", "Rising cortisol", "Using ketones as brain fuel", "Increasing insulin secretion"], "why": ["ขั้นแรกคือหยุด insulin → ตับเลิกเก็บ glucose → ตามด้วย counter-regulatory hormones (glucagon, catecholamine, cortisol, growth hormone)", "มาทีหลัง ช้า", "มาทีหลัง ช้า", "ทางเลือกเมื่ออดนาน", "ตรงข้าม"], "ans": 0, "more": "<p><b>ลำดับ:<\/b> shut off insulin → glucagon + catecholamine (นาที) → cortisol + growth hormone (ชั่วโมง) → metabolic: gluconeogenesis, glycogenolysis, fatty acids/ketone<\/p><p><b>High-yield:<\/b> สมองพึ่ง glucose เกือบทั้งหมด → hypoglycaemia ทำให้เหงื่อออก สับสน หมดสติ<\/p><p>📍 12-PHYSIO หน้า 34<\/p>"}, {"n": 54, "lec": 8, "stem": "<p>Compare a person 1 hour after a large carbohydrate meal with the same person after an overnight fast. Which change in the <b>insulin-to-glucagon ratio<\/b> and its purpose is correct?<\/p>", "opts": ["Ratio high after the meal to promote nutrient storage; ratio low during fasting to maintain blood glucose", "Ratio low after the meal to release glucose", "Ratio high during fasting to maintain glucose", "Ratio unchanged because both hormones rise equally", "Ratio determined only by growth hormone"], "why": ["fed/post-absorptive: insulin/glucagon ratio ↑ → เก็บ glycogen, fat, protein · fasting/exercise: ratio ↓ → ตับปล่อย glucose", "กลับทิศ", "กลับทิศ", "หลังอาหาร carbohydrate glucagon ลด", "ไม่ใช่"], "ans": 0, "more": "<p><b>High-yield:<\/b> ตับตอบสนองต่อ \"อัตราส่วน\" ไม่ใช่ hormone ตัวเดียว<\/p><p>📍 12-PHYSIO หน้า 32–33 · 05-BIOCHEM หน้า 73<\/p>"}, {"n": 55, "lec": 8, "stem": "<p>A 45-year-old obese man has fasting glucose slightly above normal. His fasting insulin and C-peptide are both <b>high<\/b>. What stage of type 2 diabetes does this reflect?<\/p>", "opts": ["Early insulin resistance with compensatory beta-cell hypersecretion", "Absolute insulin deficiency from beta-cell destruction", "Exogenous insulin injection", "Insulinoma with hypoglycaemia", "Late beta-cell exhaustion"], "why": ["ระยะแรก: target ดื้อ insulin → beta cell ทำงานหนัก → insulin + C-peptide สูง; glucose ยังคุมได้เกือบปกติ", "type 1: C-peptide ต่ำ", "C-peptide จะต่ำ", "จะมี hypoglycaemia ไม่ใช่ glucose สูง", "ระยะหลัง insulin/C-peptide ลดลง (relative deficiency)"], "ans": 0, "more": "<p><b>กลไกทีละขั้น:<\/b> obesity/visceral fat → adipokines + free fatty acid → insulin resistance → beta cell ชดเชย (insulin ↑) → หลายปี: glucotoxicity + lipotoxicity → beta cell เหนื่อย → insulin ลด → hyperglycaemia ชัด<\/p><p><b>High-yield:<\/b> C-peptide สูงใน type 2 ระยะแรก, ต่ำใน type 1<\/p><p>📍 12-PHYSIO หน้า 21–23<\/p>"}, {"n": 56, "lec": 8, "stem": "<p>After a large <b>protein-only<\/b> meal (no carbohydrate), both insulin and glucagon rise. Why is the rise in glucagon physiologically useful?<\/p>", "opts": ["Amino acids stimulate insulin, and the simultaneous glucagon rise prevents hypoglycaemia that insulin would otherwise cause", "Glucagon helps store amino acids as glycogen", "Glucagon blocks insulin secretion completely", "Glucagon lowers blood glucose after protein meals", "The glucagon rise is a laboratory artefact"], "why": ["amino acid (arginine, lysine) กระตุ้น insulin; ถ้ามีแต่ insulin โดยไม่มี carbohydrate → glucose จะตก; amino acid (arginine, alanine) กระตุ้น glucagon ด้วย → ถ่วงสมดุล", "ไม่ใช่", "glucagon กระตุ้น beta cell (paracrine)", "glucagon เพิ่ม glucose", "ไม่ใช่"], "ans": 0, "more": "<p><b>High-yield:<\/b> กระตุ้น glucagon: glucose ต่ำ, amino acid, sympathetic, stress, exercise · กด: somatostatin, insulin, glucose สูง<\/p><p>📍 12-PHYSIO หน้า 14, 31 · 05-BIOCHEM หน้า 74<\/p>"}, {"n": 57, "lec": 8, "stem": "<p>A 2-year-old with little sun exposure has bowed legs, a \"rachitic rosary\" and delayed growth. Which laboratory pattern is const KEY='endo-exam1-set3-v1';

const shuffle=()=>{D.qs.forEach(q=>{const a=[0,1,2,3,4];for(let i=4;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}S.order[q.n]=a})};

// time counts only while an unanswered question is on screen
function flush(){if(shownN!==null){S.spent[shownN]=(S.spent[shownN]||0)+(Date.now()-shownAt);shownN=null;save()}}
function track(q){flush();if(q&&!done(q)&&mode==='mcq'&&!document.hidden){shownN=q.n;shownAt=Date.now()}}
const live=n=>(S.spent[n]||0)+(shownN===n?Date.now()-shownAt:0);
const total=()=>D.qs.reduce((a,q)=>a+live(q.n),0);
function tick(){
  if(mode!=='mcq')return;
  const q=list()[cur];const t=q?live(q.n):0;

setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else if(mode==='mcq')track(list()[cur])});

function score(){
  const by=D.lec.map(()=>[0,0]);let r=0,t=0;
  D.qs.forEach(q=>{const p=S.pick[q.n];if(p===undefined)return;t++;by[q.lec][1]++;if(p===q.ans){r++;by[q.lec][0]++}});
  return {r,t,by};
}
function chips(){
  const s=score();
  $('chips').innerHTML=[['ทั้งหมด',-1,`${s.r}/${s.t}`],...D.lec.map((n,i)=>[n,i,s.by[i][1]?`${s.by[i][0]}/${s.by[i][1]}`:''])]
    .map(([n,i,c])=>`<button class="chip" data-lec="${i}" aria-pressed="${lec===i}">${n}<small>${c}</small></button>`).join('');
  $('score').innerHTML=`ทำแล้ว <b>${s.t}</b>/63 · ถูก <b>${s.r}</b>${s.t?` · ${Math.round(s.r/s.t*100)}%`:''}`;

function qHTML(q){
  const p=S.pick[q.n],d=p!==undefined,ord=S.order[q.n];

    const cls=d?(o===q.ans?'right':o===p?'wrong':''):'';

  const v=d?`<div class="verdict ${p===q.ans?'ok':'no'}">${p===q.ans?'ถูก':'ผิด'} · เฉลย ${L[ord.indexOf(q.ans)]} · ใช้เวลา ${fmt(S.spent[q.n]||0)}</div><div class="more">${q.more}</div>`:'';
  return `<article class="q" id="q${q.n}"><div class="qh"><span class="qn">ข้อ ${q.n}</span><span class="mono lec">${D.lec[q.lec]}</span></div>${q.stem}<div class="opts">${opts}</div>${v}</article>`;
}
function mcq(){

  cur=Math.min(cur,ls.length-1);
  const q=ls[cur];track(q);
  const left=D.qs.filter(x=>!done(x)).length;
  const last=cur===ls.length-1;
  const dots=ls.map((x,i)=>`<button class="dot ${done(x)?(S.pick[x.n]===x.ans?'ok':'no'):''} ${i===cur?'cur':''}" data-go="${i}" aria-label="ข้อ ${x.n}">${x.n}</button>`).join('');
  return `${qHTML(q)}
  <div class="nav"><button class="btn" data-act="prev" ${cur?'':'disabled'}>← ก่อนหน้า</button>
  <span class="pos">${cur+1} / ${ls.length}${wrongOnly?' · ทวนข้อผิด':''}</span>
  ${last?`<button class="btn primary" data-mode="sum">ดูสรุปผล</button>`:`<button class="btn ${done(q)?'primary':''}" data-act="next">${done(q)?'ถัดไป →':'ข้าม →'}</button>`}</div>
  <div class="dots">${dots}</div>

  <span class="row"><button class="btn" data-act="wrong" aria-pressed="${wrongOnly}">${wrongOnly?'แสดงทุกข้อ':'ทวนเฉพาะข้อผิด'}</button><button class="btn" data-act="reset">เริ่มใหม่</button></span></div>`;
}
function summary(){

  const wrong=ans.filter(q=>S.pick[q.n]!==q.ans);
  const rows=D.lec.map((n,i)=>{const [r,t]=s.by[i];const all=D.qs.filter(q=>q.lec===i).length;
    return `<tr><td>${n}</td><td style="white-space:nowrap">${r}/${t}<small> จาก ${all}</small></td><td>${t?Math.round(r/t*100)+'%':'–'}</td><td><div class="bar"><i style="width:${t?r/t*100:0}%"></i></div></td></tr>`}).join('');
  const wl=wrong.map(q=>{const o=S.order[q.n],p=S.pick[q.n];
    return `<div class="wr"><div class="qh"><span class="qn">ข้อ ${q.n}</span><span class="mono lec">${D.lec[q.lec]} · ${fmt(S.spent[q.n]||0)}</span></div>${q.stem}
    <div class="you"><small>คุณตอบ ${L[o.indexOf(p)]}</small><br>${q.opts[p]}<br><small>${q.why[p]}</small></div>

    <button class="btn" data-jump="${q.n}">เปิดข้อนี้ + คำอธิบายเต็ม</button></div>`}).join('');
  return `<section class="card sum"><h2>สรุปผล</h2>
  <div class="stats"><div><b>${s.r}/${s.t}</b><span>ถูก / ทำแล้ว (จาก 63)</span></div>
  <div><b>${s.t?Math.round(s.r/s.t*100):0}%</b><span>ความแม่น</span></div>
  <div><b>${fmt(tt)}</b><span>เวลารวม</span></div>

  <div class="tw"><table><thead><tr><th>หมวด</th><th>ถูก/ทำ</th><th>%</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>

  ${wrong.length?'<div class="nav"><button class="btn primary" data-act="drill">ทำซ้ำเฉพาะข้อที่ผิด</button></div>':''}</section>`;

function render(){

      D.saq.map(s=>`<details class="card"><summary><span class="mono lec">${s.id}</span> ${s.see}</summary><div class="a"><b>${s.ans}</b><br>${s.key}</div></details>`).join('');
    else $('main').innerHTML=`<div class="card"><div class="tw"><table><thead><tr><th>ตัวย่อ</th><th>ชื่อเต็ม</th></tr></thead><tbody>${D.gl.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table></div></div>`;
  }

const go=i=>{cur=i;render();scrollTo(0,0)};
function pick(n,o){if(S.pick[n]!==undefined)return;flush();S.pick[n]=o;save();render()}
document.addEventListener('click',e=>{

  else if(t.dataset.jump){mode='mcq';lec=-1;wrongOnly=false;go(D.qs.findIndex(q=>q.n===+t.dataset.jump))}
  else if(a==='prev')go(cur-1);

  else if(a==='drill'){mode='mcq';lec=-1;wrongOnly=true;go(0)}
  else if(a==='reset'){
    if(t.dataset.sure){shownN=null;S=blank();shuffle();save();wrongOnly=false;lec=-1;go(0)}
    else{t.dataset.sure=1;t.textContent='ยืนยันล้างคำตอบ + เวลา?';setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent='เริ่มใหม่'}},3000)}
  }
});
document.addEventListener('keydown',e=>{
  if(mode!=='mcq'||e.metaKey||e.ctrlKey||e.altKey)return;
  const ls=list(),q=ls[cur];if(!q)return;
  const k=e.key.toUpperCase(),i='12345'.indexOf(k)>=0?'12345'.indexOf(k):L.indexOf(k);
  if(i>=0&&k.length===1)pick(q.n,S.order[q.n][i]);
  else if(e.key==='ArrowRight'&&cur<ls.length-1)go(cur+1);
  else if(e.key==='ArrowLeft'&&cur>0)go(cur-1);
});
render();
</script>
