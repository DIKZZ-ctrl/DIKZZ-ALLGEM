<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Endocrine Exam 1 Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f5f3f8;--surface:#fff;--ink:#1e1b2e;--muted:#67627c;--line:#e2deec;
  --hema:#34306b;--hema-soft:#ebe9f7;--eosin:#c23d69;--eosin-soft:#fbe8ef;
  --good:#1d7f53;--good-soft:#e3f4ec;--bad:#b83227;--bad-soft:#fbe7e5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#14121d;--surface:#1d1a29;--ink:#ece9f4;--muted:#a19cb5;--line:#302c42;
  --hema:#aea7f2;--hema-soft:#282443;--eosin:#f07ea4;--eosin-soft:#3a1e2b;
  --good:#5fd09a;--good-soft:#16301f;--bad:#f08a80;--bad-soft:#3a1c1a;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#14121d;--surface:#1d1a29;--ink:#ece9f4;--muted:#a19cb5;--line:#302c42;
  --hema:#aea7f2;--hema-soft:#282443;--eosin:#f07ea4;--eosin-soft:#3a1e2b;
  --good:#5fd09a;--good-soft:#16301f;--bad:#f08a80;--bad-soft:#3a1c1a;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:820px;margin:0 auto}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;text-wrap:balance}
h1 span{color:var(--eosin)}
.sub{color:var(--muted);font-size:13px;margin:2px 0 8px}
@media (max-width:560px){.sub{display:none}h1{font-size:19px;margin-bottom:8px}}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
.tab,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.tab[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--bg)}
.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{white-space:nowrap;flex:none}
.chip small{opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.tools{margin-top:8px;justify-content:space-between}
.btn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;font-size:13px}
.score{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.score b{color:var(--ink)}
main{display:grid;gap:14px;margin-top:16px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.qh{display:flex;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.qn{font-weight:700;color:var(--hema)}
.lec{color:var(--eosin)}
.q p{margin:0 0 8px}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 10px}
.opt:hover:not(:disabled){border-color:var(--hema);background:var(--hema-soft)}
.opt:disabled{cursor:default}
.opt .k{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--muted)}
.opt .why{grid-column:2;font-size:13.5px;color:var(--muted);margin-top:4px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{color:var(--bad)}
.verdict{font-weight:600;margin:10px 0 4px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.more{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:14px}
.more p:last-child{color:var(--muted);font-size:13px}
.tw{overflow-x:auto;margin:6px 0 10px}
table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
th{background:var(--hema-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .see{margin:4px 0 8px}
.card .a{border-left:3px solid var(--eosin);padding-left:10px}
.empty{color:var(--muted);text-align:center;padding:32px}
.note{background:var(--eosin-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .15s,border-color .15s}}
.timer{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.timer b{color:var(--ink);font-weight:500}
.timer .slow{color:var(--bad)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.nav .btn{padding:8px 14px;font-size:14px}
.nav .btn.primary{background:var(--hema);border-color:var(--hema);color:var(--bg)}
.pos{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-variant-numeric:tabular-nums;padding:0}
.dot.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dot.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot.cur{outline:2px solid var(--hema);outline-offset:1px}
.sum h2{font-size:17px;margin:0 0 8px}
.stats{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:6px}
.stats div{display:grid}
.stats b{font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.wr{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.wr .you{border-left:3px solid var(--bad);padding-left:10px;margin:6px 0}
.wr .cor{border-left:3px solid var(--good);padding-left:10px;margin:6px 0}
.wr small{color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--hema)}
</style>

<div class="wrap">
<header>
  <h1>Endocrine <span>Exam 1</span> Mock</h1>
  <div class="sub">63 MCQ + 15 Lab spot · Lec 1–10 · สอบจริง 63 ข้อ / 95 นาที ≈ 90 วินาทีต่อข้อ</div>
  <div class="row" role="tablist">
    <button class="tab" aria-pressed="true" data-mode="mcq">MCQ</button>
    <button class="tab" aria-pressed="false" data-mode="sum">สรุปผล</button>
    <button class="tab" aria-pressed="false" data-mode="saq">Lab spot</button>
    <button class="tab" aria-pressed="false" data-mode="gl">ตัวย่อ</button>
  </div>
  <div id="mcqbar">
    <div class="row scroll" id="chips" style="margin-top:8px"></div>
    <div class="row tools">
      <span class="score" id="score"></span>
      <span class="timer" id="timer"></span>
    </div>
  </div>
</header>
<main id="main"></main>
</div>

<script>
const D={"lec": ["Lec 1 Anatomy", "Lec 2 Histology", "Lec 3 Embryology", "Lec 4 Biochemistry", "Lec 5 Control of secretion", "Lec 6 Hypothalamus–pituitary", "Lec 7 Growth · Thyroid", "Lec 8 Adrenal", "Lec 9 Pancreas · Other", "Lec 10 Aging"], "qs": [{"n": 1, "lec": 0, "stem": "<p>A 45-year-old woman has chronic headache. MRI shows a pituitary macroadenoma that has grown <b>laterally<\/b> into the right cavernous sinus; the optic chiasm is not compressed. Which finding is most likely to appear <b>first<\/b>?<\/p>", "opts": ["Failure of abduction of the right eye with horizontal diplopia", "Right ptosis with a dilated pupil", "Loss of the right corneal reflex", "Numbness over the right cheek and upper lip", "Bitemporal hemianopia"], "why": ["abducent nerve (cranial nerve VI) วิ่ง <b>ผ่านกลางโพรง sinus<\/b> ข้าง internal carotid artery ไม่มีผนังรองรับ → โดนกดก่อน → lateral rectus palsy", "oculomotor nerve (III) อยู่ <b>ผนังด้านข้าง<\/b> ของ sinus → โดนทีหลัง", "ophthalmic division (V1) อยู่ผนังด้านข้าง → โดนทีหลัง", "maxillary division (V2) อยู่ผนังด้านข้างส่วนล่างสุด → โดนทีหลัง", "ต้องโตขึ้น <b>บน<\/b> ไปกด decussating nasal fibres ของ optic chiasm; โจทย์บอกโตด้านข้าง"], "ans": 0, "more": "<p><b>Logic:<\/b> ทิศการโต → โครงสร้างที่ชน · lateral → cavernous sinus → nerve ที่ \"ลอยในเลือด\" เสียก่อน<\/p><p><b>High-yield:<\/b> โตขึ้น = bitemporal hemianopia; โตข้าง = cranial nerve VI ก่อน<\/p><p>📍 01-ANAT หน้า 18, 26<\/p>"}, {"n": 2, "lec": 0, "stem": "<p>A professional singer has a normal speaking voice after thyroidectomy but can no longer reach high notes and her voice tires quickly. Laryngoscopy shows both vocal folds moving normally. Which combination best describes the injured nerve?<\/p>", "opts": ["Recurrent laryngeal nerve — ran with inferior thyroid artery — supplies posterior cricoarytenoid", "External branch of superior laryngeal nerve — ran with superior thyroid artery — supplies cricothyroid", "Internal branch of superior laryngeal nerve — ran with superior thyroid artery — supplies cricothyroid", "Recurrent laryngeal nerve — ran with superior thyroid artery — supplies all intrinsic muscles", "External branch of superior laryngeal nerve — ran with inferior thyroid artery — supplies thyroarytenoid"], "why": ["recurrent laryngeal nerve เสีย → เสียงแหบ breathy ทันทีในการพูด; โจทย์บอกเสียงพูดปกติ", "external branch วิ่งคู่ superior thyroid artery ที่ superior pole → เลี้ยง <b>cricothyroid อย่างเดียว<\/b> (tense vocal fold, เสียงสูง)", "internal branch = sensory เหนือ vocal fold ไม่เลี้ยงกล้ามเนื้อ (⚠️ textbook consensus)", "recurrent laryngeal nerve คู่กับ <b>inferior<\/b> thyroid artery และเลี้ยงทุก intrinsic muscle <b>ยกเว้น<\/b> cricothyroid", "จับคู่ artery ผิด pole"], "ans": 1, "more": "<p><b>Logic:<\/b> เสียงสูงหาย + fold ขยับปกติ → cricothyroid → external branch → superior pole/superior thyroid artery<\/p><p><b>High-yield:<\/b> แหบ = recurrent laryngeal · เสียงสูงหาย = external superior laryngeal<\/p><p>📍 01-ANAT หน้า 33, 35<\/p>"}, {"n": 3, "lec": 0, "stem": "<p>A 68-year-old man has a hoarse, breathy voice for 2 months. He has never had neck surgery. Laryngoscopy shows a paralysed <b>left<\/b> vocal fold, and chest CT shows an aneurysm of the aortic arch. Which anatomical fact best explains this?<\/p>", "opts": ["The left recurrent laryngeal nerve hooks under the aortic arch and has a longer intrathoracic course", "The right recurrent laryngeal nerve hooks under the aortic arch", "The left external branch of the superior laryngeal nerve descends into the thorax", "The left vagus nerve ends at the aortic arch before giving laryngeal branches", "The left recurrent laryngeal nerve hooks around the left subclavian artery"], "why": ["left recurrent laryngeal nerve อ้อม <b>aortic arch<\/b> → เส้นทางใน thorax ยาว → โรคในอก (aneurysm, tumour) ทำให้ left vocal fold palsy", "right อ้อม <b>right subclavian artery<\/b>", "external branch อยู่ในคอ ไม่ลงอก และไม่ทำให้แหบ", "vagus ยังลงต่อไปถึงช่องท้อง; recurrent laryngeal nerve แตกจาก vagus ตรง arch", "subclavian = ฝั่งขวา"], "ans": 0, "more": "<p><b>High-yield:<\/b> left vocal fold palsy ไม่มีประวัติผ่าตัดคอ → คิดถึงรอยโรคในอก<\/p><p>📍 01-ANAT หน้า 34<\/p>"}, {"n": 4, "lec": 0, "stem": "<p>During a low tracheostomy below the thyroid isthmus in a child, the surgeon meets brisk <b>pulsatile<\/b> bleeding from a midline vessel ascending on the anterior surface of the trachea. Which vessel was most likely cut?<\/p>", "opts": ["Inferior thyroid artery from the thyrocervical trunk", "Superior thyroid artery from the external carotid artery", "Thyroid ima artery from the brachiocephalic trunk or aortic arch", "Anterior glandular branch of the superior thyroid artery", "Inferior thyroid vein draining to the brachiocephalic vein"], "why": ["inferior thyroid artery มาจากด้านข้าง ผ่าน <b>หลัง carotid sheath<\/b> ไป inferior pole ไม่ใช่แนวกลางหน้า trachea", "ไป superior pole อยู่สูง", "thyroid ima artery (มีบางคน) ขึ้นจาก brachiocephalic trunk/aortic arch <b>วิ่งบนหน้า trachea<\/b> → เสี่ยงใน low tracheostomy", "anastomose ข้าม <b>ขอบบน<\/b> isthmus ไม่ใช่ใต้ isthmus", "เป็น vein ก็อยู่หน้า trachea จริง แต่โจทย์บอก <b>pulsatile<\/b> = artery"], "ans": 2, "more": "<p><b>High-yield:<\/b> low tracheostomy + pulsatile midline bleed = thyroid ima artery<\/p><p>📍 01-ANAT หน้า 31<\/p>"}, {"n": 5, "lec": 0, "stem": "<p>During total thyroidectomy, the surgeon ligates a vein that leaves the <b>lower pole<\/b> and descends in front of the trachea. Into which vessel does this vein normally drain?<\/p>", "opts": ["Internal jugular vein", "External jugular vein", "Brachiocephalic vein", "Subclavian vein", "Facial vein"], "why": ["รับ superior + <b>middle<\/b> thyroid vein", "ไม่รับ thyroid vein", "inferior thyroid vein → right/left brachiocephalic vein", "ไม่ใช่ปลายทาง", "ไม่ใช่ปลายทางตามสไลด์"], "ans": 2, "more": "<p><b>Logic:<\/b> vein ไม่เดินตาม artery — มี middle thyroid vein แต่ <b>ไม่มี middle thyroid artery<\/b><\/p><p><b>High-yield:<\/b> superior/middle → internal jugular · inferior → brachiocephalic<\/p><p>📍 01-ANAT หน้า 32<\/p>"}, {"n": 6, "lec": 0, "stem": "<p>A student is suddenly frightened and his plasma epinephrine rises within seconds. Which pathway <b>directly<\/b> triggers secretion from adrenal chromaffin cells?<\/p>", "opts": ["Postganglionic sympathetic fibres from the coeliac ganglion", "Preganglionic sympathetic fibres (T8–L1) that end directly on chromaffin cells", "Parasympathetic fibres of the vagus nerve", "Hypothalamic releasing hormone carried by a portal system", "Adrenocorticotropic hormone from the anterior pituitary"], "why": ["ผ่าน prevertebral plexus <b>โดยไม่ synapse<\/b>; chromaffin cells เองคือ postganglionic neuron ที่ไม่มี axon", "preganglionic sympathetic (T8–L1) → chromaffin cell โดยตรง → หลั่งเข้าเลือดทันที", "medulla ไม่ใช้ parasympathetic", "portal system (hypophyseal) ใช้กับ anterior pituitary", "adrenocorticotropic hormone คุม cortex; medulla \"bypass pituitary\""], "ans": 1, "more": "<p><b>Logic:<\/b> neural crest → chromaffin = modified sympathetic ganglion → ไม่มี synapse กลาง → ตอบสนองทันที<\/p><p><b>High-yield:<\/b> thyroid nerve = vasomotor (คุมหลอดเลือด) · adrenal medulla nerve = secretomotor (คุมการหลั่ง)<\/p><p>📍 01-ANAT หน้า 3, 11, 32, 47<\/p>"}, {"n": 7, "lec": 0, "stem": "<p>A 35-year-old man has a suprasellar tumour removed that had invaded the <b>tuberal<\/b> (middle) hypothalamus. Afterwards he eats uncontrollably and gains weight rapidly. His temperature control and urine output are normal. Which nucleus was most likely damaged?<\/p>", "opts": ["Supraoptic nucleus", "Ventromedial nucleus", "Suprachiasmatic nucleus", "Preoptic/anterior hypothalamic region", "Mammillary nuclei"], "why": ["supraoptic เสีย → central diabetes insipidus (ปัสสาวะมาก) — โจทย์บอกปกติ", "ventromedial (medial zone, tuberal region) = satiety → เสีย → กินไม่หยุด → obesity", "suprachiasmatic = circadian rhythm (periventricular zone, anterior)", "anterior hypothalamus เสีย → heat-loss หาย → hyperthermia", "mammillary region = posterior; ⚠️ เกี่ยว memory (textbook consensus)"], "ans": 1, "more": "<p><b>High-yield:<\/b> ระบุ nucleus ต้องบอกทั้ง zone + region: ventromedial = medial zone × tuberal region<\/p><p>📍 01-ANAT หน้า 10, 12<\/p>"}, {"n": 8, "lec": 0, "stem": "<p>A 62-year-old man has progressive <b>painless<\/b> jaundice. CT shows a mass in the <b>head<\/b> of the pancreas. Which anatomical relation best explains the jaundice?<\/p>", "opts": ["The bile duct runs through the pancreatic head and joins the main pancreatic duct at the hepatopancreatic ampulla", "The portal vein forms behind the pancreatic head and congests the liver", "The accessory pancreatic duct drains bile through the minor papilla", "The pancreatic head lies in the splenorenal ligament beside the liver", "The tumour obstructs the superior mesenteric artery, causing hepatic ischaemia"], "why": ["duct ของ pancreas ร่วมกับ bile duct <b>ภายใน head<\/b> → ก้อนที่ head กด bile duct → painless obstructive jaundice", "portal vein เกิดหลัง <b>neck<\/b> ไม่ใช่ head; และ portal obstruction ทำ portal hypertension ไม่ใช่ jaundice", "accessory duct ไม่นำ bile", "splenorenal ligament ห่อ <b>tail<\/b>", "ตับได้เลือดหลักจาก celiac/portal ไม่ใช่ superior mesenteric artery"], "ans": 0, "more": "<p><b>High-yield:<\/b> head → bile duct → painless jaundice; head + duodenum ใช้ arcade ร่วม → ต้องตัดคู่ (pancreaticoduodenectomy)<\/p><p>📍 01-ANAT หน้า 50–51, 54<\/p>"}, {"n": 9, "lec": 0, "stem": "<p>During left adrenalectomy, the surgeon ligates the small arteries descending onto the <b>upper<\/b> part of the gland from the diaphragm. These superior suprarenal arteries arise from the:<\/p>", "opts": ["Abdominal aorta directly", "Renal artery", "Inferior phrenic artery", "Coeliac trunk", "Superior mesenteric artery"], "why": ["aorta ตรง → <b>middle<\/b> suprarenal artery", "renal artery → <b>inferior<\/b> suprarenal arteries", "inferior phrenic artery → superior suprarenal arteries", "ไม่ใช่แหล่งเลือดของ adrenal ในสไลด์", "ไม่ใช่แหล่งเลือดของ adrenal ในสไลด์"], "ans": 2, "more": "<p><b>High-yield:<\/b> 3 arteries in (phrenic–aorta–renal = บน–กลาง–ล่าง), 1 vein out (ขวาสั้นเข้า inferior vena cava, ซ้ายยาวเข้า left renal vein)<\/p><p>📍 01-ANAT หน้า 45<\/p>"}, {"n": 10, "lec": 1, "stem": "<p>A biopsy of the posterior pituitary shows unmyelinated nerve fibres, swollen axon endings full of granules, and small <b>stellate or fusiform cells with dense nuclei and lipochrome pigment<\/b> whose processes wrap capillaries. What are these small cells?<\/p>", "opts": ["Pituicytes — glial cells that support the axons", "Chromophobes — degranulated secretory cells", "Herring bodies — storage sites of antidiuretic hormone", "Pinealocytes — melatonin-secreting cells", "Basophils — cells that synthesise antidiuretic hormone"], "why": ["pituicyte = glial cell คล้าย astrocyte, stellate/fusiform, dense nucleus, lipid droplet + lipochrome pigment", "chromophobe อยู่ pars distalis (anterior)", "Herring body = <b>ปลาย axon โป่ง<\/b> ไม่ใช่เซลล์", "อยู่ pineal gland", "posterior pituitary <b>ไม่สร้าง<\/b> hormone; antidiuretic hormone สร้างใน supraoptic/paraventricular nucleus"], "ans": 0, "more": "<p><b>High-yield:<\/b> pars nervosa = axon + Herring bodies + pituicytes, ไม่มีเซลล์หลั่ง<\/p><p>📍 02-HISTO หน้า 26 · 03-HISTO หน้า 7<\/p>"}, {"n": 11, "lec": 1, "stem": "<p>In an adrenal section, the <b>innermost cortical layer<\/b> next to the medulla shows small cells in <b>anastomosing cords<\/b>, deeply acidophilic cytoplasm, few lipid droplets, and brown <b>lipofuscin<\/b> granules. What is the main product of this layer?<\/p>", "opts": ["Aldosterone", "Cortisol as its principal hormone", "Dehydroepiandrosterone and androstenedione", "Epinephrine and norepinephrine", "Calcitonin"], "why": ["zona glomerulosa — ชั้นนอกสุด เซลล์เป็น arch/cluster", "zona fasciculata — ชั้นกลาง หนาสุด ~80% เซลล์ foamy (lipid มาก) ใน straight cords; reticularis สร้าง glucocorticoid ได้เล็กน้อยเท่านั้น", "zona reticularis — anastomosing cords, acidophilic เข้มสุด, lipofuscin → adrenal androgens", "medulla — chromaffin cells ไม่ใช่ cortex", "thyroid C cells"], "ans": 2, "more": "<p><b>High-yield:<\/b> G-F-R = Salt-Sugar-Sex · arch → straight cords (foamy) → network (lipofuscin)<\/p><p>📍 02-HISTO หน้า 32 · 03-HISTO หน้า 16–17<\/p>"}, {"n": 12, "lec": 1, "stem": "<p>A thyroid biopsy is taken from a patient with weight loss, fine tremor and exophthalmos. Which histological appearance is expected?<\/p>", "opts": ["Large round follicles lined by flattened cells with homogeneous colloid", "Small irregular follicles lined by cuboidal to low columnar cells with scalloped colloid", "Cords of polygonal cells between sinusoids with no colloid", "Pale clusters of cells surrounded by darker acini", "Nests of large basophilic cells that turn brown with chromate"], "why": ["inactive stage (ทำงานน้อย)", "active stage: follicle เล็ก, เซลล์สูงขึ้น, colloid ขอบหยัก (ถูก endocytose ไปใช้) — เข้ากับ hyperthyroidism (Graves)", "ลักษณะ cords + sinusoid เป็นต่อมอื่น (เช่น parathyroid/adrenal)", "islet of Langerhans ในตับอ่อน", "chromaffin cells ของ adrenal medulla"], "ans": 1, "more": "<p><b>Logic:<\/b> thyroid-stimulating immunoglobulin กระตุ้น receptor → follicular cell ทำงาน → เซลล์สูง + colloid ถูกดึงใช้<\/p><p><b>High-yield:<\/b> active = small follicle + tall cell + scalloped colloid<\/p><p>📍 02-HISTO หน้า 17 · 03-HISTO หน้า 12–13<\/p>"}, {"n": 13, "lec": 1, "stem": "<p>A thyroid section shows <b>large pale cells<\/b> lying between follicles; they do not touch the colloid. Which stimulus increases secretion from these cells, and what do they secrete?<\/p>", "opts": ["Hypocalcaemia — parathyroid hormone", "Hypercalcaemia — calcitonin", "Thyroid-stimulating hormone — thyroxine", "Hypoglycaemia — glucagon", "Hyperglycaemia — somatostatin"], "why": ["parathyroid hormone มาจาก chief cells ของ parathyroid", "parafollicular (C) cells: ใหญ่ ซีด อยู่ระหว่าง follicle → calcitonin เมื่อ calcium สูง → ยับยั้ง osteoclast", "follicular cells ที่บุ colloid", "alpha cells ของ islet", "delta cells ของ islet"], "ans": 1, "more": "<p><b>High-yield:<\/b> C cells = neural crest (ต่างจาก follicular cells = endoderm) → คนละ lineage คนละ tumour<\/p><p>📍 02-HISTO หน้า 16, 18 · 03-HISTO หน้า 12<\/p>"}, {"n": 14, "lec": 1, "stem": "<p>A 45-year-old man has enlarging hands, jaw and nose; his epiphyses closed long ago. The pituitary tumour cells on H&amp;E are most likely:<\/p>", "opts": ["Basophils located mainly in the centre of the pars distalis", "Acidophils (somatotrophs), which normally lie mainly at the periphery of the pars distalis", "Chromophobes of the pars tuberalis", "Pituicytes of the pars nervosa", "Basophilic cells lining colloid cysts of the pars intermedia"], "why": ["basophils = corticotroph, thyrotroph, gonadotroph (ตรงกลาง)", "acromegaly = growth hormone excess หลัง epiphysis ปิด → somatotroph = acidophil (ส้มแดง, ขอบต่อม)", "pars tuberalis = cords basophilic รอบ stalk (gonadotroph บางส่วน)", "glial cells ไม่สร้าง hormone", "pars intermedia → melanocyte-stimulating hormone (หน้าที่ในคนไม่ชัด)"], "ans": 1, "more": "<p><b>High-yield:<\/b> acidophil = growth hormone + prolactin · basophil = \"B-FLAT\" (follicle-stimulating hormone, luteinizing hormone, adrenocorticotropic hormone, thyroid-stimulating hormone)<\/p><p>📍 02-HISTO หน้า 21, 25 · 03-HISTO หน้า 5, 8–9<\/p>"}, {"n": 15, "lec": 1, "stem": "<p>Adrenal medulla tissue fixed in a solution containing <b>chromium salts<\/b> turns brown. Which statement about these cells is correct?<\/p>", "opts": ["They are modified postganglionic sympathetic neurons whose catecholamine granules are oxidised by chromate", "They are mesoderm-derived steroid-secreting cells rich in lipid droplets", "They are glial cells supporting ganglion cells of the medulla", "H&amp;E cytoplasmic colour reliably separates epinephrine-secreting from norepinephrine-secreting cells", "Their secretion is controlled mainly by adrenocorticotropic hormone"], "why": ["chromaffin cell = postganglionic neuron ดัดแปลง, granule catecholamine ทำปฏิกิริยา chromate → สีน้ำตาล (ที่มาของชื่อ)", "บรรยาย cortex (mesoderm)", "ใน medulla มี sympathetic ganglion cell (multipolar neuron) ปน แต่ chromaffin ไม่ใช่ glia", "handout ระบุชัด: สี H&amp;E <b>แยกไม่แม่นยำ<\/b>", "คุมโดย preganglionic sympathetic neuron (neural) ไม่ใช่ hormone"], "ans": 0, "more": "<p><b>High-yield:<\/b> chromaffin = chrome + affinity; neural control, ไม่ใช่ pituitary<\/p><p>📍 02-HISTO หน้า 33 · 03-HISTO หน้า 18–19<\/p>"}, {"n": 16, "lec": 2, "stem": "<p>A 3-day-old infant has neonatal seizures and low serum calcium. Echocardiography shows truncus arteriosus; he has a short philtrum and low-set notched ears. Later he has recurrent fungal infections. A 22q11.2 microdeletion is found. Failure of which structures best explains the endocrine and immune findings?<\/p>", "opts": ["Pharyngeal pouches 3 and 4", "Pharyngeal pouches 1 and 2", "Thyroid diverticulum at the foramen cecum", "Rathke pouch", "Dorsal pancreatic bud"], "why": ["DiGeorge syndrome: pouch 3 (thymus + inferior parathyroid) + pouch 4 (superior parathyroid) ไม่ differentiate → hypocalcaemia + T-cell defect; TBX1 ใน 22q11.2", "pouch 1 = tympanic cavity/pharyngotympanic tube; pouch 2 = palatine tonsil", "ให้ follicular cells → hypothyroidism ไม่ใช่ hypocalcaemia", "ให้ adenohypophysis", "ให้ pancreas body/tail"], "ans": 0, "more": "<p><b>Logic:<\/b> neural crest ↔ pharyngeal endoderm signalling พัง → pouch 3/4 + arch 1 (หน้า) + conotruncal septum (หัวใจ) เสียพร้อมกัน<\/p><p><b>High-yield:<\/b> CATCH-22 ⚠️ (mnemonic นอกสไลด์: Cardiac, Abnormal facies, Thymic hypoplasia, Cleft, Hypocalcaemia, 22q11)<\/p><p>📍 04-DEV หน้า 38–39, 52<\/p>"}, {"n": 17, "lec": 2, "stem": "<p>A tumour of the thyroid secretes large amounts of <b>calcitonin<\/b>. The normal cells from which it arises reached the thyroid by which route?<\/p>", "opts": ["Neural crest cells migrating into the ultimopharyngeal body (pouch 4), which fuses with the thyroid", "Endoderm descending from the foramen cecum along the thyroglossal duct", "Endoderm of the dorsal part of pouch 3 descending with the thymus", "Mesoderm between the dorsal mesentery and the gonad", "Oral ectoderm of the roof of the stomodeum"], "why": ["C cells = neural crest → เข้า ultimopharyngeal body (ventral pouch 4) → fuse กับ thyroid → กระจายเป็น parafollicular cells; MASH1 คุม differentiation", "เส้นทางของ follicular cells", "inferior parathyroid", "adrenal cortex", "Rathke pouch → adenohypophysis"], "ans": 0, "more": "<p><b>High-yield:<\/b> 3 dual-origin glands: pituitary (ปาก + สมอง), thyroid (endoderm + neural crest), adrenal (mesoderm + neural crest)<\/p><p>📍 04-DEV หน้า 25, 35, 53<\/p>"}, {"n": 18, "lec": 2, "stem": "<p>A newborn vomits <b>bile-stained<\/b> fluid from the first day. Plain X-ray shows a \"double bubble\". At surgery, a flat band of pancreatic tissue encircles the second part of the duodenum. What developmental error caused this?<\/p>", "opts": ["A bifid ventral pancreatic bud grew around the duodenum and fused with the dorsal bud", "The dorsal and ventral pancreatic ducts failed to fuse", "Pancreatic tissue developed in an ileal (Meckel) diverticulum", "The dorsal bud overgrew to form an extra tail", "The ventral bud failed to develop"], "why": ["annular pancreas: ventral bud แยกสองแฉก อ้อมรอบ duodenum → atresia/stenosis; สัมพันธ์ Down syndrome", "pancreas divisum — ไม่รัด duodenum", "ectopic pancreas — มักไม่มีอาการ", "ไม่ใช่กลไกที่สอน", "จะขาด uncinate/lower head ไม่เกิดวงแหวน"], "ans": 0, "more": "<p><b>High-yield:<\/b> bilious vomiting day 1 + double bubble → duodenal obstruction → คิด annular pancreas<\/p><p>📍 04-DEV หน้า 51<\/p>"}, {"n": 19, "lec": 2, "stem": "<p>ERCP in an adult shows that most of the pancreas drains through the <b>minor<\/b> duodenal papilla, and the main and accessory ducts do not communicate. Which duct carries most of the pancreatic secretion in this person?<\/p>", "opts": ["The duct of the ventral bud opening at the major papilla", "The duct of the dorsal bud (accessory duct) opening at the minor papilla", "The common bile duct", "A normal main duct formed by ventral duct plus distal dorsal duct", "The thyroglossal duct remnant"], "why": ["ventral bud เล็ก → ระบาย uncinate + lower head เท่านั้น", "pancreas divisum (~9%): ducts ไม่ fuse → dorsal bud (body, tail, upper head) ระบายทาง accessory duct → minor papilla", "bile duct นำ bile", "คือภาวะปกติ — โจทย์บอกไม่เชื่อมกัน", "ไม่เกี่ยว (ตัวลวง)"], "ans": 1, "more": "<p><b>High-yield:<\/b> main duct (Wirsung) = ventral duct + distal dorsal duct · accessory (Santorini) = proximal dorsal duct<\/p><p>📍 04-DEV หน้า 48–49<\/p>"}, {"n": 20, "lec": 2, "stem": "<p>A 2-year-old has an abdominal mass arising from the adrenal <b>medulla<\/b> that secretes catecholamine metabolites. From which embryonic tissue does this part of the gland arise, and which other endocrine cell shares that origin?<\/p>", "opts": ["Mesoderm — cells of the zona glomerulosa", "Neural crest — parafollicular cells of the thyroid", "Endoderm — chief cells of the parathyroid", "Neuroectoderm of the diencephalon — pituicytes", "Oral ectoderm — somatotrophs"], "why": ["mesoderm = adrenal cortex", "medulla = neural crest (เนื้องอกเด็ก = neuroblastoma, ผู้ใหญ่ = pheochromocytoma); thyroid C cells ก็ neural crest", "parathyroid = endoderm แต่ medulla ไม่ใช่", "ให้ neurohypophysis", "ให้ adenohypophysis"], "ans": 1, "more": "<p><b>High-yield:<\/b> neural crest endocrine = adrenal medulla + thyroid C cells (เท่านั้นในบทนี้)<\/p><p>📍 04-DEV หน้า 3, 41–42, 53<\/p>"}, {"n": 21, "lec": 2, "stem": "<p>A mother with poorly controlled diabetes delivers a 4.8-kg baby. Two hours after birth the baby's blood glucose is very low. What best explains the hypoglycaemia?<\/p>", "opts": ["Fetal beta cells hypertrophied under chronic high glucose and keep secreting insulin after the maternal glucose supply is cut", "Maternal insulin crossed the placenta and persists in the baby", "Fetal alpha cells failed to develop", "The fetal adrenal cortex produced excess cortisol", "Fetal liver glycogen was absent because the fetus lacked insulin"], "why": ["glucose แม่ข้ามรก → fetal beta cell hypertrophy → insulin สูง → macrosomia; ตัดสาย → glucose หาย แต่ insulin ยังสูง → rebound hypoglycaemia", "⚠️ insulin แม่ไม่ข้ามรก (textbook consensus)", "ไม่มีข้อมูลสนับสนุน", "cortisol สูง → glucose สูง ไม่ใช่ต่ำ", "ทารกมี insulin <b>เกิน<\/b> ไม่ใช่ขาด"], "ans": 0, "more": "<p><b>High-yield:<\/b> fetal beta cell เริ่มหลั่ง insulin ~week 10; glucagon/somatostatin cells เกิดก่อน beta cells<\/p><p>📍 04-DEV หน้า 50<\/p>"}, {"n": 22, "lec": 3, "stem": "<p>Both adrenocorticotropic hormone and angiotensin II increase steroid output by accelerating the <b>rate-limiting step<\/b> of adrenal steroidogenesis. Which enzyme and site are involved?<\/p>", "opts": ["Cholesterol side-chain cleavage enzyme (desmolase) in mitochondria", "21-hydroxylase in smooth endoplasmic reticulum", "Aldosterone synthase in mitochondria", "3-beta-hydroxysteroid dehydrogenase in smooth endoplasmic reticulum", "Aromatase in smooth endoplasmic reticulum"], "why": ["cholesterol (27 C) → pregnenolone (21 C) โดย desmolase ใน mitochondria = rate-limiting; adrenocorticotropic hormone ย้าย cholesterol เข้า inner mitochondrial membrane", "ขั้นกลางทาง (smooth endoplasmic reticulum) ไม่ใช่ rate-limiting", "ขั้นสุดท้ายของ aldosterone เท่านั้น", "ขั้นกลาง", "androgen → estrogen (ovary/adipose)"], "ans": 0, "more": "<p><b>High-yield:<\/b> steroid เก็บใน vesicle ไม่ได้ → สร้างเมื่อจำเป็น → คุมที่ rate-limiting step<\/p><p>📍 05-BIOCHEM หน้า 17, 54 · 11-PHYSIO หน้า 7, 10<\/p>"}, {"n": 23, "lec": 3, "stem": "<p>A 3-year-old 46,XX girl has clitoromegaly, blood pressure above the normal range for age, serum potassium 3.0 mmol/L, <b>low<\/b> plasma renin activity and a raised 11-deoxycorticosterone level. Which enzyme is deficient?<\/p>", "opts": ["21-hydroxylase", "11-beta-hydroxylase", "17-alpha-hydroxylase", "Aromatase", "Cholesterol side-chain cleavage enzyme"], "why": ["virilization ✓ แต่ <b>salt wasting<\/b>: hypotension, hyperkalemia, renin สูง", "cortisol ↓ → adrenocorticotropic hormone ↑ → 11-deoxycorticosterone คั่ง (มีฤทธิ์ mineralocorticoid) → hypertension, hypokalemia, renin ↓; sex steroid ↑ → virilization", "hypertension ✓ แต่ sex hormone <b>ต่ำ<\/b> → ไม่มี virilization", "ไม่ทำให้ hypertension", "ขาดทุก steroid → salt wasting"], "ans": 1, "more": "<p><b>Logic (จำตามสไลด์):<\/b> เอนไซม์<b>ขึ้นต้นด้วย 1<\/b> (11β, 17α) → hypertension · <b>ลงท้ายด้วย 1<\/b> (21, 11β) → virilization ในเพศหญิง → 11β ได้ทั้งคู่<\/p><p><b>High-yield:<\/b> ทุกชนิด autosomal recessive + bilateral adrenal hyperplasia + hyperpigmentation (adrenocorticotropic hormone/melanocyte-stimulating hormone สูง)<\/p><p>📍 05-BIOCHEM หน้า 61<\/p>"}, {"n": 24, "lec": 3, "stem": "<p>A 16-year-old 46,XX girl has no breast development and primary amenorrhoea. Blood pressure is 160/100 mmHg, serum potassium is low and serum androstenedione is low. Which enzyme is deficient?<\/p>", "opts": ["21-hydroxylase", "11-beta-hydroxylase", "17-alpha-hydroxylase", "5-alpha-reductase", "Aldosterone synthase"], "why": ["androgen สูง + salt wasting", "androgen <b>สูง<\/b> → virilization", "pathway ไป cortisol + sex steroid ถูกปิด → substrate ไหลไปทาง mineralocorticoid → hypertension, hypokalemia; sex hormones ↓ → XX ไม่มี secondary sexual development (XY: ambiguous genitalia)", "testosterone → dihydrotestosterone; ไม่กระทบ blood pressure", "aldosterone ↓ → ไม่เกิด hypertension"], "ans": 2, "more": "<p><b>High-yield:<\/b> 17α = \"ความดันสูง + ไม่เป็นหนุ่มเป็นสาว\"<\/p><p>📍 05-BIOCHEM หน้า 17, 61<\/p>"}, {"n": 25, "lec": 3, "stem": "<p>Which reaction produces <b>thyroxine<\/b> during thyroid hormone synthesis?<\/p>", "opts": ["Coupling of monoiodotyrosine with diiodotyrosine on thyroglobulin", "Coupling of two diiodotyrosine residues on thyroglobulin, catalysed by thyroid peroxidase", "Inner-ring deiodination of triiodothyronine by deiodinase type 3", "Iodination of free tyrosine in the follicular cell cytoplasm", "Coupling of two monoiodotyrosine residues in the lysosome"], "why": ["ได้ triiodothyronine (T3)", "diiodotyrosine + diiodotyrosine = tetraiodothyronine (thyroxine) บน thyroglobulin ใน colloid; thyroid peroxidase ทำ oxidation + iodination + coupling", "thyroxine → reverse triiodothyronine (inactive)", "iodination เกิดกับ tyrosine <b>บน thyroglobulin<\/b> ที่ผิว apical/colloid", "lysosome = proteolysis ปล่อย hormone ไม่ใช่ coupling"], "ans": 1, "more": "<p><b>High-yield:<\/b> ลำดับ: iodide trap → oxidation → iodination → coupling → endocytosis → proteolysis → release<\/p><p>📍 05-BIOCHEM หน้า 44–46<\/p>"}, {"n": 26, "lec": 3, "stem": "<p>A patient with isolated adrenocorticotropic hormone deficiency has an intact adrenal medulla, yet the proportion of <b>epinephrine<\/b> (relative to norepinephrine) released during stress is reduced. Which enzyme step is most affected?<\/p>", "opts": ["Tyrosine hydroxylase", "Aromatic amino acid (dihydroxyphenylalanine) decarboxylase", "Dopamine beta-hydroxylase", "Phenylethanolamine-N-methyltransferase", "3-beta-hydroxysteroid dehydrogenase"], "why": ["rate-limiting แต่กระตุ้นโดย sympathetic stimulation ไม่ขึ้นกับ cortisol", "dihydroxyphenylalanine → dopamine", "dopamine → norepinephrine (ใน granule) — norepinephrine ยังปกติ", "norepinephrine → epinephrine ต้องใช้ phenylethanolamine-N-methyltransferase ซึ่ง transcription <b>ต้องการ cortisol ความเข้มข้นสูง<\/b> ที่ไหลจาก cortex → medulla", "enzyme ของ steroid ไม่ใช่ catecholamine"], "ans": 3, "more": "<p><b>High-yield:<\/b> cortisol ต่ำจากสาเหตุใดก็ตาม → epinephrine ต่ำ<\/p><p>📍 05-BIOCHEM หน้า 62 · 01-ANAT หน้า 46 · 11-PHYSIO หน้า 38<\/p>"}, {"n": 27, "lec": 3, "stem": "<p>Proglucagon is expressed in both pancreatic alpha cells and intestinal L cells. In L cells, prohormone convertase 1/3 cleaves it to release which peptide that <b>stimulates insulin secretion<\/b> after a meal?<\/p>", "opts": ["Glucagon", "Glucagon-like peptide 1", "Glicentin-related pancreatic polypeptide", "C-peptide", "Somatostatin"], "why": ["ตัดโดย prohormone convertase 2 ใน <b>alpha cells<\/b>", "L cells → glucagon-like peptide 1 (incretin) → กระตุ้น beta cell หลั่ง insulin", "ผลผลิตใน alpha cells ไม่มีบทบาท incretin", "มาจาก proinsulin ใน beta cells", "delta cells; ยับยั้ง insulin"], "ans": 1, "more": "<p><b>High-yield:<\/b> gene เดียว + เอนไซม์ตัดต่างกัน = hormone ต่างกันตามเนื้อเยื่อ (เหมือน calcitonin vs calcitonin gene-related peptide ที่ใช้ alternative splicing)<\/p><p>📍 05-BIOCHEM หน้า 47, 71 · 12-PHYSIO หน้า 38<\/p>"}, {"n": 28, "lec": 4, "stem": "<p>A healthy woman at 20 weeks of pregnancy has <b>raised total thyroxine<\/b>, but her free thyroxine and thyroid-stimulating hormone are normal and she is clinically euthyroid. What best explains this?<\/p>", "opts": ["Estrogen increases thyroxine-binding globulin, so more hormone is bound while the free fraction stays under feedback control", "Thyroid-stimulating immunoglobulin is stimulating the thyroid", "A thyroid-stimulating hormone-secreting pituitary adenoma has developed", "Iodine deficiency has increased thyroid hormone synthesis", "Thyroid hormone has lost its binding protein, raising total hormone"], "why": ["estrogen ↑ thyroxine-binding globulin → total ↑ แต่ <b>free hormone<\/b> เท่านั้นที่ออกฤทธิ์และถูก feedback คุม → free ปกติ, thyroid-stimulating hormone ปกติ", "Graves → free ↑, thyroid-stimulating hormone ↓", "thyroid-stimulating hormone จะสูง + free สูง", "ขาด iodine → hormone <b>ต่ำ<\/b>", "binding protein ลด → total <b>ลด<\/b>"], "ans": 0, "more": "<p><b>Logic:<\/b> hormone ที่จับ protein = reservoir; ชะลอ degradation/clearance, กันการกรองทิ้งที่ไต → half-life ยาว<\/p><p><b>High-yield:<\/b> อ่าน thyroid lab ในภาวะที่ binding protein เปลี่ยน → ดู free hormone<\/p><p>📍 06-PHYSIO หน้า 9 · 09-PHYSIO หน้า 6, 12<\/p>"}, {"n": 29, "lec": 4, "stem": "<p>In an adrenalectomised animal given no glucocorticoid, norepinephrine infusion produces only weak vasoconstriction. Giving cortisol restores a normal response, although cortisol alone has no vasoconstrictor effect. This interaction is best described as:<\/p>", "opts": ["Synergistic effect", "Permissive effect", "Antagonistic effect", "Down-regulation", "Positive feedback"], "why": ["synergism = ทั้งสองมีฤทธิ์เอง แล้วรวมกันได้มากกว่าผลรวม", "permissive = hormone หนึ่ง (cortisol) ไม่มีฤทธิ์เอง แต่ทำให้ target ตอบสนองต่ออีกตัว (catecholamine) ได้เต็มที่", "ไม่ได้ต้านกัน", "down-regulation = receptor ลดเมื่อ hormone สูงต่อเนื่อง", "ไม่ใช่วงจร feedback"], "ans": 1, "more": "<p><b>High-yield:<\/b> ตัวอย่างในสไลด์ 2 คู่: estrogen → progesterone (เพิ่ม progesterone receptor ที่มดลูก); glucocorticoid → catecholamine (cardiovascular)<\/p><p>📍 06-PHYSIO หน้า 27–28 · 11-PHYSIO หน้า 15<\/p>"}, {"n": 30, "lec": 4, "stem": "<p>Vasopressin constricts arterioles through V1 receptors. Which intracellular signalling pathway mediates this effect?<\/p>", "opts": ["Adenylyl cyclase → cyclic adenosine monophosphate → protein kinase A", "Phospholipase C → inositol trisphosphate + diacylglycerol → calcium release and protein kinase C", "Receptor guanylyl cyclase → cyclic guanosine monophosphate", "Janus kinase tyrosine phosphorylation", "Nuclear receptor → gene transcription"], "why": ["ใช้กับ <b>V2<\/b> receptor ที่ collecting duct (aquaporin-2)", "V1 → phospholipase C → inositol trisphosphate ปล่อย calcium จาก endoplasmic reticulum → smooth muscle หดตัว", "atrial natriuretic peptide", "growth hormone, prolactin", "steroid, thyroid hormone"], "ans": 1, "more": "<p><b>High-yield:<\/b> hormone เดียว receptor ต่างกัน → second messenger ต่างกัน: vasopressin V1 = inositol trisphosphate, V2 = cyclic adenosine monophosphate<\/p><p>📍 06-PHYSIO หน้า 11–13 · 07-PHYSIO หน้า 14, 17<\/p>"}, {"n": 31, "lec": 4, "stem": "<p>Stretch of the atria releases a hormone whose receptor <b>is itself an enzyme<\/b> in the plasma membrane. Which second messenger does this receptor generate?<\/p>", "opts": ["Cyclic adenosine monophosphate", "Cyclic guanosine monophosphate", "Inositol trisphosphate", "Arachidonic acid metabolites", "Phosphotyrosine through a Janus kinase"], "why": ["ต้องผ่าน G protein + adenylyl cyclase (receptor ไม่ใช่ enzyme เอง)", "atrial natriuretic peptide receptor มี guanylyl cyclase domain → cyclic guanosine monophosphate", "G protein → phospholipase C", "ตัวอย่างในสไลด์คือ thyrotropin-releasing hormone ผ่าน phospholipase A2", "growth hormone: receptor <b>ไม่มี<\/b> kinase เอง ต้องพึ่ง Janus kinase; insulin: receptor เป็น tyrosine kinase เอง"], "ans": 1, "more": "<p><b>High-yield:<\/b> receptor = enzyme: insulin (tyrosine kinase), atrial natriuretic peptide (guanylyl cyclase)<\/p><p>📍 06-PHYSIO หน้า 13<\/p>"}, {"n": 32, "lec": 4, "stem": "<p>A woman has taken high-dose prednisolone for 6 months for rheumatoid arthritis. Her morning adrenocorticotropic hormone is low and imaging shows thin adrenal cortices. Which regulatory mechanism explains this?<\/p>", "opts": ["Long-loop negative feedback suppressing corticotropin-releasing hormone and adrenocorticotropic hormone", "Short-loop feedback of adrenocorticotropic hormone on the hypothalamus", "Ultrashort-loop feedback of corticotropin-releasing hormone on its own neurons", "Positive feedback of cortisol on the pituitary", "Up-regulation of adrenocorticotropic hormone receptors in the adrenal cortex"], "why": ["glucocorticoid (hormone ปลายทาง) ย้อนกด hypothalamus + pituitary = long-loop → adrenocorticotropic hormone ↓ → cortex ขาด trophic effect → ฝ่อ", "short-loop = tropic hormone (adrenocorticotropic hormone) ย้อนกด hypothalamus; ต้นเหตุที่นี่คือยา steroid", "releasing hormone กดตัวเอง", "cortisol ไม่มี positive feedback", "ขัดกับ cortex ฝ่อ"], "ans": 0, "more": "<p><b>Clinical link:<\/b> หยุดยาทันที → cortex ฝ่อสร้าง cortisol ไม่ทัน → adrenal insufficiency รุนแรง<\/p><p><b>High-yield:<\/b> exogenous steroid = long-loop suppression → ต้องค่อย ๆ ลดยา<\/p><p>📍 05-BIOCHEM หน้า 24 · 06-PHYSIO หน้า 21 · 11-PHYSIO หน้า 22<\/p>"}, {"n": 33, "lec": 5, "stem": "<p>A 60-year-old smoker with small cell lung cancer develops the <b>syndrome of inappropriate antidiuretic hormone secretion<\/b>. Which set of results is expected?<\/p>", "opts": ["Serum sodium (mmol/L) <b>125<\/b> · Plasma osmolality (mOsm/kg) <b>255<\/b> · Urine osmolality (mOsm/kg) <b>450<\/b>", "Serum sodium (mmol/L) <b>150<\/b> · Plasma osmolality (mOsm/kg) <b>305<\/b> · Urine osmolality (mOsm/kg) <b>80<\/b>", "Serum sodium (mmol/L) <b>125<\/b> · Plasma osmolality (mOsm/kg) <b>255<\/b> · Urine osmolality (mOsm/kg) <b>60<\/b>", "Serum sodium (mmol/L) <b>140<\/b> · Plasma osmolality (mOsm/kg) <b>285<\/b> · Urine osmolality (mOsm/kg) <b>300<\/b>", "Serum sodium (mmol/L) <b>150<\/b> · Plasma osmolality (mOsm/kg) <b>310<\/b> · Urine osmolality (mOsm/kg) <b>750<\/b>"], "why": ["antidiuretic hormone เกิน → เก็บน้ำ → hyponatremia (&lt;130), plasma osmolality ต่ำ (&lt;270) แต่ปัสสาวะ <b>เข้มข้นเกินควร<\/b> (&gt;300) + urine sodium &gt;20", "diabetes insipidus: เสียน้ำ → sodium/osmolality สูง, ปัสสาวะเจือจาง", "⚠️ primary polydipsia (textbook consensus): ปัสสาวะเจือจางเหมาะสม", "ค่าปกติ (normal osmolality ~285)", "ขาดน้ำ + antidiuretic hormone ตอบสนอง<b>เหมาะสม<\/b>"], "ans": 0, "more": "<p><b>Logic:<\/b> คำว่า inappropriate = plasma เจือจางแต่ปัสสาวะยังเข้มข้น<\/p><p>📍 07-PHYSIO หน้า 19, 21–22<\/p>"}, {"n": 34, "lec": 5, "stem": "<p>Which cellular event <b>directly<\/b> increases the water permeability of the collecting duct after antidiuretic hormone binds its V2 receptor?<\/p>", "opts": ["Insertion of aquaporin-2 into the luminal (apical) membrane of principal cells", "Insertion of aquaporin-3 into the luminal membrane", "Opening of epithelial sodium channels in the proximal tubule", "Activation of sodium-potassium adenosine triphosphatase in the thick ascending limb", "Inositol trisphosphate-mediated calcium release in vascular smooth muscle"], "why": ["V2 (basolateral) → G protein → cyclic adenosine monophosphate → protein kinase A → vesicle aquaporin-2 แทรกที่ apical membrane → น้ำเข้าเซลล์", "aquaporin-3/4 อยู่ <b>basolateral<\/b> (ทางออกของน้ำ)", "ไม่ใช่ target ของ antidiuretic hormone ในสไลด์", "ไม่ใช่กลไกโดยตรง", "กลไก V1 (vasoconstriction)"], "ans": 0, "more": "<p><b>High-yield:<\/b> V2 = cyclic adenosine monophosphate → aquaporin-2 apical → ปัสสาวะเข้มข้น (14–16 L ถูกดูดกลับ เหลือ 1–2 L)<\/p><p>📍 07-PHYSIO หน้า 14–16<\/p>"}, {"n": 35, "lec": 5, "stem": "<p>A patient on long-term <b>lithium<\/b> has polyuria with dilute urine. Plasma antidiuretic hormone is <b>high<\/b>, and desmopressin does not concentrate the urine. Where is the defect?<\/p>", "opts": ["Supraoptic and paraventricular nuclei", "Hypothalamo-hypophyseal tract in the pituitary stalk", "Collecting duct response to antidiuretic hormone", "Excess antidiuretic hormone secretion from the posterior pituitary", "Glucose-induced osmotic diuresis"], "why": ["central diabetes insipidus → antidiuretic hormone <b>ต่ำ<\/b>, desmopressin ได้ผล", "central เช่นกัน", "nephrogenic diabetes insipidus: ไตไม่ตอบสนอง (ยา lithium) → hormone สูงชดเชยแต่ไม่ได้ผล", "จะทำให้ปัสสาวะเข้มข้น", "ต้องมี glucosuria"], "ans": 2, "more": "<p><b>High-yield:<\/b> antidiuretic hormone ต่ำ + ตอบสนอง desmopressin = central · สูง + ไม่ตอบสนอง = nephrogenic<\/p><p>📍 07-PHYSIO หน้า 22 · 02-HISTO หน้า 29<\/p>"}, {"n": 36, "lec": 5, "stem": "<p>Which change is the <b>most sensitive<\/b> stimulus for antidiuretic hormone release (produces release with the smallest percentage change)?<\/p>", "opts": ["1–2% rise in plasma osmolality", "1–2% fall in blood volume", "Ethanol ingestion", "Rise in atrial natriuretic peptide", "Rise in arterial pressure"], "why": ["osmoreceptor ใน hypothalamus ไว: osmolality ↑ 1–2% ก็กระตุ้น", "volume ต้องลด ~10% ถึงกระตุ้น (baroreceptor)", "alcohol <b>ยับยั้ง<\/b>", "<b>ยับยั้ง<\/b>", "baroreceptor ยืด → ยับยั้งแบบ tonic"], "ans": 0, "more": "<p><b>High-yield:<\/b> osmolality 1–2% vs volume 10% · อื่นที่กระตุ้น: pain, stress, nausea, angiotensin II<\/p><p>📍 07-PHYSIO หน้า 18, 20<\/p>"}, {"n": 37, "lec": 5, "stem": "<p>A night-shift nurse works under bright light. Which statement about her pineal melatonin secretion is correct?<\/p>", "opts": ["Light reaching the retina reduces sympathetic norepinephrine release to the pineal, lowering serotonin N-acetyltransferase activity and melatonin", "Light increases norepinephrine release to the pineal, raising melatonin", "Melatonin is synthesised from tyrosine via dopamine", "The rate-limiting enzyme is phenylethanolamine-N-methyltransferase", "The pineal is driven by parasympathetic fibres from the vagus nerve"], "why": ["มืด → suprachiasmatic → sympathetic (superior cervical ganglion) → norepinephrine → ↑ serotonin N-acetyltransferase → melatonin; แสงกดเส้นทางนี้", "กลับทิศ", "melatonin มาจาก <b>tryptophan<\/b> → serotonin", "เป็นเอนไซม์ของ epinephrine", "ใช้ postganglionic sympathetic"], "ans": 0, "more": "<p><b>High-yield:<\/b> melatonin สูงกลางคืน · ในสัตว์ยับยั้ง luteinizing hormone/gonad · LED/หน้าจอกลางคืนกด melatonin<\/p><p>📍 07-PHYSIO หน้า 36–40 · 05-BIOCHEM หน้า 11<\/p>"}, {"n": 38, "lec": 6, "stem": "<p>A 6-year-old boy has severe short stature. Serum growth hormone is <b>high<\/b>, insulin-like growth factor 1 is <b>very low<\/b>, and injections of growth hormone do not raise insulin-like growth factor 1. What is the most likely defect?<\/p>", "opts": ["Growth hormone-releasing hormone deficiency", "Destruction of pituitary somatotrophs", "Mutation of the growth hormone receptor", "Excess hypothalamic somatostatin", "Congenital hypothyroidism"], "why": ["growth hormone จะ <b>ต่ำ<\/b> และฉีดแล้วตอบสนอง", "growth hormone ต่ำ (pituitary dwarfism)", "Laron dwarfism: receptor ผิดปกติ → ตับไม่สร้าง insulin-like growth factor 1 → ไม่มี negative feedback → growth hormone สูง", "growth hormone ต่ำ", "thyroid hormone ต่ำ → growth hormone gene expression ลด ไม่ใช่ภาพนี้"], "ans": 2, "more": "<p><b>Logic:<\/b> hormone สูง + effect ต่ำ = resistance (receptor)<\/p><p><b>High-yield:<\/b> hormone สูง/target ต่ำ → คิด receptor defect ก่อน<\/p><p>📍 08-PHYSIO หน้า 15<\/p>"}, {"n": 39, "lec": 6, "stem": "<p>A 40-year-old man with coarse facial features takes a 75-g oral glucose load. His serum growth hormone <b>fails to fall<\/b>. What is the physiological basis of the test and the interpretation?<\/p>", "opts": ["Hyperglycaemia normally suppresses growth hormone; failure indicates autonomous secretion by a pituitary adenoma", "Hyperglycaemia normally stimulates growth hormone; failure indicates growth hormone deficiency", "Glucose normally stimulates insulin-like growth factor 1; failure indicates liver failure", "Insulin-induced hypoglycaemia is the confirmatory test for excess", "The result is normal because growth hormone is released only during sleep"], "why": ["growth hormone suppression test: glucose สูง → growth hormone + insulin-like growth factor 1 ควรลด; ไม่ลด → adenoma ไม่ฟัง feedback", "glucose สูง <b>กด<\/b> growth hormone", "ไม่ใช่หลักของ test", "insulin-induced hypoglycaemia = <b>stimulation<\/b> test สำหรับ <b>deficiency<\/b>", "หลั่งเป็น pulse ทั้งวัน peak ช่วงหลับ"], "ans": 0, "more": "<p><b>Logic (dynamic test):<\/b> สงสัยเกิน → suppression test · สงสัยขาด → stimulation test<\/p><p>📍 08-PHYSIO หน้า 16, 18<\/p>"}, {"n": 40, "lec": 6, "stem": "<p>About half of patients with acromegaly develop glucose intolerance. Which mechanism best explains this?<\/p>", "opts": ["Direct anti-insulin effect of growth hormone: reduced glucose uptake by muscle and adipose tissue, increased hepatic gluconeogenesis, and insulin receptor down-regulation", "Insulin-like growth factor 1 destroys beta cells", "Growth hormone directly blocks insulin release from beta cells", "Growth hormone increases translocation of glucose transporter 4 to the muscle membrane", "Growth hormone stimulates glucagon secretion from alpha cells as its main effect"], "why": ["direct effect (growth hormone receptor) = diabetogenic: insulin resistance → hyperinsulinism → beta-cell exhaustion", "insulin-like growth factor 1 มี insulin-<b>like<\/b> effect", "ภาพจริงคือ insulin <b>สูง<\/b> (hyperinsulinism)", "ตรงข้าม — ลด glucose uptake", "ไม่ใช่กลไกในสไลด์"], "ans": 0, "more": "<p><b>High-yield:<\/b> indirect (insulin-like growth factor 1) = anabolic/growth · direct (growth hormone) = lipolysis + anti-insulin<\/p><p>📍 08-PHYSIO หน้า 6–9, 21<\/p>"}, {"n": 41, "lec": 6, "stem": "<p>In a healthy 10-year-old, when does the <b>largest<\/b> growth hormone pulse of the day usually occur?<\/p>", "opts": ["Shortly after breakfast", "About 1–2 hours after the onset of deep (non-rapid eye movement) sleep", "In the late afternoon", "During rapid eye movement sleep just before waking", "Secretion is continuous and constant through 24 hours"], "why": ["glucose สูงหลังอาหาร <b>กด<\/b> growth hormone", "pulsatile, peak ใหญ่ 1–2 ชั่วโมงหลังเข้า deep sleep", "กลางวันหลั่งน้อย", "prolactin/cortisol สูงช่วงใกล้ตื่น ไม่ใช่ growth hormone peak", "pulsatile"], "ans": 1, "more": "<p><b>High-yield:<\/b> กระตุ้น growth hormone: deep sleep, hypoglycaemia, exercise, arginine, stress · กด: hyperglycaemia, somatostatin, insulin-like growth factor 1<\/p><p>📍 08-PHYSIO หน้า 3, 11–12 · 06-PHYSIO หน้า 26<\/p>"}, {"n": 42, "lec": 6, "stem": "<p>A patient develops hypothyroidism after starting <b>amiodarone<\/b>, an iodine-rich drug. Which mechanism is responsible?<\/p>", "opts": ["Wolff-Chaikoff effect — excess intracellular iodide suppresses thyroid peroxidase (organification block), with failure to escape", "Jod-Basedow effect — excess iodine causes hyperthyroidism", "Stimulating antibodies against the thyroid-stimulating hormone receptor", "Loss of negative feedback from thyroid hormone on the pituitary", "Estrogen-induced rise of thyroxine-binding globulin"], "why": ["iodide เกิน → กด thyroid peroxidase ชั่วคราว; ต่อมปกติ \"escape\" ได้โดยลด sodium-iodide symporter; ถ้า tropic hormone ↑ → <b>bilateral<\/b> hyperplasia", "adrenocorticotropic hormone ↑ มาก, bilateral hyperplasia", "adrenal adenoma (zona fasciculata) สร้าง cortisol เอง → กด adrenocorticotropic hormone → ต่อมอีกข้างฝ่อ", "adrenocorticotropic hormone ต่ำก็จริง แต่โจทย์ไม่ใช้ยา และจะไม่มีก้อน", "cortisol <b>ต่ำ<\/b>"], "ans": 2, "more": "<p><b>High-yield:<\/b> adrenocorticotropic hormone ต่ำ = ปัญหาที่ต่อม adrenal (หรือยา) · สูง = pituitary/ectopic<\/p><p>📍 02-HISTO หน้า 35 · 03-HISTO หน้า 19 · 11-PHYSIO หน้า 19–20<\/p>"}, {"n": 50, "lec": 7, "stem": "<p>A patient with renal failure has serum potassium 6.2 mmol/L. How does hyperkalaemia <b>directly<\/b> stimulate aldosterone secretion?<\/p>", "opts": ["It depolarises zona glomerulosa cells, opening voltage-gated calcium channels and raising intracellular calcium", "It stimulates renin release from juxtaglomerular cells", "It stimulates adrenocorticotropic hormone release", "It stimulates atrial natriuretic peptide release", "It raises cyclic adenosine monophosphate through beta-adrenergic receptors"], "why": ["potassium สูง → depolarization → voltage-dependent calcium channel เปิด → calcium-calmodulin kinase → cholesterol เข้า mitochondria → aldosterone synthesis", "aldosterone ตอบ potassium โดยตรง ไม่ผ่าน renin", "adrenocorticotropic hormone มีผลแค่เล็กน้อยช่วง stress", "atrial natriuretic peptide <b>ยับยั้ง<\/b> aldosterone", "angiotensin II ใช้ phospholipase C–inositol trisphosphate; potassium ใช้ calcium channel"], "ans": 0, "more": "<p><b>Logic:<\/b> aldosterone ขับ potassium → potassium สูงต้องกระตุ้นตรง (feedback แบบ humoral)<\/p><p><b>High-yield:<\/b> กระตุ้น aldosterone: angiotensin II, potassium สูง, (adrenocorticotropic hormone เล็กน้อย) · ยับยั้ง: atrial natriuretic peptide<\/p><p>📍 11-PHYSIO หน้า 24–27<\/p>"}, {"n": 51, "lec": 7, "stem": "<p>A low-dose epinephrine infusion increases heart rate but <b>lowers diastolic pressure<\/b> because of vasodilation in skeletal muscle. Which receptor mediates this vasodilation?<\/p>", "opts": ["Alpha-1 adrenergic receptor", "Alpha-2 adrenergic receptor", "Beta-1 adrenergic receptor", "Beta-2 adrenergic receptor", "Beta-3 adrenergic receptor"], "why": ["vasoconstriction (norepinephrine ≥ epinephrine)", "ลด cyclic adenosine monophosphate; ⚠️ ยับยั้ง insulin (ข้อมูลใน 12-PHYSIO หน้า 27)", "heart rate/contractility ↑ (อธิบายหัวใจเต้นเร็ว ไม่ใช่ vasodilation)", "beta-2 (epinephrine &gt;&gt; norepinephrine) → vasodilation กล้ามเนื้อลาย, bronchodilation", "lipolysis (norepinephrine &gt; epinephrine)"], "ans": 3, "more": "<p><b>High-yield:<\/b> epinephrine ต่างจาก norepinephrine เพราะ beta-2 · pheochromocytoma = hypertension, tachycardia, sweating, headache, pallor, glucose intolerance<\/p><p>📍 11-PHYSIO หน้า 40–43 ⚠️ ตาราง receptor ในโน้ตข้อความแตก ตรวจกับสไลด์จริง<\/p>"}, {"n": 52, "lec": 8, "stem": "<p>A patient with untreated type 1 diabetes has almost no circulating insulin. Which tissue continues to take up glucose <b>normally<\/b> through an insulin-independent transporter?<\/p>", "opts": ["Neurons, through glucose transporter 3", "Skeletal muscle, through glucose transporter 4", "Adipose tissue, through glucose transporter 4", "Resting cardiac and skeletal muscle through insulin-stimulated transporter insertion", "Satiety neurons of the hypothalamus"], "why": ["neuron = glucose transporter 3; red cell/blood–brain barrier = glucose transporter 1; liver/beta cell = glucose transporter 2 → ไม่ต้องพึ่ง insulin", "glucose transporter 4 = insulin-dependent", "insulin-dependent", "ต้องมี insulin", "<b>ข้อยกเว้น<\/b>: satiety neurons ต้องใช้ insulin → ผู้ป่วยเบาหวานรู้สึกหิว (polyphagia)"], "ans": 0, "more": "<p><b>High-yield:<\/b> glucose transporter 4 (muscle + fat) คือที่เดียวที่ insulin คุม<\/p><p>📍 12-PHYSIO หน้า 7–8<\/p>"}, {"n": 53, "lec": 8, "stem": "<p>A 72-year-old woman with type 2 diabetes and pneumonia is confused. Plasma glucose 900 mg/dL, plasma osmolality 360 mOsm/kg, arterial pH 7.38, serum ketones negative. Why is ketoac const KEY='endo-exam1-v2';
const blank=()=>({pick:{},order:{},spent:{}});
let S=blank();
try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuffle=()=>{D.qs.forEach(q=>{const a=[0,1,2,3,4];for(let i=4;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}S.order[q.n]=a})};
if(!Object.keys(S.order).length){shuffle();save()}
let mode='mcq',lec=-1,wrongOnly=false,cur=0,shownN=null,shownAt=0;
const $=id=>document.getElementById(id);
const L='ABCDE';
const done=q=>S.pick[q.n]!==undefined;
const fmt=ms=>{const s=Math.round(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const list=()=>D.qs.filter(q=>(lec<0||q.lec===lec)&&(!wrongOnly||(done(q)&&S.pick[q.n]!==q.ans)));

// time counts only while an unanswered question is on screen
function flush(){if(shownN!==null){S.spent[shownN]=(S.spent[shownN]||0)+(Date.now()-shownAt);shownN=null;save()}}
function track(q){flush();if(q&&!done(q)&&mode==='mcq'&&!document.hidden){shownN=q.n;shownAt=Date.now()}}
const live=n=>(S.spent[n]||0)+(shownN===n?Date.now()-shownAt:0);
const total=()=>D.qs.reduce((a,q)=>a+live(q.n),0);
function tick(){
  if(mode!=='mcq')return;
  const q=list()[cur];const t=q?live(q.n):0;
  $('timer').innerHTML=`รวม <b>${fmt(total())}</b> · ข้อนี้ <b class="${t>90000?'slow':''}">${fmt(t)}</b>`;
}
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else if(mode==='mcq')track(list()[cur])});

function score(){
  const by=D.lec.map(()=>[0,0]);let r=0,t=0;
  D.qs.forEach(q=>{const p=S.pick[q.n];if(p===undefined)return;t++;by[q.lec][1]++;if(p===q.ans){r++;by[q.lec][0]++}});
  return {r,t,by};
}
function chips(){
  const s=score();
  $('chips').innerHTML=[['ทั้งหมด',-1,`${s.r}/${s.t}`],...D.lec.map((n,i)=>[n,i,s.by[i][1]?`${s.by[i][0]}/${s.by[i][1]}`:''])]
    .map(([n,i,c])=>`<button class="chip" data-lec="${i}" aria-pressed="${lec===i}">${n}<small>${c}</small></button>`).join('');
  $('score').innerHTML=`ทำแล้ว <b>${s.t}</b>/63 · ถูก <b>${s.r}</b>${s.t?` · ${Math.round(s.r/s.t*100)}%`:''}`;
}
function qHTML(q){
  const p=S.pick[q.n],d=p!==undefined,ord=S.order[q.n];
  const opts=ord.map((o,i)=>{
    const cls=d?(o===q.ans?'right':o===p?'wrong':''):'';
    return `<button class="opt ${cls}" data-q="${q.n}" data-o="${o}" ${d?'disabled':''}><span class="k">${L[i]}</span><span>${q.opts[o]}</span>${d?`<span class="why">${q.why[o]}</span>`:''}</button>`}).join('');
  const v=d?`<div class="verdict ${p===q.ans?'ok':'no'}">${p===q.ans?'ถูก':'ผิด'} · เฉลย ${L[ord.indexOf(q.ans)]} · ใช้เวลา ${fmt(S.spent[q.n]||0)}</div><div class="more">${q.more}</div>`:'';
  return `<article class="q" id="q${q.n}"><div class="qh"><span class="qn">ข้อ ${q.n}</span><span class="mono lec">${D.lec[q.lec]}</span></div>${q.stem}<div class="opts">${opts}</div>${v}</article>`;
}
function mcq(){
  const ls=list();
  if(!ls.length){track(null);return '<div class="empty">ไม่มีข้อที่ตอบผิดในหมวดนี้</div><div class="nav"><button class="btn" data-act="allq">กลับไปดูทุกข้อ</button></div>'}
  cur=Math.min(cur,ls.length-1);
  const q=ls[cur];track(q);
  const left=D.qs.filter(x=>!done(x)).length;
  const last=cur===ls.length-1;
  const dots=ls.map((x,i)=>`<button class="dot ${done(x)?(S.pick[x.n]===x.ans?'ok':'no'):''} ${i===cur?'cur':''}" data-go="${i}" aria-label="ข้อ ${x.n}">${x.n}</button>`).join('');
  return `${qHTML(q)}
  <div class="nav"><button class="btn" data-act="prev" ${cur?'':'disabled'}>← ก่อนหน้า</button>
  <span class="pos">${cur+1} / ${ls.length}${wrongOnly?' · ทวนข้อผิด':''}</span>
  ${last?`<button class="btn primary" data-mode="sum">ดูสรุปผล</button>`:`<button class="btn ${done(q)?'primary':''}" data-act="next">${done(q)?'ถัดไป →':'ข้าม →'}</button>`}</div>
  <div class="dots">${dots}</div>
  <div class="row tools"><span class="score">เหลือ ${left} ข้อ · กด 1–5 หรือ A–E เพื่อตอบ · ← → เปลี่ยนข้อ</span>
  <span class="row"><button class="btn" data-act="wrong" aria-pressed="${wrongOnly}">${wrongOnly?'แสดงทุกข้อ':'ทวนเฉพาะข้อผิด'}</button><button class="btn" data-act="reset">เริ่มใหม่</button></span></div>`;
}
function summary(){
  flush();
  const s=score(),ans=D.qs.filter(done),tt=total();
  const wrong=ans.filter(q=>S.pick[q.n]!==q.ans);
  const rows=D.lec.map((n,i)=>{const [r,t]=s.by[i];const all=D.qs.filter(q=>q.lec===i).length;
    return `<tr><td>${n}</td><td style="white-space:nowrap">${r}/${t}<small> จาก ${all}</small></td><td>${t?Math.round(r/t*100)+'%':'–'}</td><td><div class="bar"><i style="width:${t?r/t*100:0}%"></i></div></td></tr>`}).join('');
  const wl=wrong.map(q=>{const o=S.order[q.n],p=S.pick[q.n];
    return `<div class="wr"><div class="qh"><span class="qn">ข้อ ${q.n}</span><span class="mono lec">${D.lec[q.lec]} · ${fmt(S.spent[q.n]||0)}</span></div>${q.stem}
    <div class="you"><small>คุณตอบ ${L[o.indexOf(p)]}</small><br>${q.opts[p]}<br><small>${q.why[p]}</small></div>
    <div class="cor"><small>เฉลย ${L[o.indexOf(q.ans)]}</small><br>${q.opts[q.ans]}<br><small>${q.why[q.ans]}</small></div>
    <button class="btn" data-jump="${q.n}">เปิดข้อนี้ + คำอธิบายเต็ม</button></div>`}).join('');
  return `<section class="card sum"><h2>สรุปผล</h2>
  <div class="stats"><div><b>${s.r}/${s.t}</b><span>ถูก / ทำแล้ว (จาก 63)</span></div>
  <div><b>${s.t?Math.round(s.r/s.t*100):0}%</b><span>ความแม่น</span></div>
  <div><b>${fmt(tt)}</b><span>เวลารวม</span></div>
  <div><b>${ans.length?fmt(tt/ans.length):'0:00'}</b><span>เฉลี่ยต่อข้อ (เป้า 1:30)</span></div></div>
  <div class="tw"><table><thead><tr><th>หมวด</th><th>ถูก/ทำ</th><th>%</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="card sum"><h2>ข้อที่ผิด (${wrong.length})</h2>${wl||'<p class="empty">ยังไม่มีข้อที่ผิด</p>'}
  ${wrong.length?'<div class="nav"><button class="btn primary" data-act="drill">ทำซ้ำเฉพาะข้อที่ผิด</button></div>':''}</section>`;
}
function render(){
  $('mcqbar').hidden=mode!=='mcq';
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  if(mode==='mcq'){chips();$('main').innerHTML=mcq();tick()}
  else{track(null);
    if(mode==='sum')$('main').innerHTML=summary();
    else if(mode==='saq')$('main').innerHTML='<div class="note">ข้อสอบจริงใช้รูป slide · ที่นี่ฝึกจากคำบรรยาย: อ่านสิ่งที่เห็น → ตอบในใจ → แตะเพื่อดูเฉลย</div>'+
      D.saq.map(s=>`<details class="card"><summary><span class="mono lec">${s.id}</span> ${s.see}</summary><div class="a"><b>${s.ans}</b><br>${s.key}</div></details>`).join('');
    else $('main').innerHTML=`<div class="card"><div class="tw"><table><thead><tr><th>ตัวย่อ</th><th>ชื่อเต็ม</th></tr></thead><tbody>${D.gl.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
}
const go=i=>{cur=i;render();scrollTo(0,0)};
function pick(n,o){if(S.pick[n]!==undefined)return;flush();S.pick[n]=o;save();render()}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.disabled)return;
  const a=t.dataset.act;
  if(t.dataset.mode){mode=t.dataset.mode;render();scrollTo(0,0)}
  else if(t.dataset.lec!==undefined){lec=+t.dataset.lec;go(0)}
  else if(t.dataset.go!==undefined)go(+t.dataset.go);
  else if(t.dataset.q)pick(+t.dataset.q,+t.dataset.o);
  else if(t.dataset.jump){mode='mcq';lec=-1;wrongOnly=false;go(D.qs.findIndex(q=>q.n===+t.dataset.jump))}
  else if(a==='prev')go(cur-1);
  else if(a==='next')go(cur+1);
  else if(a==='wrong'){wrongOnly=!wrongOnly;go(0)}
  else if(a==='allq'){wrongOnly=false;go(0)}
  else if(a==='drill'){mode='mcq';lec=-1;wrongOnly=true;go(0)}
  else if(a==='reset'){
    if(t.dataset.sure){shownN=null;S=blank();shuffle();save();wrongOnly=false;lec=-1;go(0)}
    else{t.dataset.sure=1;t.textContent='ยืนยันล้างคำตอบ + เวลา?';setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent='เริ่มใหม่'}},3000)}
  }
});
document.addEventListener('keydown',e=>{
  if(mode!=='mcq'||e.metaKey||e.ctrlKey||e.altKey)return;
  const ls=list(),q=ls[cur];if(!q)return;
  const k=e.key.toUpperCase(),i='12345'.indexOf(k)>=0?'12345'.indexOf(k):L.indexOf(k);
  if(i>=0&&k.length===1)pick(q.n,S.order[q.n][i]);
  else if(e.key==='ArrowRight'&&cur<ls.length-1)go(cur+1);
  else if(e.key==='ArrowLeft'&&cur>0)go(cur-1);
});
render();
</script>

</body></html>
